 <defs>
 <radialGradient id="mClockFace" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFFEF0"/><stop offset="100%" stop-color="#E8E0C0"/></radialGradient>
 <linearGradient id="mClockRim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B6914"/><stop offset="100%" stop-color="#4A3800"/></linearGradient>
 <linearGradient id="mHourHand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A3A7A"/><stop offset="100%" stop-color="#0A1A3A"/></linearGradient>
 <linearGradient id="mMinuteHand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#8B1A1A"/></linearGradient>
 </defs>
 <circle cx="16" cy="16" r="13" fill="url(#mClockRim)" filter="url(#sdMinClk)"/>
 <circle cx="16" cy="16" r="11.5" fill="url(#mClockFace)"/>
 <!-- Hour markers -->
 <line x1="16" y1="5" x2="16" y2="7" stroke="#5A4A20" stroke-width="1" stroke-linecap="round"/>
 <line x1="24.9" y1="7.1" x2="23.5" y2="8.7" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="27" y1="16" x2="25" y2="16" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="24.9" y1="24.9" x2="23.5" y2="23.3" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="16" y1="27" x2="16" y2="25" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="7.1" y1="24.9" x2="8.5" y2="23.3" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="5" y1="16" x2="7" y2="16" stroke="#5A4A20" stroke-width="0.7"/>
 <line x1="7.1" y1="7.1" x2="8.5" y2="8.7" stroke="#5A4A20" stroke-width="0.7"/>
 <!-- Hour hand at 12 -->
 <line x1="16" y1="16" x2="16" y2="9" stroke="url(#mHourHand)" stroke-width="2" stroke-linecap="round"/>
 <!-- Minute hand (thin, pointing just past 12 — one minute) -->
 <line x1="16" y1="16" x2="17.9" y2="5.2" stroke="url(#mMinuteHand)" stroke-width="1.3" stroke-linecap="round"/>
 <!-- Short sweep arc -->
 <path d="M16 5 A11 11 0 0 1 17.9 5.2" stroke="#E84A4A" stroke-width="0.8" fill="none" stroke-opacity="0.7"/>
 <circle cx="16" cy="16" r="1.2" fill="#3A2A10"/>
</svg>
