<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="clockFace" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFFEF0"/><stop offset="100%" stop-color="#E8E0C0"/></radialGradient>
 <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B6914"/><stop offset="100%" stop-color="#4A3800"/></linearGradient>
 <linearGradient id="hourHand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#8B1A1A"/></linearGradient>
 <linearGradient id="minuteHand" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A3A7A"/><stop offset="100%" stop-color="#0A1A3A"/></linearGradient>
 </defs>
 <!-- Clock rim -->
 <circle cx="16" cy="16" r="13" fill="url(#clockRim)" filter="url(#sdClock)"/>
 <!-- Clock face -->
 <circle cx="16" cy="16" r="11.5" fill="url(#clockFace)"/>
 <!-- Hour markers -->
 <line x1="16" y1="5" x2="16" y2="7" stroke="#5A4A20" stroke-width="1" stroke-linecap="round"/>
 <line x1="24.9" y1="7.1" x2="23.5" y2="8.7" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="27" y1="16" x2="25" y2="16" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="24.9" y1="24.9" x2="23.5" y2="23.3" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="16" y1="27" x2="16" y2="25" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="7.1" y1="24.9" x2="8.5" y2="23.3" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="5" y1="16" x2="7" y2="16" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="7.1" y1="7.1" x2="8.5" y2="8.7" stroke="#5A4A20" stroke-width="0.7" stroke-linecap="round"/>
 <!-- Hour hand (pointing to 1 o'clock) -->
 <line x1="16" y1="16" x2="21" y2="10.5" stroke="url(#hourHand)" stroke-width="2" stroke-linecap="round"/>
 <!-- Minute hand (pointing to 12) -->
 <line x1="16" y1="16" x2="16" y2="7" stroke="url(#minuteHand)" stroke-width="1.3" stroke-linecap="round"/>
 <!-- Sweep arc from 12 to 1 -->
 <path d="M16 6 A10 10 0 0 1 21 11" stroke="#E84A4A" stroke-width="0.8" fill="none" stroke-opacity="0.7"/>
 <!-- Center dot -->
 <circle cx="16" cy="16" r="1.2" fill="#3A2A10"/>
</svg>
