  <defs>
    <radialGradient id="mn_face" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#3A4790"/>
      <stop offset="0.6" stop-color="#222C66"/>
      <stop offset="1" stop-color="#121838"/>
    </radialGradient>
    <linearGradient id="mn_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F47"/>
      <stop offset="1" stop-color="#15181D"/>
    </linearGradient>
    <radialGradient id="mn_moon" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset="1" stop-color="#F3D14E"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="16" cy="28.6" rx="9.5" ry="1.5" fill="#000000" opacity="0.12"/>

  <!-- moon (crescent) top-left -->
  <g>
    <circle cx="6.0" cy="6.2" r="3.0" fill="url(#mn_moon)"/>
    <circle cx="7.6" cy="5.4" r="2.6" fill="#EAF4FF"/>
  </g>

  <!-- stars -->
  <g fill="#FCE06A">
    <path d="M24.5 4.0 l0.7 1.6 1.7 0.2 -1.25 1.2 0.32 1.7 -1.5 -0.82 -1.5 0.82 0.32 -1.7 -1.25 -1.2 1.7 -0.2 z"/>
    <path d="M28.0 10.5 l0.5 1.1 1.2 0.15 -0.9 0.85 0.22 1.2 -1.04 -0.58 -1.04 0.58 0.22 -1.2 -0.9 -0.85 1.2 -0.15 z"/>
    <path d="M22.0 11.0 l0.4 0.9 1.0 0.12 -0.72 0.7 0.18 1.0 -0.86 -0.48 -0.86 0.48 0.18 -1.0 -0.72 -0.7 1.0 -0.12 z"/>
  </g>

  <!-- clock -->
  <circle cx="15.5" cy="18.5" r="10.0" fill="url(#mn_rim)"/>
  <circle cx="15.5" cy="18.5" r="8.6" fill="url(#mn_face)" stroke="#0E1230" stroke-width="0.3"/>

  <!-- hour ticks -->
  <g stroke="#C9D2F0" stroke-width="0.5" stroke-linecap="round">
    <line x1="15.5" y1="10.6" x2="15.5" y2="11.8"/>
    <line x1="15.5" y1="25.2" x2="15.5" y2="26.4"/>
    <line x1="7.6" y1="18.5" x2="8.8" y2="18.5"/>
    <line x1="22.2" y1="18.5" x2="23.4" y2="18.5"/>
  </g>
  <g stroke="#8C97C8" stroke-width="0.35" stroke-linecap="round" opacity="0.8">
    <line x1="19.45" y1="11.7" x2="18.95" y2="12.6"/>
    <line x1="22.3" y1="14.55" x2="21.4" y2="15.05"/>
    <line x1="22.3" y1="22.45" x2="21.4" y2="21.95"/>
    <line x1="19.45" y1="25.3" x2="18.95" y2="24.4"/>
    <line x1="11.55" y1="25.3" x2="12.05" y2="24.4"/>
    <line x1="8.7" y1="22.45" x2="9.6" y2="21.95"/>
    <line x1="8.7" y1="14.55" x2="9.6" y2="15.05"/>
    <line x1="11.55" y1="11.7" x2="12.05" y2="12.6"/>
  </g>

  <!-- 12 o'clock numeral -->
  <text x="15.5" y="14.1" font-family="Arial, sans-serif" font-size="2.4" font-weight="bold" fill="#DEE5FF" text-anchor="middle">12</text>

  <!-- hands both pointing up to 12 (midnight) -->
  <line x1="15.5" y1="18.5" x2="15.5" y2="12.0" stroke="#EAF0FF" stroke-width="0.75" stroke-linecap="round"/>
  <line x1="15.5" y1="18.5" x2="15.5" y2="13.2" stroke="#EAF0FF" stroke-width="1.05" stroke-linecap="round"/>
  <circle cx="15.5" cy="18.5" r="0.85" fill="#EAF0FF"/>
