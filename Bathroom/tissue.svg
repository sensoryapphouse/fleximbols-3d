<defs>
 <linearGradient id="ti_boxfront" x1="6" y1="16" x2="26" y2="28" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#6FC3E8"/>
  <stop offset="1" stop-color="#3E92C8"/>
 </linearGradient>
 <linearGradient id="ti_boxtop" x1="6" y1="13" x2="26" y2="17" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#9AD6F2"/>
  <stop offset="1" stop-color="#62B0DD"/>
 </linearGradient>
 <linearGradient id="ti_tissue" x1="16" y1="4" x2="16" y2="16" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#ffffff"/>
  <stop offset="1" stop-color="#DCE6EC"/>
 </linearGradient>
 <radialGradient id="ti_shine" cx="0.3" cy="0.25" r="0.7">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </radialGradient>
</defs>

<!-- box body (front face) -->
<path d="M5.5 14.5 Q5.5 13.5 6.5 13.5 L25.5 13.5 Q26.5 13.5 26.5 14.5 L26.5 25.5 Q26.5 26.5 25.5 26.5 L6.5 26.5 Q5.5 26.5 5.5 25.5 Z"
      fill="url(#ti_boxfront)"/>

<!-- box top -->
<path d="M6.5 13.5 L25.5 13.5 Q26.5 13.5 26.5 14.5 L26.5 15.2 L5.5 15.2 L5.5 14.5 Q5.5 13.5 6.5 13.5 Z"
      fill="url(#ti_boxtop)"/>

<!-- oval opening on top -->
<ellipse cx="16" cy="14.4" rx="7.5" ry="1.9" fill="#2E7AA8"/>
<ellipse cx="16" cy="14.4" rx="6.6" ry="1.4" fill="#1F5E84"/>

<!-- tissue popping up out of the slot -->
<path d="M12.2 14.2
         C12 11 13 8 14.2 5.5
         C14.7 4.5 15.5 4 16.2 4.6
         C16.9 5.2 16.6 6.2 16.8 7.2
         C17.2 9 18.6 9.6 19.8 10.6
         C20.8 11.4 20.6 12.8 19.8 14.2
         Z"
      fill="url(#ti_tissue)"/>
<path d="M12.2 14.2 C12.1 12.4 12.4 10.6 13 9 C13.4 11 14.2 12.8 15 14.2 Z" fill="#EDF3F7"/>

<!-- soft fold lines on the tissue -->
<path d="M14.6 6.4 C14.2 8.6 14.4 11.4 15 13.8" stroke="#C7D5DE" stroke-width="0.4" fill="none" stroke-linecap="round"/>

<!-- decorative band on box front -->
<rect x="5.5" y="20" width="21" height="2.4" fill="#ffffff" opacity="0.45"/>

<!-- box highlight -->
<ellipse cx="11" cy="18" rx="5" ry="2.4" fill="url(#ti_shine)"/>
</svg>
