<g filter="url(#aq_drop)">
 <!-- Mobile phone body -->
 <rect x="8" y="2" width="16" height="28" rx="3" fill="#1A1A1A"/>
 <rect x="9" y="3" width="14" height="26" rx="2.5" fill="#101820"/>
 <!-- Status bar -->
 <rect x="9" y="3" width="14" height="2" rx="0.5" fill="#0A1020"/>
 <!-- Screen content (blurred home screen) -->
 <rect x="9.5" y="8" width="13" height="20" fill="#1A2A3A"/>
 <!-- Notification banner sliding down from top -->
 <rect x="9.5" y="5" width="13" height="7" rx="1.5" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="0.4"/>
 <!-- Bell icon in notification -->
 <path d="M12 9.5 Q12 7 14 7 Q14 6.5 13.5 6.5 L14.5 6.5 Q14 7 14 7 Q16 7 16 9.5 L16.5 11 L11.5 11Z" fill="#E74C3C"/>
 <rect x="13.3" y="11" width="1.4" height="0.8" rx="0.4" fill="#C0392B"/>
 <!-- Three lines of text in notification -->
 <text x="17.5" y="7.2" font-size="1.8" fill="#333" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-weight="bold">New message</text>
 <rect x="17" y="8" width="5" height="0.7" rx="0.2" fill="#888"/>
 <rect x="17" y="9.2" width="4" height="0.7" rx="0.2" fill="#AAAAAA"/>
 <rect x="17" y="10.4" width="5.5" height="0.7" rx="0.2" fill="#BBBBBB"/>
 <!-- Red badge with '3' on corner -->
 <circle cx="22.5" cy="4" r="2.2" fill="#E74C3C"/>
 <text x="22.5" y="4.9" text-anchor="middle" font-size="2.5" fill="white" font-weight="bold" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">3</text>
</g>
</svg>
