<defs>
<linearGradient id="orRed" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffd6d6"/>
<stop offset="1" stop-color="#f3b4b4"/>
</linearGradient>
<linearGradient id="orPaper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fffdf2"/>
<stop offset="1" stop-color="#eef0e2"/>
</linearGradient>
<linearGradient id="orGreen" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4fd07a"/>
<stop offset="1" stop-color="#23a04f"/>
</linearGradient>
<linearGradient id="orArrow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7be87b"/>
<stop offset="0.5" stop-color="#22aa22"/>
<stop offset="1" stop-color="#0a6a0a"/>
</linearGradient>
</defs>
<!-- OLD decision (rejected, red, behind, lower-left) -->
<g transform="rotate(-8 70 120)">
<rect x="34" y="86" width="78" height="92" rx="6" fill="url(#orRed)" stroke="#c25555" stroke-width="3"/>
<line x1="46" y1="104" x2="100" y2="104" stroke="#d99a9a" stroke-width="4" stroke-linecap="round"/>
<line x1="46" y1="118" x2="100" y2="118" stroke="#d99a9a" stroke-width="4" stroke-linecap="round"/>
<line x1="46" y1="132" x2="86" y2="132" stroke="#d99a9a" stroke-width="4" stroke-linecap="round"/>
<!-- big red X (vetoed/overridden) -->
<line x1="48" y1="98" x2="98" y2="166" stroke="#d6342e" stroke-width="8" stroke-linecap="round"/>
<line x1="98" y1="98" x2="48" y2="166" stroke="#d6342e" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- replacement arrow -->
<g transform="rotate(-32 108 96)">
<rect x="98" y="86" width="34" height="16" fill="url(#orArrow)" stroke="#0a4a0a" stroke-width="2"/>
<polygon points="132,76 158,94 132,112" fill="url(#orArrow)" stroke="#0a4a0a" stroke-width="2" stroke-linejoin="round"/>
</g>
<!-- NEW decision (approved, on top, upper-right) -->
<g transform="rotate(6 130 96)">
<rect x="92" y="36" width="80" height="98" rx="6" fill="url(#orPaper)" stroke="#3a3a32" stroke-width="3"/>
<line x1="104" y1="56" x2="160" y2="56" stroke="#c8ccc0" stroke-width="4" stroke-linecap="round"/>
<line x1="104" y1="70" x2="160" y2="70" stroke="#c8ccc0" stroke-width="4" stroke-linecap="round"/>
<!-- green approval band -->
<rect x="102" y="86" width="60" height="22" rx="5" fill="url(#orGreen)" stroke="#177a39" stroke-width="2"/>
</g>
<!-- approval tick badge -->
<circle cx="150" cy="138" r="20" fill="url(#orGreen)" stroke="#177a39" stroke-width="3"/>
<path d="M140 138 L147 146 L161 130" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
