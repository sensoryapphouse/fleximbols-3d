<defs>
<radialGradient id="cot" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D8DCE0"/></radialGradient>
<linearGradient id="str" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F0F2F4"/><stop offset="100%" stop-color="#A8B0BC"/></linearGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- main cotton cylinder (horizontal for clarity) -->
<ellipse cx="22" cy="16" rx="2" ry="5" fill="url(#cot)"/>
<rect x="10" y="11" width="12" height="10" fill="url(#cot)"/>
<ellipse cx="10" cy="16" rx="2" ry="5" fill="url(#cot)"/>
<!-- highlight band -->
<ellipse cx="13" cy="13" rx="6" ry="0.8" fill="url(#hi)"/>
<!-- vertical compression grooves on cotton -->
<line x1="13" y1="12" x2="13" y2="20" stroke="#A0A8B4" stroke-width="0.2"/>
<line x1="16" y1="12" x2="16" y2="20" stroke="#A0A8B4" stroke-width="0.2"/>
<line x1="19" y1="12" x2="19" y2="20" stroke="#A0A8B4" stroke-width="0.2"/>
<!-- pull string -->
<path d="M8 16 Q 5 14 4 18 Q 3 22 6 24" stroke="url(#str)" stroke-width="0.5" fill="none" stroke-linecap="round"/>
<!-- string knot -->
<circle cx="6" cy="24" r="0.5" fill="#A8B0BC"/>
</svg>