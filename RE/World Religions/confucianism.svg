<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<linearGradient id="cf_robe" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#5a7fd0"/>
<stop offset="55%" stop-color="#3a5fb0"/>
<stop offset="100%" stop-color="#284a8c"/>
</linearGradient>
<radialGradient id="cf_skin" cx="42%" cy="38%" r="65%">
<stop offset="0%" stop-color="#ffe3c2"/>
<stop offset="100%" stop-color="#e6b486"/>
</radialGradient>
<linearGradient id="cf_scroll" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff6db"/>
<stop offset="100%" stop-color="#e3cf94"/>
</linearGradient>
<linearGradient id="cf_cap" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3a3f47"/>
<stop offset="100%" stop-color="#15181d"/>
</linearGradient>
<filter id="cf_shd" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="0.5" stdDeviation="0.5" flood-color="#000" flood-opacity="0.25"/>
</filter>
</defs>
<!-- Robe / body -->
<path d="M9 28 Q8.5 16 12 13 L20 13 Q23.5 16 23 28 Z" fill="url(#cf_robe)" stroke="#1d3260" stroke-width="0.7" filter="url(#cf_shd)"/>
<!-- centre robe fold -->
<path d="M16 14 L16 28" stroke="#1d3260" stroke-width="0.5" opacity="0.5"/>
<!-- Sleeves -->
<path d="M12 14 Q8 16 8.5 22 L11 21.5 Q11 17 13 15.5 Z" fill="url(#cf_robe)" stroke="#1d3260" stroke-width="0.6"/>
<path d="M20 14 Q24 16 23.5 22 L21 21.5 Q21 17 19 15.5 Z" fill="url(#cf_robe)" stroke="#1d3260" stroke-width="0.6"/>
<!-- Sash -->
<rect x="10.5" y="18.5" width="11" height="1.8" fill="#c9a24b" stroke="#9c7a2e" stroke-width="0.4" opacity="0.95"/>
<!-- Neck -->
<rect x="14.6" y="11.5" width="2.8" height="2.5" fill="url(#cf_skin)"/>
<!-- Head -->
<circle cx="16" cy="9.2" r="3.4" fill="url(#cf_skin)" stroke="#c9925f" stroke-width="0.4"/>
<!-- Eyes -->
<circle cx="14.7" cy="9.2" r="0.42" fill="#2a2118"/>
<circle cx="17.3" cy="9.2" r="0.42" fill="#2a2118"/>
<!-- Long beard (sage) -->
<path d="M13.4 10.8 Q16 16 18.6 10.8 Q16 12.4 13.4 10.8 Z" fill="#e9e6e0" stroke="#cfcac0" stroke-width="0.3"/>
<!-- Black scholar cap -->
<path d="M11.8 7.4 Q16 4.2 20.2 7.4 L19.4 8 Q16 6 12.6 8 Z" fill="url(#cf_cap)" stroke="#0c0e12" stroke-width="0.4"/>
<rect x="12.4" y="6.4" width="7.2" height="1.6" rx="0.6" fill="url(#cf_cap)"/>
<!-- Scroll held in hands -->
<g filter="url(#cf_shd)">
<rect x="10" y="20.5" width="12" height="4.2" rx="0.6" fill="url(#cf_scroll)" stroke="#b89b54" stroke-width="0.5"/>
<rect x="9.2" y="20.1" width="1.6" height="5" rx="0.8" fill="#c9a24b" stroke="#9c7a2e" stroke-width="0.4"/>
<rect x="21.2" y="20.1" width="1.6" height="5" rx="0.8" fill="#c9a24b" stroke="#9c7a2e" stroke-width="0.4"/>
</g>
<!-- Chinese characters (brush strokes) on scroll -->
<g fill="#b3261e">
<rect x="12" y="21.4" width="2.2" height="0.45" rx="0.2"/>
<rect x="12.9" y="21.4" width="0.45" height="2.4" rx="0.2"/>
<rect x="12" y="22.5" width="2.2" height="0.45" rx="0.2"/>
<rect x="12" y="23.4" width="2.2" height="0.45" rx="0.2"/>
<rect x="16" y="21.4" width="2.2" height="0.45" rx="0.2"/>
<rect x="16.9" y="21.4" width="0.45" height="2.4" rx="0.2"/>
<rect x="16" y="23.4" width="2.2" height="0.45" rx="0.2"/>
</g>
<!-- Hands -->
<circle cx="10.6" cy="22.6" r="1.1" fill="url(#cf_skin)" stroke="#c9925f" stroke-width="0.35"/>
<circle cx="21.4" cy="22.6" r="1.1" fill="url(#cf_skin)" stroke="#c9925f" stroke-width="0.35"/>
</svg>
