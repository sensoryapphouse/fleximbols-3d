 <defs>
 <radialGradient id="ch-halo" cx="50%" cy="42%" r="58%">
 <stop offset="0%" stop-color="#fff6c8"/>
 <stop offset="55%" stop-color="#ffd860"/>
 <stop offset="100%" stop-color="#f0a020"/>
 </radialGradient>
 <linearGradient id="ch-robe" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="100%" stop-color="#cdd6e2"/>
 </linearGradient>
 <radialGradient id="ch-skin" cx="40%" cy="35%" r="70%">
 <stop offset="0%" stop-color="#f4d0a8"/>
 <stop offset="100%" stop-color="#c89060"/>
 </radialGradient>
 <linearGradient id="ch-hill" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#86d05a"/>
 <stop offset="100%" stop-color="#3a8a28"/>
 </linearGradient>
 </defs>
 <!-- Radiant halo disc -->
 <circle cx="16" cy="13" r="11" fill="url(#ch-halo)"/>
 <!-- Sun rays around -->
 <g stroke="#ffcb3a" stroke-width="1.1" stroke-linecap="round" opacity="0.85">
  <line x1="16" y1="0.5" x2="16" y2="2.6"/>
  <line x1="27" y1="4" x2="25.5" y2="5.6"/>
  <line x1="31.4" y1="13" x2="29.3" y2="13"/>
  <line x1="5" y1="4" x2="6.5" y2="5.6"/>
  <line x1="0.6" y1="13" x2="2.7" y2="13"/>
  <line x1="23" y1="1.8" x2="22" y2="3.7"/>
  <line x1="9" y1="1.8" x2="10" y2="3.7"/>
 </g>
 <!-- Green hill base -->
 <path d="M 2 32 Q 16 22 30 32 Z" fill="url(#ch-hill)"/>
 <!-- Robed figure, arms outstretched -->
 <path d="M 4 18 L 12.5 16 L 13.5 30 L 18.5 30 L 19.5 16 L 28 18 L 27.5 19.6 L 19.8 18.4 L 18.5 30.5 L 13.5 30.5 L 12.2 18.4 L 4.5 19.6 Z" fill="url(#ch-robe)"/>
 <!-- robe body -->
 <path d="M 12.5 13 Q 16 12 19.5 13 L 19.5 30.5 L 12.5 30.5 Z" fill="url(#ch-robe)"/>
 <!-- outstretched arms -->
 <path d="M 4 18 Q 8 16 12.8 15 L 13.2 17.4 Q 8.6 18.2 4.6 19.8 Z" fill="url(#ch-robe)"/>
 <path d="M 28 18 Q 24 16 19.2 15 L 18.8 17.4 Q 23.4 18.2 27.4 19.8 Z" fill="url(#ch-robe)"/>
 <!-- head -->
 <circle cx="16" cy="10" r="2.6" fill="url(#ch-skin)"/>
 <!-- subtle robe shading + fold -->
 <path d="M 16 13 L 16 30" stroke="#aeb8c6" stroke-width="0.5" opacity="0.6"/>
 <ellipse cx="14.4" cy="9.4" rx="0.8" ry="1" fill="#fff" opacity="0.4"/>
</svg>
