<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d04020"/>
 <stop offset="100%" stop-color="#801800"/>
 </linearGradient>
 <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e8d8b0"/>
 <stop offset="100%" stop-color="#b09060"/>
 </linearGradient>
 <radialGradient id="flameGrad" cx="50%" cy="20%" r="70%">
 <stop offset="0%" stop-color="#ffffaa"/>
 <stop offset="40%" stop-color="#ff8800"/>
 <stop offset="100%" stop-color="#cc2200" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="bowlGrad" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#d0d0f0"/>
 <stop offset="100%" stop-color="#7080b0"/>
 </radialGradient>
 <filter id="flameGlow">
 <feGaussianBlur stdDeviation="0.8" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Base platform -->
 
 <!-- Steps -->
 <rect x="9" y="27" width="14" height="2" rx="0.3" fill="#c8b888"/>
 <rect x="11" y="29" width="10" height="1.5" rx="0.3" fill="#b0a070"/>
 <!-- Pavilion pillars -->
 <rect x="9" y="16" width="1.2" height="8" fill="#d0b880"/>
 <rect x="21.8" y="16" width="1.2" height="8" fill="#d0b880"/>
 <!-- Curved roof (Asian shrine style) -->
 
 <!-- Roof ridge -->
 <path d="M7 16 Q12 13.5 16 13 Q20 13.5 25 16" fill="none" stroke="#601000" stroke-width="0.5"/>
 <!-- Roof upturned tips -->
 <path d="M5 16 C4 15 3.5 14 4 13.5 C4.5 13 5.5 14 6 15.5" fill="url(#roofGrad)"/>
 <path d="M27 16 C28 15 28.5 14 28 13.5 C27.5 13 26.5 14 26 15.5" fill="url(#roofGrad)"/>
 <!-- Offering bowl -->
 <ellipse cx="16" cy="23" rx="3" ry="1.2" fill="url(#bowlGrad)"/>
 <path d="M13 23 Q13 24.5 16 24.5 Q19 24.5 19 23" fill="url(#bowlGrad)" stroke="#6070a0" stroke-width="0.3"/>
 <!-- Candle -->
 <rect x="15.3" y="18" width="1.4" height="5" rx="0.5" fill="#ffe8c0" stroke="#d0c090" stroke-width="0.3"/>
 <!-- Flame -->
 <g filter="url(#flameGlow)">
 <path d="M16 18 C15.5 16.5 15 15 16 14 C17 15 16.5 16.5 16 18Z" fill="url(#flameGrad)"/>
 </g>
 <!-- Flowers by bowl -->
 <circle cx="12" cy="23.5" r="1" fill="#ff80a0"/>
 <circle cx="12" cy="23.5" r="0.5" fill="#ffeeaa"/>
 <circle cx="20" cy="23.5" r="1" fill="#ff80a0"/>
 <circle cx="20" cy="23.5" r="0.5" fill="#ffeeaa"/>
</svg>
