 <defs>
 <linearGradient id="domeGold" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ffd700"/>
 <stop offset="50%" stop-color="#c8960a"/>
 <stop offset="100%" stop-color="#8a6200"/>
 </linearGradient>
 <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f5e6c0"/>
 <stop offset="100%" stop-color="#c8a870"/>
 </linearGradient>
 <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#e8d090"/>
 <stop offset="100%" stop-color="#b09050"/>
 </linearGradient>
 <linearGradient id="spireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ffe040"/>
 <stop offset="100%" stop-color="#a07000"/>
 </linearGradient>
 </defs>
 <!-- Main building base -->
 
 <!-- Central arch -->
 <path d="M12 30 L12 22 Q16 18 20 22 L20 30 Z" fill="url(#archGrad)"/>
 <path d="M13 30 L13 22.5 Q16 19.5 19 22.5 L19 30 Z" fill="#d4a840" fill-opacity="0.4"/>
 <!-- Corner columns -->
 <rect x="5" y="18" width="3" height="12" rx="0.5" fill="url(#archGrad)"/>
 <rect x="24" y="18" width="3" height="12" rx="0.5" fill="url(#archGrad)"/>
 <!-- Central main dome -->
 <ellipse cx="16" cy="17" rx="5" ry="4" fill="url(#domeGold)"/>
 <ellipse cx="14.5" cy="14.5" rx="1.5" ry="1.2" fill="#ffe87a" fill-opacity="0.5"/>
 <!-- Central spire -->
 <line x1="16" y1="13" x2="16" y2="9" stroke="url(#spireGrad)" stroke-width="1"/>
 <polygon points="16,8 15,10 17,10" fill="url(#domeGold)"/>
 <!-- Khanda symbol on spire -->
 <circle cx="16" cy="11" r="0.7" fill="none" stroke="#ffd700" stroke-width="0.3"/>
 <!-- Corner small domes -->
 <ellipse cx="7" cy="18" rx="2.5" ry="2" fill="url(#domeGold)"/>
 <line x1="7" y1="16" x2="7" y2="13.5" stroke="url(#spireGrad)" stroke-width="0.6"/>
 <polygon points="7,13 6.4,14.5 7.6,14.5" fill="url(#domeGold)"/>
 <ellipse cx="25" cy="18" rx="2.5" ry="2" fill="url(#domeGold)"/>
 <line x1="25" y1="16" x2="25" y2="13.5" stroke="url(#spireGrad)" stroke-width="0.6"/>
 <polygon points="25,13 24.4,14.5 25.6,14.5" fill="url(#domeGold)"/>
 <!-- Decorative band -->
 <rect x="5" y="17.5" width="22" height="1" fill="#e8c050" fill-opacity="0.6"/>
 <!-- Steps -->
 <rect x="11" y="29" width="10" height="1.5" rx="0.3" fill="#d4b870" fill-opacity="0.8"/>
 <rect x="13" y="28" width="6" height="1.5" rx="0.3" fill="#c8a850" fill-opacity="0.6"/>
</svg>
