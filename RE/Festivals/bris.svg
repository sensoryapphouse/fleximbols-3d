<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="skinBR" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#fff4e0"/>
 <stop offset="60%" stop-color="#f0c898"/>
 <stop offset="100%" stop-color="#a87858"/>
 </radialGradient>
 <radialGradient id="swaddle" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="80%" stop-color="#e8ecf2"/>
 <stop offset="100%" stop-color="#9aa0a8"/>
 </radialGradient>
 <radialGradient id="pillow" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="60%" stop-color="#d8e0ec"/>
 <stop offset="100%" stop-color="#6a7080"/>
 </radialGradient>
 <radialGradient id="kippah" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="40%" stop-color="#7fa8d8"/>
 <stop offset="100%" stop-color="#0a2858"/>
 </radialGradient>
 <radialGradient id="star" cx="40%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="40%" stop-color="#5fa8d8"/>
 <stop offset="100%" stop-color="#0a2868"/>
 </radialGradient>
 </defs>

 <!-- Pillow / cushion the baby rests on -->
 <ellipse cx="16" cy="24" rx="12" ry="3.5" fill="url(#pillow)"/>
 <ellipse cx="16" cy="23.5" rx="11" ry="3" fill="none" stroke="#6a7080" stroke-width="0.2" opacity="0.6"/>
 <!-- tassels at pillow corners -->
 <path d="M4 25 L3 26 M5 25 L4 26" stroke="#6a7080" stroke-width="0.3"/>
 <path d="M28 25 L29 26 M27 25 L28 26" stroke="#6a7080" stroke-width="0.3"/>

 <!-- Swaddled baby body (white wrap) -->
 <path d="M7 19 Q7 16 9 15 L22 14 Q26 14 26 18 Q26 22 23 23 L9 23 Q7 22 7 19 Z" fill="url(#swaddle)"/>
 <!-- swaddle folds -->
 <path d="M11 15.5 Q14 17 13 22" fill="none" stroke="#9aa0a8" stroke-width="0.3" opacity="0.7"/>
 <path d="M19 14.5 Q21 17 20 22" fill="none" stroke="#9aa0a8" stroke-width="0.3" opacity="0.7"/>

 <!-- Baby head -->
 <circle cx="9" cy="14" r="4" fill="url(#skinBR)"/>
 <!-- Tiny baby features -->
 <circle cx="7.8" cy="14" r="0.35" fill="#1a0a05"/>
 <circle cx="10" cy="14" r="0.35" fill="#1a0a05"/>
 <path d="M8.5 15.3 Q9 15.7 9.5 15.3" fill="none" stroke="#7a3010" stroke-width="0.25" stroke-linecap="round"/>
 <!-- rosy cheek -->
 <circle cx="7" cy="14.8" r="0.6" fill="#ff9a8a" opacity="0.55"/>
 <circle cx="10.8" cy="14.8" r="0.6" fill="#ff9a8a" opacity="0.55"/>
 <!-- nose -->
 <circle cx="9" cy="14.6" r="0.25" fill="#d49878"/>

 <!-- KIPPAH (yarmulke) on baby's head — defining Jewish ceremony marker -->
 <path d="M5.5 11.5 Q9 9 12.5 11.5 Q12.5 12 9 12 Q5.5 12 5.5 11.5 Z" fill="url(#kippah)"/>
 <path d="M5.5 11.5 Q9 10.5 12.5 11.5" fill="none" stroke="#0a1a40" stroke-width="0.2"/>

 <!-- STAR OF DAVID above — clear religious context -->
 <g transform="translate(23 6)">
 <path d="M0 -4 L3.5 2 L-3.5 2 Z" fill="url(#star)" opacity="0.95"/>
 <path d="M0 4 L-3.5 -2 L3.5 -2 Z" fill="url(#star)" opacity="0.95"/>
 <path d="M0 -3 L2.6 1.5 L-2.6 1.5 Z" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.5"/>
 </g>

 <!-- highlight on swaddle -->
 <ellipse cx="13" cy="16" rx="3" ry="0.8" fill="#ffffff" opacity="0.55"/>
</svg>
