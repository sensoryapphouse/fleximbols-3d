 <defs>
 <radialGradient id="btr-face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FFCC88"/><stop offset="100%" stop-color="#E8A050"/>
 </radialGradient>
 <linearGradient id="btr-bean" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4A2800"/><stop offset="100%" stop-color="#1A0A00"/>
 </linearGradient>
 </defs>
 <!-- Face -->
 <circle cx="16" cy="15" r="12" fill="url(#btr-face)" filter="url(#btr-shad)"/>
 <!-- Squinted eyes (bitter expression) -->
 <path d="M10 10 Q12 9 13 10.5" fill="none" stroke="#3A2010" stroke-width="1.2" stroke-linecap="round"/>
 <path d="M19 10 Q20 9 22 10.5" fill="none" stroke="#3A2010" stroke-width="1.2" stroke-linecap="round"/>
 <!-- Eye pupils (narrow squinted) -->
 <ellipse cx="11.5" cy="11" rx="1.5" ry="0.8" fill="#1a2a4a"/>
 <ellipse cx="20.5" cy="11" rx="1.5" ry="0.8" fill="#1a2a4a"/>
 <!-- White dot highlights on eyes -->
 <circle cx="12" cy="10.7" r="0.3" fill="white"/>
 <circle cx="21" cy="10.7" r="0.3" fill="white"/>
 <!-- Puckered downturned mouth -->
 <path d="M11 18 Q16 15 21 18" fill="none" stroke="#8B3A10" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Sour-line marks at cheeks -->
 <line x1="8" y1="14" x2="10" y2="15" stroke="#C87040" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="7.5" y1="16" x2="9.5" y2="15.5" stroke="#C87040" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="24" y1="14" x2="22" y2="15" stroke="#C87040" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="24.5" y1="16" x2="22.5" y2="15.5" stroke="#C87040" stroke-width="0.8" stroke-linecap="round"/>
 <!-- Coffee bean at lips -->
 <ellipse cx="16" cy="19.5" rx="2" ry="1.3" fill="url(#btr-bean)"/>
 <line x1="16" y1="18.2" x2="16" y2="20.8" stroke="#8B5A30" stroke-width="0.5" fill="none"/>
</svg>
