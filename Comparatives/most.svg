<defs>
<linearGradient id="most_tall" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#E54A1E"/>
<stop offset="1" stop-color="#FF9B45"/>
</linearGradient>
<linearGradient id="most_mid" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#9aa3b2"/>
<stop offset="1" stop-color="#c3cad6"/>
</linearGradient>
<linearGradient id="most_low" x1="0" y1="1" x2="0" y2="0">
<stop offset="0" stop-color="#9aa3b2"/>
<stop offset="1" stop-color="#c3cad6"/>
</linearGradient>
<linearGradient id="most_star" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFE066"/>
<stop offset="1" stop-color="#F5A623"/>
</linearGradient>
</defs>
<!-- baseline -->
<rect x="3" y="27" width="26" height="1.6" rx="0.8" fill="#5b6472"/>
<!-- short bar -->
<rect x="4.5" y="20" width="6" height="7" rx="1.2" fill="url(#most_low)"/>
<!-- medium bar -->
<rect x="12.8" y="15" width="6" height="12" rx="1.2" fill="url(#most_mid)"/>
<!-- tallest bar = MOST, highlighted -->
<rect x="21.1" y="7.5" width="6.4" height="19.5" rx="1.2" fill="url(#most_tall)"/>
<rect x="22.2" y="9" width="1.4" height="16" rx="0.7" fill="#ffffff" opacity="0.28"/>
<!-- star/crown on the tallest = the most -->
<path d="M24.3 1.3 L25.55 4.0 L28.5 4.35 L26.3 6.35 L26.9 9.25 L24.3 7.75 L21.7 9.25 L22.3 6.35 L20.1 4.35 L23.05 4.0 Z" fill="url(#most_star)" stroke="#d98a12" stroke-width="0.3"/>
</svg>
