  <defs>
    <linearGradient id="new_hatbright" x1="2" y1="10" x2="16" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe85a"/>
      <stop offset="1" stop-color="#f2c20a"/>
    </linearGradient>
    <linearGradient id="new_hatold" x1="18" y1="14" x2="30" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3b06a"/>
      <stop offset="1" stop-color="#8f7d40"/>
    </linearGradient>
  </defs>
  <!-- NEW (bright, shiny) hat on the left -->
  <g>
    <!-- brim -->
    <ellipse cx="9" cy="19.5" rx="8" ry="3" fill="url(#new_hatbright)" stroke="#b8920a" stroke-width="0.8"/>
    <!-- crown -->
    <path d="M3.6 19 C4.2 13.5 6 11.5 9 11.5 C12 11.5 13.8 13.5 14.4 19 Z" fill="url(#new_hatbright)" stroke="#b8920a" stroke-width="0.8"/>
    <!-- red band -->
    <path d="M3.9 18.2 C6 19.4 12 19.4 14.1 18.2 L13.7 16.4 C11.8 17.4 6.2 17.4 4.3 16.4 Z" fill="#e8392b" stroke="#a3251a" stroke-width="0.5"/>
    <!-- little red flower -->
    <circle cx="12.2" cy="16.4" r="1.1" fill="#e8392b" stroke="#a3251a" stroke-width="0.4"/>
    <circle cx="12.2" cy="16.4" r="0.4" fill="#ffd23a"/>
    <!-- sparkle / shine marks (NEW) -->
    <g stroke="#ffb300" stroke-width="0.9" stroke-linecap="round">
      <line x1="9" y1="6.5" x2="9" y2="9"/>
      <line x1="4.5" y1="8" x2="6" y2="10"/>
      <line x1="13.5" y1="8" x2="12" y2="10"/>
      <line x1="2.5" y1="12" x2="4.2" y2="12.5"/>
      <line x1="15.5" y1="12" x2="13.8" y2="12.5"/>
    </g>
    <!-- downward red arrow pointing at the new hat -->
    <g fill="#e8392b" stroke="#a3251a" stroke-width="0.4">
      <rect x="8.1" y="2" width="1.8" height="3.2"/>
      <path d="M6.4 4.8 L11.6 4.8 L9 8.2 Z"/>
    </g>
  </g>
  <!-- OLD (faded, dull) hat on the right for contrast -->
  <g opacity="0.9">
    <ellipse cx="24" cy="21" rx="6.6" ry="2.6" fill="url(#new_hatold)" stroke="#6e5f30" stroke-width="0.7"/>
    <path d="M19.6 20.6 C20.1 16 21.6 14.3 24 14.3 C26.4 14.3 27.9 16 28.4 20.6 Z" fill="url(#new_hatold)" stroke="#6e5f30" stroke-width="0.7"/>
    <path d="M20 19.9 C21.7 20.9 26.3 20.9 28 19.9 L27.7 18.4 C26.1 19.2 21.9 19.2 20.3 18.4 Z" fill="#9c2418" stroke="#6e1810" stroke-width="0.4"/>
    <!-- a worn tear notch -->
    <path d="M27 15 L28.4 16 L27.2 16.4 Z" fill="#fff" opacity="0"/>
    <path d="M21.5 15.5 q0.8 -0.8 1.4 0.2" fill="none" stroke="#6e5f30" stroke-width="0.5"/>
  </g>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><polygon points="120,347 264,202 232,170 361,151 342,280 310,248 165,392" fill="#3fae5a" stroke="#1a1a1a" stroke-width="26" stroke-linejoin="round"/></g></svg>
