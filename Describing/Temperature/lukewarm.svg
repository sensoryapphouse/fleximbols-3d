<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F5F0E8"/>
 <stop offset="100%" stop-color="#EDE8E0"/>
 </linearGradient>
 <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#E8E4E0"/>
 <stop offset="40%" stop-color="#FFFFFF"/>
 <stop offset="70%" stop-color="#F0EDE8"/>
 <stop offset="100%" stop-color="#D8D4CE"/>
 </linearGradient>
 <!-- Mercury — pinkish neutral (neither red nor blue) -->
 <linearGradient id="mercuryGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFB8A0"/>
 <stop offset="55%" stop-color="#E0907A"/>
 <stop offset="100%" stop-color="#B86050"/>
 </linearGradient>
 <radialGradient id="bulbGrad" cx="38%" cy="35%" r="62%">
 <stop offset="0%" stop-color="#FFCAB8"/>
 <stop offset="55%" stop-color="#D8806A"/>
 <stop offset="100%" stop-color="#A05040"/>
 </radialGradient>
 <!-- Hand skin -->
 <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F5C88A"/>
 <stop offset="100%" stop-color="#D4915A"/>
 </linearGradient>
 </defs>

 

 <!-- Thermometer outer tube -->
 <rect x="10" y="4" width="5" height="22" fill="url(#tubeGrad)" rx="2.5"/>
 <rect x="10" y="4" width="5" height="22" fill="none" stroke="#C8C4C0" stroke-width="0.4" rx="2.5"/>

 <!-- Mercury at mid-height — about 50% up = filling from bottom half -->
 <rect x="11.5" y="14" width="2" height="12" fill="url(#mercuryGrad)" rx="1"/>

 <!-- Bulb at bottom -->
 <circle cx="12.5" cy="26.5" r="3.5" fill="url(#bulbGrad)"/>
 <circle cx="11.5" cy="25.5" r="1.1" fill="#FFCAB8" opacity="0.5"/>

 <!-- Tube glass shine -->
 <line x1="11" y1="6" x2="11" y2="24" stroke="#FFFFFF" stroke-width="0.45" opacity="0.65" stroke-linecap="round"/>

 <!-- Scale ticks -->
 <line x1="15" y1="8" x2="16.5" y2="8" stroke="#B0A8A0" stroke-width="0.4"/>
 <line x1="15" y1="12" x2="16.5" y2="12" stroke="#B0A8A0" stroke-width="0.4"/>
 <line x1="15" y1="16" x2="16.5" y2="16" stroke="#B0A8A0" stroke-width="0.4"/>
 <line x1="15" y1="20" x2="16.5" y2="20" stroke="#B0A8A0" stroke-width="0.4"/>

 <!-- Small hand icon beside thermometer with relaxed 'meh' gesture -->
 <!-- Wrist/forearm approach from right -->
 <rect x="21" y="15.5" width="3" height="5" fill="url(#skinGrad)" rx="1"/>
 <!-- Palm -->
 <rect x="19" y="14.5" width="4.5" height="5.5" fill="url(#skinGrad)" rx="1.2"/>
 <!-- Fingers — slightly curved relaxed -->
 <!-- Thumb (sideways) -->
 <rect x="18.2" y="15.5" width="1.2" height="3.5" fill="url(#skinGrad)" rx="0.6"/>
 <!-- Index finger -->
 <rect x="19.5" y="12.8" width="1.2" height="3.2" fill="url(#skinGrad)" rx="0.6"/>
 <!-- Middle finger -->
 <rect x="21.0" y="12.2" width="1.2" height="3.5" fill="url(#skinGrad)" rx="0.6"/>
 <!-- Ring finger -->
 <rect x="22.5" y="12.8" width="1.1" height="3.2" fill="url(#skinGrad)" rx="0.6"/>
 <!-- Pinky -->
 <rect x="23.8" y="13.5" width="1.0" height="2.5" fill="url(#skinGrad)" rx="0.5"/>
 <!-- Hand highlight -->
 <ellipse cx="21.5" cy="15" rx="2" ry="0.7" fill="#F8DEB8" opacity="0.45"/>
</svg>
