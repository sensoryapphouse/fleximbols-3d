 <defs>
 <radialGradient id="dot" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 </defs>
 <!-- 3 of 5 filled — several = plain count, no judgment auxiliary -->
 <!-- Different 3 from 'some': top + upper-left + upper-right (scattered, non-triangle) -->
 <!-- TOP: filled -->
 <circle cx="16" cy="8" r="2.2" fill="url(#dot)"/>
 <ellipse cx="15.4" cy="7.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- UPPER-LEFT: filled -->
 <circle cx="9" cy="14" r="2.2" fill="url(#dot)"/>
 <ellipse cx="8.4" cy="13.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- UPPER-RIGHT: filled -->
 <circle cx="23" cy="14" r="2.2" fill="url(#dot)"/>
 <ellipse cx="22.4" cy="13.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- LOWER-LEFT: empty -->
 <circle cx="11" cy="23" r="2.2" fill="none" stroke="#9CA3AF" stroke-width="0.6"/>
 <!-- LOWER-RIGHT: empty -->
 <circle cx="21" cy="23" r="2.2" fill="none" stroke="#9CA3AF" stroke-width="0.6"/>
</svg>
