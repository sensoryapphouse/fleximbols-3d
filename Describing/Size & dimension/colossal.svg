 <defs>
 <radialGradient id="col-sphere" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 <linearGradient id="col-person" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <filter id="col-sh" x="-20%" y="-20%" width="140%" height="140%">
 <feGaussianBlur stdDeviation="1.0"/>
 </filter>
 <filter id="col-sh-p" x="-80%" y="-30%" width="260%" height="160%">
 <feGaussianBlur stdDeviation="0.25"/>
 </filter>
 </defs>
 <!-- Shadow for massive sphere -->
 <!-- Sphere fills 85% canvas (r≈13.6) centred -->
 <circle cx="15" cy="15" r="13.6" fill="url(#col-sphere)"/>
 <!-- Highlight upper-left -->
 <ellipse cx="9.5" cy="9.5" rx="5.0" ry="3.1" fill="#FFFFFF" fill-opacity="0.6" transform="rotate(-30 9.5 9.5)"/>
 <!-- Shadow for tiny person -->
 
 <!-- Tiny silhouette person lower-right (head + body) -->
 <!-- head -->
 <circle cx="27.5" cy="28.2" r="0.9" fill="url(#col-person)"/>
 <!-- body torso -->
 <rect x="26.8" y="29.2" width="1.4" height="1.6" rx="0.3" fill="url(#col-person)"/>
 <!-- legs -->
 <rect x="26.8" y="30.7" width="0.55" height="1.1" rx="0.2" fill="url(#col-person)"/>
 <rect x="27.65" y="30.7" width="0.55" height="1.1" rx="0.2" fill="url(#col-person)"/>
</svg>
