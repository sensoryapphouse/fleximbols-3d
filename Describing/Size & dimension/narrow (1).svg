 <defs>
 <linearGradient id="narr-left" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#2060c0"/>
 <stop offset="100%" stop-color="#5090f0"/>
 </linearGradient>
 <linearGradient id="narr-right" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#5090f0"/>
 <stop offset="100%" stop-color="#2060c0"/>
 </linearGradient>
 <linearGradient id="narr-gap" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d0e0ff"/>
