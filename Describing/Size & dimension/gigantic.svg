 <defs>
 <linearGradient id="cubeGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#5090d0"/>
 <stop offset="100%" stop-color="#103870"/>
 </linearGradient>
 <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#3070a8"/>
 <stop offset="100%" stop-color="#082848"/>
 </linearGradient>
 <linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#80b8e8"/>
 <stop offset="100%" stop-color="#3070a8"/>
 </linearGradient>
 <linearGradient id="tinyGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#c0c0c0"/>
 <stop offset="100%" stop-color="#606060"/>
 </linearGradient>
 </defs>
 <!-- giant cube front face -->
 
 <!-- cube top face -->
 <path d="M4 8 L10 3 L30 3 L24 8Z" fill="url(#cubeTop)"/>
 <!-- cube side face -->
 <path d="M24 8 L30 3 L30 23 L24 28Z" fill="url(#cubeSide)"/>
 <!-- measurement arrows -->
 <line x1="2" y1="8" x2="2" y2="28" stroke="#e0b030" stroke-width="1"/>
 <line x1="1.2" y1="8" x2="2.8" y2="8" stroke="#e0b030" stroke-width="1"/>
 <line x1="1.2" y1="28" x2="2.8" y2="28" stroke="#e0b030" stroke-width="1"/>
 <!-- top measure -->
 <line x1="4" y1="1.5" x2="24" y2="1.5" stroke="#e0b030" stroke-width="1"/>
 <line x1="4" y1="0.8" x2="4" y2="2.2" stroke="#e0b030" stroke-width="1"/>
 <line x1="24" y1="0.8" x2="24" y2="2.2" stroke="#e0b030" stroke-width="1"/>
 <!-- cube face highlight -->
 <rect x="4" y="8" width="20" height="4" rx="0.5" fill="#ffffff" fill-opacity="0.2"/>
 <!-- tiny human silhouette -->
 <circle cx="27" cy="26" r="1.2" fill="url(#tinyGrad)"/>
 <rect x="26.5" y="27.2" width="1" height="2" rx="0.3" fill="url(#tinyGrad)"/>
 <line x1="26.5" y1="28" x2="25.5" y2="29.5" stroke="#808080" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="27.5" y1="28" x2="28.5" y2="29.5" stroke="#808080" stroke-width="0.7" stroke-linecap="round"/>
