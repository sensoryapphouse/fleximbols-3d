<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F0EDE8"/>
 <stop offset="100%" stop-color="#E2DDD6"/>
 </linearGradient>
 <linearGradient id="figureGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#D8C8A8"/>
 <stop offset="100%" stop-color="#A88A60"/>
 </linearGradient>
 <!-- Ground -->
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C8A96A"/>
 <stop offset="100%" stop-color="#8B6540"/>
 </linearGradient>
 <!-- Magnifier glass -->
 <radialGradient id="lensGrad" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#C8ECFF" stop-opacity="0.85"/>
 <stop offset="100%" stop-color="#80C4F8" stop-opacity="0.6"/>
 </radialGradient>
 <!-- Speck (orange) enlarged in magnifier -->
 <radialGradient id="speckGrad" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 </defs>

 
 <rect x="0" y="27" width="32" height="5" fill="url(#ground)" rx="0.5"/>

 <!-- Normal-size figure — standing centred, ~60% canvas height (~19px) -->
 <!-- Legs -->
 <line x1="13.8" y1="23.5" x2="12.5" y2="27" stroke="#9A8060" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="15.2" y1="23.5" x2="16.5" y2="27" stroke="#9A8060" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Body -->
 <rect x="12.2" y="17" width="5.6" height="6.8" fill="url(#figureGrad)" rx="1.2"/>
 <!-- Arms — left arm out, hand cupped/open for the speck -->
 <line x1="12.2" y1="18.5" x2="9.5" y2="21" stroke="#A88A60" stroke-width="1.0" stroke-linecap="round"/>
 <!-- Right arm -->
 <line x1="17.8" y1="18.5" x2="20.0" y2="20.5" stroke="#A88A60" stroke-width="1.0" stroke-linecap="round"/>
 <!-- Hand / palm for speck -->
 <ellipse cx="9.0" cy="21.5" rx="1.1" ry="0.6" fill="#C8A880" transform="rotate(-15 9 21.5)"/>
 <!-- Head -->
 <circle cx="15" cy="15" r="2.6" fill="#D8C8A8"/>
 <!-- Head highlight -->
 <circle cx="14.2" cy="14.2" r="0.9" fill="#EDE0C8" opacity="0.6"/>

 <!-- Actual real speck in the palm — nearly invisible, ~2% of canvas -->
 <circle cx="9.0" cy="21.0" r="0.25" fill="#FF8B3D"/>

 <!-- Magnifying glass to the right -->
 <!-- Glass circle -->
 <circle cx="24" cy="13" r="5.5" fill="url(#lensGrad)" stroke="#B08040" stroke-width="0.8"/>
 <!-- Lens rim highlight -->
 <circle cx="24" cy="13" r="5.5" fill="none" stroke="#FFEEBB" stroke-width="0.4" opacity="0.6"/>
 <!-- Handle -->
 <line x1="28.5" y1="17.5" x2="31" y2="21" stroke="#B08040" stroke-width="1.4" stroke-linecap="round"/>
 <!-- Speck enlarged inside lens — big orange dot -->
 <circle cx="24" cy="13" r="2.0" fill="url(#speckGrad)"/>
 <circle cx="23.2" cy="12.2" r="0.55" fill="#FFAB70" opacity="0.65"/>
 <!-- Lens glare -->
 <ellipse cx="21.5" cy="10.5" rx="1.2" ry="0.6" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 21.5 10.5)"/>
</svg>
