<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#EFF6E8"/>
 <stop offset="100%" stop-color="#DDF0D0"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A0D468"/>
 <stop offset="100%" stop-color="#5A8E3C"/>
 </linearGradient>
 <!-- Snail body — soft cream -->
 <radialGradient id="bodyGrad" cx="45%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#F5E8C8"/>
 <stop offset="60%" stop-color="#D4B880"/>
 <stop offset="100%" stop-color="#A88040"/>
 </radialGradient>
 <!-- Shell spiral — warm brown -->
 <radialGradient id="shellGrad" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#D4915A"/>
 <stop offset="45%" stop-color="#A85C28"/>
 <stop offset="100%" stop-color="#6A3010"/>
 </radialGradient>
 <!-- Slime trail — pale silver -->
 <linearGradient id="slimeGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#D0E0E8" stop-opacity="0"/>
 <stop offset="50%" stop-color="#D0E0E8" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#B8D0DC" stop-opacity="0.85"/>
 </linearGradient>
 <!-- Cloud -->
 <radialGradient id="cloudGrad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#E8E8E8"/>
 </radialGradient>
 </defs>

 
 <rect x="0" y="27" width="32" height="5" fill="url(#ground)" rx="0.5"/>

 <!-- Lazy cloud above -->
 <ellipse cx="7" cy="7" rx="4.5" ry="2.0" fill="url(#cloudGrad)" opacity="0.85"/>
 <ellipse cx="5" cy="7.5" rx="2.8" ry="1.7" fill="url(#cloudGrad)" opacity="0.85"/>
 <ellipse cx="9.5" cy="7.5" rx="2.5" ry="1.6" fill="url(#cloudGrad)" opacity="0.85"/>

 <!-- Slime trail stretching left behind snail (glossy pale silver) -->
 <path d="M 3 26.5 Q 10 26 16 26.5" fill="none" stroke="url(#slimeGrad)" stroke-width="2.0" stroke-linecap="round" opacity="0.8"/>
 <!-- Slime sheen highlights -->
 <path d="M 4 26.2 Q 10 25.7 15.5 26.2" fill="none" stroke="#E8F0F8" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>

 <!-- Snail body -->
 <ellipse cx="21" cy="25.5" rx="5.5" ry="2.0" fill="url(#bodyGrad)"/>
 <!-- Snail body highlight -->
 <ellipse cx="20" cy="24.8" rx="2.5" ry="0.7" fill="#F8EDD8" opacity="0.55"/>

 <!-- Snail shell — spiral -->
 <circle cx="22" cy="21.5" r="4.5" fill="url(#shellGrad)"/>
 <!-- Shell highlight -->
 <circle cx="20.8" cy="20.4" r="1.4" fill="#E8B080" opacity="0.5"/>
 <!-- Spiral lines -->
 <circle cx="22" cy="21.5" r="2.8" fill="none" stroke="#6A3010" stroke-width="0.5" opacity="0.5"/>
 <circle cx="22" cy="21.5" r="1.4" fill="none" stroke="#6A3010" stroke-width="0.45" opacity="0.45"/>
 <circle cx="22" cy="21.5" r="0.5" fill="#6A3010" opacity="0.3"/>

 <!-- Eye stalks -->
 <line x1="16.5" y1="24.8" x2="15.5" y2="22.5" stroke="#A88040" stroke-width="0.6" stroke-linecap="round"/>
 <line x1="17.5" y1="24.5" x2="17.0" y2="22.0" stroke="#A88040" stroke-width="0.6" stroke-linecap="round"/>
 <!-- Eye dots at tips of stalks -->
 <circle cx="15.3" cy="22.2" r="0.6" fill="#5A3010"/>
 <circle cx="16.8" cy="21.7" r="0.6" fill="#5A3010"/>
 <!-- Eye highlights -->
 <circle cx="15.1" cy="22.0" r="0.2" fill="#FFFFFF" opacity="0.8"/>
 <circle cx="16.6" cy="21.5" r="0.2" fill="#FFFFFF" opacity="0.8"/>

 <!-- Droopy expression — slight sad curve on body -->
 <path d="M 18.5 25.2 Q 19.5 25.8 20.5 25.2" fill="none" stroke="#8A6030" stroke-width="0.4" stroke-linecap="round" opacity="0.6"/>
</svg>
