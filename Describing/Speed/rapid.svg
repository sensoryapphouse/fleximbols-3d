 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFF0D0"/>
 <stop offset="100%" stop-color="#FFE090"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C8A96A"/>
 <stop offset="100%" stop-color="#8B6540"/>
 </linearGradient>
 <linearGradient id="torsoGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A0D468"/>
 <stop offset="100%" stop-color="#5A8E3C"/>
 </linearGradient>
 <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F5C88A"/>
 <stop offset="100%" stop-color="#D4915A"/>
 </linearGradient>
 <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#FFD45E" stop-opacity="0"/>
 <stop offset="70%" stop-color="#FFD45E" stop-opacity="0.95"/>
 <stop offset="100%" stop-color="#E5A700" stop-opacity="0.6"/>
 </linearGradient>
 </defs>

 
 <rect x="0" y="28" width="32" height="4" fill="url(#ground)" rx="0.5"/>

 <!-- After-image / ghost at 25% opacity — offset left -->
 <rect x="12" y="15.5" width="4.5" height="5.8" fill="#5A8E3C" rx="0.9" opacity="0.2" transform="rotate(-22 14.3 18.4)"/>
 <circle cx="17" cy="13" r="2.1" fill="#D4915A" opacity="0.22"/>
 <line x1="12.5" y1="17.5" x2="9" y2="20.5" stroke="#A88A60" stroke-width="0.9" opacity="0.2" stroke-linecap="round"/>
 <line x1="16.5" y1="16.5" x2="19.5" y2="14" stroke="#A88A60" stroke-width="0.9" opacity="0.2" stroke-linecap="round"/>
 <line x1="13.5" y1="21.5" x2="10.5" y2="26" stroke="#A88A60" stroke-width="1.0" opacity="0.2" stroke-linecap="round"/>
 <line x1="15.5" y1="21.5" x2="18.5" y2="25" stroke="#A88A60" stroke-width="1.0" opacity="0.2" stroke-linecap="round"/>

 <!-- 5-6 sharp horizontal motion streaks -->
 <line x1="0.5" y1="15.5" x2="16" y2="15.5" stroke="url(#streakGrad)" stroke-width="1.0" stroke-linecap="round"/>
 <line x1="0.5" y1="17.8" x2="15" y2="17.8" stroke="url(#streakGrad)" stroke-width="0.9" stroke-linecap="round"/>
 <line x1="0.5" y1="20.0" x2="14" y2="20.0" stroke="url(#streakGrad)" stroke-width="0.85" stroke-linecap="round"/>
 <line x1="0.5" y1="22.2" x2="13" y2="22.2" stroke="url(#streakGrad)" stroke-width="0.75" stroke-linecap="round"/>
 <line x1="0.5" y1="24.4" x2="12" y2="24.4" stroke="url(#streakGrad)" stroke-width="0.65" stroke-linecap="round"/>

 <!-- Running figure — very sharp lean -->
 <rect x="20" y="15" width="4.8" height="5.8" fill="url(#torsoGrad)" rx="1.0" transform="rotate(-25 22.4 17.9)"/>
 <circle cx="24.5" cy="13" r="2.2" fill="url(#skinGrad)"/>
 <circle cx="23.8" cy="12.3" r="0.7" fill="#F8DEB8" opacity="0.55"/>
 <!-- Arms -->
 <line x1="20.5" y1="17" x2="17" y2="20" stroke="#A88A60" stroke-width="1.0" stroke-linecap="round"/>
 <line x1="24.5" y1="15.8" x2="27.5" y2="13" stroke="#A88A60" stroke-width="1.0" stroke-linecap="round"/>
 <!-- Legs -->
 <line x1="21.5" y1="21" x2="18.5" y2="27" stroke="#A88A60" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="23.5" y1="21" x2="27" y2="25.5" stroke="#A88A60" stroke-width="1.1" stroke-linecap="round"/>

 <!-- Dust kick-up (more prominent than 'quick') -->
 <circle cx="18" cy="27" r="1.4" fill="#D8C0A0" opacity="0.55"/>
 <circle cx="16.5" cy="26.2" r="0.8" fill="#D8C0A0" opacity="0.4"/>
 <circle cx="15.5" cy="27.3" r="0.5" fill="#D8C0A0" opacity="0.3"/>
</svg>
