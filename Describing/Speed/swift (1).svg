<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#EAF4FF"/>
 <stop offset="100%" stop-color="#C8E8FF"/>
 </linearGradient>
 <!-- Bird body — warm gold gradient -->
 <linearGradient id="birdGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="60%" stop-color="#E5A700"/>
 <stop offset="100%" stop-color="#C07A00"/>
 </linearGradient>
 <!-- Wing gradient -->
 <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFEA90"/>
 <stop offset="100%" stop-color="#C07A00"/>
 </linearGradient>
 <!-- Motion streak gradient — gold, left-fading -->
 <linearGradient id="streakGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#FFD45E" stop-opacity="0"/>
 <stop offset="70%" stop-color="#FFD45E" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#E5A700" stop-opacity="0.6"/>
 </linearGradient>
 </defs>

 

 <!-- 3 curved motion streaks arcing behind the bird's trajectory -->
 <path d="M 1 20 Q 8 17 16 16" fill="none" stroke="url(#streakGrad)" stroke-width="1.1" stroke-linecap="round"/>
 <path d="M 1 22 Q 8 19.5 15 19" fill="none" stroke="url(#streakGrad)" stroke-width="0.95" stroke-linecap="round"/>
 <path d="M 1 24 Q 8 22 14 22.5" fill="none" stroke="url(#streakGrad)" stroke-width="0.8" stroke-linecap="round"/>

 <!-- Wind swoosh curl at tail -->
 <path d="M 16 19 Q 14 21 15.5 23 Q 17 25 15 26" fill="none" stroke="#C0D8F0" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>

 <!-- Streamlined swallow-like bird — diagonal, wings angled back -->
 <!-- Bird body — sleek teardrop going upper-left to lower-right diagonal -->
 <ellipse cx="22" cy="16" rx="5.5" ry="2.0" fill="url(#birdGrad)" transform="rotate(-20 22 16)"/>
 <!-- Body highlight -->
 <ellipse cx="20.5" cy="15.0" rx="2.0" ry="0.65" fill="#FFEA90" opacity="0.6" transform="rotate(-20 20.5 15.0)"/>

 <!-- Left wing — swept back, above body -->
 <polygon points="22,15 18,9 20,14 24,12" fill="url(#wingGrad)"/>
 <!-- Wing highlight -->
 <line x1="20" y1="11" x2="22" y2="14" stroke="#FFEA90" stroke-width="0.4" opacity="0.6"/>

 <!-- Right wing — swept back, below body -->
 <polygon points="22,17 18,23 20,18 24,20" fill="url(#wingGrad)" opacity="0.85"/>

 <!-- Tail feathers — fork -->
 <polygon points="16,16.5 12,14 14,16 12,18 16,17.5" fill="url(#birdGrad)"/>

 <!-- Beak — sharp pointed orange -->
 <polygon points="27.5,15.5 31,16 27.5,16.5" fill="#FF8B3D"/>

 <!-- Eye -->
 <circle cx="26.8" cy="15.7" r="0.5" fill="#3A2810"/>
 <circle cx="26.65" cy="15.55" r="0.17" fill="#FFFFFF" opacity="0.9"/>
</svg>
