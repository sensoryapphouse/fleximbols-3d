<path d="M9 25 Q 14 26 19 24 Q 22 24 23 23" stroke="#1A1F2C" stroke-width="0.6" fill="none" stroke-linecap="round"/>
<!-- snaggle tooth -->
<path d="M15 25 L 14 27 L 16 27 Z" fill="#FFFFFF" stroke="#1A1F2C" stroke-width="0.15"/>
<!-- warts -->
<circle cx="22" cy="20" r="0.8" fill="url(#wart)"/>
<circle cx="22" cy="20" r="0.3" fill="#1A0E04"/>
<circle cx="8" cy="22" r="0.6" fill="url(#wart)"/>
<circle cx="14" cy="11" r="0.5" fill="url(#wart)"/>
<!-- few wiry hairs -->
<path d="M10 4 L 9 1 M 14 3.5 L 14 0.5 M 18 4 L 19 1 M 22 5 L 23 2" stroke="#3A2010" stroke-width="0.4" stroke-linecap="round"/>
