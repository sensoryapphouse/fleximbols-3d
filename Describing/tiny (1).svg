<circle cx="13" cy="13" r="10" fill="none" stroke="url(#rim)" stroke-width="2"/>
<!-- lens -->
<circle cx="13" cy="13" r="9" fill="url(#lens)"/>
<ellipse cx="9" cy="9" rx="3" ry="2" fill="url(#hi)"/>
