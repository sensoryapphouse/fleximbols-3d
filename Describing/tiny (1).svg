<defs>
<radialGradient id="lens" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#BFE6FF" stop-opacity="0.5"/><stop offset="100%" stop-color="#7BC8E6" stop-opacity="0.3"/></radialGradient>
<radialGradient id="rim" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#F7C84B"/><stop offset="100%" stop-color="#7A4A08"/></radialGradient>
<linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C0A878"/><stop offset="100%" stop-color="#5A3A18"/></linearGradient>
<radialGradient id="sk" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FFE0BD"/><stop offset="100%" stop-color="#D49D7A"/></radialGradient>
<radialGradient id="sh" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#5AC85A"/><stop offset="100%" stop-color="#0E3A0E"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- magnifier handle -->
<rect x="22" y="22" width="9" height="2.5" rx="0.5" fill="url(#handle)" transform="rotate(40 22 22)"/>
<rect x="29" y="27" width="3" height="2.5" rx="0.5" fill="#3A1808" transform="rotate(40 22 22)"/>
