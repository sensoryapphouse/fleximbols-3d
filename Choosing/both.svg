 <defs>
 <radialGradient id="dot" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 </defs>
 <!-- Two filled dots — both = these two together, connected bracket between -->
 <!-- Left dot: filled -->
 <circle cx="9" cy="16" r="2.8" fill="url(#dot)"/>
 <ellipse cx="8.3" cy="15.3" rx="1.0" ry="0.6" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- Right dot: filled -->
 <circle cx="23" cy="16" r="2.8" fill="url(#dot)"/>
 <ellipse cx="22.3" cy="15.3" rx="1.0" ry="0.6" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- Connecting bracket between the two — inclusive togetherness -->
 <path d="M11.8 13 Q16 10.5 20.2 13" stroke="url(#bracketGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
 <path d="M11.8 19 Q16 21.5 20.2 19" stroke="url(#bracketGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
