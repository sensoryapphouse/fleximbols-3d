 <defs>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F0EDE5"/>
 <stop offset="100%" stop-color="#D4CFC5"/>
 </linearGradient>
 <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C8C0B0"/>
 <stop offset="100%" stop-color="#908878"/>
 </linearGradient>
 <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E0DDD5"/>
 <stop offset="100%" stop-color="#B8B4AC"/>
 </linearGradient>
 <linearGradient id="cabinetGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="fridgeGrad" x1="0" y1="0" x2="0" y2="1">
