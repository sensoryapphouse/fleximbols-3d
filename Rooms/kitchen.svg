 <!-- Fridge door split -->
 <line x1="22" y1="10" x2="29" y2="10" stroke="#C0C4C8" stroke-width="0.4"/>
 <!-- Freezer handle -->
 <rect x="23" y="5.5" width="4" height="0.6" rx="0.3" fill="#C9CDD3"/>
 <!-- Fridge handle -->
 <rect x="23" y="13" width="4" height="0.6" rx="0.3" fill="#C9CDD3"/>
 <!-- Fridge logo -->
 <circle cx="25.5" cy="8" r="0.5" fill="#C0C4C8"/>
</svg>
