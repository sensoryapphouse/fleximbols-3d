 <circle cx="12" cy="16.5" r="1" fill="#5A5E64" stroke="#3A3E44" stroke-width="0.3"/>
 <circle cx="12" cy="16.5" r="0.5" fill="#3A3E44"/>
 <circle cx="15" cy="16.5" r="1" fill="#5A5E64" stroke="#3A3E44" stroke-width="0.3"/>
 <circle cx="15" cy="16.5" r="0.5" fill="#3A3E44"/>
 <circle cx="18" cy="16.5" r="1" fill="#5A5E64" stroke="#3A3E44" stroke-width="0.3"/>
 <circle cx="18" cy="16.5" r="0.5" fill="#3A3E44"/>
 <!-- Stove knobs -->
 <circle cx="11" cy="15" r="0.5" fill="#9A9EA4"/>
 <circle cx="13.5" cy="15" r="0.5" fill="#9A9EA4"/>
 <circle cx="16" cy="15" r="0.5" fill="#9A9EA4"/>
 <circle cx="18.5" cy="15" r="0.5" fill="#9A9EA4"/>
