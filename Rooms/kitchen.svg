 <rect x="10.5" y="19.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
 <rect x="5" y="19.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
 <rect x="16" y="19.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
