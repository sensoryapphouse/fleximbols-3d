 <rect x="5.5" y="14.5" width="0.6" height="1.8" rx="0.2" fill="#C9CDD3"/>
 <rect x="4.5" y="14.5" width="2.5" height="0.5" rx="0.2" fill="#C9CDD3"/>
 <!-- STOVE (centre of counter) -->
 <rect x="10" y="16" width="9" height="1.5" rx="0.3" fill="url(#stoveGrad)"/>
