 <!-- Wall -->
 <rect x="2" y="2" width="28" height="20" fill="url(#wallGrad)"/>
 <!-- Backsplash tile -->
 <rect x="2" y="12" width="28" height="4" fill="#E8EDF5" opacity="0.7"/>
 <line x1="2" y1="14" x2="30" y2="14" stroke="#C0C8D4" stroke-width="0.3"/>
 <line x1="8" y1="12" x2="8" y2="16" stroke="#C0C8D4" stroke-width="0.3"/>
 <line x1="14" y1="12" x2="14" y2="16" stroke="#C0C8D4" stroke-width="0.3"/>
 <line x1="20" y1="12" x2="20" y2="16" stroke="#C0C8D4" stroke-width="0.3"/>
 <line x1="26" y1="12" x2="26" y2="16" stroke="#C0C8D4" stroke-width="0.3"/>
 <!-- Floor -->
 <rect x="2" y="22" width="28" height="8" fill="url(#floorGrad)"/>
 <!-- Floor tiles -->
 <line x1="2" y1="25" x2="30" y2="25" stroke="#807870" stroke-width="0.3" opacity="0.5"/>
 <line x1="2" y1="28" x2="30" y2="28" stroke="#807870" stroke-width="0.3" opacity="0.5"/>
 <line x1="9" y1="22" x2="9" y2="30" stroke="#807870" stroke-width="0.3" opacity="0.5"/>
 <line x1="18" y1="22" x2="18" y2="30" stroke="#807870" stroke-width="0.3" opacity="0.5"/>
 <line x1="25" y1="22" x2="25" y2="30" stroke="#807870" stroke-width="0.3" opacity="0.5"/>
 <!-- UPPER CABINETS -->
 
 <!-- Cabinet doors -->
 <line x1="8" y1="3" x2="8" y2="10" stroke="#8B5C3A" stroke-width="0.4"/>
 <line x1="14" y1="3" x2="14" y2="10" stroke="#8B5C3A" stroke-width="0.4"/>
 <!-- Handles -->
 <rect x="10.5" y="6.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
 <rect x="5" y="6.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
 <rect x="16" y="6.5" width="1.5" height="0.4" rx="0.2" fill="#C9CDD3"/>
 <!-- COUNTER / LOWER CABINETS -->
 
 <rect x="2" y="16" width="19" height="1.5" rx="0.3" fill="url(#counterGrad)"/>
 <!-- Lower cabinet doors -->
 <line x1="8" y1="17.5" x2="8" y2="22" stroke="#8B5C3A" stroke-width="0.4"/>
 <line x1="14" y1="17.5" x2="14" y2="22" stroke="#8B5C3A" stroke-width="0.4"/>
