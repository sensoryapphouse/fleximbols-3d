 <!-- floor -->
 
 <!-- back wall -->
 <rect x="2" y="4" width="28" height="20" fill="url(#wallGrad)"/>
 <!-- door frame opening -->
 <rect x="7" y="6" width="12" height="18" rx="0.5" fill="#2a1a08" fill-opacity="0.85"/>
