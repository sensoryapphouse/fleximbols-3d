 <defs>
 <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d4a96a"/>
 <stop offset="100%" stop-color="#8b6030"/>
 </linearGradient>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#f0e0c0"/>
 <stop offset="100%" stop-color="#c8b090"/>
 </linearGradient>
 <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#8b5e2e"/>
 <stop offset="100%" stop-color="#5a3a18"/>
 </linearGradient>
 <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c0884a"/>
 <stop offset="100%" stop-color="#7a5020"/>
 </linearGradient>
 <linearGradient id="hookGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#c0a060"/>
 <stop offset="100%" stop-color="#806830"/>
 </linearGradient>
