 <rect x="8" y="8" width="2" height="5" rx="0.3" fill="#c0884a" fill-opacity="0.7"/>
 <rect x="8" y="15" width="2" height="5" rx="0.3" fill="#c0884a" fill-opacity="0.7"/>
 <!-- door knob -->
 <circle cx="13" cy="15" r="0.7" fill="url(#hookGrad)"/>
 <!-- hallway glimpse -->
 <rect x="13" y="6" width="6" height="18" fill="#b0c8e0" fill-opacity="0.4"/>
 <!-- console table -->
 
 <rect x="22" y="19.2" width="1" height="4.8" rx="0.3" fill="url(#tableGrad)"/>
 <rect x="27" y="19.2" width="1" height="4.8" rx="0.3" fill="url(#tableGrad)"/>
