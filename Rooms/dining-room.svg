 <!-- Bulbs -->
 <circle cx="12" cy="7.5" r="0.7" fill="#FFF0A0"/>
 <circle cx="16" cy="7.5" r="0.7" fill="#FFF0A0"/>
 <circle cx="20" cy="7.5" r="0.7" fill="#FFF0A0"/>
 <!-- Glow -->
 <ellipse cx="16" cy="8" rx="5" ry="1.5" fill="#F5D060" opacity="0.2"/>
 <!-- DINING TABLE -->
 
 <!-- Table legs -->
 <rect x="7" y="22.5" width="1.2" height="3" rx="0.3" fill="#7A4A20"/>
 <rect x="23.8" y="22.5" width="1.2" height="3" rx="0.3" fill="#7A4A20"/>
 <rect x="7" y="22.5" width="1.2" height="0.5" rx="0.2" fill="#5A3010"/>
 <rect x="23.8" y="22.5" width="1.2" height="0.5" rx="0.2" fill="#5A3010"/>
 <!-- Place settings -->
 <!-- Plate left -->
 
 <ellipse cx="10" cy="20" rx="1.4" ry="0.8" fill="#F8F8F8"/>
