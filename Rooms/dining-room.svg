 <rect x="4.3" y="13.5" width="3" height="2.8" rx="0.5" fill="url(#chairGrad)"/>
 <rect x="4.3" y="19" width="0.7" height="3" rx="0.3" fill="#7A4A20"/>
 <rect x="6.6" y="19" width="0.7" height="3" rx="0.3" fill="#7A4A20"/>
 <!-- Chair back-right -->
 
 <rect x="24.7" y="13.5" width="3" height="2.8" rx="0.5" fill="url(#chairGrad)"/>
 <rect x="24.7" y="19" width="0.7" height="3" rx="0.3" fill="#7A4A20"/>
 <rect x="27" y="19" width="0.7" height="3" rx="0.3" fill="#7A4A20"/>
 <!-- Chair front-left (forward of table, abbreviated) -->
 
 <rect x="5.3" y="25" width="0.7" height="2.5" rx="0.3" fill="#7A4A20"/>
 <rect x="7.5" y="25" width="0.7" height="2.5" rx="0.3" fill="#7A4A20"/>
 <!-- Chair front-right -->
 
 <rect x="23.8" y="25" width="0.7" height="2.5" rx="0.3" fill="#7A4A20"/>
 <rect x="26" y="25" width="0.7" height="2.5" rx="0.3" fill="#7A4A20"/>
