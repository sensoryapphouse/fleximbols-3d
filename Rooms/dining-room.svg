 <defs>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F2EBDF"/>
 <stop offset="100%" stop-color="#D8C8B0"/>
 </linearGradient>
 <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="tableGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#7A4A20"/>
 </linearGradient>
 <linearGradient id="chairGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#B88060"/>
 <stop offset="100%" stop-color="#7A4A20"/>
 </linearGradient>
 <linearGradient id="chandelierGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F5D060"/>
 <stop offset="100%" stop-color="#C89820"/>
 </linearGradient>
 <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#E0E0E0"/>
 </linearGradient>
 <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C8E8F8" stop-opacity="0.8"/>
 <stop offset="100%" stop-color="#88B8D8" stop-opacity="0.8"/>
 </linearGradient>
 </defs>
 <!-- Wall -->
 <rect x="2" y="2" width="28" height="18" fill="url(#wallGrad)"/>
 <!-- Wall wainscoting -->
 <rect x="2" y="14" width="28" height="6" fill="#DDD0B8" opacity="0.5"/>
 <line x1="2" y1="14" x2="30" y2="14" stroke="#C0B098" stroke-width="0.5"/>
 <!-- Floor -->
 <rect x="2" y="20" width="28" height="10" fill="url(#floorGrad)"/>
 <!-- Planks -->
 <line x1="2" y1="23" x2="30" y2="23" stroke="#8B5C3A" stroke-width="0.3" opacity="0.4"/>
 <line x1="2" y1="26" x2="30" y2="26" stroke="#8B5C3A" stroke-width="0.3" opacity="0.4"/>
 <line x1="2" y1="29" x2="30" y2="29" stroke="#8B5C3A" stroke-width="0.3" opacity="0.4"/>
 <line x1="10" y1="20" x2="10" y2="30" stroke="#8B5C3A" stroke-width="0.3" opacity="0.3"/>
 <line x1="20" y1="20" x2="20" y2="30" stroke="#8B5C3A" stroke-width="0.3" opacity="0.3"/>
 <!-- Chandelier -->
 <!-- Chain -->
 <line x1="16" y1="2" x2="16" y2="5" stroke="#B09060" stroke-width="0.5"/>
 <!-- Main body -->
 
 <rect x="15.3" y="5" width="1.4" height="1" rx="0.3" fill="#D4A820"/>
