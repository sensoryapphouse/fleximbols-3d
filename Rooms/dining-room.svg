 <rect x="12.5" y="18.5" width="1" height="2.5" rx="0.3" fill="url(#glassGrad)"/>
 <ellipse cx="13" cy="18.5" rx="0.8" ry="0.3" fill="#B0D8F0" opacity="0.6"/>
