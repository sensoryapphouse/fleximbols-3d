 <defs>
 <linearGradient id="graterBody" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#d8d8d0"/>
 <stop offset="50%" stop-color="#b0b0a8"/>
 <stop offset="100%" stop-color="#787870"/>
 </linearGradient>
 <linearGradient id="graterSide" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#c0c0b8"/>
 <stop offset="100%" stop-color="#888880"/>
 </linearGradient>
 <linearGradient id="graterTop" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e0e0d8"/>
 <stop offset="100%" stop-color="#b0b0a8"/>
 </linearGradient>
 <linearGradient id="handleGrater" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8c8c0"/>
 <stop offset="100%" stop-color="#909088"/>
 </linearGradient>
 <linearGradient id="cheeseG2" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#f0e058"/>
 <stop offset="100%" stop-color="#d0b828"/>
 </linearGradient>
 <linearGradient id="shavingG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#f0d840"/>
 <stop offset="100%" stop-color="#c0a010"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- box grater - 4 sides visible -->
 <!-- front face -->
 <rect x="11" y="6" width="8" height="22" fill="url(#graterBody)"/>
 <!-- right side face -->
 <rect x="18" y="6" width="3" height="22" fill="url(#graterSide)"/>
 <!-- top face -->
 <path d="M11,6 L18,6 L21,6 L21,6 L18,6 Z" fill="url(#graterTop)"/>
 <ellipse cx="15.5" cy="6" rx="5" ry="1" fill="url(#graterTop)"/>
 <!-- holes / grating teeth on front face -->
 <!-- row 1 -->
 <path d="M13,9 L14,8.2 L15,9" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15.5,9 L16.5,8.2 L17.5,9" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- row 2 -->
 <path d="M12.5,11.5 L13.5,10.7 L14.5,11.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15,11.5 L16,10.7 L17,11.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M17.5,11.5 L18.5,10.7 L18.5,11.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- row 3 -->
 <path d="M13,14 L14,13.2 L15,14" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15.5,14 L16.5,13.2 L17.5,14" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- row 4 -->
 <path d="M12.5,16.5 L13.5,15.7 L14.5,16.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15,16.5 L16,15.7 L17,16.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M17.5,16.5 L18.5,15.7 L18.5,16.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- row 5 -->
 <path d="M13,19 L14,18.2 L15,19" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15.5,19 L16.5,18.2 L17.5,19" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- row 6 -->
 <path d="M12.5,21.5 L13.5,20.7 L14.5,21.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <path d="M15,21.5 L16,20.7 L17,21.5" stroke="#909088" stroke-width="0.5" fill="none"/>
 <!-- handle loop at top -->
 <ellipse cx="15.5" cy="5" rx="2.5" ry="1.5" fill="none" stroke="url(#handleGrater)" stroke-width="1.5"/>
 <!-- cheese block being grated (top) -->
 <rect x="10" y="3" width="7" height="4" rx="0.5" fill="url(#cheeseG2)"/>
 <!-- cheese shavings at base -->
 <path d="M11,27 Q12,26 13.5,27.5 Q14,29 12,29" fill="url(#shavingG)"/>
 <path d="M14,27.5 Q15,26.5 16,27.5 Q16.5,29 15,28.5" fill="url(#shavingG)"/>
 <path d="M16.5,27 Q17.5,26.5 18,27.5 Q17,29 16.5,28" fill="url(#shavingG)"/>
 <!-- grater front sheen -->
 <rect x="11.5" y="6.5" width="3" height="8" rx="0.5" fill="#ffffff" fill-opacity="0.15"/>
</svg>
