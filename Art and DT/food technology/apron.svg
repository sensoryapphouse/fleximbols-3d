 <!-- drop shadow -->
 <!-- neck strap -->
 <path d="M12,7 Q12,5 16,5 Q20,5 20,7" stroke="url(#apronNeck)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <!-- bib top portion -->
 <path d="M10,7 Q10,5.5 12,5.5 L20,5.5 Q22,5.5 22,7 L22,14 Q22,15 21,15 L11,15 Q10,15 10,14 Z" fill="url(#apronBib)"/>
 <!-- main apron body -->
 <path d="M9,15 L23,15 L25,30 L7,30 Z" fill="url(#apronBody)"/>
