 <defs>
 <linearGradient id="apronBody" x1="0" y1="0" x2="0.1" y2="1">
 <stop offset="0%" stop-color="#4878c0"/>
 <stop offset="50%" stop-color="#2858a0"/>
 <stop offset="100%" stop-color="#183878"/>
 </linearGradient>
 <linearGradient id="apronBib" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#5888d0"/>
 <stop offset="100%" stop-color="#3068b0"/>
 </linearGradient>
 <linearGradient id="apronPocket" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#3870bc"/>
 <stop offset="100%" stop-color="#2050a0"/>
 </linearGradient>
 <linearGradient id="apronTie" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#6098e0"/>
 <stop offset="100%" stop-color="#3060b0"/>
 </linearGradient>
 <linearGradient id="apronNeck" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#5888d0"/>
 <stop offset="100%" stop-color="#3060b8"/>
 </linearGradient>
