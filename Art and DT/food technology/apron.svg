 <path d="M9,19 Q5,19 4,22 Q3,23 5,23 L9,21" fill="url(#apronTie)"/>
 <path d="M23,19 Q27,19 28,22 Q29,23 27,23 L23,21" fill="url(#apronTie)"/>
 <!-- kangaroo pocket -->
 <rect x="11" y="21" width="10" height="7" rx="0.8" fill="url(#apronPocket)"/>
 <!-- pocket top fold -->
 <rect x="11" y="21" width="10" height="1.5" rx="0.5" fill="#2858b0"/>
 <!-- pocket divider -->
 <line x1="16" y1="21" x2="16" y2="28" stroke="#2858a8" stroke-width="0.6"/>
 <!-- waist band -->
 <rect x="9" y="18" width="14" height="2" rx="0.5" fill="#6098e0" fill-opacity="0.4"/>
 <!-- bib highlight -->
 <rect x="11" y="7.5" width="5" height="3" rx="0.5" fill="#90b8f0" fill-opacity="0.35"/>
