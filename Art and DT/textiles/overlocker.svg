<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<linearGradient id="olBody" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eef1f4"/>
<stop offset="0.5" stop-color="#cfd5da"/>
<stop offset="1" stop-color="#9aa2aa"/>
</linearGradient>
<linearGradient id="olHead" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#dfe4e8"/>
<stop offset="1" stop-color="#aab1b8"/>
</linearGradient>
<radialGradient id="olWheel" cx="0.4" cy="0.35" r="0.7">
<stop offset="0" stop-color="#9aa2aa"/>
<stop offset="1" stop-color="#4a5158"/>
</radialGradient>
</defs>
<!-- thread cones (multiple colors = overlocker signature) -->
<g>
<!-- spool pins -->
<g stroke="#8a9098" stroke-width="2">
<line x1="40" y1="40" x2="40" y2="70"/><line x1="60" y1="36" x2="60" y2="70"/><line x1="80" y1="36" x2="80" y2="70"/><line x1="100" y1="40" x2="100" y2="70"/>
</g>
<!-- cones -->
<g stroke="#5a5f66" stroke-width="1.6">
<path d="M34 64 L40 30 L46 64 Z" fill="#e8503a"/>
<path d="M54 64 L60 26 L66 64 Z" fill="#3a8fe8"/>
<path d="M74 64 L80 26 L86 64 Z" fill="#5ac24a"/>
<path d="M94 64 L100 30 L106 64 Z" fill="#e8c23a"/>
</g>
<!-- thread lines feeding to the head -->
<g stroke="#5a5f66" stroke-width="1" fill="none" opacity="0.8">
<path d="M40 32 Q120 30 138 78"/>
<path d="M60 28 Q124 30 140 80"/>
<path d="M80 28 Q128 32 142 82"/>
<path d="M100 32 Q132 36 144 84"/>
</g>
</g>
<!-- machine body -->
<rect x="24" y="120" width="152" height="48" rx="10" fill="url(#olBody)" stroke="#717880" stroke-width="3"/>
<!-- upright head/arm on right -->
<path d="M120 84 Q120 76 130 76 L160 76 Q170 76 170 86 L170 130 L120 130 Z" fill="url(#olHead)" stroke="#717880" stroke-width="3"/>
<!-- handwheel on right side -->
<circle cx="160" cy="104" r="14" fill="url(#olWheel)" stroke="#3c4248" stroke-width="2.5"/>
<circle cx="160" cy="104" r="4" fill="#dfe4e8"/>
<!-- needle/presser area + thread guide -->
<rect x="120" y="118" width="6" height="16" fill="#8a9098" stroke="#5a5f66" stroke-width="1.2"/>
<line x1="123" y1="118" x2="123" y2="100" stroke="#5a5f66" stroke-width="1.5"/>
<!-- flat bed / stitch plate -->
<rect x="34" y="150" width="78" height="8" rx="2" fill="#b9c0c6" stroke="#8a9098" stroke-width="1.5"/>
<!-- colored thread spot at needle (stitching) -->
<circle cx="123" cy="150" r="3" fill="#e8503a"/>
<!-- gloss -->
<rect x="30" y="124" width="120" height="10" rx="5" fill="#ffffff" opacity="0.3"/>
</svg>
