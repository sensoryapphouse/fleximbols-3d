 <defs>
 <linearGradient id="brick" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#C06030"/>
 <stop offset="50%" stop-color="#904020"/>
 <stop offset="100%" stop-color="#602010"/>
 </linearGradient>
 <radialGradient id="fire" cx="50%" cy="70%" r="60%">
 <stop offset="0%" stop-color="#FFFF44"/>
 <stop offset="40%" stop-color="#FF8800"/>
 <stop offset="100%" stop-color="#CC2200" stop-opacity="0.000"/>
 </radialGradient>
 <linearGradient id="door" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#1A0800"/>
 <stop offset="100%" stop-color="#000000"/>
 </linearGradient>
 <linearGradient id="pot" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#C08050"/>
 <stop offset="100%" stop-color="#7A4020"/>
 </linearGradient>
 </defs>
 <!-- Kiln dome body -->
 
 <!-- Brick pattern -->
 <path d="M4,20 L28,20 M4,24 L28,24 M16,16 L16,28 M10,20 L10,24 M22,20 L22,24 M7,16 L7,20 M13,16 L13,20 M19,16 L19,20 M25,16 L25,20" stroke="#804020" stroke-width="0.5" stroke-opacity="0.5"/>
 <!-- Dome arch highlight -->
 <path d="M6,16 Q16,5 26,16" fill="none" stroke="#D08050" stroke-width="0.8" stroke-opacity="0.5"/>
 <!-- Arched opening (door) -->
 <path d="M11,28 L11,20 Q11,14 16,14 Q21,14 21,20 L21,28 Z" fill="url(#door)"/>
 <!-- Fire glow inside -->
 <path d="M12,28 L12,22 Q12,16 16,16 Q20,16 20,22 L20,28 Z" fill="url(#fire)" fill-opacity="0.8"/>
 <!-- Pottery pots visible -->
 <ellipse cx="13.5" cy="26" rx="2" ry="2.5" fill="url(#pot)" fill-opacity="0.9"/>
 <ellipse cx="18.5" cy="26.5" rx="1.5" ry="2" fill="url(#pot)" fill-opacity="0.9"/>
 <!-- Chimney stack -->
 <rect x="14" y="2" width="4" height="4" rx="1" fill="url(#brick)"/>
 <!-- Smoke -->
 <path d="M16,2 Q14,0 16,-1" fill="none" stroke="#888888" stroke-width="0.8" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
