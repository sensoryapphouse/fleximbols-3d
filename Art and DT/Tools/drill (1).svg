<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="drillBody" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A7AE8"/><stop offset="100%" stop-color="#1A3A98"/></linearGradient>
 <linearGradient id="drillChuck" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8A8A9A"/><stop offset="100%" stop-color="#3A3A4A"/></linearGradient>
 <linearGradient id="drillBit" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C8C8D8"/><stop offset="100%" stop-color="#5A5A6A"/></linearGradient>
 <linearGradient id="drillHandle" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2A5AC8"/><stop offset="100%" stop-color="#0A2A88"/></linearGradient>
 </defs>
 <!-- Motor body -->
 <ellipse cx="14" cy="13" rx="7" ry="5" fill="url(#drillBody)" filter="url(#sdDrill)"/>
 <!-- Pistol grip -->
 <rect x="12" y="17" width="5" height="8" rx="1.5" fill="url(#drillHandle)" filter="url(#sdDrill)"/>
 <!-- Battery pack at bottom of grip -->
 <rect x="11" y="24" width="7" height="3" rx="1" fill="url(#drillChuck)" filter="url(#sdDrill)"/>
 <!-- Trigger -->
 <rect x="12.5" y="19" width="2" height="3" rx="0.5" fill="#1A1A3A"/>
 <!-- Chuck -->
 <rect x="20" y="11" width="4" height="4" rx="0.6" fill="url(#drillChuck)" filter="url(#sdDrill)"/>
 <!-- Drill bit -->
 <line x1="24" y1="13" x2="31" y2="13" stroke="url(#drillBit)" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Motion lines -->
 <line x1="30" y1="11" x2="32" y2="11" stroke="#6AB8F8" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="30" y1="13" x2="32" y2="13" stroke="#6AB8F8" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="30" y1="15" x2="32" y2="15" stroke="#6AB8F8" stroke-width="0.7" stroke-linecap="round"/>
 <!-- Body highlight -->
 <ellipse cx="11" cy="11" rx="3" ry="2" fill="white" fill-opacity="0.18"/>
</svg>
