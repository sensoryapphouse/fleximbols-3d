  <defs>
    <radialGradient id="fk_face" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6cda0"/>
      <stop offset="1" stop-color="#cf9c6e"/>
    </radialGradient>
    <linearGradient id="fk_mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c84a"/>
      <stop offset="1" stop-color="#d9a020"/>
    </linearGradient>
  </defs>
  <!-- real face behind, partly hidden -->
  <circle cx="220" cy="220" r="120" fill="url(#fk_face)" stroke="#b8895c" stroke-width="5"/>
  <!-- hint of hair on real head -->
  <path d="M108 196 C108 110 332 110 332 196 C320 150 300 130 220 130 C140 130 120 150 108 196 Z" fill="#7a5232" opacity="0.9"/>
  <!-- worried real eye/brow peeking on left -->
  <circle cx="170" cy="220" r="9" fill="#3a2a1a"/>
  <!-- the held mask (smiling comedy mask) overlapping the face -->
  <g transform="translate(40 30)">
    <path d="M256 180
             C200 180 176 230 176 290
             C176 360 216 410 270 410
             C324 410 364 360 364 290
             C364 230 340 180 284 180 Z"
          fill="url(#fk_mask)" stroke="#a8780f" stroke-width="6"/>
    <!-- eye holes -->
    <ellipse cx="232" cy="280" rx="24" ry="16" fill="#2a2418"/>
    <ellipse cx="308" cy="280" rx="24" ry="16" fill="#2a2418"/>
    <!-- smiling mouth -->
    <path d="M222 330 Q270 380 318 330" fill="none" stroke="#2a2418" stroke-width="12" stroke-linecap="round"/>
    <!-- mask highlight -->
    <ellipse cx="226" cy="240" rx="26" ry="16" fill="#ffffff" opacity="0.35"/>
    <!-- handle/stick of the mask -->
    <rect x="262" y="408" width="18" height="70" rx="9" fill="#8a5a2a" stroke="#5e3c18" stroke-width="4"/>
  </g>
</svg>
