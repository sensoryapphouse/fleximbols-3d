<defs>
<radialGradient id="sk" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FFE0BD"/><stop offset="100%" stop-color="#A66744"/></radialGradient>
<radialGradient id="obj" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#F7C84B"/><stop offset="100%" stop-color="#8A5A0A"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<linearGradient id="arr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE48A"/><stop offset="100%" stop-color="#E5A700"/></linearGradient>
</defs>
<!-- the apple being taken -->
<circle cx="22" cy="22" r="5" fill="url(#obj)"/>
<path d="M22 17 Q 22 15 23 14" stroke="#5A3A0A" stroke-width="0.6" fill="none"/>
<path d="M22 17 Q 24 16 25 14" stroke="#0E5A0E" stroke-width="0.6" fill="none"/>
<ellipse cx="20" cy="20" rx="1.5" ry="1" fill="url(#hi)"/>
<!-- hand grasping from upper-left (full hand with arm) -->
<!-- forearm -->
<path d="M2 4 L 8 12 L 11 10 L 5 2 Z" fill="url(#sk)"/>
<!-- palm -->
<path d="M8 12 Q 7 16 12 17 L 18 18 Q 20 17 19 14 L 14 11 Q 11 10 8 12 Z" fill="url(#sk)"/>
<!-- thumb -->
<path d="M10 10 Q 12 9 13 11 Q 13 13 11 13 Q 9 13 10 10 Z" fill="url(#sk)"/>
<!-- fingers curving around apple -->
<path d="M12 17 Q 10 19 13 21 Q 16 21 15 19 Q 14 17 12 17 Z" fill="url(#sk)"/>
<path d="M15 18 Q 14 20 17 22 Q 19 22 18 20 Q 17 18 15 18 Z" fill="url(#sk)"/>
<path d="M17 17 Q 17 20 20 21 Q 22 20 21 18 Q 19 17 17 17 Z" fill="url(#sk)"/>
<!-- highlight on hand -->
<ellipse cx="6" cy="6" rx="1.5" ry="1.5" fill="url(#hi)"/>
<!-- motion arrow from hand to apple -->
<path d="M10 7 Q 14 5 18 8" stroke="url(#arr)" stroke-width="0.6" fill="none" stroke-linecap="round"/>
<path d="M18 8 L 16.5 7 L 17 9 Z" fill="url(#arr)"/>
</svg>