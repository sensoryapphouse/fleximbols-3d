<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="clockFace" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#FFF6E0"/>
 <stop offset="100%" stop-color="#E5D4A8"/>
 </radialGradient>
 <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#C47A00"/>
 </linearGradient>
 <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 </defs>
 <!-- MAIN CLOCK (left, full) -->
 
 <circle cx="11" cy="16" r="8.3" fill="url(#clockFace)"/>
 <circle cx="8.5" cy="11.5" r="2.8" fill="rgba(255,255,255,0.2)"/>
 <!-- Clock markers (main) -->
 <circle cx="11" cy="8.5" r="0.5" fill="#C47A00"/>
 <circle cx="14.6" cy="9.4" r="0.4" fill="#C47A00"/>
 <circle cx="17" cy="12.5" r="0.4" fill="#C47A00"/>
 <circle cx="18" cy="16" r="0.5" fill="#C47A00"/>
 <circle cx="17" cy="19.5" r="0.4" fill="#C47A00"/>
 <circle cx="14.6" cy="22.6" r="0.4" fill="#C47A00"/>
 <circle cx="11" cy="23.5" r="0.5" fill="#C47A00"/>
 <circle cx="7.4" cy="22.6" r="0.4" fill="#C47A00"/>
 <circle cx="5" cy="19.5" r="0.4" fill="#C47A00"/>
 <circle cx="4" cy="16" r="0.5" fill="#C47A00"/>
 <circle cx="5" cy="12.5" r="0.4" fill="#C47A00"/>
 <circle cx="7.4" cy="9.4" r="0.4" fill="#C47A00"/>
 <!-- Clock hands (main clock showing ~current time) -->
 <line x1="11" y1="16" x2="11" y2="10" stroke="#4B3200" stroke-width="1" stroke-linecap="round"/>
 <line x1="11" y1="16" x2="15" y2="16" stroke="#4B3200" stroke-width="0.8" stroke-linecap="round"/>
 <circle cx="11" cy="16" r="0.8" fill="#4B3200"/>
 <!-- Forward arrow: motion lines, then shaft, then head -->
 <line x1="21" y1="14.5" x2="22.5" y2="15" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
 <line x1="21" y1="16" x2="22.5" y2="16" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
 <line x1="21" y1="17.5" x2="22.5" y2="17" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
 <!-- Arrow shaft -->
 
 <rect x="21" y="15" width="5" height="0.8" rx="0.6" fill="rgba(255,255,255,0.38)"/>
 <!-- Arrowhead pointing right -->
 <polygon points="29,16 25,13.5 25,18.5" fill="url(#shaftGrad)"/>
 <polygon points="28,16 25,13.8 25,15.5" fill="rgba(255,255,255,0.25)"/>
 <!-- GHOST future clock (right, faded, dashed) -->
 <circle cx="27" cy="16" r="4.5" fill="none"
 stroke="#C47A00" stroke-width="0.6" stroke-dasharray="1.2 0.8" opacity="0.4"/>
 <circle cx="27" cy="16" r="3.8" fill="url(#clockFace)" opacity="0.35"/>
 <!-- Ghost hands slightly advanced -->
 <line x1="27" y1="16" x2="29" y2="14" stroke="#4B3200" stroke-width="0.6"
 stroke-linecap="round" opacity="0.4"/>
 <line x1="27" y1="16" x2="29" y2="16" stroke="#4B3200" stroke-width="0.5"
 stroke-linecap="round" opacity="0.4"/>
</svg>
