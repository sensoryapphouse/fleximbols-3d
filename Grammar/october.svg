 <defs>
 <linearGradient id="oct-page" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f8f8f8"/>
 <stop offset="100%" stop-color="#d8d8d8"/>
 </linearGradient>
 <linearGradient id="oct-top" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d05010"/>
 <stop offset="100%" stop-color="#902808"/>
 </linearGradient>
 <linearGradient id="oct-pumpkin" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f07020"/>
 <stop offset="100%" stop-color="#b04010"/>
 </linearGradient>
 <linearGradient id="oct-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e05010"/>
 <stop offset="100%" stop-color="#a03000"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- calendar body -->
 <rect x="4" y="6" width="24" height="24" rx="2" fill="url(#oct-page)"/>
 <!-- top tab -->
 <rect x="4" y="4" width="24" height="7" rx="2" fill="url(#oct-top)"/>
 <!-- rings -->
 <rect x="10" y="3" width="2" height="5" rx="1" fill="#c0c0c0"/>
 <rect x="20" y="3" width="2" height="5" rx="1" fill="#c0c0c0"/>
 <!-- OCT label -->
 <!-- O -->
 <ellipse cx="7.5" cy="7" rx="1.5" ry="1.5" fill="none" stroke="white" stroke-width="0.7"/>
 <!-- C -->
 <path d="M12 5.5 Q10.5 5.5 10.5 7 Q10.5 8.5 12 8.5" fill="none" stroke="white" stroke-width="0.7"/>
 <!-- T -->
 <line x1="13.5" y1="5.5" x2="16.5" y2="5.5" stroke="white" stroke-width="0.7"/>
 <line x1="15" y1="5.5" x2="15" y2="8.5" stroke="white" stroke-width="0.7"/>
 <!-- pumpkin body -->
 <ellipse cx="14" cy="22" rx="5" ry="5" fill="url(#oct-pumpkin)"/>
 <ellipse cx="11" cy="22" rx="2.5" ry="4.5" fill="url(#oct-pumpkin)"/>
 <ellipse cx="17" cy="22" rx="2.5" ry="4.5" fill="url(#oct-pumpkin)"/>
 <!-- pumpkin stem -->
 <rect x="13.5" y="16" width="1.2" height="2.5" rx="0.5" fill="#5a3010"/>
 <!-- leaf -->
 <path d="M15 17 Q18 14 20 16 Q18 17 15 17 Z" fill="url(#oct-leaf)"/>
 <!-- face -->
 <polygon points="12,21 13,19.5 14,21" fill="#301000" fill-opacity="0.7"/>
 <polygon points="15,21 16,19.5 17,21" fill="#301000" fill-opacity="0.7"/>
 <path d="M12 24 Q14 26 16 24" fill="none" stroke="#301000" stroke-width="0.7" stroke-opacity="0.7"/>
 <!-- orange leaves corner -->
 <path d="M22 13 Q24 11 26 13 Q24 14 22 13 Z" fill="url(#oct-leaf)"/>
 <path d="M24 16 Q26 14 28 16 Q26 17 24 16 Z" fill="#c04010"/>
 <!-- grid lines on page -->
 <line x1="5" y1="15" x2="27" y2="15" stroke="#d0d0d0" stroke-width="0.4"/>
</svg>
