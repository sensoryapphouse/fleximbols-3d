 <defs>
 <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#E5A700"/>
 <stop offset="100%" stop-color="#FFD45E"/>
 </linearGradient>
 <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 <!-- House/origin marker gradient -->
 <linearGradient id="houseWall" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#A0D468"/>
 <stop offset="100%" stop-color="#5A8E3C"/>
 </linearGradient>
 <linearGradient id="houseRoof" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#E54A1E"/>
 <stop offset="100%" stop-color="#C02800"/>
 </linearGradient>
 </defs>
 <!-- Ground shadow under house -->
 <ellipse cx="7" cy="26.5" rx="6" ry="0.8" fill="#000" fill-opacity="0.15"/>
 <!-- HOUSE / origin marker (left side) -->
 <!-- House walls -->
 <rect x="2" y="18" width="10" height="8" fill="url(#houseWall)"/>
 <!-- Roof triangle -->
 <polygon points="2,18 7,12 12,18" fill="url(#houseRoof)"/>
 <!-- Roof highlight -->
 <polygon points="2,18 7,12 8.5,15 3.5,18" fill="rgba(255,255,255,0.2)"/>
 <!-- Door -->
 <rect x="6" y="22" width="2" height="4" rx="0.3" fill="#5A2810"/>
 <!-- Window -->
 <rect x="3.5" y="19" width="2.5" height="2.5" fill="rgba(255,255,255,0.5)" rx="0.3"/>
 <rect x="8" y="19" width="2.5" height="2.5" fill="rgba(255,255,255,0.5)" rx="0.3"/>
 <!-- Motion lines at origin (behind arrow start) -->
 <line x1="11" y1="19" x2="12.5" y2="19" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/>
 <line x1="11" y1="21" x2="13" y2="21" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
 <line x1="11" y1="23" x2="12.5" y2="23" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
 <!-- Bold gold arrow shaft (arcing rightward from house) -->
 <rect x="13" y="18" width="13" height="4" rx="1" fill="url(#shaftGrad)"/>
 <!-- Shaft highlight top -->
 <rect x="13" y="18.5" width="13" height="1" rx="0.8" fill="rgba(255,255,255,0.4)"/>
 <!-- Shaft dark bevel bottom -->
 <rect x="13" y="21" width="13" height="1" rx="0.5" fill="rgba(0,0,0,0.2)"/>
 <!-- Arrowhead polygon pointing RIGHT -->
 <polygon points="29,20 23,16 23,24" fill="url(#headGrad)"/>
 <polygon points="27,20 23,16.5 23,19" fill="rgba(255,255,255,0.25)"/>
</svg>
