<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="dec-page" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="100%" stop-color="#dcdcdc"/>
 </linearGradient>
 <linearGradient id="dec-top" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#e23030"/>
 <stop offset="100%" stop-color="#a01010"/>
 </linearGradient>
 <linearGradient id="dec-tree" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#3cc23c"/>
 <stop offset="100%" stop-color="#1c6e1c"/>
 </linearGradient>
 </defs>
 <!-- December: calendar (DEC 25) + Christmas tree beside it -->
 <!-- Calendar (left) -->
 <rect x="3" y="7" width="17" height="20" rx="1.8" fill="url(#dec-page)" stroke="#c4c4c4" stroke-width="0.3"/>
 <!-- red top header -->
 <rect x="3" y="6" width="17" height="6" rx="1.8" fill="url(#dec-top)"/>
 <rect x="3" y="10" width="17" height="2" fill="url(#dec-top)"/>
 <!-- rings -->
 <rect x="7" y="4" width="1.6" height="4.5" rx="0.8" fill="#b0b0b0"/>
 <rect x="14.4" y="4" width="1.6" height="4.5" rx="0.8" fill="#b0b0b0"/>
 <!-- DEC label -->
 <text x="11.5" y="11" font-family="Arial, sans-serif" font-size="4" font-weight="bold" text-anchor="middle" fill="#ffffff">DEC</text>
 <!-- big date 25 -->
 <text x="11.5" y="22.5" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#333333">25</text>
 <!-- header gloss -->
 <rect x="4" y="6.6" width="15" height="1.6" rx="0.8" fill="#ffffff" fill-opacity="0.25"/>
 <!-- Christmas tree (right) -->
 <g>
 <polygon points="26,16 22.4,16 24.2,12.5" fill="url(#dec-tree)"/>
 <polygon points="26.6,20 21.8,20 24.2,15.5" fill="url(#dec-tree)"/>
 <polygon points="27.2,24.5 21.2,24.5 24.2,19" fill="url(#dec-tree)"/>
 <!-- trunk -->
 <rect x="23.5" y="24.5" width="1.4" height="2.4" fill="#8B4513"/>
 <!-- star -->
 <polygon points="24.2,10.4 24.8,12.2 26.7,12.2 25.2,13.4 25.8,15.2 24.2,14.1 22.6,15.2 23.2,13.4 21.7,12.2 23.6,12.2" fill="#FFD700"/>
 <!-- baubles -->
 <circle cx="23.2" cy="18.5" r="0.6" fill="#e23030"/>
 <circle cx="25.2" cy="17" r="0.5" fill="#ffd700"/>
 <circle cx="24.4" cy="22" r="0.6" fill="#3a78c2"/>
 <circle cx="22.6" cy="22.5" r="0.5" fill="#ffd700"/>
 </g>
</svg>
