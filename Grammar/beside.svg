<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <!-- BALL: radial gradient, highlight at upper-left -->
    <radialGradient id="loc3d_ball" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#ffd4d4"/>
      <stop offset="25%"  stop-color="#ff8080"/>
      <stop offset="65%"  stop-color="#e52d2d"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="loc3d_ball_spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- BOX FRONT FACE: tan gradient + sheen -->
    <linearGradient id="loc3d_front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8a96d"/>
      <stop offset="50%"  stop-color="#c8873a"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="loc3d_front_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- BOX BACK WALL: deep brown -->
    <linearGradient id="loc3d_back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <!-- BOX FLOOR (sloping trapezoid) -->
    <linearGradient id="loc3d_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a06838"/>
      <stop offset="100%" stop-color="#6a4419"/>
    </linearGradient>
    <!-- CLOSED BOX LID STRIPE -->
    <linearGradient id="loc3d_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c8893a"/>
      <stop offset="100%" stop-color="#7a5018"/>
    </linearGradient>
    <!-- ARROW: glossy green -->
    <linearGradient id="loc3d_arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7be87b"/>
      <stop offset="50%"  stop-color="#22aa22"/>
      <stop offset="100%" stop-color="#0a6a0a"/>
    </linearGradient>
  </defs>


  <!-- Canonical OPEN BOX shifted LEFT by -80 -->
  <!-- Interior back wall: x=60 y=270 w=232 h=44 -->
  <rect x="60" y="270" width="232" height="44" fill="url(#loc3d_back)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Interior floor sloping forward -->
  <path d="M 60 314 L 292 314 L 308 326 L 44 326 Z" fill="url(#loc3d_floor)" stroke="#2a1a08" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front face: x=40 y=326 w=272 h=94 -->
  <rect x="40" y="326" width="272" height="94" fill="url(#loc3d_front)" stroke="#2a1a08" stroke-width="2"/>

  <!-- Short LEFT-pointing arrow: shaft from box right edge (x=312) to arrowhead base; tip near ball left edge (x=394) -->
  <!-- Shaft: x=316 y=359 w=72 h=22 (from x=316 to x=388) -->
  <rect x="316" y="359" width="72" height="22" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="1.8"/>
  <!-- Arrowhead tip at x=394 (ball left edge), base at x=352 -->
  <polygon points="394,370 354,348 354,392" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Ball RIGHT of the box -->
  <circle cx="448" cy="370" r="54" fill="url(#loc3d_ball)" stroke="#2a1a08" stroke-width="2"/>
  <circle cx="428" cy="350" r="16" fill="url(#loc3d_ball_spec)"/>

  <!-- glossy sheen -->
  <rect x="46" y="330" width="260" height="28" rx="6" fill="url(#loc3d_front_sheen)"/>
</svg>
