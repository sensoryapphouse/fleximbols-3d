<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Clock face -->
 <radialGradient id="clockFace" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#FFF6E0"/>
 <stop offset="100%" stop-color="#E5D4A8"/>
 </radialGradient>
 <!-- Clock rim -->
 <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#C47A00"/>
 </linearGradient>
 <!-- Infinity symbol -->
 <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFE07A"/>
 <stop offset="50%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 <filter id="glow">
 <feGaussianBlur stdDeviation="1.5" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Warm glow behind clock -->
 <circle cx="16" cy="16" r="13" fill="rgba(255,212,94,0.12)"/>
 <!-- Clock rim (outer ring) -->
 
 <!-- Clock face -->
 <circle cx="16" cy="16" r="10.5" fill="url(#clockFace)"/>
 <!-- Face highlight -->
 <circle cx="13" cy="11" r="3.5" fill="rgba(255,255,255,0.22)"/>
 <!-- Hour markers (12 dots) -->
 <circle cx="16" cy="7" r="0.6" fill="#C47A00"/>
 <circle cx="21" cy="8.3" r="0.5" fill="#C47A00"/>
 <circle cx="24.7" cy="12" r="0.5" fill="#C47A00"/>
 <circle cx="26" cy="16" r="0.6" fill="#C47A00"/>
 <circle cx="24.7" cy="20" r="0.5" fill="#C47A00"/>
 <circle cx="21" cy="23.7" r="0.5" fill="#C47A00"/>
 <circle cx="16" cy="25" r="0.6" fill="#C47A00"/>
 <circle cx="11" cy="23.7" r="0.5" fill="#C47A00"/>
 <circle cx="7.3" cy="20" r="0.5" fill="#C47A00"/>
 <circle cx="6" cy="16" r="0.6" fill="#C47A00"/>
 <circle cx="7.3" cy="12" r="0.5" fill="#C47A00"/>
 <circle cx="11" cy="8.3" r="0.5" fill="#C47A00"/>
 <!-- INFINITY SYMBOL overlaid (figure-eight on side), centred on clock -->
 <!-- Drawn as two overlapping thick circles / loops with thick stroke -->
 <circle cx="13.5" cy="16" r="3.5" fill="none" stroke="url(#infGrad)" stroke-width="2.5"
 filter="url(#glow)"/>
 <circle cx="18.5" cy="16" r="3.5" fill="none" stroke="url(#infGrad)" stroke-width="2.5"
 filter="url(#glow)"/>
 <!-- Cover the interior crossing to unify the figure-8 shape -->
 <rect x="14.5" y="14" width="3" height="4" fill="url(#clockFace)"/>
 <!-- Re-draw outer arcs over the cover for a proper infinity look -->
 <!-- Left loop: draw bottom arc and right arc -->
 <path d="M 16 14.5 A 3.5 3.5 0 1 0 16 17.5" stroke="url(#infGrad)" stroke-width="2.5"
 fill="none" stroke-linecap="butt"/>
 <path d="M 16 14.5 A 3.5 3.5 0 1 1 16 17.5" stroke="url(#infGrad)" stroke-width="2.5"
 fill="none" stroke-linecap="butt"/>
 <!-- Highlight on infinity -->
 <path d="M 11 14 A 3.5 3.5 0 0 1 14.5 13" stroke="rgba(255,255,255,0.5)" stroke-width="1"
 fill="none" stroke-linecap="round"/>
 <path d="M 17.5 13 A 3.5 3.5 0 0 1 21 14" stroke="rgba(255,255,255,0.5)" stroke-width="1"
 fill="none" stroke-linecap="round"/>
</svg>
