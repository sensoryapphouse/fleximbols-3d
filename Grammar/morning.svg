  <defs>
    <linearGradient id="mg_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeafd"/>
      <stop offset="1" stop-color="#ffe9c2"/>
    </linearGradient>
    <radialGradient id="mg_sun" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#ffce3a"/>
      <stop offset="1" stop-color="#f59a1e"/>
    </radialGradient>
    <linearGradient id="mg_ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bbf59"/>
      <stop offset="1" stop-color="#3e8b35"/>
    </linearGradient>
  </defs>
  <!-- sky panel -->
  <rect x="3" y="4.5" width="26" height="23" rx="2.4" fill="url(#mg_sky)" stroke="#c8b48a" stroke-width="0.6"/>
  <!-- rays -->
  <g stroke="#f7b733" stroke-width="0.9" stroke-linecap="round">
    <path d="M16 7.0 L16 9.6"/>
    <path d="M9.6 9.0 L11.1 11.0"/>
