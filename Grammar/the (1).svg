  <defs>
    <radialGradient id="theOff" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#c2cad2"/>
    </radialGradient>
    <radialGradient id="theOn" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd968"/>
      <stop offset="0.7" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#d4870f"/>
    </radialGradient>
    <radialGradient id="theGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="theSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c098"/>
      <stop offset="1" stop-color="#d29a6a"/>
    </linearGradient>
  </defs>
  <!-- glow behind the chosen item -->
  <circle cx="100" cy="70" r="46" fill="url(#theGlow)"/>
  <!-- Row of three items; the middle one is THE specific (highlighted) one -->
  <circle cx="52" cy="70" r="22" fill="url(#theOff)" stroke="#9aa3ad" stroke-width="3"/>
  <circle cx="148" cy="70" r="22" fill="url(#theOff)" stroke="#9aa3ad" stroke-width="3"/>
