  <ellipse cx="92" cy="60" rx="12" ry="6" fill="#ffffff" opacity="0.45"/>
  <!-- Pointing hand from below at the highlighted item -->
  <g stroke="#b07c4e" stroke-width="2.5" stroke-linejoin="round">
    <!-- index finger pointing up -->
    <path d="M94 168 L94 120 Q94 112 100 112 Q106 112 106 120 L106 168 Z" fill="url(#theSkin)"/>
    <!-- knuckle/fist base -->
    <path d="M84 168 L84 150 Q84 140 96 140 L112 140 Q120 140 120 150 L120 168 Z" fill="url(#theSkin)"/>
