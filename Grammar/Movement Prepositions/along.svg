 <defs>
 <!-- Path/road gradient -->
 <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#9CA3AF"/>
 </linearGradient>
 <!-- Orange sphere gradient -->
 <radialGradient id="sphereGrad" cx="35%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="40%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 <!-- Gold arrow gradient -->
 <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 <!-- Path shadow -->
 </defs>
 <!-- Background -->
 <!-- Winding road/path from lower-left to upper-right -->
 <!-- Road body as a thick curved band -->
 
 <!-- Road highlight -->
 <path d="M 4 26 Q 10 22 14 18 Q 18 14 24 8"
 stroke="rgba(255,255,255,0.45)" stroke-width="1.5" fill="none"
 stroke-linecap="round"/>
 <!-- Gold arrow following the curve -->
 <path d="M 5 25 Q 11 21 15 17 Q 19 13 23 9"
 stroke="url(#arrowGrad)" stroke-width="1.2" fill="none"
 stroke-linecap="round" stroke-dasharray="1.5 0.8"/>
 <!-- Arrow polygon head at upper-right -->
 <polygon points="23,7 26,9 23,11 22,9" fill="url(#arrowGrad)"/>
 <!-- Sphere 1: lower-left on path -->
 
 <!-- Highlight -->
 <circle cx="5.2" cy="23.1" r="0.7" fill="rgba(255,255,255,0.6)"/>
 <!-- Motion line -->
 <line x1="3.5" y1="25.5" x2="5" y2="24.5" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
 <!-- Sphere 2: middle on path -->
 
 <circle cx="13.2" cy="16.6" r="0.7" fill="rgba(255,255,255,0.6)"/>
 <line x1="11.5" y1="19" x2="13" y2="18" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
 <!-- Sphere 3: upper-right on path -->
 
 <circle cx="21.2" cy="9.1" r="0.7" fill="rgba(255,255,255,0.6)"/>
 <line x1="19.5" y1="11.5" x2="21" y2="10.5" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.6"/>
</svg>
