 <defs>
 <radialGradient id="sunG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFE066"/><stop offset="100%" stop-color="#F6A623"/></radialGradient>
 <linearGradient id="skyG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#E0F4FF"/></linearGradient>
 <linearGradient id="sandG" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#F4D47A"/><stop offset="100%" stop-color="#D4A84A"/></linearGradient>
 <linearGradient id="palmG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5A8A3A"/><stop offset="100%" stop-color="#2A6A1A"/></linearGradient>
 <linearGradient id="trunkG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B6914"/><stop offset="100%" stop-color="#C4A030"/></linearGradient>
 <linearGradient id="umbG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#4A8AE8"/></linearGradient>
 </defs>
 <!-- Sky background gradient fill via rect with opacity trick -->
 <rect x="0" y="0" width="32" height="22" fill="url(#skyG)" fill-opacity="0.95"/>
 <!-- Sand -->
 <ellipse cx="16" cy="27" rx="16" ry="7" fill="url(#sandG)"/>
 <!-- Sun -->
 <g filter="url(#sdSu)">
 <circle cx="26" cy="6" r="3.8" fill="url(#sunG)"/>
 <!-- Sun rays -->
 <line x1="26" y1="1.2" x2="26" y2="0" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="29.7" y1="2.3" x2="30.5" y2="1.5" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="31" y1="6" x2="32" y2="6" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="29.7" y1="9.7" x2="30.5" y2="10.5" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="22.3" y1="2.3" x2="21.5" y2="1.5" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="21" y1="6" x2="20" y2="6" stroke="#F6A623" stroke-width="0.7" stroke-linecap="round"/>
 </g>
 <!-- Palm tree trunk -->
 <path d="M10 21 Q8 17 9 13 Q10 9 12 8" stroke="url(#trunkG)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Palm leaves -->
 <g filter="url(#sdSu)">
 <ellipse cx="12" cy="7" rx="4" ry="1.2" fill="url(#palmG)" transform="rotate(-20 12 7)"/>
 <ellipse cx="12" cy="7" rx="4" ry="1.2" fill="url(#palmG)" transform="rotate(20 12 7)"/>
 <ellipse cx="12" cy="7" rx="3.5" ry="1" fill="url(#palmG)" transform="rotate(55 12 7)"/>
 <ellipse cx="12" cy="7" rx="3.5" ry="1" fill="url(#palmG)" transform="rotate(-55 12 7)"/>
 </g>
 <!-- Beach umbrella pole -->
 <line x1="20" y1="22" x2="20" y2="14" stroke="#8B4513" stroke-width="0.7"/>
 <!-- Umbrella top striped -->
 <path d="M14 14 Q17 11 20 14 Q23 11 26 14 Z" fill="#E84A4A"/>
 <path d="M20 14 Q23 11 26 14 Z" fill="#4A8AE8"/>
</svg>
