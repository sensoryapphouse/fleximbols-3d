<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="by-clock" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f8f8f8"/>
 <stop offset="100%" stop-color="#d0d0d0"/>
 </linearGradient>
 <linearGradient id="by-rim" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0c0c0"/>
 <stop offset="100%" stop-color="#707070"/>
 </linearGradient>
 <linearGradient id="by-flag" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#ff4040"/>
 <stop offset="100%" stop-color="#c01010"/>
 </linearGradient>
 <linearGradient id="by-arrow" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#3060e0"/>
 <stop offset="100%" stop-color="#102090"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- clock rim -->
 <circle cx="16" cy="15" r="13" fill="url(#by-rim)"/>
 <!-- clock face -->
 <circle cx="16" cy="15" r="12" fill="url(#by-clock)"/>
 <!-- clock face highlight -->
 <ellipse cx="13" cy="9" rx="5" ry="3" fill="white" fill-opacity="0.3"/>
 <!-- hour markers -->
 <line x1="16" y1="4" x2="16" y2="6" stroke="#808080" stroke-width="1"/>
 <line x1="16" y1="24" x2="16" y2="26" stroke="#808080" stroke-width="1"/>
 <line x1="5" y1="15" x2="7" y2="15" stroke="#808080" stroke-width="1"/>
 <line x1="25" y1="15" x2="27" y2="15" stroke="#808080" stroke-width="1"/>
 <!-- clock hands -->
 <!-- hour hand pointing ~2 o'clock -->
 <line x1="16" y1="15" x2="22" y2="10" stroke="#303030" stroke-width="1.5" stroke-linecap="round"/>
 <!-- minute hand pointing ~12 -->
 <line x1="16" y1="15" x2="16" y2="6" stroke="#303030" stroke-width="1" stroke-linecap="round"/>
 <!-- center dot -->
 <circle cx="16" cy="15" r="1" fill="#303030"/>
 <!-- red flag/marker at 2 o'clock position -->
 <line x1="22" y1="6" x2="22" y2="12" stroke="url(#by-flag)" stroke-width="0.8"/>
 <polygon points="22,6 22,9.5 25,7.8" fill="url(#by-flag)"/>
 <!-- arrow pointing toward flag -->
 <path d="M12 20 Q18 22 21 12" stroke="url(#by-arrow)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <polygon points="21.5,11 20,13 23,13" fill="#3060e0"/>
</svg>
