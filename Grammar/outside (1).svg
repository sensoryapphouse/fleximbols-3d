<defs>
<linearGradient id="osSky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#bfe6ff"/>
<stop offset="1" stop-color="#8fcdf2"/>
</linearGradient>
<linearGradient id="osGround" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8fd05a"/>
<stop offset="1" stop-color="#5aa235"/>
</linearGradient>
<radialGradient id="osSun" cx="0.4" cy="0.35" r="0.7">
<stop offset="0" stop-color="#fff6c0"/>
<stop offset="0.6" stop-color="#ffd23a"/>
<stop offset="1" stop-color="#f5a31e"/>
</radialGradient>
<linearGradient id="osLeaf" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5fbf3e"/>
<stop offset="1" stop-color="#2f7d22"/>
</linearGradient>
<linearGradient id="osTrunk" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a9743f"/>
<stop offset="1" stop-color="#6e4423"/>
</linearGradient>
</defs>
<!-- rounded scene frame -->
<clipPath id="osClip"><rect x="14" y="14" width="172" height="172" rx="18"/></clipPath>
<g clip-path="url(#osClip)">
<rect x="14" y="14" width="172" height="172" fill="url(#osSky)"/>
<!-- ground -->
<path d="M14 132 Q70 116 110 128 Q150 140 186 124 L186 186 L14 186 Z" fill="url(#osGround)"/>
<!-- sun top-right with rays -->
<g stroke="#ffce3a" stroke-width="4" stroke-linecap="round">
<line x1="150" y1="26" x2="150" y2="14"/><line x1="170" y1="34" x2="178" y2="26"/><line x1="176" y1="52" x2="188" y2="52"/><line x1="130" y1="34" x2="122" y2="26"/>
</g>
<circle cx="150" cy="52" r="20" fill="url(#osSun)"/>
<!-- cloud -->
