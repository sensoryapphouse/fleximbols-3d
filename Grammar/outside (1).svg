<circle cx="98" cy="100" r="24" fill="url(#osLeaf)"/>
<circle cx="86" cy="84" r="20" fill="url(#osLeaf)"/>
</g>
<ellipse cx="76" cy="92" rx="8" ry="5" fill="#ffffff" opacity="0.18"/>
