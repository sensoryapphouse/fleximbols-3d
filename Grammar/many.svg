 <defs>
 <radialGradient id="dot" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 </defs>
 <!-- 4 of 5 filled — many = high count -->
 <!-- TOP: filled -->
 <circle cx="16" cy="8" r="2.2" fill="url(#dot)"/>
 <ellipse cx="15.4" cy="7.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- UPPER-LEFT: filled -->
 <circle cx="9" cy="14" r="2.2" fill="url(#dot)"/>
 <ellipse cx="8.4" cy="13.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- UPPER-RIGHT: empty — the one missing -->
 <circle cx="23" cy="14" r="2.2" fill="none" stroke="#9CA3AF" stroke-width="0.6"/>
 <!-- LOWER-LEFT: filled -->
 <circle cx="11" cy="23" r="2.2" fill="url(#dot)"/>
 <ellipse cx="10.4" cy="22.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- LOWER-RIGHT: filled -->
 <circle cx="21" cy="23" r="2.2" fill="url(#dot)"/>
 <ellipse cx="20.4" cy="22.4" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- Small extra satellite dot suggesting overflow -->
 <circle cx="27" cy="8" r="1.3" fill="url(#plusGrad)"/>
 <ellipse cx="26.6" cy="7.6" rx="0.45" ry="0.3" fill="#FFFFFF" fill-opacity="0.55"/>
</svg>
