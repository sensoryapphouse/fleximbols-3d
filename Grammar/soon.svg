<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="clockFace" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#FFF6E0"/>
 <stop offset="100%" stop-color="#E5D4A8"/>
 </radialGradient>
 <linearGradient id="clockRim" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#C47A00"/>
 </linearGradient>
 <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </linearGradient>
 <filter id="pulse">
 <feGaussianBlur stdDeviation="2" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Imminence pulse glow around clock -->
 <circle cx="21" cy="16" r="13" fill="rgba(255,212,94,0.18)" filter="url(#pulse)"/>
 <!-- CLOCK (centred-right) -->
 
 <circle cx="21" cy="16" r="8.3" fill="url(#clockFace)"/>
 <circle cx="18.5" cy="11.5" r="2.8" fill="rgba(255,255,255,0.2)"/>
 <!-- Hour markers -->
 <circle cx="21" cy="8.5" r="0.5" fill="#C47A00"/>
 <circle cx="24.6" cy="9.4" r="0.4" fill="#C47A00"/>
 <circle cx="27" cy="12.5" r="0.4" fill="#C47A00"/>
 <circle cx="28" cy="16" r="0.5" fill="#C47A00"/>
 <circle cx="27" cy="19.5" r="0.4" fill="#C47A00"/>
 <circle cx="24.6" cy="22.6" r="0.4" fill="#C47A00"/>
 <circle cx="21" cy="23.5" r="0.5" fill="#C47A00"/>
 <circle cx="17.4" cy="22.6" r="0.4" fill="#C47A00"/>
 <circle cx="15" cy="19.5" r="0.4" fill="#C47A00"/>
 <circle cx="14" cy="16" r="0.5" fill="#C47A00"/>
 <circle cx="15" cy="12.5" r="0.4" fill="#C47A00"/>
 <circle cx="17.4" cy="9.4" r="0.4" fill="#C47A00"/>
 <!-- Clock hands -->
 <line x1="21" y1="16" x2="21" y2="10" stroke="#4B3200" stroke-width="1" stroke-linecap="round"/>
 <line x1="21" y1="16" x2="25" y2="16" stroke="#4B3200" stroke-width="0.8" stroke-linecap="round"/>
 <circle cx="21" cy="16" r="0.8" fill="#4B3200"/>
 <!-- Arrow approaching from LEFT, almost touching clock edge (at ~x=11.5) -->
 <!-- Motion lines (rapid approach) -->
 <line x1="3.5" y1="14.5" x2="5" y2="15" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/>
 <line x1="3" y1="16" x2="4.5" y2="16" stroke="#E5A700" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
 <line x1="3.5" y1="17.5" x2="5" y2="17" stroke="#E5A700" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/>
 <line x1="5.5" y1="14" x2="7" y2="14.5" stroke="#E5A700" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
 <line x1="5.5" y1="18" x2="7" y2="17.5" stroke="#E5A700" stroke-width="0.4" stroke-linecap="round" opacity="0.4"/>
 <!-- Arrow shaft -->
 
 <rect x="5" y="14.8" width="6" height="0.9" rx="0.7" fill="rgba(255,255,255,0.38)"/>
 <!-- Arrowhead ALMOST touching clock left edge (~x=11.5) -->
 <polygon points="12.5,16 9,13 9,19" fill="url(#shaftGrad)"/>
 <polygon points="11.8,16 9,13.3 9,15.5" fill="rgba(255,255,255,0.28)"/>
</svg>
