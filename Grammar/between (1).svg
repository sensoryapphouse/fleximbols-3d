<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <!-- BALL: radial gradient, highlight at upper-left -->
    <radialGradient id="loc3d_ball" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#ffd4d4"/>
      <stop offset="25%"  stop-color="#ff8080"/>
      <stop offset="65%"  stop-color="#e52d2d"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="loc3d_ball_spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- BOX FRONT FACE: tan gradient + sheen -->
    <linearGradient id="loc3d_front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e8a96d"/>
      <stop offset="50%"  stop-color="#c8873a"/>
      <stop offset="100%" stop-color="#8a5a20"/>
    </linearGradient>
    <linearGradient id="loc3d_front_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- BOX BACK WALL: deep brown -->
    <linearGradient id="loc3d_back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7a4818"/>
      <stop offset="100%" stop-color="#3a2010"/>
    </linearGradient>
    <!-- BOX FLOOR (sloping trapezoid) -->
    <linearGradient id="loc3d_floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#a06838"/>
      <stop offset="100%" stop-color="#6a4419"/>
    </linearGradient>
    <!-- CLOSED BOX LID STRIPE -->
    <linearGradient id="loc3d_lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#c8893a"/>
      <stop offset="100%" stop-color="#7a5018"/>
    </linearGradient>
    <!-- ARROW: glossy green -->
    <linearGradient id="loc3d_arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7be87b"/>
      <stop offset="50%"  stop-color="#22aa22"/>
      <stop offset="100%" stop-color="#0a6a0a"/>
    </linearGradient>
  </defs>


  <!-- LEFT smaller box -->
  <!-- Back wall: x=30 y=290 w=160 h=30 -->
  <rect x="30" y="290" width="160" height="30" fill="url(#loc3d_back)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Floor: M30 320 L190 320 L200 330 L20 330 -->
  <path d="M 30 320 L 190 320 L 200 330 L 20 330 Z" fill="url(#loc3d_floor)" stroke="#2a1a08" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front face: x=20 y=330 w=180 h=80 -->
  <rect x="20" y="330" width="180" height="80" fill="url(#loc3d_front)" stroke="#2a1a08" stroke-width="2"/>

  <!-- RIGHT smaller box -->
  <!-- Back wall: x=322 y=290 w=160 h=30 -->
  <rect x="322" y="290" width="160" height="30" fill="url(#loc3d_back)" stroke="#2a1a08" stroke-width="1.5"/>
  <!-- Floor: M322 320 L482 320 L492 330 L312 330 -->
  <path d="M 322 320 L 482 320 L 492 330 L 312 330 Z" fill="url(#loc3d_floor)" stroke="#2a1a08" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Front face: x=312 y=330 w=180 h=80 -->
  <rect x="312" y="330" width="180" height="80" fill="url(#loc3d_front)" stroke="#2a1a08" stroke-width="2"/>

  <!-- Ball BETWEEN the two boxes -->
  <circle cx="256" cy="380" r="54" fill="url(#loc3d_ball)" stroke="#2a1a08" stroke-width="2"/>
  <circle cx="236" cy="360" r="16" fill="url(#loc3d_ball_spec)"/>

  <!-- Double-headed horizontal arrow above ball (between the two box top edges) -->
  <!-- Shaft: x=210 y=280 w=92 h=14 -->
  <rect x="210" y="280" width="92" height="14" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="1.8"/>
  <!-- Left arrowhead pointing left at x=200 -->
  <polygon points="200,287 230,265 230,309" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Right arrowhead pointing right at x=312 -->
  <polygon points="312,287 282,265 282,309" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- glossy sheen -->
  <rect x="26" y="334" width="168" height="24" rx="6" fill="url(#loc3d_front_sheen)"/>
  <rect x="318" y="334" width="168" height="24" rx="6" fill="url(#loc3d_front_sheen)"/>
</svg>
