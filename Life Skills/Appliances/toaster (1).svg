 <defs>
 <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#d0d8e8"/>
 <stop offset="50%" stop-color="#b0bace"/>
 <stop offset="100%" stop-color="#8090a8"/>
 </linearGradient>
 <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8d0e0"/>
 <stop offset="100%" stop-color="#98a8bc"/>
 </linearGradient>
 <linearGradient id="toast1Grad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e8c878"/>
 <stop offset="40%" stop-color="#d4a84a"/>
 <stop offset="100%" stop-color="#b8862a"/>
 </linearGradient>
 <linearGradient id="toast2Grad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#dfc06a"/>
 <stop offset="40%" stop-color="#c89840"/>
 <stop offset="100%" stop-color="#a87820"/>
 </linearGradient>
 <linearGradient id="leverGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#909ab0"/>
 <stop offset="100%" stop-color="#606878"/>
 </linearGradient>
 <radialGradient id="slotGrad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#404858"/>
 <stop offset="100%" stop-color="#202830"/>
 </radialGradient>
 </defs>
 <!-- drop shadow -->
 <!-- toaster body -->
 <rect x="5" y="15" width="22" height="10" rx="2" ry="2" fill="url(#bodyGrad)"/>
 <!-- top face -->
 <rect x="5" y="13" width="22" height="3" rx="1" fill="url(#topGrad)"/>
 <!-- toast slots -->
 <rect x="9" y="9" width="5" height="7" rx="1" fill="url(#slotGrad)" fill-opacity="0.9"/>
 <rect x="18" y="9" width="5" height="7" rx="1" fill="url(#slotGrad)" fill-opacity="0.9"/>
 <!-- toast slices popping up -->
 <rect x="9.5" y="5" width="4" height="5" rx="0.5" fill="url(#toast1Grad)"/>
 <!-- crust line on toast 1 -->
 <rect x="9.5" y="5" width="4" height="1" rx="0.3" fill="#8a5c18" fill-opacity="0.5"/>
 <rect x="18.5" y="4" width="4" height="6" rx="0.5" fill="url(#toast2Grad)"/>
 <rect x="18.5" y="4" width="4" height="1" rx="0.3" fill="#7a4c10" fill-opacity="0.5"/>
 <!-- lever on right side -->
 <rect x="26" y="17" width="3" height="1.5" rx="0.5" fill="url(#leverGrad)"/>
 <circle cx="28.5" cy="17.75" r="1" fill="#808898"/>
 <!-- base feet -->
 <rect x="7" y="24.5" width="3" height="1.5" rx="0.5" fill="#787888" fill-opacity="0.7"/>
 <rect x="22" y="24.5" width="3" height="1.5" rx="0.5" fill="#787888" fill-opacity="0.7"/>
 <!-- highlight sheen -->
 <rect x="6" y="15.5" width="8" height="1.5" rx="0.5" fill-opacity="0.25" fill="#ffffff"/>
</svg>
