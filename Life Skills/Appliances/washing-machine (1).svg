 <defs>
 <linearGradient id="wm-body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f0f0f0"/>
 <stop offset="100%" stop-color="#b8b8b8"/>
 </linearGradient>
 <radialGradient id="wm-drum" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#4090d0"/>
 <stop offset="60%" stop-color="#206090"/>
 <stop offset="100%" stop-color="#0a3050"/>
 </radialGradient>
 <linearGradient id="wm-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0e0ff"/>
 <stop offset="100%" stop-color="#80b0e0"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- body -->
 <rect x="3" y="4" width="26" height="26" rx="2" fill="url(#wm-body)"/>
 <!-- body highlight -->
 <rect x="3" y="4" width="26" height="5" rx="2" fill="white" fill-opacity="0.35"/>
 <!-- control panel -->
 <rect x="3" y="4" width="26" height="6" rx="1" fill="#e0e0e0"/>
 <circle cx="26" cy="7" r="1.8" fill="#909090"/>
 <rect x="6" y="5.5" width="12" height="2" rx="0.5" fill="#c0c0c0"/>
 <!-- porthole ring outer -->
 <circle cx="16" cy="20" r="9" fill="#c8c8c8"/>
 <!-- porthole ring inner -->
 <circle cx="16" cy="20" r="8" fill="#b0b0b0"/>
 <!-- drum water -->
 <circle cx="16" cy="20" r="7" fill="url(#wm-drum)"/>
 <!-- bubbles -->
 <circle cx="13" cy="18" r="1.5" fill="url(#wm-bubble)" fill-opacity="0.8"/>
 <circle cx="18" cy="22" r="1" fill="url(#wm-bubble)" fill-opacity="0.8"/>
 <circle cx="20" cy="17" r="0.8" fill="url(#wm-bubble)" fill-opacity="0.8"/>
 <circle cx="13" cy="23" r="0.7" fill="url(#wm-bubble)" fill-opacity="0.8"/>
 <!-- tumbling laundry -->
 <ellipse cx="14" cy="16" rx="2.5" ry="1" fill="#e06030" fill-opacity="0.85" transform="rotate(-20 14 16)"/>
 <ellipse cx="19" cy="22" rx="2" ry="0.9" fill="#4070d0" fill-opacity="0.8" transform="rotate(15 19 22)"/>
 <!-- drum spokes -->
 <line x1="16" y1="13" x2="16" y2="27" stroke="#3070a0" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="9" y1="16" x2="23" y2="24" stroke="#3070a0" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="9" y1="24" x2="23" y2="16" stroke="#3070a0" stroke-width="0.4" stroke-opacity="0.5"/>
</svg>
