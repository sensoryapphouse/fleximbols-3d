 <defs>
 <radialGradient id="sk" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FFDFC4"/><stop offset="100%" stop-color="#C68642"/>
 </radialGradient>
 <radialGradient id="phone" cx="25%" cy="20%" r="75%">
 <stop offset="0%" stop-color="#424242"/><stop offset="100%" stop-color="#212121"/>
 </radialGradient>
 <radialGradient id="screen" cx="30%" cy="25%" r="70%">
 <stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#A5D6A7"/>
 </radialGradient>
 </defs>
 <!-- phone body -->
 <rect x="8" y="2" width="16" height="26" rx="3" fill="url(#phone)"/>
 <!-- screen -->
 <rect x="9.5" y="4" width="13" height="19" rx="1.5" fill="url(#screen)"/>
 <!-- screen glow -->
 <ellipse cx="13" cy="8" rx="4" ry="3" fill="#FFFFFF" fill-opacity="0.200"/>
 <!-- text messages - bubbles -->
 <!-- received (left, grey) -->
 <rect x="10.5" y="5.5" width="7" height="3" rx="1.5" fill="#EEEEEE"/>
 <!-- sent (right, green) -->
 <rect x="15" y="10" width="7" height="3" rx="1.5" fill="#4CAF50"/>
 <!-- received -->
 <rect x="10.5" y="15" width="8" height="3" rx="1.5" fill="#EEEEEE"/>
 <!-- text lines in bubbles -->
 <line x1="11.5" y1="7" x2="16.5" y2="7" stroke="#BDBDBD" stroke-width="0.5"/>
 <line x1="16" y1="11.5" x2="21" y2="11.5" stroke="#FFFFFF" stroke-width="0.5"/>
 <line x1="11.5" y1="16.5" x2="17.5" y2="16.5" stroke="#BDBDBD" stroke-width="0.5"/>
 <!-- home button -->
 <circle cx="16" cy="26" r="1.5" fill="#616161"/>
 <!-- finger typing -->
 <ellipse cx="22" cy="21" rx="3" ry="2" fill="url(#sk)"/>
 <path d="M21 17 L22 21" stroke-width="2" stroke="url(#sk)" stroke-linecap="round" fill="none"/>
</svg>