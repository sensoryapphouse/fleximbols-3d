 <rect x="6.3" y="8.3" width="3.4" height="4.4" rx="0.5" fill="#e06040" fill-opacity="0.75"/>
 <rect x="10.3" y="13.3" width="3.4" height="4.4" rx="0.5" fill="#40a060" fill-opacity="0.75"/>
