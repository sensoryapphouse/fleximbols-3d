 <defs>
 <linearGradient id="tt-bg" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f8f8f8"/>
 <stop offset="100%" stop-color="#e0e0e0"/>
 </linearGradient>
 <linearGradient id="tt-header" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#4060c0"/>
 <stop offset="100%" stop-color="#2040a0"/>
