<defs>
 <radialGradient id="ao_glow" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#88AAFF" stop-opacity="0.8"/>
 <stop offset="100%" stop-color="#4466FF" stop-opacity="0"/>
 </radialGradient>
</defs>
<g filter="url(#ao_drop)">
 <!-- Smartphone body -->
 <rect x="8" y="2" width="16" height="28" rx="3" fill="#1A1A1A"/>
 <!-- Home screen faded behind -->
 <rect x="9" y="3" width="14" height="26" rx="2.5" fill="#101820"/>
 <!-- Faded grid icons (home screen behind) -->
 <rect x="10" y="5" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="13.5" y="5" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="17" y="5" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="10" y="9" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="13.5" y="9" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="17" y="9" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="10" y="13" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="13.5" y="13" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <rect x="17" y="13" width="2.5" height="2.5" rx="0.5" fill="#333B50"/>
 <!-- Single highlighted app icon lifted off and hovering -->
 <ellipse cx="16" cy="17" rx="5.5" ry="1.5" fill="url(#ao_glow)" opacity="0.6"/>
 <rect x="10.5" y="10" width="11" height="11" rx="2.5" fill="#4466FF" filter="url(#ao_glowf)"/>
 <!-- App icon content -->
 <text x="16" y="18.5" text-anchor="middle" font-size="7" fill="white" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">A</text>
 <!-- Soft glow halo -->
 <rect x="9" y="9" width="14" height="13" rx="3" fill="url(#ao_glow)" opacity="0.3"/>
</g>
