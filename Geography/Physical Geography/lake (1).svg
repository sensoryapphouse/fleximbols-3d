 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="shore" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="14" fill="url(#sky)"/>
 <!-- Mountains backdrop -->
 <polygon points="0,14 5,6 10,14" fill="url(#mountain)"/>
 <polygon points="8,14 14,4 20,14" fill="url(#mountain)"/>
 <polygon points="18,14 24,7 30,14" fill="url(#mountain)"/>
 <polygon points="27,14 30,8 32,14" fill="url(#mountain)"/>
 <!-- Mountain snow -->
 <polygon points="3,9 5,6 7,9" fill="#FFFFFF" fill-opacity="0.9"/>
 <polygon points="12,7 14,4 16,7" fill="#FFFFFF" fill-opacity="0.9"/>
 <!-- Green shore ring -->
 <ellipse cx="16" cy="22" rx="16" ry="11" fill="url(#shore)"/>
 <!-- Lake - enclosed oval water -->
 <ellipse cx="16" cy="22" rx="11" ry="7" fill="url(#water)"/>
 <!-- Water reflections -->
 <ellipse cx="13" cy="20" rx="4" ry="1.5" fill="#FFFFFF" fill-opacity="0.2"/>
 <path d="M8,21 Q12,20 16,21" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
 <path d="M16,23 Q20,22 24,23" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
 <!-- Small boat -->
 <path d="M18,19 Q20,18.5 22,19 L21.5,21 L18.5,21 Z" fill="#8B5C3A" fill-opacity="0.8"/>
 <!-- Dock -->
 <rect x="6" y="20" width="4" height="0.8" fill="#C99878" fill-opacity="0.8"/>
 <rect x="7" y="20" width="0.5" height="3" fill="#C99878" fill-opacity="0.8"/>
 <rect x="9" y="20" width="0.5" height="3" fill="#C99878" fill-opacity="0.8"/>
</svg>
