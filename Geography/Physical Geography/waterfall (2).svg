<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#7A7E84"/>
 <stop offset="100%" stop-color="#C9CDD3"/>
 </linearGradient>
 <linearGradient id="cascade" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#A6D9F5"/>
 </linearGradient>
 <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="vegetation" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="10" fill="url(#sky)"/>
 <!-- Left cliff face -->
 <rect x="0" y="0" width="11" height="24" fill="url(#cliff)"/>
 <!-- Right cliff face -->
 <rect x="21" y="0" width="11" height="24" fill="url(#cliff)"/>
 <!-- Cliff edge at top (key gesture) -->
 <rect x="0" y="0" width="11" height="2" fill="#FFFFFF" fill-opacity="0.4"/>
 <rect x="21" y="0" width="11" height="2" fill="#FFFFFF" fill-opacity="0.4"/>
 <!-- Vegetation on cliff top and sides -->
 <ellipse cx="4" cy="1" rx="4" ry="2" fill="url(#vegetation)" fill-opacity="0.85"/>
 <ellipse cx="28" cy="1" rx="4" ry="2" fill="url(#vegetation)" fill-opacity="0.85"/>
 <ellipse cx="2" cy="10" rx="3" ry="2" fill="#33691E" fill-opacity="0.7"/>
 <ellipse cx="30" cy="10" rx="3" ry="2" fill="#33691E" fill-opacity="0.7"/>
 <ellipse cx="1" cy="18" rx="3" ry="2" fill="#7BAA48" fill-opacity="0.65"/>
 <ellipse cx="31" cy="18" rx="3" ry="2" fill="#7BAA48" fill-opacity="0.65"/>
 <!-- Cascading waterfall (key gesture - vertical cascade) -->
 <rect x="12" y="0" width="8" height="22" fill="url(#cascade)"/>
 <!-- Cascade motion lines -->
 <line x1="13" y1="2" x2="13" y2="22" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="15" y1="2" x2="15" y2="22" stroke="#A6D9F5" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="17" y1="2" x2="17" y2="22" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="19" y1="2" x2="19" y2="22" stroke="#A6D9F5" stroke-width="0.4" stroke-opacity="0.5"/>
 <!-- Spray at sides of fall -->
 <ellipse cx="10" cy="10" rx="2" ry="3" fill="#FFFFFF" fill-opacity="0.3"/>
 <ellipse cx="22" cy="10" rx="2" ry="3" fill="#FFFFFF" fill-opacity="0.3"/>
 <!-- Splash pool at bottom (key gesture) -->
 <ellipse cx="16" cy="26" rx="10" ry="4" fill="url(#pool)"/>
 <!-- White splash -->
 <ellipse cx="16" cy="23" rx="5" ry="2" fill="#FFFFFF" fill-opacity="0.7"/>
 <!-- Splash droplets -->
 <circle cx="10" cy="22" r="0.5" fill="#FFFFFF" fill-opacity="0.7"/>
 <circle cx="22" cy="22" r="0.5" fill="#FFFFFF" fill-opacity="0.7"/>
 <circle cx="12" cy="20" r="0.4" fill="#FFFFFF" fill-opacity="0.6"/>
 <circle cx="20" cy="20" r="0.4" fill="#FFFFFF" fill-opacity="0.6"/>
 <circle cx="9" cy="25" r="0.4" fill="#FFFFFF" fill-opacity="0.5"/>
 <circle cx="23" cy="25" r="0.4" fill="#FFFFFF" fill-opacity="0.5"/>
 <!-- Pool ripples -->
</svg>
