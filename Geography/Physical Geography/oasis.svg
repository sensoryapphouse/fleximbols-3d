<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFE4B5"/>
 <stop offset="100%" stop-color="#D4A574"/>
 </linearGradient>
 <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="frond" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="18" fill="url(#sky)"/>
 <!-- Sand dunes -->
 <ellipse cx="16" cy="32" rx="18" ry="10" fill="url(#sand)"/>
 <ellipse cx="0" cy="28" rx="10" ry="7" fill="url(#sand)"/>
 <ellipse cx="32" cy="28" rx="10" ry="7" fill="url(#sand)"/>
 <!-- Sand ground -->
 <rect x="0" y="22" width="32" height="10" fill="url(#sand)"/>
 <!-- Central water pool -->
 <ellipse cx="16" cy="24" rx="7" ry="4" fill="url(#pool)"/>
 <!-- Pool reflection sparkle -->
 <ellipse cx="13" cy="23" rx="2" ry="1" fill="#FFFFFF" fill-opacity="0.3"/>
 <!-- Palm tree left (leaning) -->
 <path d="M9,28 Q10,22 12,16" stroke="#8B5C3A" stroke-width="2" fill="none" stroke-linecap="round"/>
 <!-- Palm fronds left -->
 <ellipse cx="12" cy="14" rx="5" ry="2" fill="url(#frond)" transform="rotate(-20,12,14)"/>
 <ellipse cx="12" cy="14" rx="5" ry="1.8" fill="url(#frond)" transform="rotate(15,12,14)"/>
 <ellipse cx="12" cy="14" rx="4" ry="1.5" fill="url(#frond)" transform="rotate(-50,12,14)"/>
 <!-- Palm tree right (leaning other way) -->
 <path d="M23,28 Q22,22 20,16" stroke="#8B5C3A" stroke-width="2" fill="none" stroke-linecap="round"/>
 <!-- Palm fronds right -->
 <ellipse cx="20" cy="14" rx="5" ry="2" fill="url(#frond)" transform="rotate(20,20,14)"/>
 <ellipse cx="20" cy="14" rx="5" ry="1.8" fill="url(#frond)" transform="rotate(-15,20,14)"/>
 <ellipse cx="20" cy="14" rx="4" ry="1.5" fill="url(#frond)" transform="rotate(50,20,14)"/>
 <!-- Center tall palm -->
 <rect x="15" y="16" width="2" height="12" fill="url(#trunk)"/>
 <!-- Center fronds -->
 <ellipse cx="16" cy="15" rx="6" ry="2.2" fill="url(#frond)" transform="rotate(-10,16,15)"/>
 <ellipse cx="16" cy="15" rx="6" ry="2" fill="url(#frond)" transform="rotate(20,16,15)"/>
 <ellipse cx="16" cy="14" rx="5" ry="1.8" fill="url(#frond)" transform="rotate(-40,16,14)"/>
 <!-- Sand ripple texture -->
 <path d="M2,26 Q6,25.5 10,26" stroke="#D4A574" stroke-width="0.4" fill="none" stroke-opacity="0.6"/>
 <path d="M22,27 Q26,26.5 30,27" stroke="#D4A574" stroke-width="0.4" fill="none" stroke-opacity="0.6"/>
</svg>
