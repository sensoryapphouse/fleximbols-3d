 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CA3FF"/>
 <stop offset="100%" stop-color="#0D47A1"/>
 </linearGradient>
 <linearGradient id="iceAbove" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#C9CDD3"/>
 </linearGradient>
 <linearGradient id="iceBelow" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="16" fill="url(#sky)"/>
 <!-- Ocean -->
 <rect x="0" y="16" width="32" height="16" fill="url(#ocean)"/>
 <!-- Waterline wave -->
 <path d="M0,16 Q8,14.5 16,16 Q24,17.5 32,16" fill="#5CA3FF" fill-opacity="0.4"/>
 <!-- Underwater portion (large) -->
 <ellipse cx="16" cy="24" rx="11" ry="7" fill="url(#iceBelow)" fill-opacity="0.75"/>
 <!-- Above water ice peak (jagged) -->
 <polygon points="10,17 13,7 16,4 19,9 22,17" fill="url(#iceAbove)"/>
 <!-- Ice peak highlight -->
 <polygon points="13,7 16,4 17,8 14,10" fill="#FFFFFF" fill-opacity="0.6"/>
 <!-- Jagged edge detail -->
 <polygon points="10,17 11,14 12,16 13,12 14,15 15,11 16,14 17,11 18,15 19,12 20,16 21,14 22,17" fill="url(#iceAbove)"/>
 <!-- Underwater highlight -->
 <ellipse cx="13" cy="21" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
 <!-- Water wave lines -->
 <path d="M4,19 Q8,18 12,19" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <path d="M20,20 Q24,19 28,20" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
</svg>
