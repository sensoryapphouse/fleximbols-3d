<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#A6D9F5"/>
 </linearGradient>
 <linearGradient id="iceDeep" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="20" fill="url(#sky)"/>
 <!-- Mountain left -->
 <polygon points="0,20 6,8 12,20" fill="url(#mountain)"/>
 <!-- Mountain right -->
 <polygon points="20,20 26,6 32,20" fill="url(#mountain)"/>
 <!-- Mountain snow caps -->
 <polygon points="4,11 6,8 8,11" fill="#FFFFFF" fill-opacity="0.9"/>
 <polygon points="24,9 26,6 28,9" fill="#FFFFFF" fill-opacity="0.9"/>
 <!-- Glacier body - massive ice wall -->
 <polygon points="2,32 4,18 28,18 30,32" fill="url(#ice)"/>
 <!-- Glacier front face / cliffs -->
 <rect x="4" y="22" width="24" height="10" fill="url(#iceDeep)" fill-opacity="0.8"/>
 <!-- Crevasses – vertical fissures -->
 <line x1="9" y1="18" x2="8" y2="28" stroke="#5CA3FF" stroke-width="1" stroke-opacity="0.7"/>
 <line x1="14" y1="18" x2="13" y2="29" stroke="#5CA3FF" stroke-width="1.2" stroke-opacity="0.7"/>
 <line x1="19" y1="18" x2="20" y2="28" stroke="#5CA3FF" stroke-width="1" stroke-opacity="0.7"/>
 <line x1="24" y1="18" x2="25" y2="26" stroke="#5CA3FF" stroke-width="0.8" stroke-opacity="0.6"/>
 <!-- Ice cliffs at front edge - highlight -->
 <rect x="4" y="22" width="24" height="2" fill="#FFFFFF" fill-opacity="0.5"/>
 <!-- Surface ice texture / shine -->
 <polygon points="6,18 14,18 12,21 8,21" fill="#FFFFFF" fill-opacity="0.3"/>
 <polygon points="18,18 26,18 24,21 20,21" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
