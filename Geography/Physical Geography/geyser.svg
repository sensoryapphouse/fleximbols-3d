 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
 </linearGradient>
 <linearGradient id="steamMid" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E0E0E0" stop-opacity="0.3"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 
 <!-- Ground -->
 <ellipse cx="16" cy="30" rx="16" ry="4" fill="url(#ground)"/>
 <!-- Ground surface -->
 <rect x="0" y="27" width="32" height="5" fill="url(#ground)"/>
 <!-- Rocky vent rim -->
 <ellipse cx="16" cy="27" rx="3" ry="1.2" fill="#7A7E84" fill-opacity="0.9"/>
 <!-- Central steam column -->
 <rect x="14" y="4" width="4" height="23" fill="url(#steam)"/>
 <!-- Steam column widening at top -->
 <ellipse cx="16" cy="4" rx="5" ry="3" fill="#FFFFFF" fill-opacity="0.6"/>
 <ellipse cx="16" cy="3" rx="4" ry="2.5" fill="#FFFFFF" fill-opacity="0.5"/>
 <ellipse cx="16" cy="2" rx="3" ry="2" fill="#FFFFFF" fill-opacity="0.4"/>
 <!-- Steam wisps / spray sides -->
 <ellipse cx="10" cy="8" rx="2" ry="1" fill="#FFFFFF" fill-opacity="0.4"/>
 <ellipse cx="22" cy="8" rx="2" ry="1" fill="#FFFFFF" fill-opacity="0.4"/>
 <ellipse cx="8" cy="12" rx="1.5" ry="0.8" fill="#FFFFFF" fill-opacity="0.3"/>
 <ellipse cx="24" cy="12" rx="1.5" ry="0.8" fill="#FFFFFF" fill-opacity="0.3"/>
 <!-- Droplet motion lines -->
 <line x1="13" y1="6" x2="9" y2="10" stroke="#A6D9F5" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="19" y1="6" x2="23" y2="10" stroke="#A6D9F5" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="14" y1="5" x2="11" y2="14" stroke="#A6D9F5" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="18" y1="5" x2="21" y2="14" stroke="#A6D9F5" stroke-width="0.4" stroke-opacity="0.5"/>
 <!-- Base steam clouds -->
 <ellipse cx="12" cy="26" rx="3" ry="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
 <ellipse cx="20" cy="26" rx="3" ry="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
