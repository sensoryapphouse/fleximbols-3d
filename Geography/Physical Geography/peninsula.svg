<svg viewBox="0 0 512 512" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="pn_water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4aa0e0"/>
      <stop offset="1" stop-color="#2b6db0"/>
    </linearGradient>
    <linearGradient id="pn_land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fc24a"/>
      <stop offset="1" stop-color="#479230"/>
    </linearGradient>
    <linearGradient id="pn_beach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dca0"/>
      <stop offset="1" stop-color="#d9bf72"/>
    </linearGradient>
  </defs>
  <!-- water background -->
  <rect x="40" y="40" width="432" height="432" rx="24" fill="url(#pn_water)"/>
  <!-- mainland strip on left -->
  <rect x="40" y="40" width="120" height="432" fill="url(#pn_land)"/>
  <!-- peninsula: tongue of land jutting right into water, connected to mainland -->
  <path d="M150 200
           C260 196 360 218 392 256
           C360 294 260 316 150 312 Z"
        fill="url(#pn_land)" stroke="#367020" stroke-width="5"/>
  <!-- sandy shoreline edge of peninsula -->
  <path d="M150 200 C260 196 360 218 392 256 C360 294 260 316 150 312"
        fill="none" stroke="url(#pn_beach)" stroke-width="10" opacity="0.8"/>
  <!-- small water ripples -->
  <g stroke="#9fd0f5" stroke-width="6" stroke-linecap="round" opacity="0.7" fill="none">
    <line x1="300" y1="120" x2="360" y2="120"/>
    <line x1="320" y1="150" x2="380" y2="150"/>
    <line x1="300" y1="380" x2="360" y2="380"/>
    <line x1="320" y1="410" x2="380" y2="410"/>
  </g>
  <!-- mainland trees -->
  <circle cx="90" cy="120" r="24" fill="#3a9230"/>
  <circle cx="110" cy="380" r="24" fill="#3a9230"/>
</svg>
