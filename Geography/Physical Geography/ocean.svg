<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
 <linearGradient id="cf_oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#AADDFF"/>
 <stop offset="100%" stop-color="#1A5A9A"/>
 </linearGradient>
 <linearGradient id="cf_skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#99CCFF"/>
 <stop offset="100%" stop-color="#CCE8FF"/>
 </linearGradient>
</defs>
<!-- Sky -->
<rect x="0" y="0" width="32" height="14" fill="url(#cf_skyGrad)"/>
<!-- Flat horizon line -->
<line x1="0" y1="14" x2="32" y2="14" stroke="#6AB0E0" stroke-width="0.5"/>
<!-- Wide expanse of ocean with rolling waves -->
<rect x="0" y="14" width="32" height="18" fill="url(#cf_oceanGrad)"/>
<!-- Distant cargo ship silhouette on horizon -->
<path d="M20 13 L28 13 L28.5 14.5 L19.5 14.5Z" fill="#5A6A7A"/>
<!-- Ship details -->
<rect x="22" y="11.5" width="1.5" height="1.5" rx="0.2" fill="#4A5A6A"/>
<rect x="25" y="12" width="2" height="1" rx="0.2" fill="#4A5A6A"/>
<!-- Rolling waves stacked toward horizon -->
<!-- Wave 1 (horizon) - smallest, faintest -->
<path d="M0 16 Q4 14.5 8 16 Q12 14.5 16 16 Q20 14.5 24 16 Q28 14.5 32 16" stroke="#88CCEE" stroke-width="0.8" fill="none" opacity="0.6"/>
<!-- Wave 2 -->
<path d="M0 19 Q4 17 8 19 Q12 17 16 19 Q20 17 24 19 Q28 17 32 19" stroke="#55AACC" stroke-width="1" fill="none" opacity="0.7"/>
<!-- Whitecaps on wave 2 -->
<path d="M2 18 Q4 17.2 6 18" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M14 18 Q16 17.2 18 18" stroke="white" stroke-width="1" fill="none" opacity="0.5"/>
<path d="M26 18 Q28 17.2 30 18" stroke="white" stroke-width="1" fill="none" opacity="0.4"/>
<!-- Wave 3 - medium -->
<path d="M0 22.5 Q4 20.5 8 22.5 Q12 20.5 16 22.5 Q20 20.5 24 22.5 Q28 20.5 32 22.5" stroke="#3A8ABB" stroke-width="1.2" fill="none" opacity="0.8"/>
<!-- Whitecaps -->
<path d="M1 21.5 Q3 21 5 21.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.6"/>
<path d="M11 21.5 Q13 21 15 21.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.6"/>
<path d="M21 21.5 Q23 21 25 21.5" stroke="white" stroke-width="1.2" fill="none" opacity="0.6"/>
<!-- Wave 4 (foreground) - largest, darkest blue -->
<path d="M0 27 Q4 24.5 8 27 Q12 24.5 16 27 Q20 24.5 24 27 Q28 24.5 32 27" stroke="#1A6AAA" stroke-width="1.8" fill="none"/>
<!-- Whitecaps on foreground wave -->
<path d="M0 26 Q3 25 6 26" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
<path d="M10 26 Q13 25 16 26" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
<path d="M20 26 Q23 25 26 26" stroke="white" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>
