 <defs>
 <linearGradient id="sky_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f8d060"/>
 <stop offset="100%" stop-color="#f0a820"/>
 </linearGradient>
 <linearGradient id="ground_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#c89050"/>
 <stop offset="100%" stop-color="#784828"/>
 </linearGradient>
 <radialGradient id="sun_g" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ffe840"/>
 <stop offset="60%" stop-color="#ffa800"/>
 <stop offset="100%" stop-color="#e07000"/>
 </radialGradient>
 <linearGradient id="crack_g" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#5a2808"/>
 <stop offset="100%" stop-color="#3a1008"/>
 </linearGradient>
 <linearGradient id="plant_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#788020"/>
 <stop offset="100%" stop-color="#404008"/>
 </linearGradient>
 </defs>

 <!-- Hot sky (no clouds) -->
 <rect x="0" y="0" width="32" height="20" fill="url(#sky_g)"/>

 <!-- Sun (harsh, large) -->
 <circle cx="24" cy="6" r="4.5" fill="url(#sun_g)"/>
 <!-- Sun rays -->
 <line x1="24" y1="0.5" x2="24" y2="2" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="28.5" y1="1.5" x2="27.5" y2="3" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="31" y1="5" x2="29.5" y2="5.8" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="31.5" y1="9" x2="30" y2="8.5" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="28.5" y1="11.5" x2="27.5" y2="10" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="24" y1="12" x2="24" y2="10.5" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="19.5" y1="11" x2="20.5" y2="9.5" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="17" y1="7" x2="18.5" y2="6.8" stroke="#ffc030" stroke-width="0.7"/>
 <line x1="18" y1="2.5" x2="19.5" y2="3.5" stroke="#ffc030" stroke-width="0.7"/>

 <!-- Dry cracked earth -->
 <rect x="0" y="20" width="32" height="12" fill="url(#ground_g)"/>
 <!-- Crack polygons -->
 <path d="M 4 20 L 6 23 L 3 26 L 7 28 L 4 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 6 23 L 10 22 L 12 25 L 9 28 L 12 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 10 22 L 14 20 L 15 24 L 12 26 L 15 30 L 13 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 14 20 L 18 22 L 16 25 L 19 28 L 17 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 18 22 L 22 20 L 23 24 L 21 27 L 24 30 L 21 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 22 20 L 26 22 L 25 25 L 28 28 L 26 32" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 26 22 L 30 20 L 32 24 L 29 27 L 32 30" stroke="#5a2808" stroke-width="0.5" fill="none"/>
 <path d="M 0 24 L 4 23 L 8 24.5 L 14 23.5 L 18 25 L 24 24 L 28 25 L 32 24" stroke="#5a2808" stroke-width="0.4" fill="none"/>
 <path d="M 0 27.5 L 5 27 L 9 28 L 16 27.5 L 22 28.5 L 28 27.5 L 32 28" stroke="#5a2808" stroke-width="0.4" fill="none"/>

 <!-- Wilted plant -->
 <path d="M 9 26 L 9 22 L 8 20" stroke="#606008" stroke-width="0.6" fill="none" stroke-linecap="round"/>
 <path d="M 9 22 Q 11 21 12 23" stroke="#788020" stroke-width="0.4" fill="url(#plant_g)"/>
 <path d="M 9 22 Q 7 21 6 23" stroke="#788020" stroke-width="0.4" fill="url(#plant_g)"/>
 <circle cx="8" cy="20.5" r="1" fill="#a89020"/>
 <circle cx="8" cy="20.5" r="0.5" fill="#786010"/>

 <!-- Heat haze -->
 <path d="M 16 14 Q 17 13.5 18 14 Q 19 14.5 20 14" stroke="#f0b840" stroke-width="0.4" fill="none" opacity="0.5"/>
 <path d="M 16 15.5 Q 17 15 18 15.5 Q 19 16 20 15.5" stroke="#f0b840" stroke-width="0.4" fill="none" opacity="0.4"/>
</svg>
