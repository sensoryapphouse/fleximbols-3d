<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="avSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe2f5"/>
      <stop offset="1" stop-color="#8cc3e6"/>
    </linearGradient>
    <linearGradient id="avMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8a99"/>
      <stop offset="1" stop-color="#566374"/>
    </linearGradient>
    <linearGradient id="avSnow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaf2"/>
    </linearGradient>
  </defs>
  <!-- sky -->
  <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#avSky)"/>
  <!-- mountain mass -->
  <path d="M2 22 L11 7 L18 16 L24 9 L30 22 Z" fill="url(#avMtn)"/>
  <!-- snow cap on peaks -->
  <path d="M11 7 L8 12 Q11 10.5 14 12 Z" fill="#ffffff"/>
  <path d="M24 9 L21 14 Q24 12.5 27 14 Z" fill="#ffffff"/>
  <!-- the avalanche: big snow slide cascading down the left slope -->
  <path d="M11 7 Q9 14 6 20 Q5 24 9 25 Q15 26 18 23 Q14 20 14 15 Q13 10 11 7 Z" fill="url(#avSnow)" stroke="#cfdde8" stroke-width="0.4"/>
  <!-- tumbling snow chunks / cloud at the bottom -->
  <g fill="#ffffff">
    <circle cx="8" cy="24" r="2.4"/>
    <circle cx="11.5" cy="25" r="2.8"/>
    <circle cx="15" cy="24.3" r="2.4"/>
    <circle cx="18" cy="25.2" r="2"/>
    <circle cx="6" cy="25.3" r="1.8"/>
  </g>
  <!-- motion lines showing it sliding -->
  <g stroke="#9fb6c6" stroke-width="0.7" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M12 9 Q10 14 8 18"/>
    <path d="M14 10 Q12 15 10.5 19"/>
  </g>
  <!-- small skier fleeing at lower right -->
  <g transform="translate(24,22)">
    <circle cx="0" cy="-3" r="1.1" fill="#2b2b2b"/>
    <path d="M0 -2 L0.6 1" stroke="#d94f4f" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M0.6 1 L-0.8 3 M0.6 1 L2 3" stroke="#2b2b2b" stroke-width="1" stroke-linecap="round"/>
    <path d="M0 -1 L2.2 -1.6" stroke="#d94f4f" stroke-width="1" stroke-linecap="round"/>
    <path d="M-1.6 3.4 L3 2.6" stroke="#553" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
