 <defs>
 <linearGradient id="scalePlatGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#EAEEF3"/>
 <stop offset="100%" stop-color="#B0B8C4"/>
 </linearGradient>
 <linearGradient id="scaleEdgeGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#8090A0"/>
 <stop offset="100%" stop-color="#4A5A6A"/>
 </linearGradient>
 <linearGradient id="scaleDisplayGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#1A2A1A"/>
 <stop offset="100%" stop-color="#0A1A0A"/>
 </linearGradient>
 <!-- Perspective shadow under scale -->
 </defs>
 <!-- Shadow/perspective base -->
 <!-- Scale platform (slightly angled perspective) -->
 <rect x="4" y="16" width="24" height="12" rx="3" fill="url(#scalePlatGrad)"/>
 <!-- Edge/side thickness -->
 <rect x="4" y="25" width="24" height="3" rx="2" fill="url(#scaleEdgeGrad)"/>
 <!-- Top surface highlight -->
 <rect x="5" y="16.5" width="22" height="2" rx="1" fill="#FFFFFF" opacity="0.5"/>
 <!-- Digital display window -->
 <rect x="9" y="19" width="14" height="6" rx="1.5" fill="url(#scaleDisplayGrad)"/>
 <!-- Display inner glow -->
 <rect x="9.5" y="19.5" width="13" height="5" rx="1" fill="#0D1F0D" opacity="0.8"/>
 <!-- Digital number segments (stylised "70.0") -->
 <!-- 7 -->
 <line x1="11" y1="20.5" x2="13" y2="20.5" stroke="#22FF44" stroke-width="0.6"/>
 <line x1="13" y1="20.5" x2="12" y2="24" stroke="#22FF44" stroke-width="0.6"/>
 <!-- 0 -->
 <rect x="13.5" y="20.5" width="2.5" height="3.5" rx="0.5" fill="none" stroke="#22FF44" stroke-width="0.6"/>
 <!-- . -->
 <circle cx="16.5" cy="24" r="0.3" fill="#22FF44"/>
 <!-- 0 -->
 <rect x="17" y="20.5" width="2.5" height="3.5" rx="0.5" fill="none" stroke="#22FF44" stroke-width="0.6"/>
 <!-- Small power button -->
 <circle cx="26" cy="27" r="1.2" fill="#6A7A8A"/>
 <circle cx="26" cy="27" r="0.6" fill="#4A5A6A"/>
 <!-- Surface texture lines (subtle) -->
 <line x1="4" y1="20" x2="28" y2="20" stroke="#C0C8D4" stroke-width="0.3" opacity="0.5"/>
 <line x1="4" y1="23" x2="28" y2="23" stroke="#C0C8D4" stroke-width="0.3" opacity="0.5"/>
</svg>
