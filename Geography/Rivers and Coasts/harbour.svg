 <polygon points="9,13 13,16 9,16" fill="white" fill-opacity="0.8"/>
 </g>
 <!-- Boat 2 -->
 <g filter="url(#sdHB)">
 <ellipse cx="23" cy="21" rx="5" ry="2" fill="url(#hbHull2)"/>
 <rect x="21" y="17" width="4" height="4" rx="0.5" fill="#F5F5DC"/>
 <line x1="23" y1="13" x2="23" y2="17" stroke="#5A3A20" stroke-width="0.8"/>
 <polygon points="23,13 27,16 23,16" fill="white" fill-opacity="0.8"/>
 </g>
 <!-- Crane -->
 <line x1="16" y1="17" x2="16" y2="5" stroke="url(#hbCrane)" stroke-width="1.5"/>
 <line x1="16" y1="5" x2="24" y2="5" stroke="url(#hbCrane)" stroke-width="1.5"/>
 <line x1="24" y1="5" x2="24" y2="12" stroke="url(#hbCrane)" stroke-width="0.8"/>
</svg>
