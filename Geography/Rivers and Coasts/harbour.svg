 <defs>
 <linearGradient id="hbWater" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3A8ABF"/><stop offset="100%" stop-color="#1A4A7A"/></linearGradient>
 <linearGradient id="hbPier" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8B6040"/><stop offset="100%" stop-color="#5A3A20"/></linearGradient>
 <linearGradient id="hbHull" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#8B1A1A"/></linearGradient>
 <linearGradient id="hbHull2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A8AE8"/><stop offset="100%" stop-color="#1A3A98"/></linearGradient>
 <linearGradient id="hbCrane" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#D4A820"/><stop offset="100%" stop-color="#8A6800"/></linearGradient>
 </defs>
 <!-- Water -->
 <rect x="0" y="20" width="32" height="12" fill="url(#hbWater)"/>
 <!-- Water wave lines -->
 <path d="M0 23 Q4 22 8 23 Q12 24 16 23 Q20 22 24 23 Q28 24 32 23" stroke="white" stroke-opacity="0.3" stroke-width="0.5" fill="none"/>
 <path d="M0 26 Q4 25 8 26 Q12 27 16 26 Q20 25 24 26 Q28 27 32 26" stroke="white" stroke-opacity="0.2" stroke-width="0.4" fill="none"/>
 <!-- Pier -->
 <rect x="2" y="17" width="28" height="4" rx="0.5" fill="url(#hbPier)" filter="url(#sdHB)"/>
 <!-- Pier posts -->
 <rect x="5" y="21" width="1.5" height="8" fill="#5A3A20"/>
 <rect x="12" y="21" width="1.5" height="8" fill="#5A3A20"/>
 <rect x="19" y="21" width="1.5" height="8" fill="#5A3A20"/>
 <rect x="26" y="21" width="1.5" height="8" fill="#5A3A20"/>
 <!-- Boat 1 -->
 <g filter="url(#sdHB)">
 <ellipse cx="9" cy="21" rx="5" ry="2" fill="url(#hbHull)"/>
 <rect x="7" y="17" width="4" height="4" rx="0.5" fill="#F5F5DC"/>
