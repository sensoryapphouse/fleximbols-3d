<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
  <!-- Fuselage gradient -->
  <linearGradient id="fuseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="40%" stop-color="#E8EDF5"/>
    <stop offset="100%" stop-color="#9AAABB"/>
  </linearGradient>
  <!-- Wing gradient -->
  <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#D8E0EE"/>
    <stop offset="100%" stop-color="#8899AA"/>
  </linearGradient>
  <!-- Tail fin gradient -->
  <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#CC2222"/>
    <stop offset="100%" stop-color="#881111"/>
  </linearGradient>
  <!-- Engine gradient -->
  <radialGradient id="engGrad" cx="40%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#888899"/>
    <stop offset="100%" stop-color="#444455"/>
  </radialGradient>
  <!-- Nose highlight -->
  <radialGradient id="noseGrad" cx="30%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#99AABB" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ── TAIL HORIZONTAL STABILIZER (behind fuselage) ── -->
<!-- Horizontal stabilizer — small swept wing at tail -->
<polygon points="4,16 2,19 6,18.5" fill="url(#wingGrad)" stroke="#99AABB" stroke-width="0.3"/>

<!-- ── VERTICAL TAIL FIN ── -->
<polygon points="4,16 3,10 7,16" fill="url(#tailGrad)" stroke="#881111" stroke-width="0.3"/>
<!-- Blue accent on fin -->
<polygon points="4.5,14 3.5,11 6,14.5" fill="#3366CC" opacity="0.7"/>

<!-- ── FUSELAGE (main body — cigar shape, flying left→right) ── -->
<path d="
  M6,14
  Q7,12 12,12.2
  Q18,12 24,13.5
  Q28,14.5 29,16
  Q29,17 28,17.5
  Q26,18 24,17.8
  Q18,18 12,17.8
  Q7,18 6,17
  Z
" fill="url(#fuseGrad)" stroke="#AABBCC" stroke-width="0.3"/>

<!-- Nose cone -->
<path d="M28,16 Q30,16 31,16 Q30,15.2 28,15 Q29,15.5 28,16Z" fill="#D0D8E8"/>
<!-- Nose highlight -->
<ellipse cx="28.5" cy="15.5" rx="1" ry="0.6" fill="url(#noseGrad)" opacity="0.8"/>

<!-- ── MAIN WINGS (large swept-back, extend from mid-fuselage) ── -->
<!-- Lower wing surface (shadow side) -->
<polygon points="19,17.5 22,17.2 14,26 11,25" fill="#7A8A99" opacity="0.6"/>
<!-- Upper wing surface -->
<polygon points="19,16 22,15.8 14,26 11,24.5" fill="url(#wingGrad)" stroke="#99AABB" stroke-width="0.3"/>
<!-- Wing highlight strip -->
<polygon points="20,16 22,15.8 21,17 19.5,17" fill="#FFFFFF" opacity="0.35"/>

<!-- Upper small wing (port side, foreshortened) -->
<polygon points="19,15 22,13.5 18,9 15,10" fill="url(#wingGrad)" stroke="#99AABB" stroke-width="0.3"/>
<!-- Upper wing highlight -->
<polygon points="20,14.5 22,13.5 21,12 19.5,13" fill="#FFFFFF" opacity="0.3"/>

<!-- ── ENGINES (underslung on each visible wing) ── -->
<!-- Engine on lower wing -->
<ellipse cx="16" cy="22.5" rx="1.2" ry="2" fill="url(#engGrad)" stroke="#33334A" stroke-width="0.25"/>
<ellipse cx="16" cy="21.2" rx="1" ry="0.5" fill="#222233"/>
<!-- Engine highlight -->
<ellipse cx="15.7" cy="21.3" rx="0.4" ry="0.2" fill="#AABBCC" opacity="0.6"/>

<!-- Engine on upper wing -->
<ellipse cx="19" cy="11.5" rx="1.1" ry="1.8" fill="url(#engGrad)" stroke="#33334A" stroke-width="0.25"/>
<ellipse cx="19" cy="10.4" rx="0.9" ry="0.45" fill="#222233"/>
<ellipse cx="18.7" cy="10.5" rx="0.35" ry="0.18" fill="#AABBCC" opacity="0.6"/>

<!-- ── FUSELAGE DETAILS ── -->
<!-- Livery stripe -->
<path d="M7,14.6 Q18,14.2 27,15.2" stroke="#CC2222" stroke-width="0.9" fill="none" stroke-linecap="round"/>
<path d="M7,15.3 Q18,14.9 27,15.9" stroke="#3366CC" stroke-width="0.5" fill="none" stroke-linecap="round"/>

<!-- Windows -->
<circle cx="13" cy="14.2" r="0.55" fill="#88BBDD" opacity="0.9"/>
<circle cx="15.5" cy="14" r="0.55" fill="#88BBDD" opacity="0.9"/>
<circle cx="18" cy="13.8" r="0.55" fill="#88BBDD" opacity="0.9"/>
<circle cx="20.5" cy="13.7" r="0.55" fill="#88BBDD" opacity="0.9"/>
<circle cx="23" cy="13.8" r="0.55" fill="#88BBDD" opacity="0.9"/>

<!-- Cockpit / flight deck windows -->
<path d="M25.5,13.5 Q26.5,13.2 27.5,14 L27,14.5 Q26,13.8 25.5,14Z" fill="#88BBDD" opacity="0.85"/>

<!-- Fuselage gloss highlight -->
<path d="M8,13.2 Q16,12.6 24,13.8" stroke="white" stroke-width="0.6" fill="none" opacity="0.45" stroke-linecap="round"/>

</svg>
