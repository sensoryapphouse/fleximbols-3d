 <defs>
 <linearGradient id="tunMountain" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7A8A6A"/><stop offset="100%" stop-color="#4A5A3A"/></linearGradient>
 <linearGradient id="tunRoad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#6A6A7A"/><stop offset="100%" stop-color="#3A3A4A"/></linearGradient>
 <radialGradient id="tunInside" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2A2A3A"/><stop offset="100%" stop-color="#0A0A14"/></radialGradient>
 <linearGradient id="tunFrame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9A9AB0"/><stop offset="100%" stop-color="#5A5A7A"/></linearGradient>
 </defs>
 <!-- Mountain/hillside -->
 <polygon points="0,32 0,12 6,4 16,2 26,4 32,12 32,32" fill="url(#tunMountain)" filter="url(#sdTun)"/>
 <!-- Road approaching -->
 <rect x="5" y="24" width="22" height="8" fill="url(#tunRoad)"/>
 <!-- Road centre line -->
 <line x1="16" y1="24" x2="16" y2="32" stroke="white" stroke-width="0.5" stroke-dasharray="2,1.5"/>
 <!-- Tunnel mouth (dark inside) -->
 <path d="M6,28 L6,14 Q6,6 16,6 Q26,6 26,14 L26,28 Z" fill="url(#tunInside)"/>
 <!-- Arch frame -->
 <path d="M6,28 L6,14 Q6,6 16,6 Q26,6 26,14 L26,28" stroke="url(#tunFrame)" stroke-width="1.8" fill="none" filter="url(#sdTun)"/>
 <!-- Light gleam inside tunnel -->
 <ellipse cx="16" cy="20" rx="4" ry="3" fill="#FFD070" fill-opacity="0.15"/>
 <!-- Road inside tunnel -->
 <rect x="8" y="24" width="16" height="4" fill="#3A3A5A"/>
 <line x1="16" y1="24" x2="16" y2="28" stroke="white" stroke-opacity="0.4" stroke-width="0.4"/>
</svg>
