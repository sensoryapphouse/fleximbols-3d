 <rect x="5" y="12.5" width="4.5" height="3.5" rx="0.6" fill="url(#limoGlass)"/>
 <rect x="10.5" y="12.5" width="3.5" height="3.5" rx="0.5" fill="url(#limoGlass)"/>
 <rect x="15" y="12.5" width="3.5" height="3.5" rx="0.5" fill="url(#limoGlass)"/>
 <rect x="19.5" y="12.5" width="3.5" height="3.5" rx="0.5" fill="url(#limoGlass)"/>
 <rect x="24" y="12.5" width="3" height="3.5" rx="0.5" fill="url(#limoGlass)"/>
 <!-- Head/tail lights -->
 <circle cx="2.5" cy="19" r="1" fill="#FFE090"/>
 <circle cx="29.5" cy="19" r="1" fill="#E84A4A"/>
 <!-- Wheels (four) -->
 <circle cx="7" cy="25" r="3.5" fill="url(#limoWheel)" filter="url(#sdLimo)"/>
