 <circle cx="7" cy="25" r="0.6" fill="#8A8A9A"/>
 <circle cx="14" cy="25" r="3.5" fill="url(#limoWheel)" filter="url(#sdLimo)"/>
 <circle cx="14" cy="25" r="1.5" fill="#3A3A4A"/>
 <circle cx="14" cy="25" r="0.6" fill="#8A8A9A"/>
 <circle cx="21" cy="25" r="3.5" fill="url(#limoWheel)" filter="url(#sdLimo)"/>
 <circle cx="21" cy="25" r="1.5" fill="#3A3A4A"/>
 <circle cx="21" cy="25" r="0.6" fill="#8A8A9A"/>
 <circle cx="28" cy="25" r="3.5" fill="url(#limoWheel)" filter="url(#sdLimo)"/>
 <circle cx="28" cy="25" r="1.5" fill="#3A3A4A"/>
 <circle cx="28" cy="25" r="0.6" fill="#8A8A9A"/>
 <!-- Body highlight strip -->
 <rect x="2" y="16.5" width="28" height="1.5" rx="0.5" fill="white" fill-opacity="0.12"/>
