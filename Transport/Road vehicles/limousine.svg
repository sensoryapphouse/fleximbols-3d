 <defs>
 <linearGradient id="limoBody" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3A3A4A"/><stop offset="50%" stop-color="#6A6A7A"/><stop offset="100%" stop-color="#1A1A2A"/></linearGradient>
 <linearGradient id="limoGlass" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1A3A5A" stop-opacity="0.8"/><stop offset="100%" stop-color="#0A1A2A" stop-opacity="0.9"/></linearGradient>
 <radialGradient id="limoWheel" cx="40%" cy="40%" r="55%"><stop offset="0%" stop-color="#5A5A6A"/><stop offset="100%" stop-color="#0A0A1A"/></radialGradient>
 </defs>
 <!-- Very long body -->
 <rect x="1" y="16" width="30" height="8" rx="1.5" fill="url(#limoBody)" filter="url(#sdLimo)"/>
 <!-- Cabin top (stretched) -->
 <rect x="4" y="12" width="24" height="5" rx="2" fill="url(#limoBody)"/>
