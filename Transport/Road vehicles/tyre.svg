<defs>
<radialGradient id="rubber" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#5A6878"/><stop offset="100%" stop-color="#0A0E18"/></radialGradient>
<radialGradient id="hub" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#E8E8E8"/><stop offset="100%" stop-color="#5A6878"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- outer tyre -->
<circle cx="16" cy="16" r="13" fill="url(#rubber)"/>
<ellipse cx="11" cy="8" rx="4" ry="2" fill="url(#hi)"/>
<!-- tread pattern (radial blocks) -->
<g fill="#1A1F2C">
<rect x="15" y="3" width="2" height="2" rx="0.3"/>
<rect x="15" y="27" width="2" height="2" rx="0.3"/>
<rect x="3" y="15" width="2" height="2" rx="0.3"/>
<rect x="27" y="15" width="2" height="2" rx="0.3"/>
<rect x="7" y="6" width="2" height="2" rx="0.3" transform="rotate(-45 8 7)"/>
<rect x="23" y="6" width="2" height="2" rx="0.3" transform="rotate(45 24 7)"/>
<rect x="7" y="24" width="2" height="2" rx="0.3" transform="rotate(45 8 25)"/>
<rect x="23" y="24" width="2" height="2" rx="0.3" transform="rotate(-45 24 25)"/>
</g>
<!-- inner rim -->
<circle cx="16" cy="16" r="8" fill="url(#hub)"/>
<ellipse cx="13" cy="13" rx="2.5" ry="1.5" fill="url(#hi)"/>
<!-- centre hub bolts -->
<circle cx="16" cy="16" r="2" fill="#3A4250"/>
<circle cx="16" cy="11.5" r="0.6" fill="#3A4250"/>
<circle cx="20.5" cy="16" r="0.6" fill="#3A4250"/>
<circle cx="16" cy="20.5" r="0.6" fill="#3A4250"/>
<circle cx="11.5" cy="16" r="0.6" fill="#3A4250"/>
<!-- spokes -->
<line x1="16" y1="11.5" x2="16" y2="20.5" stroke="#3A4250" stroke-width="0.4"/>
<line x1="11.5" y1="16" x2="20.5" y2="16" stroke="#3A4250" stroke-width="0.4"/>
<!-- sidewall -->
<circle cx="16" cy="16" r="11" fill="none" stroke="#1A1F2C" stroke-width="0.5"/>
</svg>