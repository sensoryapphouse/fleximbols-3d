 <defs>
 <linearGradient id="bd_body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc94a"/><stop offset="100%" stop-color="#e89018"/></linearGradient>
 <linearGradient id="bd_cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd966"/><stop offset="100%" stop-color="#eaa524"/></linearGradient>
 <linearGradient id="bd_blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffb84a"/><stop offset="100%" stop-color="#e07a14"/></linearGradient>
 <linearGradient id="bd_glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cfeefb"/><stop offset="100%" stop-color="#8fd0ef"/></linearGradient>
 <radialGradient id="bd_tyre" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#555"/><stop offset="100%" stop-color="#1c1c1c"/></radialGradient>
 <radialGradient id="bd_hub" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#ffe07a"/><stop offset="100%" stop-color="#d68f1a"/></radialGradient>
 </defs>
 <!-- ground -->
 <line x1="2" y1="27.2" x2="30" y2="27.2" stroke="#bdbdbd" stroke-width="0.6"/>
 <!-- body -->
 <path d="M9 16 L22 16 L22 22 L8.5 22 L8.5 18 Z" fill="url(#bd_body)" stroke="#b8700e" stroke-width="0.5"/>
 <!-- cabin -->
 <path d="M13 9.5 L20.5 9.5 C21.3 9.5 22 10.2 22 11 L22 16 L12 16 L12 11 C12 10.2 12.4 9.5 13 9.5 Z" fill="url(#bd_cab)" stroke="#b8700e" stroke-width="0.5"/>
 <!-- window -->
 <rect x="13.4" y="11" width="7.4" height="4" rx="0.6" fill="url(#bd_glass)" stroke="#5a9fc0" stroke-width="0.4"/>
 <line x1="17.1" y1="11" x2="17.1" y2="15" stroke="#5a9fc0" stroke-width="0.4"/>
 <!-- exhaust stack -->
 <rect x="11.5" y="6" width="1.6" height="4" rx="0.5" fill="#3a3a3a"/>
 <ellipse cx="12.3" cy="6" rx="1.1" ry="0.5" fill="#222"/>
 <!-- dozer blade (front, left) -->
 <path d="M3.2 14 C2.4 14.3 2.2 15 2.6 16 L4.4 22.6 C4.6 23.3 5.4 23.6 6 23.2 L6 14.6 C6 13.9 5.2 13.4 4.6 13.7 Z" fill="url(#bd_blade)" stroke="#b8700e" stroke-width="0.5"/>
 <!-- blade highlight -->
 <path d="M4 14.6 L5 14.4 L5 22.4 L4.2 22.6 Z" fill="#ffe2a0" opacity="0.5"/>
 <!-- push arm linking blade to body -->
 <path d="M6 18 L9.2 19.6" stroke="#3a3a3a" stroke-width="1.1" stroke-linecap="round"/>
 <!-- tracks: tyres -->
 <g>
  <circle cx="10" cy="23" r="3" fill="url(#bd_tyre)"/>
  <circle cx="10" cy="23" r="1.3" fill="url(#bd_hub)"/>
  <circle cx="16" cy="23.4" r="3.2" fill="url(#bd_tyre)"/>
  <circle cx="16" cy="23.4" r="1.4" fill="url(#bd_hub)"/>
  <circle cx="21.5" cy="23" r="3" fill="url(#bd_tyre)"/>
  <circle cx="21.5" cy="23" r="1.3" fill="url(#bd_hub)"/>
 </g>
 <!-- body highlight -->
 <rect x="9.5" y="16.6" width="11" height="1.1" rx="0.5" fill="#fff" opacity="0.3"/>
</svg>
