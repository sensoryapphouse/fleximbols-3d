 <line x1="16" y1="1" x2="16" y2="26" stroke="white" stroke-opacity="0.2" stroke-width="0.5"/>
 <line x1="11" y1="2" x2="9" y2="26" stroke="white" stroke-opacity="0.2" stroke-width="0.5"/>
 <line x1="21" y1="2" x2="23" y2="26" stroke="white" stroke-opacity="0.2" stroke-width="0.5"/>
