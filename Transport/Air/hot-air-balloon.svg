 <defs>
 <radialGradient id="habEnv" cx="45%" cy="35%" r="60%"><stop offset="0%" stop-color="#FFE066"/><stop offset="50%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#4A2ACA"/></radialGradient>
 <linearGradient id="habStripe1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFE066" stop-opacity="0"/><stop offset="50%" stop-color="#FFE066" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFE066" stop-opacity="0"/></linearGradient>
 <linearGradient id="habBasket" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8A030"/><stop offset="100%" stop-color="#7A5800"/></linearGradient>
 <linearGradient id="habFlame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE066"/><stop offset="100%" stop-color="#FF4A00" stop-opacity="0.3"/></linearGradient>
