 <defs>
 <linearGradient id="gliderBody" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E8E8F8"/><stop offset="100%" stop-color="#8A8ABF"/></linearGradient>
 <linearGradient id="gliderWing" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8D8F8"/><stop offset="100%" stop-color="#4A6AB8"/></linearGradient>
 <linearGradient id="gliderTail" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9AAAD8"/><stop offset="100%" stop-color="#3A5A98"/></linearGradient>
 <linearGradient id="skySky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#D0ECFF"/></linearGradient>
 </defs>
 <!-- Sky -->
 <!-- Fuselage (very slim, long) -->
 <ellipse cx="16" cy="16" rx="14" ry="1.8" fill="url(#gliderBody)" filter="url(#sdGlider)"/>
 <!-- Long wings (very thin) -->
 <ellipse cx="16" cy="16" rx="15" ry="3.5" fill="url(#gliderWing)" fill-opacity="0.85" filter="url(#sdGlider)"/>
 <!-- Wing taper to tips -->
 <polygon points="1,16 8,14 8,18" fill="url(#gliderWing)"/>
 <polygon points="31,16 24,14 24,18" fill="url(#gliderWing)"/>
 <!-- Vertical tail fin -->
 <polygon points="28,16 30,10 30,16" fill="url(#gliderTail)" filter="url(#sdGlider)"/>
 <!-- Horizontal tail fin -->
 <ellipse cx="28.5" cy="16" rx="3" ry="1" fill="url(#gliderTail)"/>
 <!-- Cockpit canopy -->
 <ellipse cx="12" cy="15" rx="3" ry="1.5" fill="#4A6A9A" fill-opacity="0.7"/>
 <!-- Wing highlight -->
 <ellipse cx="16" cy="15" rx="14" ry="1" fill="white" fill-opacity="0.12"/>
</svg>
