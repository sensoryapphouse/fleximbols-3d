 <stop offset="100%" stop-color="#607d8b" stop-opacity="0.3"/>
 </radialGradient>
 <linearGradient id="qc-camera" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#78909c"/>
 <stop offset="100%" stop-color="#102027"/>
 </linearGradient>
 <linearGradient id="qc-body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ef5350"/>
 <stop offset="100%" stop-color="#b71c1c"/>
 </linearGradient>
 </defs>
 <!-- X-frame arms -->
 <line x1="7" y1="7" x2="25" y2="25" stroke="url(#qc-frame)" stroke-width="2" stroke-linecap="round"/>
 <line x1="25" y1="7" x2="7" y2="25" stroke="url(#qc-frame)" stroke-width="2" stroke-linecap="round"/>
 <!-- Center body -->
 
