 <defs>
 <linearGradient id="qc-frame" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#90a4ae"/>
 <stop offset="100%" stop-color="#263238"/>
 </linearGradient>
 <radialGradient id="qc-motor" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#b0bec5"/>
 <stop offset="100%" stop-color="#37474f"/>
 </radialGradient>
 <radialGradient id="qc-rotor" cx="50%" cy="50%" r="50%">
