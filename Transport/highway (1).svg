 <defs>
 <linearGradient id="hwRoad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#5A5A6A"/><stop offset="100%" stop-color="#3A3A4A"/></linearGradient>
 <linearGradient id="hwShield" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E84A4A"/><stop offset="100%" stop-color="#6B1A1A"/></linearGradient>
 <linearGradient id="hwSky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#C8E8FF"/></linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="22" fill="url(#hwSky)" fill-opacity="0.8"/>
 <!-- Road vanishing to horizon -->
 <polygon points="10,32 22,32 18,18 14,18" fill="url(#hwRoad)"/>
 <!-- Shoulders -->
 <polygon points="0,32 10,32 14,18 8,18" fill="#8A8A6A"/>
 <polygon points="22,32 32,32 24,18 18,18" fill="#8A8A6A"/>
 <!-- Lane markings -->
 <line x1="16" y1="32" x2="16" y2="26" stroke="white" stroke-width="0.7"/>
 <line x1="16" y1="23" x2="16" y2="19" stroke="white" stroke-width="0.5"/>
 <!-- Road shield sign (foreground) -->
 <g filter="url(#sdHW)">
 <path d="M5,8 L11,8 L11,12 Q11,14 8,15 Q5,14 5,12 Z" fill="url(#hwShield)"/>
 <path d="M6,9 L10,9 L10,12 Q10,13.5 8,14.2 Q6,13.5 6,12 Z" fill="white" fill-opacity="0.9"/>
 <!-- Number on shield -->
 <line x1="7.5" y1="10" x2="8.5" y2="10" stroke="#E84A4A" stroke-width="0.6"/>
 <line x1="8" y1="10" x2="8" y2="12.5" stroke="#E84A4A" stroke-width="0.6"/>
 <line x1="7.5" y1="12.5" x2="8.5" y2="12.5" stroke="#E84A4A" stroke-width="0.6"/>
 <!-- Post -->
 <rect x="7.8" y="15" width="0.4" height="4" rx="0.2" fill="#5A5A6A"/>
 </g>
</svg>
