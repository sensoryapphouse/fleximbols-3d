<defs>
 <linearGradient id="np_body" x1="6" y1="6" x2="26" y2="28" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#8AA0F2"/>
  <stop offset="0.55" stop-color="#5E78E0"/>
  <stop offset="1" stop-color="#3F56C2"/>
 </linearGradient>
 <radialGradient id="np_shine" cx="0.35" cy="0.3" r="0.7">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="np_clasp" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#F6D45A"/>
  <stop offset="1" stop-color="#E0A92E"/>
 </linearGradient>
</defs>

<!-- U-shaped neck pillow: thick ring open at the bottom -->
<path d="M16 4
         C9 4 4.5 8.5 4.5 15
         C4.5 19 5.5 22.5 7.5 25.5
         C8.4 26.8 11 26.8 11.6 25
         C12.2 23.2 10.6 22 9.9 20.6
         C9.1 19 8.7 17.2 8.7 15.4
         C8.7 11 11.6 8.2 16 8.2
         C20.4 8.2 23.3 11 23.3 15.4
         C23.3 17.2 22.9 19 22.1 20.6
         C21.4 22 19.8 23.2 20.4 25
         C21 26.8 23.6 26.8 24.5 25.5
         C26.5 22.5 27.5 19 27.5 15
         C27.5 8.5 23 4 16 4 Z"
      fill="url(#np_body)"/>

<!-- soft puffy highlight on top of the ring -->
<path d="M16 5.4 C10.4 5.4 6.6 9 6.2 14.2 C7.4 11 10.6 9 16 9 C21.4 9 24.6 11 25.8 14.2 C25.4 9 21.6 5.4 16 5.4 Z"
      fill="url(#np_shine)"/>

<!-- seam lines following the ring -->
<path d="M16 6.4 C10 6.4 6 10.4 6 15.4 C6 18.6 7 21.6 8.8 24.2"
      stroke="#34489E" stroke-width="0.5" fill="none" stroke-linecap="round" opacity="0.5"/>
<path d="M16 6.4 C22 6.4 26 10.4 26 15.4 C26 18.6 25 21.6 23.2 24.2"
      stroke="#34489E" stroke-width="0.5" fill="none" stroke-linecap="round" opacity="0.5"/>

<!-- little clasp at the open bottom -->
<rect x="13.6" y="24.6" width="4.8" height="3" rx="1" fill="url(#np_clasp)"/>
<rect x="14.4" y="25.3" width="3.2" height="0.7" rx="0.35" fill="#fff6cf" opacity="0.8"/>
</svg>
