 <defs>
 <linearGradient id="rainBody" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#F0D030"/>
 <stop offset="100%" stop-color="#B89010"/>
 </linearGradient>
 <linearGradient id="rainGlossy" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFE84A" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#E0B800" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="rainHood" x1="0" y1="0" x2="1" y2="1">
