<defs>
<radialGradient id="itV1" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF3B0"/><stop offset="1" stop-color="#F2B705"/></radialGradient>
<radialGradient id="itV2" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#BBDEFB"/><stop offset="1" stop-color="#1E88E5"/></radialGradient>
<radialGradient id="itV3" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#C8E6C9"/><stop offset="1" stop-color="#43A047"/></radialGradient>
</defs>
<!-- circular loop arrow showing repeated cycle -->
<path d="M50 20 A30 30 0 1 1 20 50" fill="none" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
<polyline points="12,43 20,51 28,43" fill="none" stroke="#37474F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<!-- central star (refinement each pass) -->
<polygon points="50,40 53,48 61,48 54.5,53 57,61 50,56 43,61 45.5,53 39,48 47,48" fill="#FFD54F" stroke="#F2B705" stroke-width="1.6" stroke-linejoin="round"/>
<!-- version nodes around the loop: v1 -> v2 -> v3 -->
<circle cx="50" cy="20" r="10" fill="url(#itV1)" stroke="#B8860B" stroke-width="2"/>
<text x="50" y="24" font-size="9" font-family="Verdana, sans-serif" font-weight="bold" text-anchor="middle" fill="#5a3a00">v1</text>
<circle cx="80" cy="50" r="10" fill="url(#itV2)" stroke="#0D47A1" stroke-width="2"/>
<text x="80" y="54" font-size="9" font-family="Verdana, sans-serif" font-weight="bold" text-anchor="middle" fill="#0D2E66">v2</text>
<circle cx="50" cy="80" r="10" fill="url(#itV3)" stroke="#1B5E20" stroke-width="2"/>
<text x="50" y="84" font-size="9" font-family="Verdana, sans-serif" font-weight="bold" text-anchor="middle" fill="#0f3d12">v3</text>
</svg>
