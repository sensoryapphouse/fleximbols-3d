 <defs>
 <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#6090e0"/>
 <stop offset="50%" stop-color="#3060c0"/>
 <stop offset="100%" stop-color="#1838a0"/>
 </linearGradient>
 <linearGradient id="dropGrad" cx="50%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#90c0f8"/>
 <stop offset="100%" stop-color="#2860d0"/>
 </linearGradient>
 <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#80a8f0"/>
 <stop offset="100%" stop-color="#2858c8"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Top bar -->
 <rect x="5" y="6" width="22" height="3" rx="1.5" fill="url(#barGrad)"/>
 <!-- Funnel body — inverted triangle narrowing to bottom stem -->
 <path d="M5,9 L27,9 L19,20 L19,26 L13,26 L13,20 Z" fill="url(#funnelGrad)"/>
 <!-- Funnel highlight left face -->
 <path d="M5,9 L13,9 L13,20 L13,26 Q11,24 10,20 Z" fill="#a8c8f8" fill-opacity="0.3"/>
 <!-- Funnel inner line -->
 <line x1="16" y1="9" x2="16" y2="26" stroke="#90b8f0" stroke-width="0.5" stroke-opacity="0.4"/>
 <!-- Drop coming out of bottom -->
 <ellipse cx="16" cy="28.5" rx="1.8" ry="2" fill="url(#dropGrad)"/>
 <!-- Drop highlight -->
 <circle cx="15.2" cy="27.5" r="0.5" fill="#c8e8ff" fill-opacity="0.8"/>
</svg>
