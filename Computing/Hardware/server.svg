 <rect x="9.5" y="26" width="13" height="2.5" rx="0.8" fill="url(#slotDarkGrad)"/>
 <!-- LED indicators on each slot -->
 <circle cx="21" cy="5.25" r="0.7" fill="#43A047"/>
 <circle cx="21" cy="9.75" r="0.7" fill="#43A047"/>
 <circle cx="21" cy="14.25" r="0.7" fill="#FFD45E"/>
 <circle cx="21" cy="18.75" r="0.7" fill="#FF5252"/>
 <circle cx="21" cy="23.25" r="0.7" fill="#43A047"/>
 <circle cx="21" cy="27.25" r="0.7" fill="#FF5252"/>
