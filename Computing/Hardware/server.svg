 <!-- Rack cabinet body -->
 <rect x="8" y="2" width="16" height="28" rx="1.5" fill="url(#cabinetGrad)" stroke="#374151" stroke-width="0.8"/>
 <!-- Server slots (6 units) -->
 <rect x="9.5" y="3.5" width="13" height="3.5" rx="0.8" fill="url(#slotGrad)"/>
 <rect x="9.5" y="8" width="13" height="3.5" rx="0.8" fill="url(#slotDarkGrad)"/>
 <rect x="9.5" y="12.5" width="13" height="3.5" rx="0.8" fill="url(#slotGrad)"/>
