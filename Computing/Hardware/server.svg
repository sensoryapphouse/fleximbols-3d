 <line x1="11" y1="5.25" x2="19" y2="5.25" stroke="#9CA3AF" stroke-width="0.4"/>
 <line x1="11" y1="9.75" x2="19" y2="9.75" stroke="#9CA3AF" stroke-width="0.4"/>
