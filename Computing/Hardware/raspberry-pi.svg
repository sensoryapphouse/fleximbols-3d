 <defs>
 <linearGradient id="rpi-board" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#66bb6a"/>
 <stop offset="100%" stop-color="#1b5e20"/>
 </linearGradient>
 <linearGradient id="rpi-chip" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#90a4ae"/>
 <stop offset="100%" stop-color="#263238"/>
 </linearGradient>
 <linearGradient id="rpi-usb" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#b0bec5"/>
 <stop offset="100%" stop-color="#546e7a"/>
 </linearGradient>
 <linearGradient id="rpi-hdmi" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#78909c"/>
 <stop offset="100%" stop-color="#263238"/>
 </linearGradient>
