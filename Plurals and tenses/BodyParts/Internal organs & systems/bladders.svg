 <defs>
 <linearGradient id="bld_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#E8E8E8"/>
 <stop offset="100%" stop-color="#B0B0C8"/>
 </linearGradient>
 <linearGradient id="bld_bladder" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFB3BA"/>
 <stop offset="100%" stop-color="#E57373"/>
 </linearGradient>
 <radialGradient id="bld_glow" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFCDD2" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#EF9A9A" stop-opacity="0.4"/>
 </radialGradient>
 <linearGradient id="bld_urethra" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#EF9A9A"/>
 <stop offset="100%" stop-color="#C62828"/>
 </linearGradient>
 <radialGradient id="bld_highlight" cx="30%" cy="25%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Body silhouette (translucent lower torso) -->
 <path d="M8 4 Q6 8 6 14 Q6 22 8 28 Q10 31 16 31 Q22 31 24 28 Q26 22 26 14 Q26 8 24 4 Q22 2 16 2 Q10 2 8 4 Z" fill="url(#bld_body)" fill-opacity="0.3" stroke="#B0B0C8" stroke-width="0.8" stroke-dasharray="2,1.5"/>
 <!-- Pelvic area hint -->
 <path d="M8 26 Q12 28 16 28 Q20 28 24 26" stroke="#B0B0C8" stroke-width="0.6" fill="none" stroke-opacity="0.5"/>
 <!-- Bladder organ (pear-shaped) -->
 <path d="M16 13 Q11 13 10 17 Q9 21 11 24 Q13 27 16 27 Q19 27 21 24 Q23 21 22 17 Q21 13 16 13 Z" fill="url(#bld_bladder)"/>
 <!-- Bladder glow/highlight -->
 <path d="M16 13 Q11 13 10 17 Q9 21 11 24 Q13 27 16 27 Q19 27 21 24 Q23 21 22 17 Q21 13 16 13 Z" fill="url(#bld_glow)"/>
 <!-- Bladder wall highlight -->
 <path d="M16 13 Q11 13 10 17 Q9 21 11 24 Q13 27 16 27 Q19 27 21 24 Q23 21 22 17 Q21 13 16 13 Z" fill="url(#bld_highlight)"/>
 <!-- Bladder outline -->
 <path d="M16 13 Q11 13 10 17 Q9 21 11 24 Q13 27 16 27 Q19 27 21 24 Q23 21 22 17 Q21 13 16 13 Z" fill="none" stroke="#E57373" stroke-width="1"/>
 <!-- Ureteral inlets (two small tubes from above) -->
 <!-- Left ureter -->
 <path d="M12 13 Q11 9 10 7" stroke="url(#bld_urethra)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Right ureter -->
 <path d="M20 13 Q21 9 22 7" stroke="url(#bld_urethra)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Urethra (tube going down) -->
 <path d="M16 27 Q16 29 16 31" stroke="url(#bld_urethra)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 <!-- Inner fluid representation -->
 <ellipse cx="16" cy="21" rx="4.5" ry="4" fill="#FFE0E0" fill-opacity="0.4"/>
 <!-- Sheen spots -->
 <circle cx="13" cy="16" r="1.2" fill="white" fill-opacity="0.4"/>
 <circle cx="15" cy="14.5" r="0.7" fill="white" fill-opacity="0.5"/>
 <!-- Highlight on body outline -->
 <path d="M10 6 Q8 10 8 16" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.3" stroke-linecap="round"/>
