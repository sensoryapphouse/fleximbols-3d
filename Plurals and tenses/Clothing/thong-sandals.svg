<g filter="url(#bb_drop)">
 <!-- Top-down view of a pair of flip-flops -->
 <!-- Left sandal -->
 <ellipse cx="9" cy="18" rx="6.5" ry="12" fill="#2980B9"/>
 <!-- Sole edge -->
 <ellipse cx="9" cy="18" rx="6.5" ry="12" fill="none" stroke="#1A5A8A" stroke-width="1"/>
 <!-- Y-shaped thong strap -->
 <!-- From toe post (top) splitting to two sides -->
 <path d="M9 7 L9 14" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <path d="M9 14 L4.5 19" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <path d="M9 14 L13.5 19" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Toe post holes -->
 <circle cx="9" cy="7" r="1" fill="#1A5A8A"/>
 <circle cx="4.5" cy="19" r="0.8" fill="#1A5A8A"/>
 <circle cx="13.5" cy="19" r="0.8" fill="#1A5A8A"/>
 <!-- Right sandal (flipped) -->
 <ellipse cx="23" cy="18" rx="6.5" ry="12" fill="#2980B9"/>
 <ellipse cx="23" cy="18" rx="6.5" ry="12" fill="none" stroke="#1A5A8A" stroke-width="1"/>
 <path d="M23 7 L23 14" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <path d="M23 14 L18.5 19" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <path d="M23 14 L27.5 19" stroke="#1A5A8A" stroke-width="1.5" stroke-linecap="round"/>
 <circle cx="23" cy="7" r="1" fill="#1A5A8A"/>
 <circle cx="18.5" cy="19" r="0.8" fill="#1A5A8A"/>
 <circle cx="27.5" cy="19" r="0.8" fill="#1A5A8A"/>
</g>
