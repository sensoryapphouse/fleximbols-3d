 <defs>
 <linearGradient id="droneBody" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A4A5A"/><stop offset="100%" stop-color="#1A1A2A"/></linearGradient>
 <linearGradient id="droneArm" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6A6A7A"/><stop offset="100%" stop-color="#3A3A4A"/></linearGradient>
 <radialGradient id="droneProp" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#8A8A9A"/><stop offset="100%" stop-color="#3A3A4A"/></radialGradient>
 <radialGradient id="droneCam" cx="40%" cy="40%" r="55%"><stop offset="0%" stop-color="#2A3A5A"/><stop offset="100%" stop-color="#0A0A1A"/></radialGradient>
 </defs>
 <!-- Arms (X frame) -->
 <g filter="url(#sdDrone)">
 <line x1="4" y1="4" x2="28" y2="28" stroke="url(#droneArm)" stroke-width="2.5" stroke-linecap="round"/>
 <line x1="28" y1="4" x2="4" y2="28" stroke="url(#droneArm)" stroke-width="2.5" stroke-linecap="round"/>
 </g>
 <!-- Central body -->
 <rect x="12" y="12" width="8" height="8" rx="2" fill="url(#droneBody)" filter="url(#sdDrone)"/>
 <!-- Camera dome below centre -->
 <ellipse cx="16" cy="22" rx="2.5" ry="1.5" fill="url(#droneCam)" filter="url(#sdDrone)"/>
 <circle cx="16" cy="22" r="1" fill="#1A2A4A"/>
 <circle cx="15.5" cy="21.6" r="0.3" fill="white" fill-opacity="0.5"/>
 <!-- Motor hubs at arm ends -->
 <circle cx="4" cy="4" r="2.5" fill="url(#droneBody)" filter="url(#sdDrone)"/>
 <circle cx="28" cy="4" r="2.5" fill="url(#droneBody)" filter="url(#sdDrone)"/>
 <circle cx="4" cy="28" r="2.5" fill="url(#droneBody)" filter="url(#sdDrone)"/>
 <circle cx="28" cy="28" r="2.5" fill="url(#droneBody)" filter="url(#sdDrone)"/>
 <!-- Propeller blades (top-left motor) -->
 <ellipse cx="4" cy="4" rx="3.5" ry="0.7" fill="url(#droneProp)" fill-opacity="0.55" transform="rotate(45 4 4)"/>
 <!-- Propeller blades (top-right motor) -->
 <ellipse cx="28" cy="4" rx="3.5" ry="0.7" fill="url(#droneProp)" fill-opacity="0.55" transform="rotate(-45 28 4)"/>
 <!-- Propeller blades (bottom-left motor) -->
 <ellipse cx="4" cy="28" rx="3.5" ry="0.7" fill="url(#droneProp)" fill-opacity="0.55" transform="rotate(-45 4 28)"/>
 <!-- Propeller blades (bottom-right motor) -->
 <ellipse cx="28" cy="28" rx="3.5" ry="0.7" fill="url(#droneProp)" fill-opacity="0.55" transform="rotate(45 28 28)"/>
 <!-- LED lights -->
 <circle cx="4" cy="4" r="0.6" fill="#FF4A4A"/>
 <circle cx="28" cy="4" r="0.6" fill="#4AFF4A"/>
 <circle cx="4" cy="28" r="0.6" fill="#4AFF4A"/>
 <circle cx="28" cy="28" r="0.6" fill="#FF4A4A"/>
</g><g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl3068" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl3068)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
