<defs>
<linearGradient id="dispBody" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#A8E0D4"/>
<stop offset="45%" stop-color="#5AA89A"/>
<stop offset="100%" stop-color="#1E4840"/>
</linearGradient>
<linearGradient id="dispPump" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8A929C"/>
<stop offset="100%" stop-color="#363E48"/>
</linearGradient>
<filter id="dispSh" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/><feOffset dx="0.3" dy="0.6" result="off"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<!-- bottle body -->
<rect x="9" y="11" width="14" height="18" rx="3" fill="url(#dispBody)" filter="url(#dispSh)"/>
<!-- shoulder/neck -->
<path d="M 13 11 Q 13 8.5 14 8 L 18 8 Q 19 8.5 19 11 Z" fill="url(#dispBody)"/>
<!-- pump collar -->
<rect x="13.5" y="6" width="5" height="2.6" rx="1.3" fill="url(#dispPump)"/>
