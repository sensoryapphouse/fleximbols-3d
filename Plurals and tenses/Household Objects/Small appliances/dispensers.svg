<path d="M 15 3.5 L 22 3.5 Q 23 3.5 23 4.5 L 23 5 L 15 5 Z" fill="url(#dispPump)"/>
<rect x="22" y="5" width="1.2" height="2.4" rx="0.5" fill="#2A323A"/>
<!-- label -->
<rect x="11" y="17" width="10" height="8" rx="1" fill="#FFFFFF" fill-opacity="0.35"/>
<!-- highlight -->
<path d="M 11.5 13 Q 10.5 20 11.5 26" stroke="#D8F4EC" stroke-width="1.1" fill="none" stroke-opacity="0.7" stroke-linecap="round"/>
