 <defs>
 <linearGradient id="mbBox" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#f0c46a"/>
 <stop offset="55%" stop-color="#e0a338"/>
 <stop offset="100%" stop-color="#b87a18"/>
 </linearGradient>
 <linearGradient id="mbTray" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d99a2e"/>
 <stop offset="100%" stop-color="#9c6810"/>
 </linearGradient>
 <linearGradient id="mbStrike" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7a4a2a"/>
 <stop offset="100%" stop-color="#4a2a16"/>
 </linearGradient>
 <linearGradient id="mbWood" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#f3d9a6"/>
 <stop offset="100%" stop-color="#c89a52"/>
 </linearGradient>
 <radialGradient id="mbHead" cx="40%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#ff7a5a"/>
 <stop offset="100%" stop-color="#c0181a"/>
 </radialGradient>
 </defs>
 <!-- slightly open matchbox: outer sleeve + inner tray -->
 <!-- inner tray sticking out left -->
 <path d="M3 18 L11 18 L11 25 L3 25 Z" fill="url(#mbTray)" stroke="#7c5210" stroke-width="0.4"/>
 <!-- matches inside the tray -->
 <g>
 <rect x="3.6" y="19" width="6.5" height="1.2" rx="0.6" fill="url(#mbWood)"/>
 <circle cx="3.9" cy="19.6" r="0.9" fill="url(#mbHead)"/>
 <rect x="3.6" y="21" width="6.5" height="1.2" rx="0.6" fill="url(#mbWood)"/>
 <circle cx="3.9" cy="21.6" r="0.9" fill="url(#mbHead)"/>
 <rect x="3.6" y="23" width="6.5" height="1.2" rx="0.6" fill="url(#mbWood)"/>
 <circle cx="3.9" cy="23.6" r="0.9" fill="url(#mbHead)"/>
 </g>
 <!-- outer sleeve (the box) on the right -->
 <path d="M10 16.5 L29 16.5 L29 26.5 L10 26.5 Z" fill="url(#mbBox)" stroke="#9c6810" stroke-width="0.5"/>
 <!-- label panel -->
 <rect x="12" y="18" width="15" height="7" rx="0.8" fill="#f7e6b8" stroke="#c79a3e" stroke-width="0.4"/>
 <!-- a little flame icon on the label -->
 <path d="M19.5 23.5 Q17.8 22 19.2 20 Q19.4 21 20 21.2 Q21 20 20.2 18.6 Q22.4 19.8 21.8 22 Q21.5 23.2 19.5 23.5 Z" fill="#e0561f"/>
 <!-- striker strip down the right edge -->
 <rect x="27.4" y="16.5" width="1.6" height="10" fill="url(#mbStrike)"/>
 <g stroke="#3a2010" stroke-width="0.25">
 <path d="M27.6 17.5 L28.8 17.5"/><path d="M27.6 19 L28.8 19"/><path d="M27.6 20.5 L28.8 20.5"/>
 <path d="M27.6 22 L28.8 22"/><path d="M27.6 23.5 L28.8 23.5"/><path d="M27.6 25 L28.8 25"/>
 </g>
 <!-- box gloss -->
 <rect x="11" y="17" width="16" height="1.2" fill="#ffffff" fill-opacity="0.3"/>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl1958" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl1958)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
