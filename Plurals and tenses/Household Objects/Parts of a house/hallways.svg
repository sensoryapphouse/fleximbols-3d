<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,7.498) scale(0.7657)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#E8DECE"/>
 <stop offset="100%" stop-color="#C8B89E"/>
 </linearGradient>
 <linearGradient id="floorGrad" x1="0" y1="1" x2="0" y2="0">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="ceilingGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F5F0E8"/>
 <stop offset="100%" stop-color="#E0D8C8"/>
 </linearGradient>
 <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="rugGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#8060C0"/>
 <stop offset="100%" stop-color="#503890"/>
 </linearGradient>
 <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFDE0"/>
 <stop offset="100%" stop-color="#F0D060"/>
 </linearGradient>
 </defs>
 <!-- RECEDING PERSPECTIVE CORRIDOR -->
 <!-- Left wall -->
 <polygon points="2,2 14,8 14,24 2,30" fill="url(#wallGrad)"/>
 <!-- Right wall -->
 <polygon points="30,2 18,8 18,24 30,30" fill="url(#wallGrad)"/>
 <!-- Ceiling -->
 <polygon points="2,2 14,8 18,8 30,2" fill="url(#ceilingGrad)"/>
 <!-- Floor -->
 <polygon points="2,30 14,24 18,24 30,30" fill="url(#floorGrad)"/>
 <!-- Back wall (end of corridor) -->
 <rect x="14" y="8" width="4" height="16" fill="#D8CCBC"/>
 <!-- Runner rug on floor -->
 <polygon points="12,24 20,24 22,30 10,30" fill="url(#rugGrad)" opacity="0.8"/>
 <!-- Rug pattern -->
 <line x1="11" y1="27" x2="21" y2="27" stroke="#6848A8" stroke-width="0.4" opacity="0.6"/>
 <line x1="10.5" y1="29" x2="21.5" y2="29" stroke="#6848A8" stroke-width="0.4" opacity="0.6"/>
 <!-- LEFT WALL DOORS -->
 <!-- Door 1 (nearer, bigger) -->
 
 <rect x="2" y="10" width="4" height="12" fill="none" stroke="#7A4A20" stroke-width="0.4"/>
 <circle cx="5.5" cy="16" r="0.4" fill="#C9CDD3"/>
 <!-- Door frame moulding -->
 <line x1="2" y1="10" x2="6" y2="10" stroke="#A07040" stroke-width="0.5"/>
 <!-- Door 2 (mid distance) -->
 <polygon points="7,14 12,11 12,21 7,22" fill="url(#doorGrad)"/>
 <circle cx="11.2" cy="16" r="0.3" fill="#C9CDD3"/>
 <!-- RIGHT WALL DOORS -->
 <!-- Door 1 (nearer, bigger) -->
 
 <rect x="26" y="10" width="4" height="12" fill="none" stroke="#7A4A20" stroke-width="0.4"/>
 <circle cx="26.5" cy="16" r="0.4" fill="#C9CDD3"/>
 <!-- Door 2 (mid distance) -->
 <polygon points="25,14 20,11 20,21 25,22" fill="url(#doorGrad)"/>
 <circle cx="20.8" cy="16" r="0.3" fill="#C9CDD3"/>
 <!-- Ceiling lights -->
 <!-- Light 1 (near) -->
 
 <line x1="16" y1="8.2" x2="16" y2="9" stroke="#C0A820" stroke-width="0.4"/>
 <!-- Glow -->
 <ellipse cx="16" cy="10" rx="4" ry="2" fill="#FFFDE0" opacity="0.2"/>
 <!-- Light 2 (distant) -->
 <ellipse cx="16" cy="12" rx="1.2" ry="0.3" fill="url(#lightGrad)" opacity="0.7"/>
 <!-- Framed picture left wall -->
 <polygon points="2.5,14 5.5,12.5 5.5,15.5 2.5,16.5" fill="#D4AA80"/>
 <polygon points="3,14.2 5,13.2 5,15.2 3,15.8" fill="#A8C8E0"/>
