 <defs>
 <linearGradient id="aerHandle" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#a07840"/>
 <stop offset="100%" stop-color="#6a4818"/>
 </linearGradient>
 <linearGradient id="aerDrum" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#9ab8c8"/>
 <stop offset="100%" stop-color="#4a6888"/>
 </linearGradient>
 <linearGradient id="aerSpike" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d0d8e0"/>
 <stop offset="100%" stop-color="#708090"/>
 </linearGradient>
 <linearGradient id="aerGrass" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#7ec850"/>
 <stop offset="100%" stop-color="#3a8a18"/>
 </linearGradient>
 </defs>
 <!-- Handle — long angled rod -->
 <rect x="15" y="1" width="2" height="22" rx="1" fill="url(#aerHandle)" transform="rotate(-20,16,12)"/>
 <!-- Handle grip at top -->
 <rect x="17" y="1.5" width="5" height="2" rx="1" fill="url(#aerHandle)"/>
 <!-- Axle bracket -->
 <rect x="10" y="18" width="12" height="2" rx="0.8" fill="url(#aerDrum)"/>
 <!-- Drum cylinder body -->
 <ellipse cx="16" cy="23" rx="10" ry="4" fill="url(#aerDrum)" filter="url(#aerShad)"/>
 <rect x="6" y="20" width="20" height="6" fill="url(#aerDrum)"/>
 <!-- drum end faces -->
 <ellipse cx="6" cy="23" rx="1.5" ry="4" fill="#4a6888"/>
 <ellipse cx="26" cy="23" rx="1.5" ry="4" fill="#6090b0"/>
 <!-- Drum texture banding -->
 <rect x="6" y="21" width="20" height="0.6" fill="#7090b0" fill-opacity="0.5"/>
 <rect x="6" y="24.5" width="20" height="0.6" fill="#7090b0" fill-opacity="0.5"/>
 <!-- Spikes on drum -->
 <rect x="8" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <rect x="11" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <rect x="14" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <rect x="17" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <rect x="20" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <rect x="23" y="24" width="1" height="4" rx="0.4" fill="url(#aerSpike)"/>
 <!-- Grass strip at bottom -->
 <rect x="2" y="28" width="28" height="3.5" rx="1" fill="url(#aerGrass)"/>
 <!-- Drop shadow -->
