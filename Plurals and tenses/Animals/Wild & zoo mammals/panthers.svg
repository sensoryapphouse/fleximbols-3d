 <defs>
 <radialGradient id="pa_body" cx="38%" cy="32%" r="62%"><stop offset="0%" stop-color="#4a4a5a"/><stop offset="50%" stop-color="#1a1a28"/><stop offset="100%" stop-color="#050508"/></radialGradient>
 <radialGradient id="pa_shine" cx="30%" cy="25%" r="50%"><stop offset="0%" stop-color="#7a7a9a" stop-opacity="0.5"/><stop offset="100%" stop-color="#7a7a9a" stop-opacity="0"/></radialGradient>
 <radialGradient id="pa_eye" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#88ff44"/><stop offset="100%" stop-color="#448800"/></radialGradient>
 </defs>
 <!-- tail - sleek -->
 <path d="M28 22 Q31 19 32 16 Q32 12 30 10" fill="none" stroke="#1a1a28" stroke-width="2" stroke-linecap="round"/>
 <!-- body - lithe, muscular -->
 <ellipse cx="18" cy="22" rx="10.5" ry="6" fill="url(#pa_body)"/>
 <!-- sheen (black cats have a subtle sheen) -->
 <ellipse cx="14" cy="19" rx="5" ry="3" fill="url(#pa_shine)"/>
 <!-- legs -->
 <rect x="10" y="26" width="2.5" height="5" rx="1" fill="url(#pa_body)"/>
 <rect x="14" y="26" width="2.5" height="5" rx="1" fill="url(#pa_body)"/>
 <rect x="20" y="26" width="2.5" height="5" rx="1" fill="url(#pa_body)"/>
 <rect x="24" y="26" width="2.5" height="5" rx="1" fill="url(#pa_body)"/>
 <!-- neck -->
 <path d="M9 20 Q8 15 9 12" fill="none" stroke="#181820" stroke-width="5" stroke-linecap="round"/>
 <!-- head -->
 <ellipse cx="9" cy="11.5" rx="6.5" ry="6" fill="url(#pa_body)"/>
 <!-- shine on head -->
 <ellipse cx="7" cy="9" rx="2.5" ry="2" fill="url(#pa_shine)"/>
 <!-- eyes - GREEN (panther trait) -->
 <ellipse cx="7" cy="11" rx="1.5" ry="1.3" fill="url(#pa_eye)"/>
 <ellipse cx="11.5" cy="11" rx="1.5" ry="1.3" fill="url(#pa_eye)"/>
 <!-- pupils -->
 <ellipse cx="7" cy="11" rx="0.4" ry="1" fill="#1a1a1a"/>
 <ellipse cx="11.5" cy="11" rx="0.4" ry="1" fill="#1a1a1a"/>
 <!-- small eye shine -->
 <circle cx="6.5" cy="10.5" r="0.3" fill="#fff" fill-opacity="0.7"/>
 <!-- nose -->
 <ellipse cx="9" cy="14.5" rx="1.8" ry="1.2" fill="#2a2a3a"/>
 <!-- whiskers (white on black) -->
 <line x1="9" y1="15" x2="5" y2="14" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
 <line x1="9" y1="15.5" x2="5" y2="17" stroke="#ccc" stroke-width="0.5" opacity="0.5"/>
 <!-- ear -->
 <path d="M12 7 Q13 5 14 7 Q13 8 12 7Z" fill="#1a1a28"/>
 <path d="M7 6 Q8 4 9 6 Q8 7 7 6Z" fill="#1a1a28"/>
</g><g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl422" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl422)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>