 <defs>
 <radialGradient id="rh_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#b0b0a0"/><stop offset="60%" stop-color="#808070"/><stop offset="100%" stop-color="#505040"/></radialGradient>
 <radialGradient id="rh_horn" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#e8d8a0"/><stop offset="100%" stop-color="#988840"/></radialGradient>
 <radialGradient id="rh_belly" cx="50%" cy="55%" r="55%"><stop offset="0%" stop-color="#d0d0c0"/><stop offset="100%" stop-color="#a0a090"/></radialGradient>
 </defs>
 <!-- body - barrel shaped -->
 <ellipse cx="18" cy="23" rx="12" ry="7.5" fill="url(#rh_body)"/>
 <ellipse cx="18" cy="25" rx="9" ry="4" fill="url(#rh_belly)"/>
 <!-- thick legs -->
 <ellipse cx="9" cy="29" rx="4" ry="2.5" fill="url(#rh_body)"/>
 <ellipse cx="15" cy="30" rx="4" ry="2" fill="url(#rh_body)"/>
 <ellipse cx="21" cy="30" rx="4" ry="2" fill="url(#rh_body)"/>
 <ellipse cx="27" cy="29" rx="4" ry="2.5" fill="url(#rh_body)"/>
 <!-- tail -->
 <path d="M30 21 Q32 20 32 22" fill="none" stroke="#707060" stroke-width="2" stroke-linecap="round"/>
 <!-- head -->
 <ellipse cx="7" cy="20" rx="8" ry="7" fill="url(#rh_body)"/>
 <!-- HORN (prominent - rhino feature) -->
 <path d="M3 16 Q1 10 3 7 Q5 10 5 16Z" fill="url(#rh_horn)"/>
 <!-- smaller second horn -->
 <path d="M5 17 Q4 13 5 11 Q6.5 13 6.5 17Z" fill="url(#rh_horn)"/>
 <!-- skin folds (armour look) -->
 <path d="M8 22 Q10 20 12 22" fill="none" stroke="#606050" stroke-width="0.8" opacity="0.5"/>
 <path d="M2 18 Q4 16 6 18" fill="none" stroke="#606050" stroke-width="0.8" opacity="0.5"/>
 <!-- eye (small for large head) -->
 <circle cx="8.5" cy="16.5" r="1.2" fill="#1a1a1a"/>
 <circle cx="8.1" cy="16.1" r="0.4" fill="#fff" fill-opacity="0.7"/>
 <!-- mouth/lip -->
 <path d="M2 22 Q4 23.5 7 22" fill="none" stroke="#505040" stroke-width="1" stroke-linecap="round"/>
 <!-- ear -->
 <ellipse cx="14" cy="15" rx="2.5" ry="2.2" fill="url(#rh_body)"/>
