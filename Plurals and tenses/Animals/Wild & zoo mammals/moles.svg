  <defs>
    <radialGradient id="mo_body" cx="42%" cy="30%" r="75%">
      <stop offset="0" stop-color="#8b94a0"/>
      <stop offset="0.6" stop-color="#5e6772"/>
      <stop offset="1" stop-color="#3f4751"/>
    </radialGradient>
    <radialGradient id="mo_belly" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#b9c0c9"/>
      <stop offset="1" stop-color="#8b94a0"/>
    </radialGradient>
    <radialGradient id="mo_nose" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffc3cf"/>
      <stop offset="1" stop-color="#e98199"/>
    </radialGradient>
    <linearGradient id="mo_mound" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9764f"/>
      <stop offset="1" stop-color="#6e4528"/>
    </linearGradient>
    <radialGradient id="mo_claw" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd0db"/>
      <stop offset="1" stop-color="#e98199"/>
    </radialGradient>
  </defs>
  <!-- earth mound (back) -->
  <ellipse cx="16" cy="26.5" rx="13" ry="4.2" fill="url(#mo_mound)" stroke="#5a3a22" stroke-width="0.5"/>
  <!-- mole body emerging -->
  <ellipse cx="16" cy="17.5" rx="8.2" ry="8.6" fill="url(#mo_body)" stroke="#363d46" stroke-width="0.6"/>
  <!-- lighter belly/chest -->
  <ellipse cx="16" cy="20.0" rx="5.4" ry="5.2" fill="url(#mo_belly)" opacity="0.85"/>
  <!-- snout (pointed nose) pushing forward -->
  <ellipse cx="16" cy="15.2" rx="3.4" ry="2.7" fill="url(#mo_body)" stroke="#363d46" stroke-width="0.5"/>
  <ellipse cx="16" cy="14.0" rx="1.9" ry="1.5" fill="url(#mo_nose)" stroke="#cf6b85" stroke-width="0.4"/>
  <!-- nostrils -->
  <ellipse cx="15.3" cy="13.9" rx="0.3" ry="0.45" fill="#b3475f"/>
  <ellipse cx="16.7" cy="13.9" rx="0.3" ry="0.45" fill="#b3475f"/>
  <!-- closed eyes (small line — moles are near-blind) -->
  <path d="M12.6 16.4 Q13.6 17.0 14.6 16.4" stroke="#2a3038" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <path d="M17.4 16.4 Q18.4 17.0 19.4 16.4" stroke="#2a3038" stroke-width="0.5" fill="none" stroke-linecap="round"/>
  <!-- big digging claws (left paw) -->
  <g stroke="#cf6b85" stroke-width="0.35" stroke-linecap="round">
    <ellipse cx="9.6" cy="22.2" rx="2.6" ry="2.0" fill="url(#mo_claw)" stroke="#cf6b85" stroke-width="0.4"/>
    <path d="M7.6 21.4 L6.2 20.7 M7.4 22.4 L5.8 22.2 M7.7 23.3 L6.3 23.7"/>
  </g>
  <!-- big digging claws (right paw) -->
  <g stroke="#cf6b85" stroke-width="0.35" stroke-linecap="round">
    <ellipse cx="22.4" cy="22.2" rx="2.6" ry="2.0" fill="url(#mo_claw)" stroke="#cf6b85" stroke-width="0.4"/>
    <path d="M24.4 21.4 L25.8 20.7 M24.6 22.4 L26.2 22.2 M24.3 23.3 L25.7 23.7"/>
  </g>
  <!-- body highlight -->
  <ellipse cx="12.6" cy="12.8" rx="2.4" ry="1.6" fill="#ffffff" opacity="0.22"/>
  <!-- front of mound (over body base) -->
  <path d="M3.2 26.0 Q16 21.0 28.8 26.0 Q28.8 30.0 16 30.5 Q3.2 30.0 3.2 26.0 Z" fill="url(#mo_mound)" stroke="#5a3a22" stroke-width="0.5"/>
  <!-- earth clods -->
  <ellipse cx="7.5" cy="27.2" rx="1.1" ry="0.7" fill="#5a3a22" opacity="0.5"/>
  <ellipse cx="24.5" cy="27.4" rx="1.0" ry="0.6" fill="#5a3a22" opacity="0.5"/>
  <ellipse cx="16" cy="28.6" rx="1.3" ry="0.7" fill="#5a3a22" opacity="0.4"/>
