 <defs>
 <radialGradient id="el_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#c09050"/><stop offset="60%" stop-color="#8a5820"/><stop offset="100%" stop-color="#4a2800"/></radialGradient>
