<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,3.293) scale(0.8971)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- White puff seeds -->
 <radialGradient id="dan_seed" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#F0E4D0"/>
 </radialGradient>
 <!-- Seed head globe -->
 <radialGradient id="dan_globe" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
 <stop offset="60%" stop-color="#F5F0E8" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#E8E0D0" stop-opacity="0.2"/>
 </radialGradient>
 <!-- Yellow flower (bottom-left) -->
 <radialGradient id="dan_ypetal" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFF9C4"/>
 <stop offset="40%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <radialGradient id="dan_ycentre" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#BF6000"/>
 </radialGradient>
 <!-- Stem -->
 <linearGradient id="dan_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="dan_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#AED581"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 </defs>

 <!-- PUFF SEED-HEAD (main, upper right) — KEY GESTURE -->
 <!-- Stem for puff -->
 <path d="M20 31 Q20.5 26 20 19" stroke="url(#dan_stem)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

 <!-- Globe outline (translucent) -->
 <circle cx="20" cy="13" r="8" fill="url(#dan_globe)"/>

 <!-- Radiating seed filaments — spokes of the puff ball -->
 <!-- Each seed = thin line (filament) + small oval (pappus) at tip -->
 <!-- Top -->
 <line x1="20" y1="13" x2="20" y2="5.2" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="20" cy="4.8" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(0 20 4.8)"/>
 <!-- Top-right 30deg -->
 <line x1="20" y1="13" x2="24" y2="6.1" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="24.5" cy="5.7" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(30 24.5 5.7)"/>
 <!-- Right 60deg -->
 <line x1="20" y1="13" x2="26.9" y2="9" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="27.4" cy="8.7" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(60 27.4 8.7)"/>
 <!-- Right 90deg -->
 <line x1="20" y1="13" x2="27.8" y2="13" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="28.4" cy="13" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(90 28.4 13)"/>
 <!-- Lower-right 120deg -->
 <line x1="20" y1="13" x2="26.9" y2="17" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="27.4" cy="17.3" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(120 27.4 17.3)"/>
 <!-- Lower-right 150deg -->
 <line x1="20" y1="13" x2="24" y2="19.9" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="24.5" cy="20.3" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(150 24.5 20.3)"/>
 <!-- Bottom -->
 <line x1="20" y1="13" x2="20" y2="20.8" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="20" cy="21.2" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(180 20 21.2)"/>
 <!-- Left 210deg -->
 <line x1="20" y1="13" x2="16" y2="19.9" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="15.5" cy="20.3" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(-150 15.5 20.3)"/>
 <!-- Left 240deg -->
 <line x1="20" y1="13" x2="13.1" y2="17" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="12.6" cy="17.3" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(-120 12.6 17.3)"/>
 <!-- Left 270deg -->
 <line x1="20" y1="13" x2="12.2" y2="13" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="11.6" cy="13" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(-90 11.6 13)"/>
 <!-- Upper-left 300deg -->
 <line x1="20" y1="13" x2="13.1" y2="9" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="12.6" cy="8.7" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(-60 12.6 8.7)"/>
 <!-- Upper-left 330deg -->
 <line x1="20" y1="13" x2="16" y2="6.1" stroke="#D0C8B8" stroke-width="0.5"/>
 <ellipse cx="15.5" cy="5.7" rx="1.2" ry="0.5" fill="url(#dan_seed)" transform="rotate(-30 15.5 5.7)"/>

 <!-- Centre of seed head -->
 <circle cx="20" cy="13" r="1.5" fill="#D4C5A0"/>

 <!-- 3 FLOATING SEEDS drifting away (upper left) — KEY GESTURE -->
 <line x1="9" y1="6" x2="11" y2="8" stroke="#C0B898" stroke-width="0.5"/>
 <ellipse cx="8.5" cy="5.5" rx="1.1" ry="0.45" fill="url(#dan_seed)" transform="rotate(-45 8.5 5.5)"/>
 <line x1="5" y1="9" x2="7" y2="11" stroke="#C0B898" stroke-width="0.5"/>
 <ellipse cx="4.5" cy="8.5" rx="1.1" ry="0.45" fill="url(#dan_seed)" transform="rotate(-30 4.5 8.5)"/>
 <line x1="7" y1="4" x2="9" y2="6" stroke="#C0B898" stroke-width="0.5"/>
 <ellipse cx="6.5" cy="3.5" rx="1.1" ry="0.45" fill="url(#dan_seed)" transform="rotate(-60 6.5 3.5)"/>

 <!-- YELLOW FLOWER at lower left (secondary, smaller) -->
 <path d="M7 31 Q7.5 28 8 24" stroke="url(#dan_stem)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <!-- Leaf -->
 <path d="M7.5 29 Q4 27 3.5 23 Q6 26 7.5 29 Z" fill="url(#dan_leaf)"/>
 <!-- Yellow petals (narrower/notched, dandelion-style) -->
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(36 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(72 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(108 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(144 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(180 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(216 8 22)"/>
 <ellipse cx="8" cy="19" rx="1.5" ry="3.5" fill="url(#dan_ypetal)" transform="rotate(252 8 22)"/>
 <circle cx="8" cy="22" r="2.5" fill="url(#dan_ycentre)"/>
 <ellipse cx="7.2" cy="21.2" rx="0.8" ry="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
</g><g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl140" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl140)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
