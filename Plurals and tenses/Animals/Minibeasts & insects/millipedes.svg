 stroke="#4E342E" stroke-width="0.5" fill="none" stroke-linecap="round" stroke-dasharray="2,1.5"/>
 <!-- Middle coil -->
 <path d="M16 8 Q24 8 26 16 Q27 24 19 27 Q11 29 7 23 Q4 18 7 13 Q10 9 16 9"
 stroke="url(#mil_seg)" stroke-width="3" fill="none" stroke-linecap="round"/>
