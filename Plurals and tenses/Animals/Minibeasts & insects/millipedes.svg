 <ellipse cx="17.5" cy="5.5" rx="0.8" ry="0.8" fill="#1a2a4a"/>
 <circle cx="14.7" cy="5.2" r="0.28" fill="white"/>
 <circle cx="17.7" cy="5.2" r="0.28" fill="white"/>
 <!-- Dense tiny legs along the body (both sides of coil) -->
 <!-- Outer coil legs - top arc -->
 <line x1="20" y1="3.5" x2="20" y2="1" stroke="#5D4037" stroke-width="0.5"/>
 <line x1="24" y1="5" x2="26" y2="3" stroke="#5D4037" stroke-width="0.5"/>
