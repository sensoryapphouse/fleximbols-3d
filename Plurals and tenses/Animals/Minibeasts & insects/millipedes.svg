 <path d="M16 13 Q21 13 22 18 Q23 23 18 25 Q13 26 11 22 Q9 18 11 15 Q13 13 16 13"
 stroke="url(#mil_body)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
