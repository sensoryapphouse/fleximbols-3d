 <defs>
 <linearGradient id="mil_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#5D4037"/>
 <stop offset="100%" stop-color="#2E1503"/>
 </linearGradient>
 <linearGradient id="mil_seg" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#795548"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </linearGradient>
 <linearGradient id="mil_head" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Coiled spiral body - draw as concentric arc segments -->
 <!-- Outer coil -->
 <path d="M16 3 Q27 3 29 14 Q31 25 22 29 Q13 32 7 26 Q2 21 5 13 Q8 6 16 6"
 stroke="url(#mil_body)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
