 <circle cx="16" cy="5.5" r="3" fill="url(#mil_head)"/>
 <!-- Antennae -->
 <path d="M14.5 3 Q12 1 10 0" stroke="#795548" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <circle cx="10" cy="0" r="0.6" fill="#8D6E63"/>
