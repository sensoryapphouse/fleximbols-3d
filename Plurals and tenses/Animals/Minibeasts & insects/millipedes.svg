 <line x1="22" y1="28" x2="23" y2="31" stroke="#5D4037" stroke-width="0.5"/>
 <line x1="16" y1="30" x2="16" y2="32" stroke="#5D4037" stroke-width="0.5"/>
 <line x1="10" y1="29" x2="9" y2="32" stroke="#5D4037" stroke-width="0.5"/>
 <line x1="6" y1="25" x2="4" y2="27" stroke="#5D4037" stroke-width="0.5"/>
