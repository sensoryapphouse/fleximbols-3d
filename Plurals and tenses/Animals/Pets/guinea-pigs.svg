 <defs>
 <radialGradient id="gp_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#e8c870"/><stop offset="60%" stop-color="#c09840"/><stop offset="100%" stop-color="#806010"/></radialGradient>
 <radialGradient id="gp_patch" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#D09070" stop-opacity="0.376"/><stop offset="100%" stop-color="#a06040"/></radialGradient>
 <radialGradient id="gp_belly" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#f0e0c0"/><stop offset="100%" stop-color="#d4b880"/></radialGradient>
 <radialGradient id="gp_ear" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#ffbbaa"/><stop offset="100%" stop-color="#cc8877"/></radialGradient>
 </defs>
 <!-- body - rounder, no tail -->
 <ellipse cx="17" cy="22" rx="10" ry="7" fill="url(#gp_body)"/>
 <!-- color patch -->
 <ellipse cx="21" cy="20" rx="5" ry="4" fill="#a06040" fill-opacity="0.5"/>
 <!-- belly -->
 <ellipse cx="17" cy="23.5" rx="5" ry="3" fill="url(#gp_belly)"/>
 <!-- head (more blunt/round than gerbil) -->
 <ellipse cx="9" cy="19" rx="7" ry="6" fill="url(#gp_body)"/>
 <!-- ears - round and low -->
 <ellipse cx="8" cy="14" rx="3" ry="2.5" fill="url(#gp_body)"/>
 <ellipse cx="8" cy="14" rx="1.8" ry="1.5" fill="url(#gp_ear)"/>
 <ellipse cx="13" cy="14" rx="3" ry="2.5" fill="url(#gp_body)"/>
 <ellipse cx="13" cy="14" rx="1.8" ry="1.5" fill="url(#gp_ear)"/>
 <!-- eye -->
 <circle cx="7" cy="18" r="1.4" fill="#1a1a1a"/>
 <circle cx="6.5" cy="17.5" r="0.45" fill="#fff" fill-opacity="0.7"/>
 <!-- blunt nose -->
 <ellipse cx="4" cy="20" rx="1.2" ry="0.8" fill="#cc8877"/>
 <!-- whiskers -->
 <line x1="4" y1="19.5" x2="1" y2="18.5" stroke="#e8d8b0" stroke-width="0.5" opacity="0.8"/>
 <line x1="4" y1="20.5" x2="1" y2="21.5" stroke="#e8d8b0" stroke-width="0.5" opacity="0.8"/>
