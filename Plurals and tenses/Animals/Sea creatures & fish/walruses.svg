 <!-- Muzzle area (wide) -->
 <ellipse cx="16" cy="14.5" rx="6.5" ry="4" fill="url(#wal_belly)"/>
 <!-- Moustache/bristles -->
 <line x1="10" y1="15" x2="7" y2="14" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="10" y1="16" x2="7" y2="16" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="10" y1="17" x2="7" y2="18" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="22" y1="15" x2="25" y2="14" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="22" y1="16" x2="25" y2="16" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="22" y1="17" x2="25" y2="18" stroke="#8B7355" stroke-width="0.6"/>
 <line x1="11" y1="15.5" x2="8" y2="15" stroke="#A09080" stroke-width="0.4"/>
 <line x1="11" y1="16.5" x2="8" y2="17" stroke="#A09080" stroke-width="0.4"/>
 <line x1="21" y1="15.5" x2="24" y2="15" stroke="#A09080" stroke-width="0.4"/>
 <line x1="21" y1="16.5" x2="24" y2="17" stroke="#A09080" stroke-width="0.4"/>
