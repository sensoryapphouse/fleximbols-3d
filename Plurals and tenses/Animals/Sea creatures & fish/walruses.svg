 <defs>
 <linearGradient id="wal_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#A0826D"/>
 <stop offset="100%" stop-color="#5A3E2B"/>
 </linearGradient>
 <linearGradient id="wal_belly" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#C8A882"/>
 <stop offset="100%" stop-color="#8B6550"/>
 </linearGradient>
 <linearGradient id="wal_tusk" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFFFF0"/>
 <stop offset="100%" stop-color="#D4C090"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Body (large round) -->
 <ellipse cx="16" cy="22" rx="12" ry="10" fill="url(#wal_body)"/>
 <!-- Belly lighter -->
 <ellipse cx="16" cy="24" rx="8" ry="7" fill="url(#wal_belly)" fill-opacity="0.5"/>
 <!-- Flippers front left -->
 <path d="M4 22 Q1 21 1 26 Q3 29 6 28 Q7 25 5 22 Z" fill="url(#wal_body)"/>
 <!-- Flippers front right -->
 <path d="M28 22 Q31 21 31 26 Q29 29 26 28 Q25 25 27 22 Z" fill="url(#wal_body)"/>
