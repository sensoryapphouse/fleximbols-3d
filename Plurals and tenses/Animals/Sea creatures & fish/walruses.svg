 <ellipse cx="14" cy="13.5" rx="1" ry="0.7" fill="#3A2818"/>
 <ellipse cx="18" cy="13.5" rx="1" ry="0.7" fill="#3A2818"/>
 <!-- Eyes (small) -->
 <ellipse cx="12" cy="9.5" rx="1.3" ry="1.3" fill="#1a2a4a"/>
 <ellipse cx="20" cy="9.5" rx="1.3" ry="1.3" fill="#1a2a4a"/>
 <circle cx="12.4" cy="9.1" r="0.4" fill="white" fill-opacity="0.8"/>
 <circle cx="20.4" cy="9.1" r="0.4" fill="white" fill-opacity="0.8"/>
