 <path d="M13.5 17 Q12 21 13 26 Q13.5 28 14 27.5 Q13.5 23 14.5 18 Z" fill="url(#wal_tusk)"/>
 <path d="M18.5 17 Q20 21 19 26 Q18.5 28 18 27.5 Q18.5 23 17.5 18 Z" fill="url(#wal_tusk)"/>
