 <defs>
 <linearGradient id="eel_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4A7A4A"/>
 <stop offset="100%" stop-color="#1A3A1A"/>
 </linearGradient>
 <linearGradient id="eel_belly" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#8FBC8F"/>
 <stop offset="100%" stop-color="#4A7A4A"/>
 </linearGradient>
 <linearGradient id="eel_fin" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#2E5C2E"/>
 <stop offset="100%" stop-color="#0A2A0A"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Eel S-curved body -->
 <!-- Main body path -->
 <path d="M6 4 Q12 4 14 10 Q16 16 12 20 Q8 24 10 29 Q12 31 14 30" stroke="url(#eel_body)" stroke-width="5" fill="none" stroke-linecap="round"/>
 <!-- Belly lighter side -->
 <path d="M6 5 Q11 5 13 10.5 Q15 16 11.5 20 Q8.5 23.5 10.5 28.5" stroke="url(#eel_belly)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Dorsal fin -->
 <path d="M7 4 Q10 2 14 8 Q16 14 13 18 Q11 22 12 27" stroke="url(#eel_fin)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <!-- Head -->
 <ellipse cx="6" cy="4" rx="3.5" ry="2.5" fill="url(#eel_body)"/>
 <!-- Eye (slit) -->
 <ellipse cx="5" cy="3.5" rx="0.8" ry="0.8" fill="#1a2a4a"/>
 <circle cx="5.2" cy="3.2" r="0.3" fill="white" fill-opacity="0.8"/>
 <!-- Mouth (slight open) -->
 <path d="M3 4.5 Q4.5 5.5 6 4.5" stroke="#1A3A1A" stroke-width="0.6" fill="none"/>
 <!-- Tiny pectoral fin near head -->
 <ellipse cx="9" cy="7" rx="1.5" ry="0.8" fill="url(#eel_fin)" transform="rotate(30, 9, 7)"/>
 <!-- Scale texture marks -->
 <path d="M8 9 Q9 8.5 10 9" stroke="#2E5C2E" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <path d="M10 14 Q11 13.5 12 14" stroke="#2E5C2E" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <path d="M9 19 Q10 18.5 11 19" stroke="#2E5C2E" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <!-- Tail tip fin -->
 <path d="M14 30 Q17 28 18 31 Q15 32 14 30 Z" fill="url(#eel_fin)"/>
