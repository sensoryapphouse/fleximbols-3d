 <path d="M9.5 14 Q8 12.5 7.5 14 Q8.5 15.5 9.5 14" fill="#1565C0" opacity="0.7"/>
 <!-- School of fish (small silhouettes) -->
 <ellipse cx="20" cy="16" rx="1.2" ry="0.6" fill="#7DBEFC" opacity="0.9"/>
 <ellipse cx="22" cy="15" rx="1" ry="0.5" fill="#BDE3FE" opacity="0.9"/>
