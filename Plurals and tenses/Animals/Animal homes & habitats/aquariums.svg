 <defs>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#9CA3AF"/>
 </linearGradient>
 <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7DBEFC" stop-opacity="0.75"/>
 <stop offset="100%" stop-color="#1565C0" stop-opacity="0.85"/>
 </linearGradient>
 <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#BDE3FE" stop-opacity="0.35"/>
 <stop offset="100%" stop-color="#7DBEFC" stop-opacity="0.2"/>
 </linearGradient>
 <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#9CA3AF"/>
 </linearGradient>
 <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#9CA3AF"/>
 <stop offset="100%" stop-color="#6B7280"/>
 </linearGradient>
 </defs>
 <!-- Building walls -->
 <rect x="2" y="4" width="28" height="24" rx="1" fill="url(#wallGrad)" stroke="#9CA3AF" stroke-width="0.6"/>
 <!-- Roof bar -->
 <rect x="2" y="2" width="28" height="4" rx="1" fill="url(#roofGrad)" stroke="#9CA3AF" stroke-width="0.6"/>
 <!-- Glass tank window (most of building front) -->
 <rect x="4" y="6" width="24" height="16" rx="1" fill="url(#waterGrad)"/>
 <!-- Glass overlay sheen -->
 <rect x="4" y="6" width="5" height="16" rx="0.5" fill="url(#glassGrad)"/>
