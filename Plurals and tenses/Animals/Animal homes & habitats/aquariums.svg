 <ellipse cx="21" cy="18" rx="0.9" ry="0.45" fill="#BDE3FE" opacity="0.9"/>
 <!-- Water surface ripple -->
 <path d="M4 8 Q8 7 12 8 Q16 9 20 8 Q24 7 28 8" fill="none" stroke="#BDE3FE" stroke-width="0.6" opacity="0.7"/>
