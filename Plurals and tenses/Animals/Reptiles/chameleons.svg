 <circle cx="8.5" cy="14.5" r="3" fill="url(#chm_eye)"/>
 <circle cx="8.5" cy="14.5" r="2" fill="#4CAF50"/>
 <circle cx="8.5" cy="14.5" r="1" fill="#1a2a4a"/>
 <circle cx="8" cy="14" r="0.5" fill="white" fill-opacity="0.9"/>
 <!-- Eye outer ring -->
 <circle cx="8.5" cy="14.5" r="3" fill="none" stroke="#2E7D32" stroke-width="0.5"/>
 <!-- Feet gripping branch (zygodactyl) -->
 <path d="M13 25 Q11 27 9 28 Q11 28.5 13 27.5" fill="url(#chm_body)"/>
 <path d="M13 25 Q13 27.5 14 28.5 Q15 28 14.5 27" fill="url(#chm_body)"/>
