 <path d="M12 11 Q13 9 13 11" stroke="#2E7D32" stroke-width="0.5" fill="none"/>
 <path d="M14 10.5 Q15 8.5 15 10.5" stroke="#2E7D32" stroke-width="0.5" fill="none"/>
