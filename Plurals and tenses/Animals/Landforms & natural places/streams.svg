 <path d="M13,15 Q14,16 13,17" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.6"/>
 <path d="M12,21 Q13,22 12,23" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.6"/>
 <!-- Visible stones in/around stream (key gesture) -->
 <ellipse cx="11" cy="19" rx="1.5" ry="0.9" fill="url(#stone)" fill-opacity="0.9"/>
 <ellipse cx="15" cy="22" rx="1.2" ry="0.7" fill="url(#stone)" fill-opacity="0.9"/>
 <ellipse cx="12" cy="26" rx="1.3" ry="0.8" fill="url(#stone)" fill-opacity="0.85"/>
 <ellipse cx="9" cy="23" rx="1" ry="0.7" fill="url(#stone)" fill-opacity="0.8"/>
 <ellipse cx="16" cy="17" rx="1.1" ry="0.7" fill="url(#stone)" fill-opacity="0.8"/>
 <!-- White splash over stones -->
 <ellipse cx="11" cy="19" rx="1.2" ry="0.5" fill="#FFFFFF" fill-opacity="0.5"/>
 <ellipse cx="15" cy="22" rx="1" ry="0.4" fill="#FFFFFF" fill-opacity="0.5"/>
