 <rect x="8" y="15" width="9" height="1.2" fill="#8B5C3A" fill-opacity="0.85"/>
 <rect x="8.5" y="13.5" width="0.8" height="2.5" fill="#C99878" fill-opacity="0.85"/>
 <rect x="15.5" y="13.5" width="0.8" height="2.5" fill="#C99878" fill-opacity="0.85"/>
 <!-- Planks -->
 <line x1="10" y1="15" x2="10" y2="16.2" stroke="#C99878" stroke-width="0.4" stroke-opacity="0.7"/>
 <line x1="12" y1="15" x2="12" y2="16.2" stroke="#C99878" stroke-width="0.4" stroke-opacity="0.7"/>
 <line x1="14" y1="15" x2="14" y2="16.2" stroke="#C99878" stroke-width="0.4" stroke-opacity="0.7"/>
 <!-- Grass tufts beside stream -->
