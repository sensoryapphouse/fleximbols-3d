 <line x1="9" y1="22" x2="8.5" y2="19" stroke="#33691E" stroke-width="0.7" stroke-opacity="0.8"/>
 <line x1="18" y1="20" x2="18.5" y2="17" stroke="#7BAA48" stroke-width="0.7" stroke-opacity="0.8"/>
 <line x1="20" y1="24" x2="20.5" y2="21" stroke="#33691E" stroke-width="0.7" stroke-opacity="0.8"/>
