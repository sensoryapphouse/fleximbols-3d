 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CC8D0"/>
 </linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="12" fill="url(#sky)"/>
 <!-- Grassy/rocky terrain -->
 <rect x="0" y="12" width="32" height="20" fill="url(#bank)"/>
 <!-- Narrow winding stream (key gesture - narrow width + winding) -->
