<line x1="13" y1="13" x2="12" y2="26"/>
<line x1="17" y1="13" x2="17" y2="26"/>
<line x1="20" y1="13" x2="21" y2="26"/>
</g>
<!-- sunlit highlight on left face -->
<path d="M9 13 L11 13 L9 25 L7 25 Z" fill="url(#bt_hi)"/>
