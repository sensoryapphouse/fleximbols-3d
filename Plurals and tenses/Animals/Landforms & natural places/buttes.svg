<linearGradient id="bt_rock" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#d98a5a"/>
<stop offset="50%" stop-color="#bd5e30"/>
<stop offset="100%" stop-color="#7a3414"/>
</linearGradient>
<linearGradient id="bt_top" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#e8a070"/>
