<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sal_back" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#212121"/>
 <stop offset="100%" stop-color="#000000"/>
 </linearGradient>
 <linearGradient id="sal_spot" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD54F"/>
 <stop offset="100%" stop-color="#F57F17"/>
 </linearGradient>
 <linearGradient id="sal_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4CAF50"/>
 <stop offset="100%" stop-color="#1B5E20"/>
 </linearGradient>
 <radialGradient id="sal_sheen" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#424242" stop-opacity="0.8"/>
 <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Leaf (wet ground) -->
 <path d="M2 27 Q10 22 28 24 Q24 31 2 30 Z" fill="url(#sal_leaf)" fill-opacity="0.5"/>
 <!-- Leaf vein -->
 <path d="M4 28 Q14 25 26 26" stroke="#2E7D32" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
 <!-- Tail -->
 <path d="M28 18 Q31 16 32 19 Q31 22 29 21 Q28 20 27 19" stroke="url(#sal_back)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Body -->
 <path d="M6 20 Q5 16 9 14 Q16 11 23 14 Q27 17 27 20 Q26 24 22 26 Q16 28 10 26 Q6 24 6 20 Z" fill="url(#sal_back)"/>
 <!-- Sheen on body (wet/shiny) -->
 <path d="M9 15 Q16 12.5 23 15" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.2" stroke-linecap="round"/>
 <!-- Yellow spots on body -->
 <circle cx="11" cy="17" r="2" fill="url(#sal_spot)"/>
 <circle cx="16" cy="15" r="2" fill="url(#sal_spot)"/>
 <circle cx="21" cy="16" r="2" fill="url(#sal_spot)"/>
 <circle cx="13" cy="23" r="1.5" fill="url(#sal_spot)"/>
 <circle cx="19" cy="23" r="1.5" fill="url(#sal_spot)"/>
 <circle cx="25" cy="19" r="1.2" fill="url(#sal_spot)"/>
 <!-- Small spot highlights -->
 <circle cx="11" cy="16.5" r="0.7" fill="white" fill-opacity="0.4"/>
 <circle cx="16" cy="14.5" r="0.7" fill="white" fill-opacity="0.4"/>
 <circle cx="21" cy="15.5" r="0.7" fill="white" fill-opacity="0.4"/>
 <!-- Head -->
 <ellipse cx="7" cy="20" rx="4.5" ry="3.8" fill="url(#sal_back)"/>
 <!-- Eye -->
 <circle cx="6.5" cy="18.5" r="1.5" fill="#1a2a4a"/>
 <circle cx="6.5" cy="18.5" r="0.7" fill="#FFD700" fill-opacity="0.7"/>
 <circle cx="6" cy="18" r="0.35" fill="white" fill-opacity="0.8"/>
 <!-- Nostril -->
 <ellipse cx="4" cy="20" rx="0.5" ry="0.35" fill="#1a2a4a"/>
 <!-- Mouth -->
 <path d="M3.5 21.5 Q5.5 22.5 8 21.5" stroke="#1a2a4a" stroke-width="0.5" fill="none"/>
 <!-- Front legs splayed -->
 <path d="M9 24 Q8 26.5 6.5 28" stroke="url(#sal_back)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M11 25 Q10.5 27 9.5 29" stroke="url(#sal_back)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Back legs -->
 <path d="M21 26 Q20 28 18.5 29.5" stroke="url(#sal_back)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M24 25 Q23 27 21.5 28.5" stroke="url(#sal_back)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Toes front -->
 <line x1="6.5" y1="28" x2="5" y2="29.5" stroke="#212121" stroke-width="0.7"/>
 <line x1="6.5" y1="28" x2="6.5" y2="30" stroke="#212121" stroke-width="0.7"/>
 <line x1="6.5" y1="28" x2="8" y2="29.5" stroke="#212121" stroke-width="0.7"/>
 <!-- Toes back -->
 <line x1="18.5" y1="29.5" x2="17" y2="31" stroke="#212121" stroke-width="0.7"/>
 <line x1="18.5" y1="29.5" x2="18.5" y2="31" stroke="#212121" stroke-width="0.7"/>
 <line x1="18.5" y1="29.5" x2="20" y2="31" stroke="#212121" stroke-width="0.7"/>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
