</linearGradient>
<linearGradient id="sk_legs" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#E04020"/>
<stop offset="1" stop-color="#6A1208"/>
</linearGradient>
<linearGradient id="sk_water" x1="0" y1="0" x2="0" y2="1">
