<g transform="translate(16 17) scale(2.0)">
<!-- shadow -->
<ellipse cx="0.5" cy="11" rx="4" ry="0.8" fill="#000" fill-opacity="0.25" filter="url(#blur)"/>
<!-- long red legs -->
<path d="M-1 4 L-1.5 11 M1 4 L1.5 11" stroke="url(#sk_legs)" stroke-width="0.7" stroke-linecap="round"/>
<path d="M-2 11 L-1 11 L-0.5 11.3 M1 11 L2 11 L2.5 11.3" stroke="url(#sk_legs)" stroke-width="0.6" stroke-linecap="round"/>
