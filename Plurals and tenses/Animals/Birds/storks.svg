<radialGradient id="sk_body" cx="0.4" cy="0.4" r="0.8">
<stop offset="0" stop-color="#FFFFFF"/>
<stop offset="0.7" stop-color="#E8ECF2"/>
<stop offset="1" stop-color="#A0AAB8"/>
</radialGradient>
<linearGradient id="sk_wingtip" x1="0" y1="0" x2="1" y2="0">
