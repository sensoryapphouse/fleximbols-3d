 <!-- Perch twig -->
 <rect x="6" y="26.5" width="20" height="2" rx="1" fill="#5D4037"/>
 <!-- Brown back/body -->
 <ellipse cx="16" cy="21" rx="8.5" ry="5.5" fill="url(#backG)"/>
 <!-- Tail -->
 <path d="M22.5 22 L28 25 L27 27 L22 24Z" fill="url(#backG)"/>
