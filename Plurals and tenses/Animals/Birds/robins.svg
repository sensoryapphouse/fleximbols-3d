 <line x1="18" y1="26.8" x2="16.5" y2="27.5" stroke="url(#legG)" stroke-width="0.7" stroke-linecap="round"/>
 <line x1="18" y1="26.8" x2="19.5" y2="27.3" stroke="url(#legG)" stroke-width="0.7" stroke-linecap="round"/>
