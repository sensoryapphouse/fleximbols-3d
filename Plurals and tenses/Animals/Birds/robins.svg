 <defs>
 <radialGradient id="backG" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#6D4C41"/>
 <stop offset="100%" stop-color="#3E2723"/>
 </radialGradient>
 <radialGradient id="breastG" cx="40%" cy="35%" r="60%">
