 <defs>
  <linearGradient id="fc-body" x1="0" y1="0" x2="0.4" y2="1">
   <stop offset="0%" stop-color="#8a98a8"/>
   <stop offset="50%" stop-color="#5d6b7c"/>
   <stop offset="100%" stop-color="#39424f"/>
  </linearGradient>
  <linearGradient id="fc-wing" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#5a6675"/>
   <stop offset="100%" stop-color="#2c333d"/>
  </linearGradient>
  <radialGradient id="fc-belly" cx="0.5" cy="0.4" r="0.7">
