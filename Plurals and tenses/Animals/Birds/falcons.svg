 <circle cx="15" cy="7.2" r="1.5" fill="#ffd45e"/>
 <circle cx="15" cy="7.2" r="0.8" fill="#10131a"/>
 <circle cx="15.3" cy="6.9" r="0.28" fill="#ffffff"/>
