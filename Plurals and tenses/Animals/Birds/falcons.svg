   <stop offset="100%" stop-color="#11151c"/>
  </linearGradient>
  <linearGradient id="fc-cere" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#ffd45e"/>
   <stop offset="100%" stop-color="#d89a16"/>
  </linearGradient>
 </defs>
 <!-- perch -->
 <rect x="6" y="27.4" width="16" height="1.8" rx="0.9" fill="#7a5230"/>
 <rect x="6" y="27.4" width="16" height="0.7" rx="0.35" fill="#ffffff" fill-opacity="0.25"/>
 <!-- tail (long, pointed, down behind) -->
