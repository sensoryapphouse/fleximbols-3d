 <path d="M16.5 9 Q21 9 21 14 Q21 19 18 22 Q19.5 16 17.5 11 Q17 9.5 16.5 9 Z" fill="url(#fc-wing)"/>
 <ellipse cx="18.2" cy="11.5" rx="1.1" ry="2.4" fill="#ffffff" fill-opacity="0.18"/>
