 <!-- Perch branch -->
 <rect x="4" y="27" width="24" height="2.5" rx="1.2" fill="#5D4037"/>
 <rect x="4.5" y="27.2" width="8" height="0.8" rx="0.4" fill="#8D6E63" opacity="0.5"/>
