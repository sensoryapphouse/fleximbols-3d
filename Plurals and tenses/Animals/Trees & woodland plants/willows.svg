 <defs>
 <linearGradient id="wi-trunk" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#a08848"/>
 <stop offset="100%" stop-color="#6a5818"/>
 </linearGradient>
 <linearGradient id="wi-drape" x1="0%" y1="0%" x2="0%" y2="100%">
