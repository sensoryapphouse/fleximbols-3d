<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,3.709) scale(0.8841)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <radialGradient id="asp_crown" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#F4D654"/>
      <stop offset="50%" stop-color="#D8B23A"/>
      <stop offset="100%" stop-color="#A8862A"/>
    </radialGradient>
    <linearGradient id="asp_trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6F4EC"/>
      <stop offset="0.5" stop-color="#E4E0D2"/>
      <stop offset="1" stop-color="#C4BEA8"/>
    </linearGradient>
    <filter id="asp_sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.4" dy="0.8" stdDeviation="0.7" flood-color="#5a4a13" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- slender pale trunk (drawn first, foliage overlaps its top so they connect) -->
  <path d="M14.2 13 L15.1 29.4 C15.1 29.9 16.9 29.9 16.9 29.4 L17.8 13 Z" fill="url(#asp_trunk)" filter="url(#asp_sh)"/>
  <!-- characteristic dark aspen bark eyes/scars -->
  <g fill="#3c3a32">
    <ellipse cx="15.5" cy="17.5" rx="0.7" ry="1.05"/>
    <ellipse cx="16.7" cy="21" rx="0.65" ry="1.0"/>
    <ellipse cx="15.7" cy="24.5" rx="0.6" ry="0.9"/>
    <ellipse cx="16.5" cy="27.5" rx="0.5" ry="0.8"/>
  </g>
  <!-- rounded golden foliage crown, base overlaps trunk top -->
  <g filter="url(#asp_sh)">
    <path d="M16 3
             C 10 3 6.5 6.5 6.5 11
             C 6.5 15.2 10 17.8 16 17.8
             C 22 17.8 25.5 15.2 25.5 11
             C 25.5 6.5 22 3 16 3 Z" fill="url(#asp_crown)"/>
    <!-- leaf lobe bumps along the top for a fluttering-aspen look -->
    <g fill="url(#asp_crown)">
      <circle cx="10" cy="7" r="3.2"/>
      <circle cx="16" cy="5" r="3.6"/>
      <circle cx="22" cy="7" r="3.2"/>
      <circle cx="8.5" cy="11.5" r="3"/>
      <circle cx="23.5" cy="11.5" r="3"/>
    </g>
    <!-- darker leaf flecks for texture -->
    <g fill="#B89436" fill-opacity="0.55">
      <circle cx="12" cy="9" r="1.1"/>
      <circle cx="18.5" cy="8" r="1.0"/>
      <circle cx="20" cy="12" r="1.1"/>
      <circle cx="13" cy="13" r="1.0"/>
    </g>
    <!-- gloss highlight -->
    <ellipse cx="12" cy="7" rx="3.2" ry="2.1" fill="#FFFFFF" fill-opacity="0.30" transform="rotate(-18 12 7)"/>
  </g>
</g><g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl352" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl352)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
