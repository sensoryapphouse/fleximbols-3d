 <defs>
 <radialGradient id="ci_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#4a3820"/><stop offset="60%" stop-color="#2a1e08"/><stop offset="100%" stop-color="#100c00"/></radialGradient>
 <radialGradient id="ci_face" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#e8c0a0"/><stop offset="70%" stop-color="#c09070"/><stop offset="100%" stop-color="#885040"/></radialGradient>
 <radialGradient id="ci_ear" cx="50%" cy="40%" r="60%"><stop offset="0%" stop-color="#e0a890"/><stop offset="100%" stop-color="#b07050"/></radialGradient>
 </defs>
 <!-- body (slimmer than gorilla/ape) -->
 <ellipse cx="16" cy="23" rx="9" ry="7" fill="url(#ci_body)"/>
 <!-- arms (long, chimp-like) -->
 <path d="M7 20 Q5 25 6 28" fill="none" stroke="#2a1e08" stroke-width="4" stroke-linecap="round"/>
 <path d="M25 20 Q27 25 26 28" fill="none" stroke="#2a1e08" stroke-width="4" stroke-linecap="round"/>
 <!-- hands -->
 <ellipse cx="6" cy="28" rx="2.5" ry="1.8" fill="url(#ci_body)"/>
 <ellipse cx="26" cy="28" rx="2.5" ry="1.8" fill="url(#ci_body)"/>
 <!-- legs -->
 <ellipse cx="11" cy="29" rx="3.5" ry="2.2" fill="url(#ci_body)"/>
 <ellipse cx="21" cy="29" rx="3.5" ry="2.2" fill="url(#ci_body)"/>
 <!-- head (no sagittal crest - distinct from gorilla/ape) -->
 <ellipse cx="16" cy="13" rx="7.5" ry="7" fill="url(#ci_body)"/>
 <!-- PINK FACE (distinct chimp feature) -->
 <ellipse cx="16" cy="14" rx="5.5" ry="5.5" fill="url(#ci_face)"/>
 <!-- large ears (bigger than gorilla) -->
 <ellipse cx="9" cy="13" rx="3" ry="3.5" fill="url(#ci_body)"/>
 <ellipse cx="9" cy="13" rx="2" ry="2.5" fill="url(#ci_ear)"/>
 <ellipse cx="23" cy="13" rx="3" ry="3.5" fill="url(#ci_body)"/>
 <ellipse cx="23" cy="13" rx="2" ry="2.5" fill="url(#ci_ear)"/>
 <!-- eyes (more expressive, forward facing) -->
 <circle cx="13.5" cy="12" r="1.3" fill="#1a1a1a"/>
 <circle cx="18.5" cy="12" r="1.3" fill="#1a1a1a"/>
 <circle cx="13.1" cy="11.6" r="0.4" fill="#fff" fill-opacity="0.6"/>
 <circle cx="18.1" cy="11.6" r="0.4" fill="#fff" fill-opacity="0.6"/>
 <!-- protruding lips/muzzle area -->
 <ellipse cx="16" cy="17" rx="3.5" ry="2.5" fill="url(#ci_face)"/>
 <!-- nose -->
 <ellipse cx="14.8" cy="15.5" rx="0.7" ry="0.5" fill="#8a5030"/>
 <ellipse cx="17.2" cy="15.5" rx="0.7" ry="0.5" fill="#8a5030"/>
 <!-- mouth (chimps can make expressions) -->
 <path d="M13.5 18 Q16 19.5 18.5 18" fill="none" stroke="#8a5030" stroke-width="1" stroke-linecap="round"/>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl310" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl310)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>