 <defs>
 <linearGradient id="algo-card" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f8f8ff"/>
 <stop offset="100%" stop-color="#dde4f0"/>
 </linearGradient>
 <linearGradient id="algo-box1" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#5090e8"/>
 <stop offset="100%" stop-color="#2060c0"/>
 </linearGradient>
 <linearGradient id="algo-box2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#50c090"/>
 <stop offset="100%" stop-color="#208060"/>
 </linearGradient>
 <linearGradient id="algo-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e08030"/>
 <stop offset="100%" stop-color="#b05010"/>
 </linearGradient>
 <linearGradient id="algo-box3" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#9060e0"/>
 <stop offset="100%" stop-color="#6030b0"/>
