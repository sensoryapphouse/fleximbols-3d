 <rect x="9" y="24" width="14" height="5" rx="1.5" fill="url(#algo-box2)"/>
 <rect x="10" y="25" width="6" height="1" rx="0.3" fill="white" fill-opacity="0.5"/>
 <!-- Arrow diamond→box3 (no, right) -->
 <line x1="21" y1="17" x2="25" y2="17" stroke="#6080a0" stroke-width="0.8"/>
 <polygon points="25,17 23.5,15.8 23.5,18.2" fill="#6080a0"/>
 <!-- Box 3 (side, no path — small) -->
 <rect x="25" y="14" width="1" height="6" rx="0.4" fill="url(#algo-box3)"/>
