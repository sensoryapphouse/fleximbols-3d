 <!-- Card background -->
 
 <!-- Card border -->
 <rect x="3" y="2" width="26" height="28" rx="2.5" fill="none" stroke="#c0c8dc" stroke-width="0.5"/>
 <!-- Box 1 (top) -->
 <rect x="9" y="5" width="14" height="5" rx="1.5" fill="url(#algo-box1)"/>
 <rect x="10" y="6" width="6" height="1" rx="0.3" fill="white" fill-opacity="0.5"/>
 <!-- Arrow 1→diamond -->
 <line x1="16" y1="10" x2="16" y2="13" stroke="#6080a0" stroke-width="0.8"/>
 <polygon points="16,13 14.8,11.5 17.2,11.5" fill="#6080a0"/>
 <!-- Diamond (decision) -->
 <polygon points="16,13 21,17 16,21 11,17" fill="url(#algo-diamond)"/>
 <!-- Diamond highlight -->
 <polygon points="16,14 19.5,17 16,17.5 12.5,17" fill="white" fill-opacity="0.2"/>
 <!-- Arrow diamond→box2 (yes, down) -->
 <line x1="16" y1="21" x2="16" y2="24" stroke="#6080a0" stroke-width="0.8"/>
 <polygon points="16,24 14.8,22.5 17.2,22.5" fill="#6080a0"/>
