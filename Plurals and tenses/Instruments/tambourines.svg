<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><g transform="translate(0.000,4.307) scale(0.8654)"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Wood hoop frame gradient -->
 <linearGradient id="tb-hoop" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD089"/>
 <stop offset="50%" stop-color="#C58400"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <!-- Jingle (zil) metal disk gradient -->
 <radialGradient id="tb-jingle" cx="35%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="60%" stop-color="#C57500"/>
 <stop offset="100%" stop-color="#8B5000"/>
 </radialGradient>
 <!-- Drum skin gradient -->
 <radialGradient id="tb-skin" cx="45%" cy="45%" r="55%">
 <stop offset="0%" stop-color="#F0E0C0"/>
 <stop offset="70%" stop-color="#D0B890"/>
 <stop offset="100%" stop-color="#A08060"/>
 </radialGradient>
 <!-- Jingle highlight -->
 <radialGradient id="tb-jhi" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFE880"/>
 <stop offset="100%" stop-color="#C57500"/>
 </radialGradient>
 </defs>

 <!-- DRUMHEAD SKIN (optional, but adds recognition) -->
 <circle cx="16" cy="16" r="11.5" fill="url(#tb-skin)"/>
 <!-- Skin highlight -->
 <circle cx="13" cy="13" r="4" fill="#F8F0E0" fill-opacity="0.3"/>
 <!-- Skin centre mark -->
 <circle cx="16" cy="16" r="1.5" fill="#B09070" fill-opacity="0.4"/>

 <!-- WOODEN HOOP FRAME (ring) — mandatory -->
 <circle cx="16" cy="16" r="13" fill="none" stroke="url(#tb-hoop)" stroke-width="3"/>

 <!-- JINGLES (zils) around the rim — the mandatory distinguisher -->
 <!-- Jingle pair 1 (top) -->
 <ellipse cx="16" cy="2.5" rx="2.2" ry="1" fill="url(#tb-jingle)"/>
 <ellipse cx="16" cy="2.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5"/>
 <ellipse cx="16" cy="3.5" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8"/>

 <!-- Jingle pair 2 (upper right) -->
 <ellipse cx="23.5" cy="5.5" rx="2.2" ry="1" fill="url(#tb-jingle)" transform="rotate(45 23.5 5.5)"/>
 <ellipse cx="23.5" cy="5.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5" transform="rotate(45 23.5 5.5)"/>
 <ellipse cx="23.5" cy="6.3" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8" transform="rotate(45 23.5 6.3)"/>

 <!-- Jingle pair 3 (right) -->
 <ellipse cx="29.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jingle)"/>
 <ellipse cx="29.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jhi)" fill-opacity="0.5"/>
 <ellipse cx="28.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jingle)" fill-opacity="0.8"/>

 <!-- Jingle pair 4 (lower right) -->
 <ellipse cx="23.5" cy="26.5" rx="2.2" ry="1" fill="url(#tb-jingle)" transform="rotate(-45 23.5 26.5)"/>
 <ellipse cx="23.5" cy="26.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5" transform="rotate(-45 23.5 26.5)"/>
 <ellipse cx="23.5" cy="27.3" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8" transform="rotate(-45 23.5 27.3)"/>

 <!-- Jingle pair 5 (bottom) -->
 <ellipse cx="16" cy="29.5" rx="2.2" ry="1" fill="url(#tb-jingle)"/>
 <ellipse cx="16" cy="29.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5"/>
 <ellipse cx="16" cy="28.5" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8"/>

 <!-- Jingle pair 6 (lower left) -->
 <ellipse cx="8.5" cy="26.5" rx="2.2" ry="1" fill="url(#tb-jingle)" transform="rotate(45 8.5 26.5)"/>
 <ellipse cx="8.5" cy="26.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5" transform="rotate(45 8.5 26.5)"/>
 <ellipse cx="8.5" cy="27.3" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8" transform="rotate(45 8.5 27.3)"/>

 <!-- Jingle pair 7 (left) -->
 <ellipse cx="2.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jingle)"/>
 <ellipse cx="2.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jhi)" fill-opacity="0.5"/>
 <ellipse cx="3.5" cy="16" rx="1" ry="2.2" fill="url(#tb-jingle)" fill-opacity="0.8"/>

 <!-- Jingle pair 8 (upper left) -->
 <ellipse cx="8.5" cy="5.5" rx="2.2" ry="1" fill="url(#tb-jingle)" transform="rotate(-45 8.5 5.5)"/>
 <ellipse cx="8.5" cy="5.5" rx="2.2" ry="1" fill="url(#tb-jhi)" fill-opacity="0.5" transform="rotate(-45 8.5 5.5)"/>
 <ellipse cx="8.5" cy="6.3" rx="2.2" ry="1" fill="url(#tb-jingle)" fill-opacity="0.8" transform="rotate(-45 8.5 6.3)"/>

 <!-- Jingle slot cutouts in frame (where jingles mount) -->
 <rect x="14.5" y="1.5" width="3" height="2.5" rx="0.4" fill="#8B5C3A" fill-opacity="0.3"/>
</g><g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2458" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2458)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
