 <defs>
 <!-- Chrome silver body gradient -->
 <linearGradient id="hm-body" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="25%" stop-color="#C9CDD3"/>
 <stop offset="70%" stop-color="#9AA0AA"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <!-- Cover plate top surface -->
 <linearGradient id="hm-top" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#E8EAF0"/>
 <stop offset="100%" stop-color="#B0B4BA"/>
 </linearGradient>
 <!-- Hole slot gradient -->
 <linearGradient id="hm-hole" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#3B3F47"/>
 <stop offset="100%" stop-color="#16181D"/>
 </linearGradient>
 <!-- Side end cap gradient -->
 <linearGradient id="hm-cap" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#D0D4DA"/>
 <stop offset="100%" stop-color="#8B9090"/>
 </linearGradient>
 </defs>

 <!-- MAIN BODY: small rectangular chrome box -->
 <rect x="3" y="11" width="26" height="10" rx="1.5" fill="url(#hm-body)"/>

 <!-- Top cover plate -->
 <rect x="3" y="11" width="26" height="4" rx="1.5" fill="url(#hm-top)"/>

 <!-- Bottom cover plate -->
 <rect x="3" y="17" width="26" height="4" rx="1.5" fill="url(#hm-top)" fill-opacity="0.8"/>

 <!-- Top highlight reflection -->
 <rect x="5" y="11.5" width="22" height="1.5" rx="0.5" fill="#FFFFFF" fill-opacity="0.5"/>

 <!-- ROW OF HOLES/SLOTS along the mouthpiece edge — the harmonica signature -->
 <!-- 10 holes in a row -->
 <rect x="4.2" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="6.6" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="9.0" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="11.4" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="13.8" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="16.2" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="18.6" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="21.0" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="23.4" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>
 <rect x="25.8" y="14.5" width="1.8" height="3" rx="0.4" fill="url(#hm-hole)"/>

 <!-- Hole number dividers (between holes) -->
 <line x1="5.1" y1="14.5" x2="5.1" y2="17.5" stroke="#C9CDD3" stroke-width="0.3" stroke-opacity="0.5"/>
 <line x1="7.5" y1="14.5" x2="7.5" y2="17.5" stroke="#C9CDD3" stroke-width="0.3" stroke-opacity="0.5"/>

 <!-- End caps -->
 <rect x="3" y="11" width="2" height="10" rx="1.5" fill="url(#hm-cap)"/>
 <rect x="27" y="11" width="2" height="10" rx="1.5" fill="url(#hm-cap)"/>

 <!-- Screw details top and bottom -->
 <circle cx="5" cy="12.5" r="0.6" fill="#9AA0AA" fill-opacity="0.8"/>
 <circle cx="27" cy="12.5" r="0.6" fill="#9AA0AA" fill-opacity="0.8"/>
 <circle cx="5" cy="19.5" r="0.6" fill="#9AA0AA" fill-opacity="0.8"/>
 <circle cx="27" cy="19.5" r="0.6" fill="#9AA0AA" fill-opacity="0.8"/>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2440" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2440)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
