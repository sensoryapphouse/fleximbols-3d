<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Warm wood bar gradient -->
 <linearGradient id="xy-bar" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFD089"/>
 <stop offset="40%" stop-color="#C58400"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <!-- Frame wood gradient -->
 <linearGradient id="xy-frame" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <!-- Frame side gradient -->
 <linearGradient id="xy-side" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#A07848"/>
 <stop offset="100%" stop-color="#6B4828"/>
 </linearGradient>
 <!-- Mallet head (harder than marimba) -->
 <radialGradient id="xy-mallet" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#D0D4DA"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </radialGradient>
 <!-- Bar highlight -->
 <linearGradient id="xy-hi" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#FFE8B0"/>
 <stop offset="100%" stop-color="#C58400"/>
 </linearGradient>
 </defs>

 <!-- FRAME: angled rails (trapezoid wider at left) -->
 <!-- Top rail -->
 <rect x="3" y="10" width="26" height="2" rx="0.8" fill="url(#xy-frame)"/>
 <!-- Bottom rail -->
 <rect x="3" y="20" width="26" height="2" rx="0.8" fill="url(#xy-frame)"/>
 <!-- Side posts -->
 <rect x="3" y="10" width="2" height="12" rx="0.7" fill="url(#xy-side)"/>
 <rect x="27" y="10" width="2" height="12" rx="0.7" fill="url(#xy-side)"/>
 <!-- Legs -->
 <rect x="4" y="22" width="1.5" height="9" rx="0.5" fill="url(#xy-frame)"/>
 <rect x="12" y="22" width="1.5" height="9" rx="0.5" fill="url(#xy-frame)"/>
 <rect x="20" y="22" width="1.5" height="9" rx="0.5" fill="url(#xy-frame)"/>
 <rect x="27" y="22" width="1.5" height="9" rx="0.5" fill="url(#xy-frame)"/>

 <!-- WOODEN BARS (decreasing length left to right, warm wood tone) -->
 <!-- Bar 1 (longest) -->
 <rect x="5.5" y="11.5" width="3" height="9" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="5.7" y="11.5" width="1" height="9" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- Bar 2 -->
 <rect x="9.5" y="12" width="3" height="8" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="9.7" y="12" width="1" height="8" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- Bar 3 -->
 <rect x="13.5" y="12.5" width="3" height="7" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="13.7" y="12.5" width="1" height="7" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- Bar 4 -->
 <rect x="17.5" y="13" width="3" height="6" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="17.7" y="13" width="1" height="6" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- Bar 5 -->
 <rect x="21.5" y="13.5" width="3" height="5.5" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="21.7" y="13.5" width="1" height="5.5" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- Bar 6 (shortest) -->
 <rect x="25" y="14" width="3" height="5" rx="0.6" fill="url(#xy-bar)"/>
 <rect x="25.2" y="14" width="1" height="5" rx="0.3" fill="url(#xy-hi)" fill-opacity="0.35"/>

 <!-- NO RESONATOR TUBES (mandatory distinction from marimba) -->
 <!-- Mount cords between bars and rails (decorative holes) -->
 <circle cx="7" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>
 <circle cx="11" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>
 <circle cx="15" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>
 <circle cx="19" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>
 <circle cx="23" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>
 <circle cx="26.5" cy="20" r="0.4" fill="#6B4828" fill-opacity="0.6"/>

 <!-- TWO MALLETS (crossed above — harder mallet heads for xylophone) -->
 <!-- Mallet 1 -->
 <line x1="9" y1="3" x2="11" y2="10" stroke="#6B4828" stroke-width="0.9" stroke-linecap="round"/>
 <circle cx="8.5" cy="2.5" r="1.6" fill="url(#xy-mallet)"/>

 <!-- Mallet 2 (crossed) -->
 <line x1="21" y1="3" x2="19" y2="10" stroke="#6B4828" stroke-width="0.9" stroke-linecap="round"/>
 <circle cx="21.5" cy="2.5" r="1.6" fill="url(#xy-mallet)"/>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2461" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2461)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
