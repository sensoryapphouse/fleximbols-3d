 <!-- Large round resonator (skin-covered) -->
 
 <!-- Skin membrane look -->
 <circle cx="16" cy="22" r="8.5" fill="none" stroke="#bf360c" stroke-width="0.3" stroke-opacity="0.5"/>
 <circle cx="16" cy="22" r="7" fill="none" stroke="#e65100" stroke-width="0.3" stroke-opacity="0.3"/>
 <!-- Wooden body section (upper bowl) -->
 
 <!-- Metal fingerboard (shiny, no frets) -->
 
 <!-- Fingerboard shine -->
 <rect x="14" y="4.5" width="1.5" height="10" rx="0.5" fill="#fff" fill-opacity="0.25"/>
 <!-- Pegbox at top -->
 
 <!-- Tuning pegs -->
 <ellipse cx="13" cy="3" rx="1" ry="0.7" fill="url(#sr-peg)"/>
 <ellipse cx="16" cy="2.5" rx="1" ry="0.7" fill="url(#sr-peg)"/>
 <ellipse cx="19" cy="3" rx="1" ry="0.7" fill="url(#sr-peg)"/>
 <!-- Main strings (4) -->
 <line x1="14" y1="6" x2="14" y2="28" stroke="url(#sr-string)" stroke-width="0.5"/>
 <line x1="15.3" y1="6" x2="15.3" y2="28" stroke="url(#sr-string)" stroke-width="0.5"/>
 <line x1="16.7" y1="6" x2="16.7" y2="28" stroke="url(#sr-string)" stroke-width="0.5"/>
 <line x1="18" y1="6" x2="18" y2="28" stroke="url(#sr-string)" stroke-width="0.5"/>
 <!-- Sympathetic strings (thinner, more) -->
 <line x1="14.5" y1="6" x2="14.5" y2="28" stroke="#b0bec5" stroke-width="0.25" stroke-opacity="0.6"/>
 <line x1="15.8" y1="6" x2="15.8" y2="28" stroke="#b0bec5" stroke-width="0.25" stroke-opacity="0.6"/>
 <line x1="17.2" y1="6" x2="17.2" y2="28" stroke="#b0bec5" stroke-width="0.25" stroke-opacity="0.6"/>
