 <defs>
 <linearGradient id="subBody" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3A6A3A"/><stop offset="50%" stop-color="#6A9A6A"/><stop offset="100%" stop-color="#1A4A1A"/></linearGradient>
 <linearGradient id="subWater" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#3A8ABF"/><stop offset="100%" stop-color="#0A2A5A"/></linearGradient>
 <linearGradient id="subTower" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4A8A4A"/><stop offset="100%" stop-color="#1A5A1A"/></linearGradient>
 <linearGradient id="subPeris" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7A7A8A"/><stop offset="100%" stop-color="#3A3A4A"/></linearGradient>
 </defs>
 <!-- Water above -->
 <rect x="0" y="0" width="32" height="14" fill="url(#subWater)" fill-opacity="0.65"/>
 <!-- Sea surface -->
 <path d="M0 14 Q4 13 8 14 Q12 15 16 14 Q20 13 24 14 Q28 15 32 14" stroke="white" stroke-opacity="0.4" stroke-width="0.7" fill="none"/>
 <!-- Underwater water -->
 <rect x="0" y="14" width="32" height="18" fill="#0A2A5A" fill-opacity="0.6"/>
 <!-- Submarine body (cigar shape) -->
 <ellipse cx="16" cy="22" rx="14" ry="5.5" fill="url(#subBody)" filter="url(#sdSub)"/>
 <!-- Body highlight -->
 <ellipse cx="11" cy="19" rx="7" ry="2.5" fill="white" fill-opacity="0.15" transform="rotate(-10 11 19)"/>
 <!-- Rudder / tail fins -->
 <polygon points="29,22 32,18 32,26" fill="#2A6A2A"/>
 <polygon points="29,22 31,19 31,22" fill="#2A4A2A"/>
 <!-- Propeller -->
 <circle cx="30.5" cy="22" r="1.5" fill="none" stroke="#8A8A9A" stroke-width="0.8"/>
 <line x1="30.5" y1="20.5" x2="30.5" y2="23.5" stroke="#8A8A9A" stroke-width="0.8"/>
 <line x1="29" y1="22" x2="32" y2="22" stroke="#8A8A9A" stroke-width="0.8"/>
 <!-- Conning tower -->
 <rect x="13" y="14" width="7" height="6" rx="1" fill="url(#subTower)" filter="url(#sdSub)"/>
 <!-- Periscope -->
 <line x1="16" y1="14" x2="16" y2="8" stroke="url(#subPeris)" stroke-width="1.2" filter="url(#sdSub)"/>
 <line x1="16" y1="8" x2="19" y2="8" stroke="url(#subPeris)" stroke-width="1.2"/>
 <rect x="19" y="7" width="1.5" height="2.5" rx="0.5" fill="url(#subPeris)"/>
 <!-- Portholes -->
 <circle cx="9" cy="22" r="1.2" fill="#1A4A6A"/>
 <circle cx="13" cy="22" r="1.2" fill="#1A4A6A"/>
 <circle cx="17" cy="22" r="1.2" fill="#1A4A6A"/>
 <circle cx="21" cy="22" r="1.2" fill="#1A4A6A"/>
 <!-- Porthole shine -->
 <circle cx="8.5" cy="21.5" r="0.4" fill="white" fill-opacity="0.4"/>
 <circle cx="12.5" cy="21.5" r="0.4" fill="white" fill-opacity="0.4"/>
 <!-- Bubbles rising -->
 <circle cx="10" cy="18" r="0.5" fill="white" fill-opacity="0.5"/>
 <circle cx="20" cy="16" r="0.7" fill="white" fill-opacity="0.4"/>
 <circle cx="7" cy="13" r="0.4" fill="white" fill-opacity="0.5"/>
