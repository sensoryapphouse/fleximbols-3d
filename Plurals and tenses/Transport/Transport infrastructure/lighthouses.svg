 <!-- Water / sea -->
 <!-- Rocky coastline -->
 
 <!-- Tower body (slightly tapered) -->
 <polygon points="11,26 13,6 19,6 21,26" fill="url(#tower-grad)"/>
 <!-- Red stripes on tower -->
 <polygon points="11.5,23 12,19 20,19 20.5,23" fill="url(#stripe-red)" fill-opacity="0.9"/>
