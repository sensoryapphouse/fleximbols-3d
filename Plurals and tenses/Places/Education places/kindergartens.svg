<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<radialGradient id="knW" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#FFE6A8"/><stop offset="1" stop-color="#C89028"/></radialGradient>
<radialGradient id="knR" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#B83A2A"/></radialGradient>
<radialGradient id="knG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#A8E0A8"/><stop offset="1" stop-color="#4A8A4A"/></radialGradient>
<radialGradient id="knD" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#7BC9EF"/><stop offset="1" stop-color="#2A6AA8"/></radialGradient>
<radialGradient id="knSkin" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#FFD9B0"/><stop offset="1" stop-color="#E8A56A"/></radialGradient>
<radialGradient id="knShirt" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#7FB2F0"/><stop offset="1" stop-color="#2F66C0"/></radialGradient>
</defs>
<!-- ground -->
<rect x="2" y="26" width="28" height="3" rx="0.6" fill="url(#knG)"/>
<!-- ===== schoolhouse (left/centre) ===== -->
<!-- walls -->
<rect x="3.2" y="13" width="17.6" height="13" fill="url(#knW)"/>
<!-- roof -->
<path d="M 2 13.2 L 12 5 L 22 13.2 Z" fill="url(#knR)"/>
<!-- bell / clock tower on the apex -->
<rect x="10.5" y="2.4" width="3" height="3.4" fill="url(#knW)"/>
<path d="M 10.1 2.6 L 12 0.7 L 13.9 2.6 Z" fill="url(#knR)"/>
<!-- flag on the tower -->
<line x1="12" y1="0.7" x2="12" y2="-0.3" stroke="#5A4A2A" stroke-width="0.3"/>
<path d="M 12 -0.4 L 14 0.1 L 12 0.7 Z" fill="#2A7DE1"/>
<!-- bell opening (dark) -->
<rect x="11.2" y="3.2" width="1.6" height="2.2" fill="#3a3026"/>
<circle cx="12" cy="4.0" r="0.7" fill="url(#knW)"/>
<!-- clock on the front gable -->
<circle cx="12" cy="10.4" r="1.7" fill="#FFFFFF" stroke="#5A4A2A" stroke-width="0.35"/>
<line x1="12" y1="10.4" x2="12" y2="9.2" stroke="#3a3026" stroke-width="0.3" stroke-linecap="round"/>
<line x1="12" y1="10.4" x2="12.9" y2="10.7" stroke="#3a3026" stroke-width="0.3" stroke-linecap="round"/>
<circle cx="12" cy="10.4" r="0.25" fill="#3a3026"/>
<!-- door -->
<rect x="9.6" y="18.5" width="4.8" height="7.5" rx="0.3" fill="url(#knD)"/>
<rect x="10.4" y="19.4" width="3.2" height="3" fill="#5AC8E8"/>
<line x1="12" y1="19.4" x2="12" y2="22.4" stroke="#2A6AA8" stroke-width="0.25"/>
<line x1="10.4" y1="20.9" x2="13.6" y2="20.9" stroke="#2A6AA8" stroke-width="0.25"/>
<circle cx="13.1" cy="22.6" r="0.32" fill="#E8C82A"/>
<!-- windows -->
<rect x="4.8" y="15.6" width="3.2" height="3.2" fill="#5AC8E8" stroke="#5A4A2A" stroke-width="0.25"/>
<path d="M 6.4 15.6 L 6.4 18.8 M 4.8 17.2 L 8 17.2" stroke="#5A4A2A" stroke-width="0.28"/>
<rect x="15.8" y="15.6" width="3.2" height="3.2" fill="#5AC8E8" stroke="#5A4A2A" stroke-width="0.25"/>
<path d="M 17.4 15.6 L 17.4 18.8 M 15.8 17.2 L 19 17.2" stroke="#5A4A2A" stroke-width="0.28"/>
<!-- ===== ABC block (kindergarten / early-learning cue) ===== -->
<g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle">
<rect x="3.0" y="21.4" width="4.4" height="4.4" rx="0.6" fill="#E8453C"/>
<rect x="3.0" y="21.4" width="4.4" height="1.1" rx="0.55" fill="#ffffff" opacity="0.35"/>
<text x="5.2" y="25.0" font-size="3.2" fill="#ffffff">A</text>
</g>
<!-- ===== child standing in front (right) ===== -->
<g>
<!-- legs -->
<rect x="24.2" y="22.0" width="1.5" height="3.8" rx="0.5" fill="#3b3b3b"/>
<rect x="26.3" y="22.0" width="1.5" height="3.8" rx="0.5" fill="#3b3b3b"/>
<!-- shoes -->
<ellipse cx="24.6" cy="25.9" rx="1.2" ry="0.55" fill="#E8203A"/>
<ellipse cx="27.4" cy="25.9" rx="1.2" ry="0.55" fill="#E8203A"/>
<!-- body / shirt -->
<rect x="23.4" y="16.6" width="5.2" height="6.0" rx="1.3" fill="url(#knShirt)"/>
<!-- left arm (down) -->
<path d="M 23.6 17.4 Q 22.2 19.2 22.6 21.2" fill="none" stroke="url(#knShirt)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="22.7" cy="21.4" r="0.8" fill="url(#knSkin)"/>
<!-- right arm (waving up) -->
<path d="M 28.4 17.4 Q 30.0 16.0 30.2 14.4" fill="none" stroke="url(#knShirt)" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="30.3" cy="14.2" r="0.85" fill="url(#knSkin)"/>
<!-- head -->
<circle cx="26.0" cy="13.6" r="2.9" fill="url(#knSkin)" stroke="#B07840" stroke-width="0.2"/>
<!-- hair -->
<path d="M 23.2 12.8 Q 23.0 10.0 26.0 9.7 Q 29.0 10.0 28.8 12.8 Q 27.4 11.7 26.0 11.7 Q 24.6 11.7 23.2 12.8 Z" fill="#5c2a14"/>
<!-- eyes -->
<circle cx="24.9" cy="13.6" r="0.42" fill="#3a3026"/>
<circle cx="27.1" cy="13.6" r="0.42" fill="#3a3026"/>
<!-- smile -->
<path d="M 24.8 14.7 Q 26.0 15.6 27.2 14.7" fill="none" stroke="#3a3026" stroke-width="0.4" stroke-linecap="round"/>
<!-- cheeks -->
<circle cx="24.0" cy="14.4" r="0.6" fill="#ff99aa" opacity="0.6"/>
<circle cx="28.0" cy="14.4" r="0.6" fill="#ff99aa" opacity="0.6"/>
</g>
<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl2520" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl2520)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>
