 <defs>
 <linearGradient id="towelGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="50%" stop-color="#F5E8DC"/>
 <stop offset="100%" stop-color="#E0C8B0"/>
 </linearGradient>
 <linearGradient id="towelFoldGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#EED8C4"/>
 <stop offset="100%" stop-color="#C8A888"/>
 </linearGradient>
 <linearGradient id="towelTrimGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#B08060"/>
 <stop offset="50%" stop-color="#D0A880"/>
 <stop offset="100%" stop-color="#B08060"/>
 </linearGradient>
 </defs>
 <!-- Main folded towel body -->
 <rect x="4" y="10" width="24" height="17" rx="2" fill="url(#towelGrad)"/>
 <!-- Fold shadow at top (top-fold line) -->
 <rect x="4" y="10" width="24" height="4" rx="2" fill="url(#towelFoldGrad)"/>
 <!-- Terry-cloth texture lines (horizontal, woven look) -->
 <line x1="5" y1="16" x2="27" y2="16" stroke="#E0C8B0" stroke-width="0.5" opacity="0.7"/>
 <line x1="5" y1="18" x2="27" y2="18" stroke="#E0C8B0" stroke-width="0.5" opacity="0.7"/>
 <line x1="5" y1="20" x2="27" y2="20" stroke="#E0C8B0" stroke-width="0.5" opacity="0.7"/>
 <line x1="5" y1="22" x2="27" y2="22" stroke="#E0C8B0" stroke-width="0.5" opacity="0.7"/>
 <line x1="5" y1="24" x2="27" y2="24" stroke="#E0C8B0" stroke-width="0.5" opacity="0.7"/>
 <!-- Vertical texture lines (terry loop appearance) -->
 <line x1="8" y1="14" x2="8" y2="27" stroke="#E8D4C0" stroke-width="0.4" opacity="0.5"/>
 <line x1="12" y1="14" x2="12" y2="27" stroke="#E8D4C0" stroke-width="0.4" opacity="0.5"/>
 <line x1="16" y1="14" x2="16" y2="27" stroke="#E8D4C0" stroke-width="0.4" opacity="0.5"/>
 <line x1="20" y1="14" x2="20" y2="27" stroke="#E8D4C0" stroke-width="0.4" opacity="0.5"/>
 <line x1="24" y1="14" x2="24" y2="27" stroke="#E8D4C0" stroke-width="0.4" opacity="0.5"/>
 <!-- Decorative trim/stripe along bottom edge -->
 <rect x="4" y="25" width="24" height="2.5" rx="1" fill="url(#towelTrimGrad)"/>
 <!-- Top fold highlight -->
 <rect x="5" y="10.5" width="22" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.55"/>
 <!-- Shadow beneath fold -->
 
