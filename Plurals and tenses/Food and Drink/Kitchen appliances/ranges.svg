 <defs>
 <linearGradient id="rangeBody" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#C0C8D0"/>
 </linearGradient>
 <linearGradient id="rangeDoor" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#D8E0E8"/>
 <stop offset="100%" stop-color="#8898A8"/>
 </linearGradient>
 <linearGradient id="rangeGlass" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#A0B8C8" stop-opacity="0.75"/>
 <stop offset="100%" stop-color="#5068A0" stop-opacity="0.85"/>
 </linearGradient>
 <linearGradient id="burnerGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#484848"/>
 <stop offset="100%" stop-color="#181818"/>
 </linearGradient>
 <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#60C0FF"/>
 <stop offset="50%" stop-color="#FF8820"/>
 <stop offset="100%" stop-color="#D02000"/>
 </linearGradient>
 </defs>
 <!-- Main body -->
 
 <!-- Cooktop surface -->
 <rect x="3" y="3" width="26" height="14" rx="2" fill="#E8E8E8"/>
 <rect x="3" y="14" width="26" height="2" fill="#C0C8D0"/>
 <!-- Burner 1 (top-left) -->
 <circle cx="10" cy="8" r="3.5" fill="url(#burnerGrad)"/>
 <circle cx="10" cy="8" r="2.5" fill="#303030"/>
 <circle cx="10" cy="8" r="1.5" fill="#202020"/>
 <!-- Burner 2 (top-right) -->
 <circle cx="22" cy="8" r="3.5" fill="url(#burnerGrad)"/>
 <circle cx="22" cy="8" r="2.5" fill="#303030"/>
 <circle cx="22" cy="8" r="1.5" fill="#202020"/>
 <!-- Burner 3 (bottom-left) -->
 <circle cx="10" cy="13" r="3" fill="url(#burnerGrad)"/>
 <circle cx="10" cy="13" r="2" fill="#303030"/>
 <circle cx="10" cy="13" r="1" fill="#202020"/>
 <!-- Burner 4 (bottom-right) with flame lit -->
 <circle cx="22" cy="13" r="3" fill="url(#burnerGrad)"/>
 <circle cx="22" cy="13" r="2" fill="#303030"/>
 <!-- Flame on burner 4 -->
 <path d="M21 13 Q21.5 11 22 11.5 Q22.5 10 23 11.5 Q23.5 11 23.5 13 Q22.5 12 22 12.5 Q21.5 12 21 13Z" fill="url(#flameG)" opacity="0.9"/>
 <!-- Grate lines over burners -->
 <line x1="7" y1="8" x2="13" y2="8" stroke="#585858" stroke-width="0.5"/>
 <line x1="10" y1="5" x2="10" y2="11" stroke="#585858" stroke-width="0.5"/>
 <line x1="19" y1="8" x2="25" y2="8" stroke="#585858" stroke-width="0.5"/>
 <line x1="22" y1="5" x2="22" y2="11" stroke="#585858" stroke-width="0.5"/>
 <!-- Oven door -->
 <rect x="4" y="16" width="24" height="13" rx="1.5" fill="url(#rangeDoor)"/>
 <!-- Oven window -->
 <rect x="6" y="17.5" width="20" height="9" rx="1" fill="url(#rangeGlass)"/>
 <!-- Food inside oven hint -->
 <rect x="9" y="22" width="14" height="2.5" rx="0.5" fill="#C89040" fill-opacity="0.5"/>
 <!-- Oven handle -->
 <rect x="9" y="28.5" width="14" height="1.5" rx="0.7" fill="#A0A8B0"/>
 <!-- Knobs on control panel -->
 <circle cx="5.5" cy="16" r="0.8" fill="#707880"/>
 <circle cx="8.5" cy="16" r="0.8" fill="#707880"/>
 <circle cx="23.5" cy="16" r="0.8" fill="#707880"/>
 <circle cx="26.5" cy="16" r="0.8" fill="#707880"/>
 <!-- Centre clock/timer -->
 <rect x="14" y="15" width="4" height="2" rx="0.5" fill="#20A060"/>
 <rect x="14.5" y="15.3" width="1" height="1.2" rx="0.2" fill="#60F0A0" fill-opacity="0.8"/>
 <rect x="16.5" y="15.3" width="1" height="1.2" rx="0.2" fill="#60F0A0" fill-opacity="0.8"/>
