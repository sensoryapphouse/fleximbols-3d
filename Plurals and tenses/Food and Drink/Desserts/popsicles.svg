  <defs>
    <linearGradient id="pop_ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FA0"/>
      <stop offset="0.55" stop-color="#F2407B"/>
      <stop offset="1" stop-color="#D02860"/>
    </linearGradient>
    <linearGradient id="pop_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9DC0"/>
      <stop offset="1" stop-color="#FF6FA0"/>
    </linearGradient>
    <linearGradient id="pop_stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C98F"/>
      <stop offset="0.5" stop-color="#D4A85F"/>
      <stop offset="1" stop-color="#B8853F"/>
    </linearGradient>
    <linearGradient id="pop_gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="16" cy="29.0" rx="6.0" ry="1.2" fill="#000000" opacity="0.12"/>

  <!-- wooden stick -->
  <rect x="14.4" y="20.0" width="3.2" height="9.0" rx="1.3" fill="url(#pop_stick)" stroke="#A87838" stroke-width="0.3"/>
  <line x1="16" y1="22.0" x2="16" y2="28.2" stroke="#C49A5C" stroke-width="0.3" opacity="0.6"/>

