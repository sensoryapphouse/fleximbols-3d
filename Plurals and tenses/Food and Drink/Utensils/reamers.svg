 <line x1="16" y1="22.5" x2="16" y2="29" stroke="#f9a825" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="8" y1="25" x2="24" y2="25" stroke="#f9a825" stroke-width="0.5" stroke-opacity="0.6"/>
 <line x1="10" y1="23" x2="22" y2="28" stroke="#f9a825" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="22" y1="23" x2="10" y2="28" stroke="#f9a825" stroke-width="0.4" stroke-opacity="0.5"/>
