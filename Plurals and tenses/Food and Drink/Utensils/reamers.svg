 <stop offset="100%" stop-color="#bf360c"/>
 </linearGradient>
 <radialGradient id="rm-hand" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#ffccbc"/>
 <stop offset="100%" stop-color="#bf360c"/>
 </radialGradient>
