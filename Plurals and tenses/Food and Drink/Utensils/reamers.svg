 <path d="M12 22 L16 9 L20 22 Z" fill="url(#rm-cone)"/>
 <!-- Ridges on cone -->
 <path d="M14 15 Q16 14 18 15" stroke="url(#rm-groove)" stroke-width="0.6" fill="none" stroke-opacity="0.7"/>
 <path d="M13.5 17 Q16 16 18.5 17" stroke="url(#rm-groove)" stroke-width="0.6" fill="none" stroke-opacity="0.7"/>
