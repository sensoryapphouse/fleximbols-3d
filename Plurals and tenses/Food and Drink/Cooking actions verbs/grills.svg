<defs>
 <!-- Warm skin base -->
 <radialGradient id="face_grad" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FFE4A0"/>
 <stop offset="60%" stop-color="#FFD166"/>
 <stop offset="100%" stop-color="#F5A623"/>
 </radialGradient>
 <!-- Yellow warm face highlight -->
 <radialGradient id="face_hi" cx="35%" cy="30%" r="40%">
 <stop offset="0%" stop-color="#FFF6CC" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
 </radialGradient>
 <!-- Metal blade -->
 <radialGradient id="blade_grad" cx="30%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#E8EEF5"/>
 <stop offset="50%" stop-color="#B8C8D8"/>
 <stop offset="100%" stop-color="#7A8A99"/>
 </radialGradient>
 <!-- Wood handle -->
 <radialGradient id="handle_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#C8893A"/>
 <stop offset="100%" stop-color="#7A4A1A"/>
 </radialGradient>
 <!-- Bowl orange-warm -->
 <radialGradient id="bowl_grad" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF9B5E"/>
 <stop offset="60%" stop-color="#E8612A"/>
 <stop offset="100%" stop-color="#C04010"/>
 </radialGradient>
 <!-- Bowl interior -->
 <radialGradient id="bowl_inner" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFC09A"/>
 <stop offset="100%" stop-color="#FF8055"/>
 </radialGradient>
 <!-- Fire red-orange -->
 <radialGradient id="fire_grad" cx="50%" cy="80%" r="60%">
 <stop offset="0%" stop-color="#FFE066"/>
 <stop offset="40%" stop-color="#FF8C00"/>
 <stop offset="100%" stop-color="#CC2200"/>
 </radialGradient>
 <!-- Steam blue-white -->
 <radialGradient id="steam_grad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#E8F4FF"/>
 <stop offset="100%" stop-color="#A8C8EE" stop-opacity="0.3"/>
 </radialGradient>
 <!-- Ice blue -->
 <radialGradient id="ice_grad" cx="30%" cy="25%" r="70%">
 <stop offset="0%" stop-color="#D4F0FF"/>
 <stop offset="60%" stop-color="#7AC5F0"/>
 <stop offset="100%" stop-color="#3A8ABF"/>
 </radialGradient>
 <!-- Water blue -->
 <radialGradient id="water_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#88DDFF"/>
 <stop offset="60%" stop-color="#2299DD"/>
 <stop offset="100%" stop-color="#0055AA"/>
 </radialGradient>
 <!-- Thread red -->
 <radialGradient id="thread_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FF9999"/>
 <stop offset="100%" stop-color="#CC1111"/>
 </radialGradient>
 <!-- Fabric blue -->
 <radialGradient id="fabric_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#99BBFF"/>
 <stop offset="100%" stop-color="#2244BB"/>
 </radialGradient>
 <!-- Tool grey -->
 <radialGradient id="tool_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#D0D8E0"/>
 <stop offset="60%" stop-color="#8898A8"/>
 <stop offset="100%" stop-color="#445566"/>
