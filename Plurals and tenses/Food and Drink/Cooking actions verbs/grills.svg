</defs>

 <!-- Grill body -->
 <path d="M4 16 Q4 28 16 28 Q28 28 28 16 Z" fill="url(#grill_grad)"/>
 <!-- Grill grate lines -->
 <ellipse cx="16" cy="16" rx="12" ry="3.5" fill="#777777"/>
 <line x1="7" y1="16" x2="7" y2="28" stroke="#555" stroke-width="1"/>
 <line x1="11" y1="16" x2="11" y2="28" stroke="#555" stroke-width="1"/>
 <line x1="15" y1="16" x2="15" y2="28" stroke="#555" stroke-width="1"/>
 <line x1="19" y1="16" x2="19" y2="28" stroke="#555" stroke-width="1"/>
 <line x1="23" y1="16" x2="23" y2="28" stroke="#555" stroke-width="1"/>
 <!-- Grill marks on top -->
 <ellipse cx="16" cy="16" rx="10" ry="2.5" fill="#BB9944"/>
 <!-- Sausage/steak being grilled -->
 <ellipse cx="16" cy="16" rx="8" ry="2" fill="#CC6633"/>
 <line x1="10" y1="15.2" x2="22" y2="15.2" stroke="#774422" stroke-width="0.8"/>
 <line x1="10" y1="16.8" x2="22" y2="16.8" stroke="#774422" stroke-width="0.8"/>
 <!-- Flames underneath -->
 <path d="M8 28 Q9 25 10 28 Q11 24 12 28 Q13 25 14 28" stroke="url(#fire_grad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <path d="M18 28 Q19 25 20 28 Q21 24 22 28 Q23 25 24 28" stroke="url(#fire_grad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <!-- Legs -->
 <line x1="10" y1="28" x2="8" y2="32" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
 <line x1="22" y1="28" x2="24" y2="32" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>

<g transform="translate(0,0) scale(0.0625) translate(360 8) scale(0.2812)"><defs><radialGradient id="pl1085" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#7ed957"/><stop offset="100%" stop-color="#3aa324"/></radialGradient></defs><path d="M 256.0,56.0 L 281.0,212.7 L 429.2,156.0 L 306.0,256.0 L 429.2,356.0 L 281.0,299.3 L 256.0,456.0 L 231.0,299.3 L 82.8,356.0 L 206.0,256.0 L 82.8,156.0 L 231.0,212.7 Z" fill="url(#pl1085)" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/></g></svg>