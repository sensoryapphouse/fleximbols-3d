  <defs>
    <linearGradient id="poolDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d4"/>
      <stop offset="1" stop-color="#cdbfa3"/>
    </linearGradient>
    <linearGradient id="poolWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd0ec"/>
      <stop offset="0.55" stop-color="#3fa9d6"/>
      <stop offset="1" stop-color="#2b86b8"/>
    </linearGradient>
    <linearGradient id="poolGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
