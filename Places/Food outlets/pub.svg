 <defs>
 <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e8d8b0"/>
 <stop offset="100%" stop-color="#c0a060"/>
 </linearGradient>
 <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#604010"/>
 <stop offset="100%" stop-color="#301000"/>
 </linearGradient>
 <radialGradient id="beerGrad" cx="40%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#ffe090"/>
 <stop offset="70%" stop-color="#d09020"/>
 <stop offset="100%" stop-color="#a06010"/>
 </radialGradient>
 <linearGradient id="signGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c09040"/>
 <stop offset="100%" stop-color="#805010"/>
 </linearGradient>
 </defs>
 <!-- Building -->
 
 <!-- Roof / fascia -->
 <rect x="3" y="10" width="26" height="5" rx="0.5" fill="url(#roofGrad)"/>
 <!-- Hanging sign bracket -->
 <line x1="13" y1="10" x2="13" y2="7" stroke="#703010" stroke-width="0.8"/>
 <line x1="13" y1="7" x2="19" y2="7" stroke="#703010" stroke-width="0.8"/>
 <!-- Pub sign -->
 <rect x="14" y="4.5" width="10" height="5" rx="0.8" fill="url(#signGrad)" stroke="#503010" stroke-width="0.5"/>
 <!-- Beer mug on sign -->
 <path d="M16.5 6 L16.5 8 L19.5 8 L19.5 6 Z" fill="url(#beerGrad)" stroke="#a06020" stroke-width="0.3"/>
 <!-- Mug handle -->
 <path d="M19.5 6.5 Q21 6.5 21 7.5 Q21 8 19.5 8" fill="none" stroke="#a06020" stroke-width="0.5"/>
 <!-- Foam top -->
 <path d="M16 6 Q17 5 18 6 Q19 5 20 6" fill="none" stroke="#f0f0f0" stroke-width="0.6"/>
 <!-- Window -->
 <rect x="5" y="18" width="9" height="8" rx="0.5" fill="#d4c090" fill-opacity="0.5" stroke="#a08050" stroke-width="0.5"/>
 <!-- Door -->
 <rect x="16" y="20" width="7" height="10" rx="0.5" fill="#a07040" stroke="#703010" stroke-width="0.5"/>
 <circle cx="18" cy="25" r="0.4" fill="#604020"/>
 <!-- Window divider -->
 <line x1="9.5" y1="18" x2="9.5" y2="26" stroke="#a08050" stroke-width="0.4"/>
 <line x1="5" y1="22" x2="14" y2="22" stroke="#a08050" stroke-width="0.4"/>
</svg>
