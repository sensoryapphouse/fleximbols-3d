 <defs>
 <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#d8ccc0"/>
 <stop offset="100%" stop-color="#a09080"/>
 </linearGradient>
 <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#808090"/>
 <stop offset="100%" stop-color="#404050"/>
 </linearGradient>
 <linearGradient id="doorOpen" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c8b890"/>
 <stop offset="100%" stop-color="#907050"/>
 </linearGradient>
 <linearGradient id="pegboard" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#d8c090"/>
 <stop offset="100%" stop-color="#a08050"/>
 </linearGradient>
 </defs>
 <!-- Building -->
 
 <!-- Roof -->
 <polygon points="2,12 30,12 28,7 4,7" fill="url(#roofGrad)"/>
 <!-- Open garage door frame -->
 <rect x="5" y="17" width="15" height="13" rx="0.5" fill="#1a1200" fill-opacity="0.7"/>
 <!-- Door panels (raised-open) -->
 <rect x="5" y="17" width="15" height="2" rx="0.2" fill="url(#doorOpen)"/>
 <rect x="5" y="17" width="15" height="0.5" rx="0" fill="#ffffff" fill-opacity="0.2"/>
 <!-- Pegboard inside garage -->
 <rect x="6" y="19" width="13" height="9" fill="url(#pegboard)" fill-opacity="0.5"/>
 <!-- Pegboard holes pattern -->
 <circle cx="8" cy="21" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <circle cx="10" cy="21" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <circle cx="12" cy="21" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <circle cx="8" cy="23" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <circle cx="10" cy="23" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <circle cx="12" cy="23" r="0.3" fill="#604020" fill-opacity="0.6"/>
 <!-- Hammer -->
 <line x1="7.5" y1="21.5" x2="10" y2="24" stroke="#707070" stroke-width="0.9" stroke-linecap="round"/>
 <rect x="9.5" y="21" width="2" height="1.2" rx="0.3" fill="#909090" transform="rotate(-45,10.5,21.6)"/>
 <!-- Saw -->
 <line x1="11" y1="23" x2="14" y2="25.5" stroke="#c0b080" stroke-width="0.8" stroke-linecap="round"/>
 <path d="M11 23 L11.4 22.5 L11.8 23 L12.2 22.5 L12.6 23 L13 22.5 L13.4 23" fill="none" stroke="#a09060" stroke-width="0.4"/>
 <!-- Wrench -->
 <path d="M13 21 Q14.5 20.5 15 21.5 L14 22.5 L13.5 24 L12.5 23 Z" fill="#808090"/>
 <!-- Office door on side -->
 <rect x="22" y="20" width="6" height="10" rx="0.5" fill="#c0b090" stroke="#907040" stroke-width="0.5"/>
 <circle cx="23.5" cy="25" r="0.4" fill="#706030"/>
</svg>
