<defs>
 <linearGradient id="cuffband" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#e3e6ea"/>
  <stop offset="0.5" stop-color="#aeb2b8"/>
  <stop offset="1" stop-color="#74787e"/>
 </linearGradient>
 <linearGradient id="chaing" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#c9cdd3"/>
  <stop offset="1" stop-color="#7a7e84"/>
 </linearGradient>
</defs>
 <!-- left cuff ring (band) -->
 <circle cx="8.5" cy="15" r="6.4" fill="url(#cuffband)" stroke="#4a4d52" stroke-width="0.6"/>
 <circle cx="8.5" cy="15" r="3.5" fill="#eef0f2" stroke="#4a4d52" stroke-width="0.6"/>
 <!-- left ratchet arm overlap -->
 <path d="M11.2 10.6 Q14 11.4 14.6 14.2 L12.4 14.6 Q11.8 12.4 9.8 12 Z" fill="url(#cuffband)" stroke="#4a4d52" stroke-width="0.5"/>
 <circle cx="9.6" cy="20.4" r="0.7" fill="#5b5f66"/>
 <!-- right cuff ring (band) -->
 <circle cx="23.5" cy="15" r="6.4" fill="url(#cuffband)" stroke="#4a4d52" stroke-width="0.6"/>
 <circle cx="23.5" cy="15" r="3.5" fill="#eef0f2" stroke="#4a4d52" stroke-width="0.6"/>
 <path d="M20.8 10.6 Q18 11.4 17.4 14.2 L19.6 14.6 Q20.2 12.4 22.2 12 Z" fill="url(#cuffband)" stroke="#4a4d52" stroke-width="0.5"/>
 <circle cx="22.4" cy="20.4" r="0.7" fill="#5b5f66"/>
 <!-- connecting chain links -->
 <g stroke="#4a4d52" stroke-width="0.5">
  <ellipse cx="13.6" cy="15" rx="1.5" ry="1.0" fill="none" stroke="url(#chaing)" stroke-width="1.0"/>
  <ellipse cx="16" cy="15" rx="1.5" ry="1.0" fill="none" stroke="url(#chaing)" stroke-width="1.0"/>
  <ellipse cx="18.4" cy="15" rx="1.5" ry="1.0" fill="none" stroke="url(#chaing)" stroke-width="1.0"/>
 </g>
 <!-- gloss highlights -->
 <ellipse cx="6.2" cy="11.8" rx="1.5" ry="2.1" fill="#ffffff" fill-opacity="0.5"/>
 <ellipse cx="21.2" cy="11.8" rx="1.5" ry="2.1" fill="#ffffff" fill-opacity="0.5"/>
</svg>
