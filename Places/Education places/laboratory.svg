 <defs>
 <radialGradient id="flask" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="70%" stop-color="#e0e8f0"/>
 <stop offset="100%" stop-color="#7a8090"/>
 </radialGradient>
 <radialGradient id="liquid" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="40%" stop-color="#7ee880"/>
 <stop offset="100%" stop-color="#187828"/>
 </radialGradient>
 <radialGradient id="tubeBlue" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="40%" stop-color="#7fc8ff"/>
 <stop offset="100%" stop-color="#0a3a78"/>
 </radialGradient>
 <radialGradient id="tubeRed" cx="35%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="40%" stop-color="#ff8070"/>
 <stop offset="100%" stop-color="#8a1010"/>
 </radialGradient>
 <radialGradient id="stand" cx="40%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="100%" stop-color="#4a4e58"/>
 </radialGradient>
 <radialGradient id="bubble" cx="40%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="100%" stop-color="#a8e8a8" stop-opacity="0.6"/>
 </radialGradient>
 </defs>

 <!-- bench surface -->
 <path d="M0 27 L32 27 L32 29 L0 29 Z" fill="#8a5848"/>
 <path d="M0 27 L32 27" stroke="#4a2818" stroke-width="0.3"/>

 <!-- TEST TUBE RACK on left -->
 <rect x="1" y="20" width="9" height="1.4" rx="0.3" fill="url(#stand)"/>
 <rect x="1" y="25" width="9" height="1.4" rx="0.3" fill="url(#stand)"/>
 <!-- two test tubes in rack -->
 <path d="M2.5 17 L2.5 25 Q2.5 26.5 4 26.5 Q5.5 26.5 5.5 25 L5.5 17 Z" fill="url(#flask)" opacity="0.92"/>
 <path d="M2.7 22 L2.7 25 Q2.7 26.2 4 26.2 Q5.3 26.2 5.3 25 L5.3 22 Z" fill="url(#tubeBlue)"/>
 <ellipse cx="4" cy="17" rx="1.5" ry="0.4" fill="#9aa0a8"/>
 <path d="M6.5 16 L6.5 25 Q6.5 26.5 8 26.5 Q9.5 26.5 9.5 25 L9.5 16 Z" fill="url(#flask)" opacity="0.92"/>
 <path d="M6.7 21 L6.7 25 Q6.7 26.2 8 26.2 Q9.3 26.2 9.3 25 L9.3 21 Z" fill="url(#tubeRed)"/>
 <ellipse cx="8" cy="16" rx="1.5" ry="0.4" fill="#9aa0a8"/>

 <!-- BIG ERLENMEYER FLASK in centre/right -->
 <!-- neck -->
 <path d="M19 5 L23 5 L23 11 L19 11 Z" fill="url(#flask)"/>
 <!-- triangular body -->
 <path d="M19 11 L13 25 Q13 27 15 27 L27 27 Q29 27 29 25 L23 11 Z" fill="url(#flask)"/>
 <!-- liquid inside -->
 <path d="M16 19 L26 19 L28.5 25 Q28.5 26.5 27 26.5 L15 26.5 Q13.5 26.5 13.5 25 Z" fill="url(#liquid)"/>
 <!-- meniscus -->
 <path d="M16 19 Q21 18.2 26 19" fill="none" stroke="#187828" stroke-width="0.3"/>
 <!-- measurement markings on flask -->
 <path d="M14.5 23 L16 23 M14.5 21 L16 21 M19.5 17 L21 17 M19.5 14 L21 14" stroke="#5a606a" stroke-width="0.2" opacity="0.85"/>
 <!-- rim of neck -->
 <ellipse cx="21" cy="5" rx="2.4" ry="0.7" fill="#a8aeb6"/>
 <ellipse cx="21" cy="5" rx="1.8" ry="0.3" fill="#4a4e58"/>

 <!-- bubbles rising -->
 <circle cx="20" cy="16" r="0.7" fill="url(#bubble)"/>
 <circle cx="22" cy="13" r="0.5" fill="url(#bubble)"/>
 <circle cx="19" cy="11" r="0.4" fill="url(#bubble)"/>
 <circle cx="22.5" cy="9" r="0.35" fill="url(#bubble)"/>
 <circle cx="20.5" cy="7" r="0.3" fill="url(#bubble)"/>

 <!-- flask highlight -->
 <path d="M16 22 Q15 18 19 13" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.7" stroke-linecap="round"/>
</svg>
