<defs>
<linearGradient id="env" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B080E0"/><stop offset="100%" stop-color="#4A2080"/></linearGradient>
<linearGradient id="env_back" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8050C0"/><stop offset="100%" stop-color="#2A0A5A"/></linearGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<linearGradient id="arr" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFE48A"/><stop offset="100%" stop-color="#E5A700"/></linearGradient>
</defs>
<!-- envelope body -->
<rect x="6" y="11" width="20" height="14" rx="1" fill="url(#env_back)"/>
<!-- envelope flap (folded down) -->
<path d="M6 11 L 16 19 L 26 11 Z" fill="url(#env)"/>
<!-- envelope front rim -->
<path d="M6 25 L 16 16 L 26 25 Z" fill="url(#env)" opacity="0.6"/>
<ellipse cx="11" cy="13" rx="4" ry="0.7" fill="url(#hi)"/>
<!-- circular renewal arrows around envelope -->
<path d="M3 16 A 13 13 0 1 0 29 16" stroke="url(#arr)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.85"/>
<path d="M29 16 L 27.5 14 L 30.5 14.5 Z" fill="url(#arr)"/>
<path d="M3 16 L 4.5 18 L 1.5 17.5 Z" fill="url(#arr)"/>
</svg>