<defs>
<linearGradient id="dsk-top" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#c98f52"/>
<stop offset="100%" stop-color="#9c6432"/>
</linearGradient>
<linearGradient id="dsk-top-edge" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#8a5326"/>
<stop offset="100%" stop-color="#6b3e1a"/>
</linearGradient>
<linearGradient id="dsk-leg" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#9c6432"/>
<stop offset="50%" stop-color="#7c4c22"/>
<stop offset="100%" stop-color="#5e3818"/>
</linearGradient>
<linearGradient id="dsk-drawer" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#b07c44"/>
<stop offset="100%" stop-color="#8a5a2c"/>
</linearGradient>
<linearGradient id="dsk-paper" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#e2e6ec"/>
</linearGradient>
</defs>
<!-- sheet of paper on the desk -->
<rect x="11" y="6.5" width="9" height="4.5" rx="0.4" fill="url(#dsk-paper)" stroke="#c8cdd6" stroke-width="0.3" transform="rotate(-4 15.5 8.7)"/>
<g stroke="#b9c0cb" stroke-width="0.4" transform="rotate(-4 15.5 8.7)">
<line x1="12" y1="8" x2="19" y2="8"/>
<line x1="12" y1="9.2" x2="19" y2="9.2"/>
</g>
<!-- desk top (writing surface) -->
<rect x="3" y="11" width="26" height="2.6" rx="0.6" fill="url(#dsk-top)"/>
<rect x="3" y="13.0" width="26" height="1.4" rx="0.4" fill="url(#dsk-top-edge)"/>
<!-- highlight on top -->
<rect x="4.2" y="11.4" width="23" height="0.7" rx="0.3" fill="#e9c08a" fill-opacity="0.6"/>
<!-- drawer / apron under top -->
<rect x="17.5" y="14.4" width="9.5" height="4.6" rx="0.6" fill="url(#dsk-drawer)"/>
<rect x="18.4" y="16.2" width="5" height="0.9" rx="0.45" fill="#5e3818"/>
<!-- legs -->
<rect x="4.5" y="14.4" width="2.2" height="14" rx="0.6" fill="url(#dsk-leg)"/>
<rect x="25.3" y="14.4" width="2.2" height="14" rx="0.6" fill="url(#dsk-leg)"/>
<!-- foot shadows -->
<ellipse cx="5.6" cy="28.6" rx="1.4" ry="0.5" fill="#000" fill-opacity="0.18"/>
<ellipse cx="26.4" cy="28.6" rx="1.4" ry="0.5" fill="#000" fill-opacity="0.18"/>
</svg>
