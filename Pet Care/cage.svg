<defs>
<linearGradient id="cg-bar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#f0d676"/>
<stop offset="100%" stop-color="#c79a34"/>
</linearGradient>
<linearGradient id="cg-base" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#c79a34"/>
<stop offset="100%" stop-color="#9a7322"/>
</linearGradient>
</defs>
<!-- Cage: a birdcage (domed top, handle, vertical bars, door, base) -->
<!-- hanging handle -->
<path d="M11.5 6 Q11.5 2.2 16 2.2 Q20.5 2.2 20.5 6" fill="none" stroke="#7a5a18" stroke-width="0.7"/>
<!-- domed top -->
<path d="M5.5 11 Q5.5 5.5 16 5.5 Q26.5 5.5 26.5 11 Z" fill="url(#cg-bar)" stroke="#7a5a18" stroke-width="0.5"/>
<!-- dome ribs -->
<g stroke="#9a7322" stroke-width="0.45" fill="none">
<path d="M10 10.5 Q11 7 12.5 6"/>
<path d="M14 10.5 Q14.5 7 15.4 6"/>
<path d="M18 10.5 Q17.5 7 16.6 6"/>
<path d="M22 10.5 Q21 7 19.5 6"/>
</g>
<!-- top ring -->
<rect x="5" y="10.5" width="22" height="1.6" rx="0.6" fill="url(#cg-base)"/>
<!-- cage body bars -->
<rect x="6" y="12.1" width="20" height="12.4" fill="#fbf3d8" fill-opacity="0.25"/>
<g stroke="url(#cg-bar)" stroke-width="1.1">
<line x1="7.5" y1="12.1" x2="7.5" y2="24.5"/>
<line x1="10" y1="12.1" x2="10" y2="24.5"/>
<line x1="12.5" y1="12.1" x2="12.5" y2="24.5"/>
<line x1="15" y1="12.1" x2="15" y2="24.5"/>
<line x1="17.5" y1="12.1" x2="17.5" y2="24.5"/>
<line x1="20" y1="12.1" x2="20" y2="24.5"/>
<line x1="22.5" y1="12.1" x2="22.5" y2="24.5"/>
<line x1="24.5" y1="12.1" x2="24.5" y2="24.5"/>
</g>
<!-- mid cross-bar -->
<rect x="6" y="17.8" width="20" height="1" fill="url(#cg-base)"/>
<!-- little door frame + latch -->
<rect x="12.5" y="15" width="7" height="8" fill="none" stroke="#7a5a18" stroke-width="0.7"/>
<circle cx="18.6" cy="19" r="0.7" fill="#9a7322" stroke="#7a5a18" stroke-width="0.3"/>
<!-- base -->
<rect x="4.5" y="24.5" width="23" height="2.6" rx="0.6" fill="url(#cg-base)" stroke="#7a5a18" stroke-width="0.4"/>
<rect x="6.5" y="27.1" width="19" height="1.6" rx="0.5" fill="url(#cg-base)"/>
<!-- gloss on dome -->
<ellipse cx="11" cy="8" rx="2.5" ry="1.2" fill="#ffffff" fill-opacity="0.3"/>
</svg>
