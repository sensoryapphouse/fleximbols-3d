 <defs>
 <linearGradient id="bowlBody" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#f4f0ec"/>
 <stop offset="50%" stop-color="#ddd8d0"/>
 <stop offset="100%" stop-color="#b8b0a8"/>
 </linearGradient>
 <linearGradient id="bowlInside" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#f8f4f0"/>
 <stop offset="100%" stop-color="#ddd8d0"/>
 </linearGradient>
 <linearGradient id="bowlRim" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e8e4e0"/>
 <stop offset="100%" stop-color="#c0bbb5"/>
 </linearGradient>
 <radialGradient id="bowlSheen" cx="35%" cy="30%" r="55%">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="bowlInsideR" cx="50%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#f8f4f0"/>
 <stop offset="100%" stop-color="#d8d0c8"/>
 </radialGradient>
 </defs>
 <!-- drop shadow -->
 <!-- bowl outer body -->
 <path d="M5,16 Q5,27 16,27 Q27,27 27,16 Z" fill="url(#bowlBody)"/>
 <!-- rim -->
 <ellipse cx="16" cy="16" rx="11" ry="2.8" fill="url(#bowlRim)"/>
 <!-- inside of bowl visible from 3/4 angle -->
 <ellipse cx="16" cy="16" rx="9.5" ry="2.2" fill="url(#bowlInsideR)"/>
 <!-- inner shadow depth -->
 <ellipse cx="16" cy="22" rx="6" ry="1.8" fill="#d0c8c0" fill-opacity="0.4"/>
 <!-- bowl sheen -->
 <path d="M6,18 Q7,20 9,23" stroke="url(#bowlSheen)" stroke-width="2" fill="none"/>
 <!-- outer surface sheen highlight -->
 <path d="M8,19 Q8,23 10,25" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-opacity="0.3" stroke-linecap="round"/>
 <!-- rim highlight -->
 <path d="M9,14.5 Q12,14 16,14 Q20,14 23,14.5" stroke="#ffffff" stroke-width="1" fill="none" stroke-opacity="0.5"/>
 <!-- small rim decoration line -->
 <ellipse cx="16" cy="16" rx="10.5" ry="2.5" fill="none" stroke="#c0bbb5" stroke-width="0.4" stroke-opacity="0.5"/>
</svg>
