<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <radialGradient id="ciSkin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#f3cda6"/>
      <stop offset="1" stop-color="#d29e6f"/>
    </radialGradient>
    <linearGradient id="ciProc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8fe0"/>
      <stop offset="1" stop-color="#2f5fb0"/>
    </linearGradient>
    <radialGradient id="ciCoil" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6ea0e8"/>
      <stop offset="1" stop-color="#2c569e"/>
    </radialGradient>
  </defs>

  <!-- ear (left side) -->
  <g>
    <path d="M14 7
             C 9 6.5, 6.5 10, 6.8 14.5
             C 7 19, 9 23, 12 24.5
             C 13.4 25.2, 14.6 24.2, 14.2 22.6
             C 13.7 20.6, 12.6 19.6, 13.4 17.2
             C 14.0 15.4, 16 14.6, 16 11.6
             C 16 9, 16 7.4, 14 7 Z" fill="url(#ciSkin)" stroke="#b07f52" stroke-width="0.6"/>
    <!-- inner ear fold -->
    <path d="M12.8 10.2 C 10.6 10.4, 9.6 12.4, 9.9 14.6 C 10.2 17, 11.4 19.4, 12.6 20.4"
          fill="none" stroke="#b07f52" stroke-width="0.6" opacity="0.8"/>
  </g>

  <!-- behind-the-ear (BTE) sound processor hooking over the top of the ear -->
  <path d="M14 8.2 q3.6 -1.4 4.2 1.4" fill="none" stroke="#3a5fa0" stroke-width="1.0" stroke-linecap="round"/>
  <rect x="17.4" y="8.2" width="3.6" height="7.2" rx="1.4" fill="url(#ciProc)" stroke="#274d92" stroke-width="0.4"/>
  <!-- processor mic dot + indicator -->
  <circle cx="19.2" cy="10.2" r="0.7" fill="#15305f"/>
  <rect x="18.1" y="12" width="2.2" height="2.2" rx="0.4" fill="#9fc0ef"/>

  <!-- coil wire from processor to round coil on head -->
  <path d="M19.2 15.4 Q20.6 17.4 21.6 18.6" fill="none" stroke="#3a5fa0" stroke-width="0.7"/>

  <!-- round transmitter coil (magnet) on the scalp -->
  <circle cx="22.6" cy="19.8" r="3.2" fill="url(#ciCoil)" stroke="#244a8e" stroke-width="0.5"/>
  <circle cx="22.6" cy="19.8" r="1.7" fill="none" stroke="#bcd4f4" stroke-width="0.7"/>
  <circle cx="22.6" cy="19.8" r="0.7" fill="#bcd4f4"/>
  <!-- coil gloss -->
  <ellipse cx="21.4" cy="18.4" rx="1.2" ry="0.7" fill="#ffffff" opacity="0.35"/>
</svg>
