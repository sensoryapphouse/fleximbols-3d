<defs>
<radialGradient id="cloud" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#7A8898"/><stop offset="100%" stop-color="#1A1F2C"/></radialGradient>
<linearGradient id="funnel" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#7A8898"/><stop offset="100%" stop-color="#2A3040"/></linearGradient>
