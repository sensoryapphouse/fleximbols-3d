 <defs>
 <linearGradient id="domTile" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2A2A3A"/><stop offset="100%" stop-color="#0A0A1A"/></linearGradient>
 <radialGradient id="domDot" cx="40%" cy="40%" r="55%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#C0C0D0"/></radialGradient>
 </defs>
 <!-- Domino 1 (standing upright) -->
 <g filter="url(#sdDom)">
 <rect x="4" y="8" width="5" height="9" rx="0.7" fill="url(#domTile)"/>
 <line x1="4" y1="12.5" x2="9" y2="12.5" stroke="white" stroke-opacity="0.3" stroke-width="0.4"/>
 <circle cx="5.5" cy="10.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="7.5" cy="10.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="6.5" cy="14.5" r="0.6" fill="url(#domDot)"/>
 </g>
 <!-- Domino 2 (standing) -->
 <g filter="url(#sdDom)">
 <rect x="11" y="10" width="5" height="9" rx="0.7" fill="url(#domTile)"/>
 <line x1="11" y1="14.5" x2="16" y2="14.5" stroke="white" stroke-opacity="0.3" stroke-width="0.4"/>
 <circle cx="12.5" cy="12.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="14.5" cy="12.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="13.5" cy="12.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="13.5" cy="16.5" r="0.6" fill="url(#domDot)"/>
 </g>
 <!-- Domino 3 (lying flat, slightly tilted) -->
 <g filter="url(#sdDom)" transform="rotate(-15 22 18)">
 <rect x="18" y="14" width="8" height="5" rx="0.7" fill="url(#domTile)"/>
 <line x1="22" y1="14" x2="22" y2="19" stroke="white" stroke-opacity="0.3" stroke-width="0.4"/>
 <circle cx="20" cy="15.5" r="0.5" fill="url(#domDot)"/>
 <circle cx="20" cy="17.5" r="0.5" fill="url(#domDot)"/>
 <circle cx="24" cy="16.5" r="0.5" fill="url(#domDot)"/>
 </g>
 <!-- Domino 4 (another standing) -->
 <g filter="url(#sdDom)">
 <rect x="24" y="6" width="5" height="9" rx="0.7" fill="url(#domTile)"/>
 <line x1="24" y1="10.5" x2="29" y2="10.5" stroke="white" stroke-opacity="0.3" stroke-width="0.4"/>
 <circle cx="26.5" cy="8.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="25.5" cy="9.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="27.5" cy="9.5" r="0.6" fill="url(#domDot)"/>
 <circle cx="26.5" cy="12" r="0.6" fill="url(#domDot)"/>
 <circle cx="25.5" cy="13" r="0.6" fill="url(#domDot)"/>
 <circle cx="27.5" cy="13" r="0.6" fill="url(#domDot)"/>
 </g>
</svg>
