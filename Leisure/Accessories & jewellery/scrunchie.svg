<defs>
 <radialGradient id="scFab" cx="40%" cy="35%" r="75%">
  <stop offset="0" stop-color="#FFB8D8"/><stop offset="60%" stop-color="#F26FAE"/><stop offset="100%" stop-color="#C93B86"/>
 </radialGradient>
 <radialGradient id="scInner" cx="50%" cy="50%" r="55%">
  <stop offset="0" stop-color="#E8B9CE"/><stop offset="100%" stop-color="#C98AAE"/>
 </radialGradient>
</defs>
<!-- ruffled fabric ring: scalloped outer edge so it reads as gathered cloth, not a donut -->
<g>
 <!-- outer scalloped fabric body -->
 <path d="M16 3
   Q19 4 20.4 5.2 Q23 5 24.4 6.6 Q27 7 27.4 9.4 Q29 11 28.6 13.6
   Q30 16 28.6 18.4 Q29 21 27.4 22.6 Q27 25 24.4 25.4 Q23 27 20.4 26.8
   Q19 28 16 29 Q13 28 11.6 26.8 Q9 27 7.6 25.4 Q5 25 4.6 22.6
   Q3 21 3.4 18.4 Q2 16 3.4 13.6 Q3 11 4.6 9.4 Q5 7 7.6 6.6
   Q9 5 11.6 5.2 Q13 4 16 3 Z" fill="url(#scFab)"/>
 <!-- inner hole (smaller, soft) -->
 <circle cx="16" cy="16" r="6.4" fill="url(#scInner)"/>
 <circle cx="16" cy="16" r="5.4" fill="#FFFFFF" opacity="0.0"/>
 <!-- carve the actual hole -->
 <circle cx="16" cy="16" r="5.4" fill="#FBEFF4"/>
</g>
<!-- radial scrunch gathers (folds in the fabric) -->
<g stroke="#C93B86" stroke-width="0.7" stroke-linecap="round" opacity="0.65" fill="none">
 <path d="M16 4 L16 9.6"/>
 <path d="M22.5 6.5 L19.5 11"/>
 <path d="M27 11 L22.5 13.5"/>
 <path d="M28 16 L22.4 16"/>
 <path d="M27 21 L22.5 18.5"/>
 <path d="M22.5 25.5 L19.5 21"/>
 <path d="M16 28 L16 22.4"/>
 <path d="M9.5 25.5 L12.5 21"/>
 <path d="M5 21 L9.5 18.5"/>
 <path d="M4 16 L9.6 16"/>
 <path d="M5 11 L9.5 13.5"/>
 <path d="M9.5 6.5 L12.5 11"/>
</g>
<!-- highlight gathers (lighter folds) -->
<g stroke="#FFE0EE" stroke-width="0.5" stroke-linecap="round" opacity="0.7" fill="none">
 <path d="M19 4.6 L17.8 9.8"/>
 <path d="M25 8.5 L21 12"/>
 <path d="M27.4 18.5 L22 17.6"/>
 <path d="M13 4.6 L14.2 9.8"/>
 <path d="M4.6 18.5 L10 17.6"/>
</g>
<!-- soft gloss -->
<ellipse cx="10.5" cy="9" rx="3" ry="1.6" fill="#FFFFFF" opacity="0.3" transform="rotate(-35 10.5 9)"/>
</svg>
