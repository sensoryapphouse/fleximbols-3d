<defs>
 <radialGradient id="cc_mitGrad" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#E84040"/>
 <stop offset="100%" stop-color="#AA1010"/>
 </radialGradient>
</defs>
<g filter="url(#cc_drop)">
 <!-- Pair of knitted mittens - red with white snowflake fair-isle band at cuff -->
 <!-- Connecting cord between mittens -->
 <path d="M9 18 Q16 14 23 18" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="1.5,1"/>
 <!-- Left mitten (single thumb compartment, all four fingers in one pouch) -->
 <g transform="translate(2 0)">
 <!-- Main mitten pouch -->
 <path d="M1 18 Q1 10 6 8 Q11 8 11 14 L11 22 Q9 25 6 25 Q2 24 1 21Z" fill="url(#cc_mitGrad)"/>
 <!-- Thumb compartment -->
 <path d="M11 12 Q14 11 14.5 13.5 Q14 16 11 15Z" fill="url(#cc_mitGrad)"/>
 <!-- White fair-isle snowflake band at cuff -->
 <rect x="1" y="20" width="10" height="5" rx="1" fill="#CC1010"/>
 <!-- Snowflake pattern band -->
 <rect x="1.5" y="21" width="9" height="1.5" rx="0.3" fill="white" opacity="0.7"/>
 <text x="6" y="22.3" text-anchor="middle" font-size="2.2" fill="#CC1010" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">❄</text>
 <rect x="1.5" y="23.2" width="9" height="0.8" rx="0.3" fill="white" opacity="0.4"/>
 <!-- Knit texture horizontal lines -->
 <line x1="1" y1="10" x2="11" y2="10" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="12" x2="11" y2="12" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="14" x2="11" y2="14" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="16" x2="11" y2="16" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="18" x2="11" y2="18" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 </g>
 <!-- Right mitten (mirror) -->
 <g transform="translate(30 0) scale(-1,1)">
 <path d="M1 18 Q1 10 6 8 Q11 8 11 14 L11 22 Q9 25 6 25 Q2 24 1 21Z" fill="url(#cc_mitGrad)"/>
 <path d="M11 12 Q14 11 14.5 13.5 Q14 16 11 15Z" fill="url(#cc_mitGrad)"/>
 <rect x="1" y="20" width="10" height="5" rx="1" fill="#CC1010"/>
 <rect x="1.5" y="21" width="9" height="1.5" rx="0.3" fill="white" opacity="0.7"/>
 <text x="6" y="22.3" text-anchor="middle" font-size="2.2" fill="#CC1010" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif">❄</text>
 <rect x="1.5" y="23.2" width="9" height="0.8" rx="0.3" fill="white" opacity="0.4"/>
 <line x1="1" y1="10" x2="11" y2="10" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="12" x2="11" y2="12" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="14" x2="11" y2="14" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="16" x2="11" y2="16" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 <line x1="1" y1="18" x2="11" y2="18" stroke="#CC1010" stroke-width="0.5" opacity="0.4"/>
 </g>
