<defs>
<linearGradient id="dsBody" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#3A4A56"/>
<stop offset="55%" stop-color="#212E38"/>
<stop offset="100%" stop-color="#10181E"/>
</linearGradient>
<linearGradient id="dsSeal" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#9AAAB6"/>
<stop offset="100%" stop-color="#566570"/>
</linearGradient>
<linearGradient id="dsStripe" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#FF5A52"/>
<stop offset="100%" stop-color="#B81818"/>
</linearGradient>
<filter id="dssh" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/><feOffset dx="0.3" dy="0.6" result="off"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<!-- full one-piece suit body: neck, torso, arms, legs all connected -->
<path d="M 12.5 5
 Q 16 4 19.5 5
 L 21 6.5
 Q 24.5 8 26.5 13
 Q 27 14.5 25 15.2
 Q 23 15.8 22 14
 Q 21.4 12.6 20.5 11.5
 L 20.5 20
 Q 21 24 21.2 28
 Q 21.3 29 20 29
 L 17.2 29
 Q 16 29 16 28
 L 16 22
 L 16 28
 Q 16 29 14.8 29
 L 12 29
 Q 10.7 29 10.8 28
 Q 11 24 11.5 20
 L 11.5 11.5
 Q 10.6 12.6 10 14
 Q 9 15.8 7 15.2
 Q 5 14.5 5.5 13
 Q 7.5 8 11 6.5
 Z" fill="url(#dsBody)" filter="url(#dssh)"/>
<!-- neck seal -->
<ellipse cx="16" cy="5" rx="3.6" ry="1.6" fill="url(#dsSeal)"/>
<!-- wrist seals -->
<ellipse cx="6.2" cy="14.4" rx="1.8" ry="0.9" fill="url(#dsSeal)" transform="rotate(20 6.2 14.4)"/>
<ellipse cx="25.8" cy="14.4" rx="1.8" ry="0.9" fill="url(#dsSeal)" transform="rotate(-20 25.8 14.4)"/>
