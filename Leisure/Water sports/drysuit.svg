<rect x="11.4" y="27.6" width="3.2" height="1.3" rx="0.5" fill="url(#dsSeal)"/>
<rect x="17.4" y="27.6" width="3.2" height="1.3" rx="0.5" fill="url(#dsSeal)"/>
<!-- diagonal front zip -->
<path d="M 13.5 7 Q 16 13 15.5 21" stroke="#AAB6C0" stroke-width="0.5" fill="none"/>
<!-- chest accent stripe -->
<path d="M 11.5 13 L 20.5 13" stroke="url(#dsStripe)" stroke-width="1.3"/>
