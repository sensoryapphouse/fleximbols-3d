 <defs>
 <radialGradient id="malletGrad" cx="0.3" cy="0.3" r="0.9">
 <stop offset="0%" stop-color="#f0c080"/>
 <stop offset="50%" stop-color="#d09040"/>
 <stop offset="100%" stop-color="#6a4010"/>
 </radialGradient>
 <radialGradient id="handleGrad" cx="0.3" cy="0.3" r="0.9">
 <stop offset="0%" stop-color="#f5d09a"/>
 <stop offset="100%" stop-color="#8a5a20"/>
 </radialGradient>
 <radialGradient id="ballGrad" cx="0.3" cy="0.3" r="0.9">
 <stop offset="0%" stop-color="#ffb0a0"/>
 <stop offset="40%" stop-color="#ff5040"/>
 <stop offset="100%" stop-color="#a01020"/>
 </radialGradient>
 <radialGradient id="wicketGrad" cx="0.3" cy="0.3" r="0.9">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="50%" stop-color="#c8c8b8"/>
 <stop offset="100%" stop-color="#606060"/>
 </radialGradient>
 <radialGradient id="grassGrad" cx="0.5" cy="0.0" r="1">
 <stop offset="0%" stop-color="#80d040"/>
 <stop offset="100%" stop-color="#306010"/>
 </radialGradient>
 </defs>
 <!-- Grass ground -->
 
 <g stroke="#2a6a18" stroke-width="0.2" opacity="0.7">
 <line x1="5" y1="28" x2="5" y2="27"/>
 <line x1="8" y1="29" x2="8" y2="28"/>
 <line x1="12" y1="29.5" x2="12" y2="28.5"/>
 <line x1="24" y1="29" x2="24" y2="28"/>
 <line x1="27" y1="28" x2="27" y2="27"/>
 </g>
 <!-- Mallet handle (long, diagonal) -->
 <rect x="2" y="2" width="2" height="20" rx="0.8" fill="url(#handleGrad)" transform="rotate(-30 3 12)"/>
 <!-- Mallet head -->
 <rect x="3" y="20" width="10" height="3.5" rx="0.6" fill="url(#malletGrad)"/>
 <rect x="3.4" y="20.3" width="9.2" height="0.9" rx="0.3" fill="#ffffff" opacity="0.4"/>
 <!-- Stripes on mallet head -->
 <rect x="5" y="20" width="0.5" height="3.5" fill="#5a3010" opacity="0.6"/>
 <rect x="10" y="20" width="0.5" height="3.5" fill="#5a3010" opacity="0.6"/>
 <!-- Ball -->
 <circle cx="21" cy="26" r="2.4" fill="url(#ballGrad)"/>
 <ellipse cx="20.2" cy="25" rx="0.9" ry="0.6" fill="#ffffff" opacity="0.6"/>
 <!-- Wicket (wire arch in ground) -->
 <line x1="25" y1="27" x2="25" y2="20" stroke="url(#wicketGrad)" stroke-width="0.8"/>
 <path d="M25 20 Q27.5 17 30 20" fill="none" stroke="url(#wicketGrad)" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="30" y1="20" x2="30" y2="27" stroke="url(#wicketGrad)" stroke-width="0.8"/>
</svg>
