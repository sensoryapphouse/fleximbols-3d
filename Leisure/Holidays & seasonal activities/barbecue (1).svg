 <defs>
 <linearGradient id="bbqBody" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#505050"/>
 <stop offset="100%" stop-color="#202020"/>
 </linearGradient>
 <linearGradient id="bbqLid" x1="0" y1="0" x2="1" y2="1">
