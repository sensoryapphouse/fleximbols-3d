 <defs>
 <radialGradient id="pi_basket" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#e8c080"/><stop offset="70%" stop-color="#c09040"/><stop offset="100%" stop-color="#885010"/></radialGradient>
