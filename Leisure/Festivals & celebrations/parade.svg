<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Bunting cord -->
 <linearGradient id="cordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#88AACC"/>
 <stop offset="100%" stop-color="#AACCEE"/>
 </linearGradient>
 <!-- Bunting flags -->
 <linearGradient id="bFlag1" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FF2222"/>
 <stop offset="100%" stop-color="#AA0000"/>
 </linearGradient>
 <linearGradient id="bFlag2" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#2266FF"/>
 <stop offset="100%" stop-color="#0033AA"/>
 </linearGradient>
 <linearGradient id="bFlag3" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFD700"/>
 <stop offset="100%" stop-color="#CC8800"/>
 </linearGradient>
 <!-- Figure uniforms -->
 <linearGradient id="uni1" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#DD2222"/>
 <stop offset="100%" stop-color="#880000"/>
 </linearGradient>
 <linearGradient id="uni2" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#2255EE"/>
 <stop offset="100%" stop-color="#001188"/>
 </linearGradient>
 <linearGradient id="uni3" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#DDBB00"/>
 <stop offset="100%" stop-color="#886600"/>
 </linearGradient>
 <!-- Flag poles/flags -->
 <linearGradient id="flag1Col" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FF4444"/>
 <stop offset="100%" stop-color="#CC0000"/>
 </linearGradient>
 <linearGradient id="flag2Col" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#4488FF"/>
 <stop offset="100%" stop-color="#0033CC"/>
 </linearGradient>
 <linearGradient id="flag3Col" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFEE22"/>
 <stop offset="100%" stop-color="#CC9900"/>
 </linearGradient>
 <!-- Skin -->
 <radialGradient id="skinGrad" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FFCCAA"/>
 <stop offset="100%" stop-color="#CC8855"/>
 </radialGradient>
 <!-- Pole gradient -->
 <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#CCAA66"/>
 <stop offset="100%" stop-color="#AA8833"/>
 </linearGradient>
 <!-- Motion line gradient -->
 <linearGradient id="motionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#AAAAAA"/>
 <stop offset="100%" stop-color="#AAAAAA" stop-opacity="0.000"/>
 </linearGradient>
 </defs>

 <!-- Bunting overhead -->
 <path d="M1 6 Q5 8 9 6 Q13 8 17 6 Q21 8 25 6 Q28 8 31 6"
 stroke="url(#cordGrad)" stroke-width="0.4" fill="none"/>
 <!-- Bunting triangles -->
 <polygon points="1,6 4,6 2.5,10" fill="url(#bFlag1)"/>
 <polygon points="4.5,6 7.5,6 6,10" fill="url(#bFlag2)"/>
 <polygon points="8,6 11,6 9.5,10" fill="url(#bFlag3)"/>
 <polygon points="11.5,6 14.5,6 13,10" fill="url(#bFlag1)"/>
 <polygon points="15,6 18,6 16.5,10" fill="url(#bFlag2)"/>
 <polygon points="18.5,6 21.5,6 20,10" fill="url(#bFlag3)"/>
 <polygon points="22,6 25,6 23.5,10" fill="url(#bFlag1)"/>
 <polygon points="25.5,6 28.5,6 27,10" fill="url(#bFlag2)"/>
 <polygon points="29,6 31,6 30,9" fill="url(#bFlag3)"/>

 <!-- Motion lines below feet (ground level ~29) -->
 <line x1="2" y1="28.5" x2="7" y2="28.5" stroke="url(#motionGrad)" stroke-width="0.5"/>
 <line x1="2" y1="29.5" x2="7" y2="29.5" stroke="url(#motionGrad)" stroke-width="0.5"/>
 <line x1="11" y1="28.5" x2="16" y2="28.5" stroke="url(#motionGrad)" stroke-width="0.5"/>
 <line x1="11" y1="29.5" x2="16" y2="29.5" stroke="url(#motionGrad)" stroke-width="0.5"/>
 <line x1="19" y1="28.5" x2="25" y2="28.5" stroke="url(#motionGrad)" stroke-width="0.5"/>
 <line x1="19" y1="29.5" x2="25" y2="29.5" stroke="url(#motionGrad)" stroke-width="0.5"/>

 <!-- ===== FIGURE 1 (leftmost, red uniform) ===== -->
 <!-- Pole -->
 <line x1="9" y1="12" x2="9" y2="27" stroke="url(#poleGrad)" stroke-width="0.6"/>
 <!-- Red flag waving -->
 <path d="M9 12 Q12 13.5 9 15" fill="url(#flag1Col)"/>
 <!-- Body -->
 <rect x="5.5" y="19" width="3" height="5" rx="0.7" fill="url(#uni1)"/>
 <!-- Head -->
 <circle cx="7" cy="17.5" r="1.5" fill="url(#skinGrad)"/>
 <!-- Hat (marching band tall hat) -->
 <rect x="5.8" y="14.5" width="2.4" height="2.5" rx="0.3" fill="url(#uni1)"/>
 <rect x="5.3" y="16.7" width="3.4" height="0.6" rx="0.2" fill="url(#uni1)"/>
 <!-- Right arm (holding pole) -->
 <line x1="8.5" y1="20" x2="9" y2="18" stroke="url(#uni1)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Left arm swinging -->
 <line x1="5.5" y1="20" x2="3.5" y2="21.5" stroke="url(#uni1)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Legs — marching step (left leg forward) -->
 <line x1="6.5" y1="24" x2="5" y2="28" stroke="url(#uni1)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="8" y1="24" x2="9.5" y2="27.5" stroke="url(#uni1)" stroke-width="1.1" stroke-linecap="round"/>

 <!-- ===== FIGURE 2 (middle, blue uniform) ===== -->
 <!-- Pole -->
 <line x1="18" y1="11" x2="18" y2="26" stroke="url(#poleGrad)" stroke-width="0.6"/>
 <!-- Blue flag waving -->
 <path d="M18 11 Q21 12.5 18 14.5" fill="url(#flag2Col)"/>
 <!-- Body -->
 <rect x="14.5" y="18" width="3" height="5" rx="0.7" fill="url(#uni2)"/>
 <!-- Head -->
 <circle cx="16" cy="16.5" r="1.5" fill="url(#skinGrad)"/>
 <!-- Hat -->
 <rect x="14.8" y="13.5" width="2.4" height="2.5" rx="0.3" fill="url(#uni2)"/>
 <rect x="14.3" y="15.7" width="3.4" height="0.6" rx="0.2" fill="url(#uni2)"/>
 <!-- Right arm holding pole -->
 <line x1="17.5" y1="19" x2="18" y2="17" stroke="url(#uni2)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Left arm swinging -->
 <line x1="14.5" y1="19" x2="12.5" y2="20.5" stroke="url(#uni2)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Legs marching -->
 <line x1="15.5" y1="23" x2="14" y2="27.5" stroke="url(#uni2)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="17" y1="23" x2="18.5" y2="27" stroke="url(#uni2)" stroke-width="1.1" stroke-linecap="round"/>

 <!-- ===== FIGURE 3 (rightmost, yellow uniform) ===== -->
 <!-- Pole -->
 <line x1="27" y1="12" x2="27" y2="27" stroke="url(#poleGrad)" stroke-width="0.6"/>
 <!-- Yellow flag waving -->
 <path d="M27 12 Q30 13.5 27 15.5" fill="url(#flag3Col)"/>
 <!-- Body -->
 <rect x="23.5" y="19" width="3" height="5" rx="0.7" fill="url(#uni3)"/>
 <!-- Head -->
 <circle cx="25" cy="17.5" r="1.5" fill="url(#skinGrad)"/>
 <!-- Hat -->
 <rect x="23.8" y="14.5" width="2.4" height="2.5" rx="0.3" fill="url(#uni3)"/>
 <rect x="23.3" y="16.7" width="3.4" height="0.6" rx="0.2" fill="url(#uni3)"/>
 <!-- Right arm holding pole -->
 <line x1="26.5" y1="20" x2="27" y2="18" stroke="url(#uni3)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Left arm swinging -->
 <line x1="23.5" y1="20" x2="21.5" y2="21.5" stroke="url(#uni3)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Legs marching -->
 <line x1="24.5" y1="24" x2="23" y2="28" stroke="url(#uni3)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="26" y1="24" x2="27.5" y2="27.5" stroke="url(#uni3)" stroke-width="1.1" stroke-linecap="round"/>
</svg>
