<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Mask gradient -->
 <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF6B35"/>
 <stop offset="50%" stop-color="#FFD700"/>
 <stop offset="100%" stop-color="#FF3366"/>
 </linearGradient>
 <!-- Left feather gradient -->
 <linearGradient id="feathL" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#00C896"/>
 <stop offset="100%" stop-color="#0080FF"/>
 </linearGradient>
 <!-- Center feather gradient -->
 <linearGradient id="feathC" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFD700"/>
 <stop offset="100%" stop-color="#FF6B00"/>
 </linearGradient>
 <!-- Right feather gradient -->
 <linearGradient id="feathR" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF3DCC"/>
 <stop offset="100%" stop-color="#9B30FF"/>
 </linearGradient>
 <!-- Eye holes -->
 <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#1A0033"/>
 <stop offset="100%" stop-color="#3A006F"/>
 </radialGradient>
 <!-- Nose bridge accent -->
 <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#FFA040"/>
 <stop offset="100%" stop-color="#CC3300"/>
 </linearGradient>
 <!-- Confetti gradients -->
 <linearGradient id="conf1" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF3366"/>
 <stop offset="100%" stop-color="#FF8800"/>
 </linearGradient>
 <linearGradient id="conf2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#00C896"/>
 <stop offset="100%" stop-color="#0066FF"/>
 </linearGradient>
 <linearGradient id="conf3" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD700"/>
 <stop offset="100%" stop-color="#FF6B35"/>
 </linearGradient>
 <linearGradient id="conf4" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#CC44FF"/>
 <stop offset="100%" stop-color="#FF3399"/>
 </linearGradient>
 <!-- Sparkle gradient -->
 <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#FFD700"/>
 </radialGradient>
 </defs>

 <!-- Far-left feather (fan out) -->
 <ellipse cx="7" cy="8" rx="1.6" ry="5" transform="rotate(-40 7 8)" fill="url(#feathL)" opacity="0.9"/>
 <ellipse cx="9" cy="6.5" rx="1.4" ry="4.5" transform="rotate(-25 9 6.5)" fill="url(#feathL)" opacity="0.85"/>

 <!-- Left-center feathers -->
 <ellipse cx="11.5" cy="5.5" rx="1.4" ry="4.8" transform="rotate(-10 11.5 5.5)" fill="url(#feathC)" opacity="0.9"/>

 <!-- Center feather (tall) -->
 <ellipse cx="16" cy="4.5" rx="1.5" ry="5.5" fill="url(#feathC)" opacity="1"/>

 <!-- Right-center feathers -->
 <ellipse cx="20.5" cy="5.5" rx="1.4" ry="4.8" transform="rotate(10 20.5 5.5)" fill="url(#feathC)" opacity="0.9"/>

 <!-- Far-right feathers -->
 <ellipse cx="23" cy="6.5" rx="1.4" ry="4.5" transform="rotate(25 23 6.5)" fill="url(#feathR)" opacity="0.85"/>
 <ellipse cx="25" cy="8" rx="1.6" ry="5" transform="rotate(40 25 8)" fill="url(#feathR)" opacity="0.9"/>

 <!-- Mask body -->
 <path d="M6 16 Q6 11 10 11 L22 11 Q26 11 26 16 L26 19 Q26 22 23 22 L20 22 Q19 24 16 24 Q13 24 12 22 L9 22 Q6 22 6 19 Z"
 fill="url(#maskGrad)"/>

 <!-- Left eye hole -->
 <ellipse cx="11.5" cy="16.5" rx="2.8" ry="2.2" fill="url(#eyeGrad)"/>
 <!-- Left eye shine -->
 <ellipse cx="10.8" cy="15.8" rx="0.7" ry="0.5" fill="#FFFFFF" opacity="0.6"/>

 <!-- Right eye hole -->
 <ellipse cx="20.5" cy="16.5" rx="2.8" ry="2.2" fill="url(#eyeGrad)"/>
 <!-- Right eye shine -->
 <ellipse cx="19.8" cy="15.8" rx="0.7" ry="0.5" fill="#FFFFFF" opacity="0.6"/>

 <!-- Nose bridge -->
 <path d="M15 17 Q16 19 17 17" stroke="url(#bridgeGrad)" stroke-width="0.8" fill="none" stroke-linecap="round"/>

 <!-- Mask outline/edge highlight -->
 <path d="M6 16 Q6 11 10 11 L22 11 Q26 11 26 16 L26 19 Q26 22 23 22 L20 22 Q19 24 16 24 Q13 24 12 22 L9 22 Q6 22 6 16 Z"
 fill="none" stroke="#FF9900" stroke-width="0.5" opacity="0.7"/>

 <!-- Confetti pieces scattered around -->
 <!-- Small rectangles / squares -->
 <rect x="3" y="13" width="1.5" height="1" rx="0.2" fill="url(#conf1)" transform="rotate(20 3.75 13.5)"/>
 <rect x="4" y="22" width="1.2" height="0.8" rx="0.2" fill="url(#conf2)" transform="rotate(-30 4.6 22.4)"/>
 <rect x="27" y="14" width="1.5" height="1" rx="0.2" fill="url(#conf3)" transform="rotate(15 27.75 14.5)"/>
 <rect x="27" y="21" width="1.2" height="0.8" rx="0.2" fill="url(#conf4)" transform="rotate(-20 27.6 21.4)"/>
 <rect x="5" y="26" width="1.4" height="0.9" rx="0.2" fill="url(#conf3)" transform="rotate(45 5.7 26.45)"/>
 <rect x="24" y="26" width="1.4" height="0.9" rx="0.2" fill="url(#conf1)" transform="rotate(-15 24.7 26.45)"/>
 <rect x="13" y="27" width="1.2" height="0.8" rx="0.2" fill="url(#conf2)" transform="rotate(10 13.6 27.4)"/>
 <rect x="18" y="27.5" width="1.2" height="0.8" rx="0.2" fill="url(#conf4)" transform="rotate(-25 18.6 27.9)"/>

 <!-- Sparkle stars -->
 <!-- Sparkle top-left -->
 <g transform="translate(3.5 10)">
 <line x1="0" y1="-1.2" x2="0" y2="1.2" stroke="url(#sparkle)" stroke-width="0.5"/>
 <line x1="-1.2" y1="0" x2="1.2" y2="0" stroke="url(#sparkle)" stroke-width="0.5"/>
 <line x1="-0.85" y1="-0.85" x2="0.85" y2="0.85" stroke="url(#sparkle)" stroke-width="0.35"/>
 <line x1="0.85" y1="-0.85" x2="-0.85" y2="0.85" stroke="url(#sparkle)" stroke-width="0.35"/>
 </g>
 <!-- Sparkle top-right -->
 <g transform="translate(28.5 10)">
 <line x1="0" y1="-1" x2="0" y2="1" stroke="url(#sparkle)" stroke-width="0.5"/>
 <line x1="-1" y1="0" x2="1" y2="0" stroke="url(#sparkle)" stroke-width="0.5"/>
 <line x1="-0.7" y1="-0.7" x2="0.7" y2="0.7" stroke="url(#sparkle)" stroke-width="0.35"/>
 <line x1="0.7" y1="-0.7" x2="-0.7" y2="0.7" stroke="url(#sparkle)" stroke-width="0.35"/>
 </g>
 <!-- Small sparkle dot -->
 <circle cx="3" cy="19" r="0.6" fill="url(#sparkle)"/>
 <circle cx="29" cy="18" r="0.6" fill="url(#sparkle)"/>
 <circle cx="16" cy="28.5" r="0.5" fill="url(#sparkle)"/>
</svg>
