 <defs>
 <linearGradient id="def-case" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e82020"/>
 <stop offset="50%" stop-color="#cc1010"/>
 <stop offset="100%" stop-color="#a00000"/>
 </linearGradient>
 <linearGradient id="def-handle" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f8f8f8"/>
 <stop offset="100%" stop-color="#d0d0d0"/>
 </linearGradient>
 <radialGradient id="def-paddle" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#e8e8e8"/>
 <stop offset="60%" stop-color="#c0c0c0"/>
 <stop offset="100%" stop-color="#909090"/>
 </radialGradient>
 <linearGradient id="def-heart" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ff4040"/>
 <stop offset="100%" stop-color="#cc0000"/>
 </linearGradient>
 </defs>
 <!-- AED red rectangular case -->
 
 <!-- White handle on top -->
 <rect x="9" y="6" width="10" height="3" rx="1" fill="url(#def-handle)"/>
 <!-- Heart symbol on case lid -->
 <path d="M10,17 Q10,14 12.5,14 Q14,14 14,15.5 Q14,14 15.5,14 Q18,14 18,17 Q18,20 14,22.5 Q10,20 10,17 Z" fill="url(#def-heart)"/>
 <!-- Yellow lightning bolt through heart -->
 <polygon points="14,14.5 12.5,18 13.8,18 12.5,22 15.5,17.5 14.2,17.5" fill="#f8e020"/>
 <!-- Coiled cables from case (white) -->
 <path d="M23,12 Q27,12 27,14 Q27,16 25,16 Q27,16 27,18 Q27,20 25,20" fill="none" stroke="#e8e8e8" stroke-width="0.9" stroke-linecap="round"/>
 <path d="M23,16 Q26,16 26,18 Q26,20 24,20" fill="none" stroke="#e8e8e8" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.5"/>
 <!-- Paddle 1 -->
 <ellipse cx="26" cy="11" rx="3" ry="2" fill="url(#def-paddle)" stroke="#808080" stroke-width="0.4"/>
 <!-- Paddle 2 -->
 <ellipse cx="26" cy="21" rx="3" ry="2" fill="url(#def-paddle)" stroke="#808080" stroke-width="0.4"/>
 <!-- Paddle highlights -->
 <ellipse cx="25.3" cy="10.5" rx="1.2" ry="0.7" fill="white" fill-opacity="0.45"/>
 <ellipse cx="25.3" cy="20.5" rx="1.2" ry="0.7" fill="white" fill-opacity="0.45"/>
</svg>
