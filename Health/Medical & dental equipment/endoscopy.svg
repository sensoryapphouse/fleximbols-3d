 <defs>
 <radialGradient id="skin" cx="38%" cy="32%" r="80%">
 <stop offset="0%" stop-color="#ffe0c2"/>
 <stop offset="100%" stop-color="#d49d78"/>
 </radialGradient>
 <linearGradient id="scope" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#7fd0ff"/>
 <stop offset="100%" stop-color="#2a6fd6"/>
 </linearGradient>
 <radialGradient id="unit" cx="35%" cy="28%" r="80%">
