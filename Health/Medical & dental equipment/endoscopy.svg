 <rect x="24" y="5" width="4.5" height="3" rx="0.5" fill="#1a4f9c"/>
 <rect x="24" y="5" width="4.5" height="0.8" rx="0.4" fill="#fff" opacity="0.3"/>
 <circle cx="25.2" cy="10.5" r="0.7" fill="#cfd8e4"/>
 <circle cx="27.3" cy="10.5" r="0.7" fill="#cfd8e4"/>
