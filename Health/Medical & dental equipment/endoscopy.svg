 <!-- head in profile facing left -->
 <path d="M7 8 Q14 5.5 18 9 Q20.5 11.5 20 15.5 Q19.5 19 17 20.5 L17 22.5 Q11 24 7.5 21 Q4 18 4.5 13.5 Q4.8 9.6 7 8 Z" fill="url(#skin)" stroke="#b9825f" stroke-width="0.4"/>
