           C24 13 21.5 9.5 16 9.5 Z"
        fill="url(#ret_plate)" stroke="#d96a92" stroke-width="0.8" fill-rule="evenodd"/>
  <!-- plate gloss -->
  <path d="M10 8 Q16 6.5 22 8 Q24 9.5 24 12 Q16 9.5 8 12 Q8 9.5 10 8 Z" fill="#ffffff" opacity="0.3"/>
