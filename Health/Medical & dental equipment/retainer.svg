  <defs>
    <radialGradient id="ret_plate" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffd0e0"/>
      <stop offset="1" stop-color="#f08bb0"/>
    </radialGradient>
    <linearGradient id="ret_wire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#c2c9d2"/>
      <stop offset="1" stop-color="#9aa3ac"/>
