  <!-- acrylic palate plate (U / horseshoe shaped) -->
  <path d="M16 5
           C24 5 28 10 28 17
           C28 24 23 27.5 16 27.5
           C9 27.5 4 24 4 17
           C4 10 8 5 16 5 Z
           M16 9.5
