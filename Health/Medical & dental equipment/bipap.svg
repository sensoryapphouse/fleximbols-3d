 <defs>
 <linearGradient id="bip-device" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#D0D8E8"/><stop offset="100%" stop-color="#8898B8"/>
 </linearGradient>
 <linearGradient id="bip-display" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#001A2A"/><stop offset="100%" stop-color="#000A18"/>
 </linearGradient>
 <linearGradient id="bip-mask" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#88AABB" stop-opacity="0.8"/><stop offset="100%" stop-color="#5578AA" stop-opacity="0.7"/>
 </linearGradient>
 <radialGradient id="bip-glow" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#44AAFF" stop-opacity="0.4"/>
 <stop offset="100%" stop-color="#2266AA" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Device body -->
 <rect x="3" y="14" width="16" height="10" rx="2" fill="url(#bip-device)" filter="url(#bip-shad)"/>
 <!-- Display screen -->
 <rect x="5" y="15.5" width="8" height="6" rx="1" fill="url(#bip-display)"/>
 <!-- Glow around display -->
 <rect x="5" y="15.5" width="8" height="6" rx="1" fill="url(#bip-glow)"/>
 <!-- Display numbers -->
 <text x="6" y="20" font-family="'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', 'Century Gothic', Verdana, sans-serif" font-size="3" fill="#44DDFF">12.5</text>
 <!-- Device controls -->
 <circle cx="17" cy="17" r="1.2" fill="#6688AA"/>
 <circle cx="17" cy="20" r="1.2" fill="#6688AA"/>
 <circle cx="17" cy="23" r="1" fill="#44BB88"/>
 <!-- Tube connecting device to mask -->
 <path d="M19 19 Q22 19 24 21 Q26 23 27 22" fill="none" stroke="#88AABB" stroke-width="2" stroke-linecap="round"/>
 <!-- Mask (suggests sleeping figure orientation) -->
 <ellipse cx="28" cy="20" rx="3" ry="4" fill="url(#bip-mask)"/>
 <!-- Mask straps suggestion -->
 <path d="M28 16 Q30 14 30 12" stroke="#88AABB" stroke-width="0.8" fill="none" stroke-opacity="0.7"/>
 <path d="M28 24 Q30 25 30 27" stroke="#88AABB" stroke-width="0.8" fill="none" stroke-opacity="0.7"/>
 <!-- Mask vents -->
 <circle cx="27.5" cy="19" r="0.5" fill="#446688" fill-opacity="0.5"/>
 <circle cx="27.5" cy="21" r="0.5" fill="#446688" fill-opacity="0.5"/>
 <!-- Power cord -->
 <path d="M3 20 Q1 20 1 22 L1 30" stroke="#444" stroke-width="1" fill="none" stroke-linecap="round"/>
 <!-- Sleeping figure silhouette (pillow + outline) -->
 <ellipse cx="14" cy="9" rx="10" ry="3" fill="#C8B090" fill-opacity="0.5"/>
 <ellipse cx="10" cy="8" rx="4" ry="3.5" fill="#FFAB76" fill-opacity="0.3"/>
</svg>
