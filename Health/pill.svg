<defs>
<linearGradient id="pl_red" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f4685c"/>
<stop offset="1" stop-color="#cc342a"/>
</linearGradient>
<linearGradient id="pl_white" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#dde0e5"/>
</linearGradient>
<filter id="pl_sh" x="-25%" y="-25%" width="150%" height="150%">
<feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
</filter>
</defs>

<!-- ground shadow -->
<ellipse cx="100" cy="150" rx="66" ry="13" fill="#000" opacity="0.08"/>

<g filter="url(#pl_sh)" transform="rotate(-35 100 100)">
<!-- capsule body -->
<rect x="38" y="78" width="124" height="44" rx="22" fill="url(#pl_white)" stroke="#b9bcc2" stroke-width="2"/>
<!-- red half -->
<path d="M60 78 L 100 78 L 100 122 L 60 122 A22 22 0 0 1 60 78 Z" fill="url(#pl_red)" stroke="#a82a22" stroke-width="2"/>
<!-- seam -->
<line x1="100" y1="78" x2="100" y2="122" stroke="#a82a22" stroke-width="2.2"/>
<!-- gloss highlights -->
<rect x="50" y="84" width="100" height="9" rx="4.5" fill="#ffffff" opacity="0.4"/>
<ellipse cx="72" cy="90" rx="10" ry="4" fill="#ffd0cb" opacity="0.5"/>
</g>
</svg>
