<defs>
 <radialGradient id="bz_skinGrad" cx="50%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#FFCBA4"/>
 <stop offset="100%" stop-color="#E8956A"/>
 </radialGradient>
</defs>
<g filter="url(#bz_drop)">
 <!-- Arm/shoulder cropped area -->
 <path d="M3 20 Q3 10 12 8 Q22 8 24 14 L26 20 Q24 22 20 22 Q10 24 3 20Z" fill="url(#bz_skinGrad)"/>
 <!-- Sleeve of shirt (upper arm) -->
 <path d="M3 20 Q3 14 8 11 L8 16 Q6 17 5 20Z" fill="#4AAEEE" opacity="0.8"/>
 <!-- Bandaid already on skin nearby -->
 <rect x="17" y="15" width="6" height="2.5" rx="0.7" fill="#E8B870"/>
 <rect x="17" y="15" width="2" height="2.5" rx="0.4" fill="#D4A060" opacity="0.6"/>
 <rect x="21" y="15" width="2" height="2.5" rx="0.4" fill="#D4A060" opacity="0.6"/>
 <line x1="17" y1="16.2" x2="23" y2="16.2" stroke="#C8A050" stroke-width="0.3"/>
 <!-- Syringe touching the skin -->
 <g transform="rotate(-60 15 12)">
 <!-- Syringe barrel -->
 <rect x="13" y="5" width="4" height="12" rx="1.5" fill="#EEEEEE" stroke="#AAAAAA" stroke-width="0.4"/>
 <!-- Liquid in barrel -->
 <rect x="13.5" y="10" width="3" height="6.5" rx="1" fill="#88BBFF"/>
 <!-- Plunger -->
 <rect x="13.5" y="4" width="3" height="1.5" rx="0.5" fill="#888"/>
 <rect x="12.5" y="3.5" width="5" height="1" rx="0.3" fill="#888"/>
 <!-- Needle -->
 <rect x="15" y="17" width="2" height="5" rx="0.5" fill="#C8C8C8"/>
 <path d="M15 22 L16 25 L17 22Z" fill="#AAAAAA"/>
 <!-- Gradation marks on barrel -->
 <line x1="13" y1="11" x2="15" y2="11" stroke="#AAAAAA" stroke-width="0.4"/>
 <line x1="13" y1="13" x2="15" y2="13" stroke="#AAAAAA" stroke-width="0.4"/>
 <line x1="13" y1="15" x2="15" y2="15" stroke="#AAAAAA" stroke-width="0.4"/>
 </g>
 <!-- Shield icon suggesting immunisation -->
 <g transform="translate(26 8)" filter="url(#bz_glow)">
 <path d="M0,-4.5 L3.5,-2.5 L3.5,1 Q3.5,4 0,5 Q-3.5,4 -3.5,1 L-3.5,-2.5 Z" fill="#27AE60" stroke="#1E8A4E" stroke-width="0.4"/>
 <polyline points="-1.5,1 0,2.5 2.5,-1" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
</g>
</svg>
