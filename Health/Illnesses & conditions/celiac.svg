 <defs>
 <radialGradient id="wheat" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFE082"/>
 <stop offset="100%" stop-color="#C8A030"/>
 </radialGradient>
 <radialGradient id="stem" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#A5E68A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 <radialGradient id="ban" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FF5252"/>
 <stop offset="100%" stop-color="#8B1A1A"/>
 </radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Wheat stalk in center -->
 <line x1="16" y1="16" x2="16" y2="28" stroke="url(#stem)" stroke-width="0.6"/>
 <!-- Wheat grains (paired ovals up the stalk) -->
 <ellipse cx="14" cy="8" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(-30 14 8)"/>
 <ellipse cx="18" cy="8" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(30 18 8)"/>
 <ellipse cx="13" cy="11" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(-30 13 11)"/>
 <ellipse cx="19" cy="11" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(30 19 11)"/>
 <ellipse cx="12" cy="14" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(-30 12 14)"/>
 <ellipse cx="20" cy="14" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(30 20 14)"/>
 <ellipse cx="11" cy="17" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(-30 11 17)"/>
 <ellipse cx="21" cy="17" rx="1.5" ry="0.8" fill="url(#wheat)" transform="rotate(30 21 17)"/>
 <ellipse cx="16" cy="6" rx="1.5" ry="0.8" fill="url(#wheat)"/>
 <!-- Awns sticking up -->
 <line x1="14" y1="7" x2="13" y2="5" stroke="#C8A030" stroke-width="0.2"/>
 <line x1="18" y1="7" x2="19" y2="5" stroke="#C8A030" stroke-width="0.2"/>
 <line x1="16" y1="5" x2="16" y2="3" stroke="#C8A030" stroke-width="0.2"/>
 <!-- Big red prohibition circle (no-gluten) -->
 <circle cx="16" cy="14" r="12.5" fill="none" stroke="url(#ban)" stroke-width="2.5"/>
 <!-- Diagonal slash -->
 <line x1="7" y1="5" x2="25" y2="23" stroke="url(#ban)" stroke-width="2.5"/>
 <ellipse cx="10" cy="6" rx="3" ry="1" fill="url(#hl)"/>
</svg>
