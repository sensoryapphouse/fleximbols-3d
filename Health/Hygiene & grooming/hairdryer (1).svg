<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="hdBodyGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#D4A0C8"/>
 <stop offset="50%" stop-color="#B870A8"/>
 <stop offset="100%" stop-color="#7A4080"/>
 </linearGradient>
 <linearGradient id="hdHandleGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#9A50A0"/>
 <stop offset="50%" stop-color="#C880B8"/>
 <stop offset="100%" stop-color="#7A4080"/>
 </linearGradient>
 <linearGradient id="hdNozzleGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#7A4080"/>
 <stop offset="100%" stop-color="#5A2060"/>
 </linearGradient>
 <linearGradient id="hdGrilleGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#3A1040"/>
 <stop offset="100%" stop-color="#1A0020"/>
 </linearGradient>
 <linearGradient id="airGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#C0E8F8" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#80C0E8" stop-opacity="0.1"/>
 </linearGradient>
 </defs>

 <!-- Handle (pistol grip, pointing down) -->
 <rect x="16" y="17" width="5" height="11" rx="2.5" fill="url(#hdHandleGrad)"/>

 <!-- Button on handle -->
 <ellipse cx="18.5" cy="21" rx="1.5" ry="1" fill="#FF8080"/>

 <!-- Motor body (horizontal cylinder) -->
 <rect x="5" y="10" width="18" height="9" rx="4.5" fill="url(#hdBodyGrad)"/>

 <!-- Grille (back end, left) -->
 <ellipse cx="7" cy="14.5" rx="3" ry="4" fill="url(#hdGrilleGrad)"/>
 <!-- Grille slots -->
 <line x1="5" y1="12.5" x2="9" y2="12.5" stroke="#5A2060" stroke-width="0.5"/>
 <line x1="4.5" y1="14" x2="9.5" y2="14" stroke="#5A2060" stroke-width="0.5"/>
 <line x1="4.5" y1="15.5" x2="9.5" y2="15.5" stroke="#5A2060" stroke-width="0.5"/>
 <line x1="5" y1="17" x2="9" y2="17" stroke="#5A2060" stroke-width="0.5"/>

 <!-- Nozzle (right end, tapered) -->
 <path d="M22 10.5 L27 12 L27 17 L22 18.5Z" fill="url(#hdNozzleGrad)"/>

 <!-- Air-flow lines from nozzle -->
 <path d="M27.5 12.5 Q30 12.5 30 14.5" stroke="url(#airGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <path d="M27.5 14.5 L31 14.5" stroke="url(#airGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <path d="M27.5 16.5 Q30 16.5 30 14.5" stroke="url(#airGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>

 <!-- Highlight on body -->
 <ellipse cx="14" cy="11.5" rx="5" ry="1.5" fill="#E8C0E0" opacity="0.4"/>
</svg>
