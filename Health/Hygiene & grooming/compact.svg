  <defs>
    <linearGradient id="cp_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc6e6"/>
      <stop offset="100%" stop-color="#3f93c4"/>
    </linearGradient>
    <linearGradient id="cp_glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff2fb"/>
      <stop offset="100%" stop-color="#aed6ec"/>
    </linearGradient>
    <radialGradient id="cp_tyre" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a5f66"/>
      <stop offset="100%" stop-color="#1c1f24"/>
    </radialGradient>
  </defs>
  <!-- "compact / small" down-arrows pressing in from sides -->
  <g fill="#e25a5a">
    <path d="M48 22 L52 22 L52 34 L56 34 L50 41 L44 34 L48 34 Z"/>
  </g>
  <g stroke="#e25a5a" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M8 64 L20 64 M20 60 L24 64 L20 68"/>
    <path d="M92 64 L80 64 M80 60 L76 64 L80 68"/>
  </g>
  <!-- Compact car body (short, stubby) -->
  <path d="M22 70 L26 52 Q28 46 36 46 L62 46 Q70 46 74 54 L78 70 Z"
