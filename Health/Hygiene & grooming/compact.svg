  <!-- lower body -->
  <rect x="20" y="62" width="60" height="12" rx="5" fill="url(#cp_body)" stroke="#235d83" stroke-width="2.8"/>
  <!-- Windows -->
  <path d="M32 50 L46 50 L46 60 L29 60 Z" fill="url(#cp_glass)" stroke="#235d83" stroke-width="1.8"/>
  <path d="M50 50 L60 50 Q66 50 69 60 L50 60 Z" fill="url(#cp_glass)" stroke="#235d83" stroke-width="1.8"/>
  <!-- Headlight / tail -->
  <circle cx="76" cy="64" r="2.4" fill="#ffd24a" stroke="#235d83" stroke-width="1"/>
  <circle cx="24" cy="64" r="2.4" fill="#e25a5a" stroke="#235d83" stroke-width="1"/>
  <!-- Wheels -->
  <circle cx="36" cy="76" r="9" fill="url(#cp_tyre)" stroke="#0e1013" stroke-width="2.5"/>
  <circle cx="36" cy="76" r="3.5" fill="#c8ccd2"/>
  <circle cx="64" cy="76" r="9" fill="url(#cp_tyre)" stroke="#0e1013" stroke-width="2.5"/>
  <circle cx="64" cy="76" r="3.5" fill="#c8ccd2"/>
