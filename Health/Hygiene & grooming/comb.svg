 <defs>
 <linearGradient id="combGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7EC8E3"/>
 <stop offset="50%" stop-color="#4A90C4"/>
 <stop offset="100%" stop-color="#2A5F8A"/>
 </linearGradient>
 <linearGradient id="combSpineGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5BA8D0"/>
 <stop offset="100%" stop-color="#1F4F75"/>
 </linearGradient>
 <linearGradient id="toothGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#9BD8EE"/>
 <stop offset="100%" stop-color="#4A90C4"/>
 </linearGradient>
 </defs>

 <!-- Comb shown horizontally -->
 <!-- Spine (thick back edge) -->
 <rect x="3" y="13" width="26" height="4" rx="1.5" fill="url(#combSpineGrad)"/>

 <!-- Handle end (slightly wider) -->
 <rect x="22" y="12" width="7" height="6" rx="2" fill="url(#combGrad)"/>

 <!-- Fine teeth along bottom edge -->
 <rect x="4" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="6" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="8" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="10" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="12" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="14" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="16" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="18" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>
 <rect x="20" y="17" width="1.2" height="5" rx="0.6" fill="url(#toothGrad)"/>

 <!-- Spine highlight -->
 <rect x="3" y="13.5" width="26" height="1.5" rx="0.75" fill="#9BD8EE" opacity="0.5"/>
</svg>
