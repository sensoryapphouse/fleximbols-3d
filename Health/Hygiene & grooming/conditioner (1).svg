<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Conditioner: pink/rose bottle -->
 <linearGradient id="condBottleGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#E8809A"/>
 <stop offset="40%" stop-color="#F5B8C8"/>
 <stop offset="70%" stop-color="#E8809A"/>
 <stop offset="100%" stop-color="#C0506A"/>
 </linearGradient>
 <linearGradient id="condCapGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F0C0CC"/>
 <stop offset="100%" stop-color="#C0506A"/>
 </linearGradient>
 <linearGradient id="condLabelGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#F5D0DA" stop-opacity="0.9"/>
 </linearGradient>
 </defs>

 <!-- Bottle body: cylindrical, pink -->
 <rect x="10" y="11" width="12" height="19" rx="5" fill="url(#condBottleGrad)"/>

 <!-- Shoulder taper at top -->
 <ellipse cx="16" cy="11" rx="6" ry="2" fill="url(#condBottleGrad)"/>

 <!-- Neck -->
 <rect x="13" y="7" width="6" height="5" rx="2" fill="url(#condBottleGrad)"/>

 <!-- Flip-cap (open, hinge on right) -->
 <rect x="12.5" y="4" width="7" height="4" rx="1.5" fill="url(#condCapGrad)"/>
 <!-- Flip lid open tab -->
 <rect x="17" y="3" width="3" height="2" rx="0.5" fill="#E8809A"/>

 <!-- Label area (white rectangle) -->
 <rect x="11.5" y="16" width="9" height="10" rx="1" fill="url(#condLabelGrad)"/>

 <!-- Pink stripe on label (conditioner symbol) -->
 <rect x="11.5" y="20" width="9" height="2" rx="0.5" fill="#E8809A" opacity="0.6"/>

 <!-- Highlight on bottle -->
 <rect x="11" y="12" width="2" height="16" rx="1" fill="#FFCCD8" opacity="0.5"/>
</svg>
