<svg width="200" height="200" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="pst_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset="1" stop-color="#D6DBE2"/>
    </linearGradient>
    <linearGradient id="pst_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F62A8"/>
      <stop offset="1" stop-color="#2B4880"/>
    </linearGradient>
    <linearGradient id="pst_base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7BDC6"/>
      <stop offset="1" stop-color="#8E949D"/>
    </linearGradient>
    <linearGradient id="pst_win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0F5"/>
      <stop offset="1" stop-color="#7FB4DC"/>
    </linearGradient>
    <linearGradient id="pst_shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="1" stop-color="#E6B62E"/>
    </linearGradient>
    <radialGradient id="pst_beacon" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8FD0FF"/>
      <stop offset="1" stop-color="#2A6FD6"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect x="1.5" y="27.4" width="29" height="2.0" rx="0.5" fill="url(#pst_base)" stroke="#7A808B" stroke-width="0.25"/>

  <!-- beacon on roof -->
  <g>
    <rect x="14.6" y="3.0" width="2.8" height="1.4" rx="0.4" fill="#3A3F47"/>
    <ellipse cx="16" cy="2.5" rx="1.5" ry="1.5" fill="url(#pst_beacon)" stroke="#1F4FA0" stroke-width="0.25"/>
    <ellipse cx="15.5" cy="2.1" rx="0.5" ry="0.4" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- roof band -->
  <rect x="4.0" y="8.4" width="24.0" height="3.4" rx="0.5" fill="url(#pst_roof)" stroke="#243E6E" stroke-width="0.3"/>
  <!-- roof crenellation dots -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="5.6" y="9.4" width="1.0" height="1.2"/><rect x="8.0" y="9.4" width="1.0" height="1.2"/>
    <rect x="23.0" y="9.4" width="1.0" height="1.2"/><rect x="25.4" y="9.4" width="1.0" height="1.2"/>
  </g>

  <!-- main wall -->
  <rect x="4.6" y="11.6" width="22.8" height="15.9" rx="0.4" fill="url(#pst_wall)" stroke="#B3B9C2" stroke-width="0.35"/>

  <!-- columns -->
  <g fill="#E3E7ED" stroke="#C2C8D0" stroke-width="0.2">
    <rect x="5.6" y="12.6" width="1.4" height="14.8"/>
    <rect x="25.0" y="12.6" width="1.4" height="14.8"/>
  </g>

  <!-- left & right windows -->
  <g stroke="#5E7CA8" stroke-width="0.3">
    <rect x="7.8" y="13.6" width="4.6" height="4.6" rx="0.3" fill="url(#pst_win)"/>
    <line x1="10.1" y1="13.6" x2="10.1" y2="18.2"/><line x1="7.8" y1="15.9" x2="12.4" y2="15.9"/>
    <rect x="19.6" y="13.6" width="4.6" height="4.6" rx="0.3" fill="url(#pst_win)"/>
    <line x1="21.9" y1="13.6" x2="21.9" y2="18.2"/><line x1="19.6" y1="15.9" x2="24.2" y2="15.9"/>
  </g>

  <!-- police shield over door -->
  <g>
    <path d="M16 12.6 C17.6 13.2 18.9 13.3 19.4 13.2 C19.4 16.4 18.6 18.6 16 19.9 C13.4 18.6 12.6 16.4 12.6 13.2 C13.1 13.3 14.4 13.2 16 12.6 Z"
          fill="url(#pst_shield)" stroke="#3F62A8" stroke-width="0.55"/>
    <path d="M16 14.0 l0.55 1.15 1.27 0.12 -0.95 0.86 0.27 1.25 -1.14 -0.66 -1.14 0.66 0.27 -1.25 -0.95 -0.86 1.27 -0.12 z" fill="#2B4880"/>
  </g>

  <!-- door -->
  <rect x="13.6" y="21.6" width="4.8" height="5.9" rx="0.3" fill="#2E343C" stroke="#1C2026" stroke-width="0.25"/>
  <rect x="14.4" y="22.4" width="3.2" height="3.0" rx="0.2" fill="#46505C"/>
  <circle cx="17.6" cy="24.6" r="0.3" fill="#C9CFD8"/>

  <!-- steps -->
  <rect x="12.4" y="26.6" width="7.2" height="0.9" fill="url(#pst_base)"/>
</svg>
