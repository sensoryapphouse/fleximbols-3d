<defs>
<linearGradient id="mb_bag" x1="0" y1="10" x2="0" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#b08a64"/><stop offset="0.55" stop-color="#8a6748"/><stop offset="1" stop-color="#6b4d32"/></linearGradient>
