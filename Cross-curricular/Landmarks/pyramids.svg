<defs>
<radialGradient id="py_sh" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#16181D" stop-opacity="0.32"/><stop offset="100%" stop-color="#16181D" stop-opacity="0"/></radialGradient>
<linearGradient id="py_sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD45E"/><stop offset="100%" stop-color="#E5A700"/></linearGradient>
<linearGradient id="py_front1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#E5A700"/><stop offset="100%" stop-color="#8B5C1A"/></linearGradient>
<linearGradient id="py_side1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5C1A"/><stop offset="100%" stop-color="#4A2E0A"/></linearGradient>
<linearGradient id="py_front2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFCB6E"/><stop offset="100%" stop-color="#A67423"/></linearGradient>
<linearGradient id="py_side2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A67423"/><stop offset="100%" stop-color="#5C3A0A"/></linearGradient>
