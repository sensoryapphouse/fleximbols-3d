 <path d="M12 24 Q16 22 20 24" stroke="url(#glg2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Sparkle/bond formed -->
 <path d="M16 21 L16.4 19.8 L17.2 21 L18.5 20.8 L17.5 21.8 L17.8 23 L16.4 22.2 L15 23 L15.3 21.8 L14.3 20.8Z" fill="#FFD700" opacity="0.8"/>
