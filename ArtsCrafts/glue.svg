 <stop offset="100%" stop-color="#BDBDBD"/>
 </radialGradient>
 </defs>
 <!-- Glue bottle body -->
 <rect x="13" y="13" width="8" height="14" rx="2" fill="url(#glg3)"/>
 <!-- Glue bottle label -->
 <rect x="14" y="16" width="6" height="7" rx="1" fill="white"/>
 <rect x="14.5" y="17" width="5" height="1" rx="0.3" fill="#FF5722"/>
 <rect x="14.5" y="19" width="5" height="0.7" rx="0.3" fill="#9E9E9E"/>
