 <defs>
 <linearGradient id="breadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#e8b850"/>
 <stop offset="40%" stop-color="#d09830"/>
 <stop offset="100%" stop-color="#a87020"/>
 </linearGradient>
 <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f0c860"/>
 <stop offset="100%" stop-color="#c88828"/>
 </linearGradient>
 <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e8c830" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#a88010" stop-opacity="0.2"/>
 </linearGradient>
 <radialGradient id="dimpleGrad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#7a5018"/>
 <stop offset="100%" stop-color="#9a6820"/>
 </radialGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Bread slab body (slightly rounded rect suggesting thickness) -->
 <!-- Bottom edge (crust side) -->
 <rect x="4" y="19" width="24" height="6" rx="2" fill="url(#breadGrad)"/>
 <!-- Top face of focaccia -->
 <rect x="4" y="8" width="24" height="12" rx="2" fill="url(#topGrad)"/>
 <!-- Oil sheen over top -->
 <rect x="4" y="8" width="24" height="12" rx="2" fill="url(#oilGrad)"/>
 <!-- Dimples (finger-press holes) in top surface -->
 <circle cx="9" cy="12" r="1" fill="url(#dimpleGrad)"/>
 <circle cx="14" cy="11" r="1.1" fill="url(#dimpleGrad)"/>
 <circle cx="19" cy="12" r="1" fill="url(#dimpleGrad)"/>
 <circle cx="24" cy="11.5" r="0.9" fill="url(#dimpleGrad)"/>
 <circle cx="11" cy="16" r="1.1" fill="url(#dimpleGrad)"/>
 <circle cx="17" cy="16.5" r="1" fill="url(#dimpleGrad)"/>
 <circle cx="22" cy="15.5" r="1.1" fill="url(#dimpleGrad)"/>
 <circle cx="7" cy="16" r="0.9" fill="url(#dimpleGrad)"/>
 <!-- Rosemary sprigs (green lines with dots) -->
 <!-- Sprig 1 -->
 <path d="M8,9 Q10,10 12,9" fill="none" stroke="#4a7830" stroke-width="0.9" stroke-linecap="round"/>
 <circle cx="9" cy="9.2" r="0.5" fill="#3a6828"/>
 <circle cx="11" cy="9.2" r="0.5" fill="#3a6828"/>
 <!-- Sprig 2 -->
 <path d="M18,9 Q20,10 22,9" fill="none" stroke="#4a7830" stroke-width="0.9" stroke-linecap="round"/>
 <circle cx="19" cy="9.2" r="0.5" fill="#3a6828"/>
 <circle cx="21" cy="9.2" r="0.5" fill="#3a6828"/>
 <!-- Sprig 3 -->
 <path d="M13,14 Q15,15 17,14" fill="none" stroke="#4a7830" stroke-width="0.9" stroke-linecap="round"/>
 <circle cx="14" cy="14.2" r="0.5" fill="#3a6828"/>
 <circle cx="16" cy="14.2" r="0.5" fill="#3a6828"/>
 <!-- Oil gleam highlights on top -->
 <path d="M6,10 Q10,9 14,10" fill="none" stroke="#fff" stroke-width="0.5" stroke-linecap="round" stroke-opacity="0.4"/>
 <path d="M18,10 Q22,9 26,10" fill="none" stroke="#fff" stroke-width="0.5" stroke-linecap="round" stroke-opacity="0.4"/>
 <!-- Crust side texture lines -->
 <line x1="6" y1="21" x2="6" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
 <line x1="10" y1="21" x2="10" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
 <line x1="14" y1="21" x2="14" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
 <line x1="18" y1="21" x2="18" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
 <line x1="22" y1="21" x2="22" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
 <line x1="26" y1="21" x2="26" y2="24" stroke="#e8c060" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
