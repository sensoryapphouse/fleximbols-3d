 <defs>
 <linearGradient id="lidGlass" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#c0e4f8" stop-opacity="0.85"/>
 <stop offset="50%" stop-color="#90c8f0" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#6098c8" stop-opacity="0.8"/>
 </linearGradient>
 <linearGradient id="lidRim" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d0d0d0"/>
 <stop offset="100%" stop-color="#909090"/>
 </linearGradient>
 <linearGradient id="lidKnob2" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#c8c8c8"/>
 <stop offset="100%" stop-color="#707070"/>
 </linearGradient>
 <radialGradient id="glassSheen" cx="35%" cy="30%" r="55%">
 <stop offset="0%" stop-color="#e0f4ff" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#80c0e8" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="steamG" x1="0" y1="1" x2="0" y2="0">
 <stop offset="0%" stop-color="#c8d8e8" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#d8e8f8" stop-opacity="0"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- lid glass dome body -->
 <path d="M5,20 Q5,26 16,26 Q27,26 27,20" fill="url(#lidGlass)"/>
 <!-- glass dome upper curve -->
 <path d="M5,20 Q5,14 16,12 Q27,14 27,20 Z" fill="url(#lidGlass)"/>
 <!-- glass sheen overlay -->
 <path d="M5,20 Q5,14 16,12 Q27,14 27,20" fill="url(#glassSheen)"/>
 <!-- rim edge -->
 <ellipse cx="16" cy="20" rx="11" ry="2.5" fill="url(#lidRim)"/>
 <!-- rim highlight -->
 <path d="M8,19 Q12,18 16,18 Q20,18 24,19" stroke="#e0e0e0" stroke-width="0.8" fill="none" stroke-opacity="0.6"/>
 <!-- steam vent hole -->
 <circle cx="16" cy="14" r="0.8" fill="#405870" fill-opacity="0.4"/>
 <!-- knob stem -->
 <rect x="15" y="8" width="2" height="5" rx="0.7" fill="url(#lidKnob2)"/>
 <!-- knob head -->
 <ellipse cx="16" cy="8" rx="3" ry="1.2" fill="url(#lidKnob2)"/>
 <ellipse cx="16" cy="7.2" rx="2.2" ry="0.8" fill="#c0c0c0"/>
 <!-- steam wisps -->
 <path d="M11,19 Q10,16 11.5,13" stroke="url(#steamG)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <path d="M14,19 Q13,16 14.5,13" stroke="url(#steamG)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <path d="M19,19 Q18,16 19.5,13" stroke="url(#steamG)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <!-- glass reflection -->
 <path d="M8,18 Q10,15 13,14" stroke="#e0f0ff" stroke-width="1.5" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>
</svg>
