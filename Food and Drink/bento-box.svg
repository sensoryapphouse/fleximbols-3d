 <defs>
 <radialGradient id="box" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#3B3F47"/>
 <stop offset="100%" stop-color="#16181D"/>
 </radialGradient>
 <radialGradient id="rice" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#E6E8EC"/>
 </radialGradient>
 <radialGradient id="salmon" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FF8FAB"/>
 <stop offset="100%" stop-color="#D63060"/>
 </radialGradient>
 <radialGradient id="veg" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#A5E68A"/>
 <stop offset="100%" stop-color="#43A047"/>
 </radialGradient>
 <radialGradient id="egg" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Square lacquered bento box, top-down view -->
 <rect x="3" y="5" width="26" height="22" rx="2" fill="url(#box)"/>
 <!-- Divider lines -->
 <line x1="16" y1="5" x2="16" y2="27" stroke="#5A5E64" stroke-width="0.4"/>
 <line x1="16" y1="16" x2="29" y2="16" stroke="#5A5E64" stroke-width="0.4"/>
 <!-- Compartment 1 (left): Rice ball -->
 <rect x="4" y="6" width="11" height="20" rx="1" fill="url(#rice)"/>
 <!-- Rice texture dots -->
 <circle cx="7" cy="10" r="0.3" fill="#C9CDD3"/>
 <circle cx="11" cy="14" r="0.3" fill="#C9CDD3"/>
 <circle cx="8" cy="18" r="0.3" fill="#C9CDD3"/>
 <circle cx="12" cy="22" r="0.3" fill="#C9CDD3"/>
 <!-- Nori strip on rice -->
 <rect x="7" y="13" width="5" height="2" fill="#3B3F47"/>
 <!-- Compartment 2 (top right): Salmon sushi -->
 <rect x="17" y="6" width="11" height="9" rx="1" fill="url(#rice)"/>
 <ellipse cx="20" cy="10" rx="2" ry="1.3" fill="url(#salmon)"/>
 <ellipse cx="24" cy="11" rx="2" ry="1.3" fill="url(#salmon)"/>
 <!-- Compartment 3 (bottom right): veggies + egg -->
 <rect x="17" y="17" width="11" height="9" rx="1" fill="url(#veg)"/>
 <circle cx="22" cy="21" r="2" fill="url(#egg)"/>
 <circle cx="22" cy="21" r="0.8" fill="#FF8B3D"/>
 <ellipse cx="20" cy="24" rx="1" ry="0.5" fill="#33691E"/>
 <ellipse cx="25" cy="20" rx="1" ry="0.5" fill="#33691E"/>
 <ellipse cx="8" cy="9" rx="3" ry="1.5" fill="url(#hl)"/>
</svg>
