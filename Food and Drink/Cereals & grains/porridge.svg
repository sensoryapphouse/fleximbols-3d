    <ellipse cx="22.0" cy="9.0" rx="2.3" ry="3.0" fill="url(#prg_spoon)" stroke="#9098A4" stroke-width="0.25"/>
    <ellipse cx="21.6" cy="8.4" rx="0.8" ry="1.1" fill="#FFFFFF" opacity="0.6"/>
