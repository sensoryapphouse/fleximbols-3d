<defs>
<linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E8E8E8"/><stop offset="50%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#5A6878"/></linearGradient>
<linearGradient id="band" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#7A0808"/><stop offset="50%" stop-color="#F75B5B"/><stop offset="100%" stop-color="#3A0202"/></linearGradient>
<radialGradient id="lid" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#7A8898"/><stop offset="100%" stop-color="#1A1F2C"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="steam" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- steam wisps -->
<path d="M14 3 Q 13 1 15 0.5" stroke="url(#steam)" stroke-width="1" fill="none" stroke-linecap="round"/>
<path d="M18 3 Q 19 1 17 0.5" stroke="url(#steam)" stroke-width="1" fill="none" stroke-linecap="round"/>
<!-- cup-style lid (top) -->
<rect x="11" y="3" width="10" height="3.5" rx="0.5" fill="url(#lid)"/>
<ellipse cx="13" cy="3.5" rx="2" ry="0.4" fill="url(#hi)"/>
<!-- neck (slightly narrower) -->
<rect x="12" y="6.5" width="8" height="2" fill="url(#metal)"/>
<!-- main body (tall cylinder) -->
<rect x="10" y="8.5" width="12" height="19" rx="1" fill="url(#metal)"/>
<!-- vertical highlight stripe -->
<rect x="11" y="9" width="1.2" height="18" fill="url(#hi)"/>
<!-- red wrap band middle -->
<rect x="10" y="15" width="12" height="5" fill="url(#band)"/>
<ellipse cx="12" cy="16" rx="1" ry="0.4" fill="url(#hi)"/>
<!-- bottom rim -->
<rect x="10" y="27" width="12" height="1" rx="0.3" fill="url(#lid)"/>

</svg>