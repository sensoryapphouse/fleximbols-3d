 <defs>
 <linearGradient id="matG" x1="0" y1="0" x2="0.1" y2="1">
 <stop offset="0%" stop-color="#a88060"/>
 <stop offset="50%" stop-color="#886040"/>
 <stop offset="100%" stop-color="#604020"/>
 </linearGradient>
 <linearGradient id="matFace" x1="0" y1="0" x2="0.15" y2="1">
 <stop offset="0%" stop-color="#c09870"/>
 <stop offset="100%" stop-color="#907050"/>
 </linearGradient>
 <linearGradient id="plateG2" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#f4f0ec"/>
 <stop offset="100%" stop-color="#d4d0cc"/>
 </linearGradient>
 <linearGradient id="forkG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d0d0d0"/>
 <stop offset="100%" stop-color="#909090"/>
 </linearGradient>
 <linearGradient id="knifeG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d8d8d8"/>
 <stop offset="100%" stop-color="#989898"/>
 </linearGradient>
 <linearGradient id="wovenH" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#a87850" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#a87850" stop-opacity="0"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- placemat body -->
 <rect x="2" y="17" width="28" height="10" rx="2" fill="url(#matG)"/>
 <!-- mat top face isometric -->
 <path d="M2,14 L28,14 L30,17 L2,17 Z" fill="url(#matFace)"/>
 <!-- woven texture lines horizontal -->
 <line x1="3" y1="14.8" x2="29" y2="14.8" stroke="url(#wovenH)" stroke-width="0.5"/>
 <line x1="3" y1="15.6" x2="29" y2="15.6" stroke="url(#wovenH)" stroke-width="0.5"/>
 <line x1="3" y1="16.4" x2="29" y2="16.4" stroke="url(#wovenH)" stroke-width="0.5"/>
 <line x1="3" y1="18" x2="29" y2="18" stroke="#806040" stroke-width="0.5" stroke-opacity="0.4"/>
 <line x1="3" y1="19.5" x2="29" y2="19.5" stroke="#806040" stroke-width="0.5" stroke-opacity="0.4"/>
 <line x1="3" y1="21" x2="29" y2="21" stroke="#806040" stroke-width="0.5" stroke-opacity="0.4"/>
 <line x1="3" y1="22.5" x2="29" y2="22.5" stroke="#806040" stroke-width="0.5" stroke-opacity="0.4"/>
 <line x1="3" y1="24" x2="29" y2="24" stroke="#806040" stroke-width="0.5" stroke-opacity="0.4"/>
 <!-- woven texture vertical -->
 <line x1="5" y1="14" x2="5" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="8" y1="14" x2="8" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="11" y1="14" x2="11" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="14" y1="14" x2="14" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="17" y1="14" x2="17" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="20" y1="14" x2="20" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="23" y1="14" x2="23" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <line x1="26" y1="14" x2="26" y2="27" stroke="#806040" stroke-width="0.5" stroke-opacity="0.3"/>
 <!-- plate on mat -->
 <ellipse cx="16" cy="21" rx="7" ry="5" fill="url(#plateG2)"/>
 <ellipse cx="16" cy="21" rx="5.5" ry="4" fill="#f8f4f0"/>
 <ellipse cx="16" cy="21" rx="4" ry="3" fill="#eeece8" fill-opacity="0.5"/>
 <!-- fork left of plate -->
 <rect x="6" y="16" width="1" height="10" rx="0.4" fill="url(#forkG)"/>
 <!-- fork tines -->
 <line x1="5.7" y1="16" x2="5.7" y2="18.5" stroke="#c8c8c8" stroke-width="0.4"/>
 <line x1="6.3" y1="16" x2="6.3" y2="18.5" stroke="#c8c8c8" stroke-width="0.4"/>
 <line x1="7" y1="16" x2="7" y2="18.5" stroke="#c8c8c8" stroke-width="0.4"/>
