 <rect x="25" y="16" width="1" height="10" rx="0.4" fill="url(#knifeG)"/>
 <!-- knife blade edge -->
 <path d="M25,16 L25.3,16 L25.5,21 L25,21" fill="#c0c0c0" fill-opacity="0.5"/>
</svg>
