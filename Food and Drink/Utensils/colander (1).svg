 <path d="M5,14 Q3,14 3,12 Q3,10 5,10 L7,10 L7,14 Z" fill="url(#handleColan)"/>
 <path d="M27,14 Q29,14 29,12 Q29,10 27,10 L25,10 L25,14 Z" fill="url(#handleColan)"/>
