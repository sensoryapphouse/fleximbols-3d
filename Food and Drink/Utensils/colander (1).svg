 <defs>
 <linearGradient id="colanBody" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#d8d8d8"/>
 <stop offset="50%" stop-color="#b0b0b0"/>
 <stop offset="100%" stop-color="#787878"/>
 </linearGradient>
 <linearGradient id="colanRim" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e0e0e0"/>
 <stop offset="100%" stop-color="#a0a0a0"/>
 </linearGradient>
 <linearGradient id="handleColan" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8c8c8"/>
 <stop offset="100%" stop-color="#909090"/>
 </linearGradient>
 <linearGradient id="waterDrop" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#a8d4f8" stop-opacity="0.9"/>
 <stop offset="100%" stop-color="#4888c8" stop-opacity="0.7"/>
 </linearGradient>
 <radialGradient id="colanInner" cx="50%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#c8c8c8"/>
 <stop offset="100%" stop-color="#888888"/>
 </radialGradient>
 </defs>
 <!-- drop shadow -->
