 <defs>
 <linearGradient id="mfLoaf" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#a9682f"/>
 <stop offset="60%" stop-color="#8a4e22"/>
 <stop offset="100%" stop-color="#633616"/>
 </linearGradient>
 <linearGradient id="mfGlaze" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e85a3a"/>
 <stop offset="100%" stop-color="#c0331f"/>
 </linearGradient>
 <linearGradient id="mfPlate" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="100%" stop-color="#cfd4da"/>
 </linearGradient>
