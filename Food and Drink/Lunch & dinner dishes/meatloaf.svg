 <!-- plate -->
 <ellipse cx="16" cy="24" rx="13" ry="3.4" fill="url(#mfPlate)" stroke="#b6bcc4" stroke-width="0.5"/>
 <ellipse cx="16" cy="23.4" rx="10" ry="2.4" fill="#eef1f4" stroke="#cdd2d8" stroke-width="0.3"/>
 <!-- meatloaf body (rounded brick loaf) -->
