<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="me_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FCF6E8"/>
      <stop offset="1" stop-color="#F0E4C8"/>
    </linearGradient>
    <linearGradient id="me_swirlshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE0C2"/>
    </linearGradient>
    <linearGradient id="me_plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF2"/>
      <stop offset="1" stop-color="#C7CDD6"/>
    </linearGradient>
    <linearGradient id="me_gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="16" cy="27.0" rx="11.5" ry="2.0" fill="#000000" opacity="0.10"/>

  <!-- plate -->
  <ellipse cx="16" cy="25.4" rx="11.0" ry="2.9" fill="url(#me_plate)" stroke="#AEB4BD" stroke-width="0.35"/>
  <ellipse cx="16" cy="24.9" rx="8.0" ry="1.9" fill="#F4F6F9" opacity="0.7"/>

  <!-- meringue body: domed base with swirled peak -->
  <path d="M6.2 23.0
           C6.2 18.5 9.6 16.5 16 16.5
           C22.4 16.5 25.8 18.5 25.8 23.0
           C25.8 24.6 21.8 25.4 16 25.4
           C10.2 25.4 6.2 24.6 6.2 23.0 Z"
        fill="url(#me_body)" stroke="#E2D4B4" stroke-width="0.4"/>

  <!-- swirl tiers rising to a tip (classic piped meringue) -->
  <path d="M8.0 21.0 C9.0 17.8 12.2 16.4 16 16.4 C19.8 16.4 23.0 17.8 24.0 21.0
           C21.5 19.3 18.8 18.6 16 18.6 C13.2 18.6 10.5 19.3 8.0 21.0 Z"
        fill="url(#me_swirlshade)" opacity="0.85"/>
  <path d="M9.6 18.6 C10.6 15.8 13.0 14.4 16 14.4 C19.0 14.4 21.4 15.8 22.4 18.6
           C20.2 17.2 18.1 16.6 16 16.6 C13.9 16.6 11.8 17.2 9.6 18.6 Z"
        fill="url(#me_body)" stroke="#E8DBBE" stroke-width="0.3"/>
  <path d="M11.0 16.3 C11.8 13.9 13.8 12.6 16 12.6 C18.2 12.6 20.2 13.9 21.0 16.3
           C19.3 15.2 17.7 14.7 16 14.7 C14.3 14.7 12.7 15.2 11.0 16.3 Z"
        fill="url(#me_swirlshade)" opacity="0.9"/>
  <path d="M12.4 14.2 C13.0 12.0 14.4 10.7 16 10.7 C17.6 10.7 19.0 12.0 19.6 14.2
           C18.4 13.4 17.2 13.0 16 13.0 C14.8 13.0 13.6 13.4 12.4 14.2 Z"
        fill="url(#me_body)" stroke="#E8DBBE" stroke-width="0.25"/>
  <!-- the pointed peak -->
  <path d="M14.3 12.0 C14.7 8.5 15.4 6.0 16 6.0 C16.6 6.0 17.3 8.5 17.7 12.0
           C17.1 11.4 16.6 11.1 16 11.1 C15.4 11.1 14.9 11.4 14.3 12.0 Z"
        fill="url(#me_body)" stroke="#E8DBBE" stroke-width="0.22"/>

  <!-- gloss highlight on body -->
  <path d="M8.5 20.5 C10.5 18.8 13 18.2 16 18.2 C16 18.8 16 19.6 16 20.2
           C13.3 20.2 10.8 20.6 8.5 21.6 Z" fill="url(#me_gloss)"/>
</svg>
