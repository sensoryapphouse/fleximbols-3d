<defs>
<radialGradient id="aspbody" cx="30%" cy="50%" r="60%">
 <stop offset="0%" stop-color="#99cc55"/>
 <stop offset="60%" stop-color="#44882a"/>
 <stop offset="100%" stop-color="#1a4411"/>
</radialGradient>
<radialGradient id="asptip" cx="40%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#77aa33"/>
 <stop offset="100%" stop-color="#224411"/>
</radialGradient>
</defs>
<!-- Three asparagus spears -->
<!-- Left spear -->
<rect x="9" y="12" width="3" height="16" rx="1.5" fill="url(#aspbody)"/>
<path d="M9 12 Q10.5 7 12 12" fill="url(#asptip)"/>
<!-- Scale bracts on left -->
<path d="M9.5 15 Q10.5 14 11.5 15 M9.5 18 Q10.5 17 11.5 18 M9.5 21 Q10.5 20 11.5 21" stroke="#1a4411" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
<!-- Middle spear (taller) -->
<rect x="14" y="10" width="4" height="18" rx="2" fill="url(#aspbody)"/>
<path d="M14 10 Q16 4 18 10" fill="url(#asptip)"/>
<!-- Scale bracts on middle -->
<path d="M14.5 13 Q16 12 17.5 13 M14.5 17 Q16 16 17.5 17 M14.5 21 Q16 20 17.5 21" stroke="#1a4411" stroke-width="0.5" fill="none" stroke-opacity="0.5"/>
<!-- Right spear -->
<rect x="20" y="12" width="3" height="16" rx="1.5" fill="url(#aspbody)"/>
<path d="M20 12 Q21.5 7 23 12" fill="url(#asptip)"/>
<!-- Scale bracts on right -->
<path d="M20.5 15 Q21.5 14 22.5 15 M20.5 18 Q21.5 17 22.5 18 M20.5 21 Q21.5 20 22.5 21" stroke="#1a4411" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
<!-- Base band -->
<rect x="8" y="27" width="16" height="2" rx="1" fill="#8b7355"/>
</svg>