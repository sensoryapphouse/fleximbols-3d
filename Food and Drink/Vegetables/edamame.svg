 <defs>
 <linearGradient id="ed-pod" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#66cc44"/>
 <stop offset="100%" stop-color="#228822"/>
 </linearGradient>
 <linearGradient id="ed-pod2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#55bb33"/>
 <stop offset="100%" stop-color="#1a7711"/>
 </linearGradient>
 <linearGradient id="ed-bean" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#cceeaa"/>
 <stop offset="100%" stop-color="#88bb55"/>
 </linearGradient>
 </defs>
 <!-- pod 1 (rotated, closed) -->
 <ellipse cx="10" cy="10" rx="2.5" ry="8" transform="rotate(-30 10 10)" fill="url(#ed-pod)" filter="url(#ed-sh)"/>
 <!-- fuzzy highlights on pod 1 -->
 <ellipse cx="9" cy="9" rx="0.8" ry="3" transform="rotate(-30 10 10)" fill="#88ee66" fill-opacity="0.35"/>
 <!-- pod 2 (rotated, closed) -->
 <ellipse cx="22" cy="9" rx="2.5" ry="8" transform="rotate(25 22 9)" fill="url(#ed-pod)" filter="url(#ed-sh)"/>
 <ellipse cx="22" cy="8" rx="0.8" ry="3" transform="rotate(25 22 9)" fill="#88ee66" fill-opacity="0.35"/>
 <!-- pod 3 (open, showing beans) horizontal -->
 <path d="M4 22 Q6 18 16 18 Q26 18 28 22 Q26 26 16 26 Q6 26 4 22 Z" fill="url(#ed-pod2)" filter="url(#ed-sh)"/>
 <!-- inner pod lining -->
 <path d="M5 22 Q7 19 16 19 Q25 19 27 22 Q25 25 16 25 Q7 25 5 22 Z" fill="#ccee88" fill-opacity="0.4"/>
 <!-- three beans inside open pod -->
 <ellipse cx="10" cy="22" rx="2.2" ry="2.5" fill="url(#ed-bean)"/>
 <circle cx="10.5" cy="21.2" r="0.6" fill="#eeffcc" fill-opacity="0.6"/>
 <ellipse cx="16" cy="22" rx="2.2" ry="2.5" fill="url(#ed-bean)"/>
 <circle cx="16.5" cy="21.2" r="0.6" fill="#eeffcc" fill-opacity="0.6"/>
 <ellipse cx="22" cy="22" rx="2.2" ry="2.5" fill="url(#ed-bean)"/>
 <circle cx="22.5" cy="21.2" r="0.6" fill="#eeffcc" fill-opacity="0.6"/>
 <!-- salt crystals -->
 <rect x="8" y="16" width="0.8" height="0.8" rx="0.1" fill="#fff" fill-opacity="0.9"/>
 <rect x="18" y="17" width="0.7" height="0.7" rx="0.1" fill="#fff" fill-opacity="0.85"/>
 <rect x="24" y="16.5" width="0.6" height="0.6" rx="0.1" fill="#fff" fill-opacity="0.8"/>
</svg>
