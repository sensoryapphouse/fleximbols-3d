<!-- pod body: long tapered ridged okra pointing down-right -->
<path d="M52 58 Q70 50 96 70 Q128 96 152 140 Q166 166 158 178 Q146 186 124 170 Q92 146 70 104 Q54 76 52 58 Z" fill="url(#okPod)" stroke="#2c5e18" stroke-width="3" stroke-linejoin="round"/>
