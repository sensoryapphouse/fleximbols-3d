<defs>
<linearGradient id="okPod" x1="40" y1="40" x2="160" y2="170" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#a4e26b"/>
<stop offset="0.5" stop-color="#6fc23c"/>
<stop offset="1" stop-color="#3f8a23"/>
</linearGradient>
<linearGradient id="okCap" x1="40" y1="30" x2="80" y2="80" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#8ed24c"/>
<stop offset="1" stop-color="#4e9a2a"/>
</linearGradient>
<radialGradient id="okGloss" cx="0.35" cy="0.3" r="0.5">
<stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
