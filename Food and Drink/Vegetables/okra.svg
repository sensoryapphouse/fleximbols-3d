<path d="M60 92 Q92 124 128 168" fill="none" stroke="#2c5e18" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>
<path d="M90 64 Q120 92 150 142" fill="none" stroke="#2c5e18" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
<!-- stem cap at top-left -->
<path d="M44 40 Q60 36 70 52 Q74 62 66 70 Q56 74 50 62 Q44 50 44 40 Z" fill="url(#okCap)" stroke="#2c5e18" stroke-width="3" stroke-linejoin="round"/>
<path d="M40 34 L52 50" fill="none" stroke="#2c5e18" stroke-width="3.2" stroke-linecap="round"/>
<!-- gloss highlight -->
<ellipse cx="86" cy="92" rx="34" ry="20" fill="url(#okGloss)" transform="rotate(40 86 92)"/>
