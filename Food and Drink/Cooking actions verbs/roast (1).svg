<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
 <radialGradient id="ro_oven" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#ccbbaa"/>
 <stop offset="60%" stop-color="#997766"/>
 <stop offset="100%" stop-color="#664433"/>
 </radialGradient>
 <radialGradient id="ro_int" cx="50%" cy="50%" r="60%">
 <stop offset="0%" stop-color="#ff9944"/>
 <stop offset="70%" stop-color="#cc5500"/>
 <stop offset="100%" stop-color="#881100"/>
 </radialGradient>
 <radialGradient id="ro_meat" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#ddaa55"/>
 <stop offset="60%" stop-color="#aa6622"/>
 <stop offset="100%" stop-color="#773311"/>
 </radialGradient>
 <radialGradient id="ro_skin" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#ffe0b0"/>
 <stop offset="100%" stop-color="#d4804a"/>
 </radialGradient>
 <linearGradient id="ro_tray" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c0c0c0"/>
 <stop offset="100%" stop-color="#888"/>
 </linearGradient>
 <linearGradient id="ro_mitt" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#dd4422"/>
 <stop offset="100%" stop-color="#881100"/>
 </linearGradient>
</defs>
<!-- ground shadow -->
<!-- OVEN BODY (outer) -->
<rect x="3" y="8" width="26" height="22" rx="1.5" fill="url(#ro_oven)" filter="url(#ro_sh)"/>
<!-- Oven door frame -->
<rect x="5" y="10" width="22" height="17" rx="1" fill="#bbaa99"/>
<!-- Oven interior glow -->
<rect x="6.5" y="11.5" width="19" height="14" rx="0.8" fill="url(#ro_int)" filter="url(#ro_sh)"/>
<!-- Interior shine top -->
<rect x="7" y="12" width="18" height="1" rx="0.5" fill="#ffcc88" fill-opacity="0.3"/>
<!-- GLOWING HEATING ELEMENTS -->
<!-- Top element -->
<path d="M8,13.5 L24,13.5" stroke="#ff6600" stroke-width="1" stroke-linecap="round" fill="none"/>
<path d="M8,13.5 L24,13.5" stroke="#ffcc00" stroke-width="0.5" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
<!-- Bottom element -->
<path d="M8,24 L24,24" stroke="#ff6600" stroke-width="1" stroke-linecap="round" fill="none"/>
<path d="M8,24 L24,24" stroke="#ffcc00" stroke-width="0.5" stroke-linecap="round" fill="none" stroke-opacity="0.6"/>
<!-- ROASTING TRAY -->
<rect x="8" y="19.5" width="16" height="4" rx="0.8" fill="url(#ro_tray)" filter="url(#ro_sh)"/>
<!-- Tray handles -->
<rect x="7" y="20.5" width="1.5" height="1.5" rx="0.5" fill="#aaa"/>
<rect x="23.5" y="20.5" width="1.5" height="1.5" rx="0.5" fill="#aaa"/>
<!-- Tray shine -->
<path d="M9,20 Q16,19.5 23,20" stroke="#fff" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
<!-- ROAST JOINT OF MEAT (golden-brown surface) -->
<ellipse cx="16" cy="20.5" rx="7" ry="3" fill="url(#ro_meat)" filter="url(#ro_sh)"/>
<!-- Meat surface texture (browning) -->
<path d="M11,19.5 Q16,18 21,19.5" stroke="#cc8833" stroke-width="0.6" fill="none" stroke-opacity="0.6"/>
<path d="M10.5,21 Q16,22 21.5,21" stroke="#aa5511" stroke-width="0.5" fill="none" stroke-opacity="0.5"/>
<!-- Meat highlight -->
<ellipse cx="14" cy="19.5" rx="2.5" ry="1" fill="#eebb66" fill-opacity="0.5"/>
<!-- Vegetables beside meat (carrots/potatoes) -->
<ellipse cx="9" cy="22" rx="1.5" ry="0.9" fill="#ff8833" fill-opacity="0.9"/>
<ellipse cx="23" cy="22.5" rx="1.3" ry="0.8" fill="#ddbb55" fill-opacity="0.9"/>
<ellipse cx="21" cy="22.8" rx="0.9" ry="0.7" fill="#88cc44" fill-opacity="0.8"/>
<!-- Heat-wave lines from tray -->
<path d="M12,18.5 Q11.5,17 12,15.5" stroke="#ffaa44" stroke-width="0.5" fill="none" stroke-opacity="0.7"/>
<path d="M16,18 Q15.5,16.5 16,15" stroke="#ffaa44" stroke-width="0.6" fill="none" stroke-opacity="0.75"/>
<path d="M20,18.5 Q20.5,17 20,15.5" stroke="#ffaa44" stroke-width="0.5" fill="none" stroke-opacity="0.7"/>
<!-- GLOVED HANDS (oven mitts) -->
<!-- Left mitt -->
<ellipse cx="6" cy="19.5" rx="2.5" ry="3" fill="url(#ro_mitt)" filter="url(#ro_sh)"/>
<ellipse cx="5.2" cy="18" rx="0.9" ry="1.4" fill="#ee5533" fill-opacity="0.85"/>
<!-- Left hand grip fingers -->
<ellipse cx="7.2" cy="17.5" rx="1" ry="0.7" fill="#cc3311" fill-opacity="0.8"/>
<!-- Right mitt -->
<ellipse cx="26" cy="19.5" rx="2.5" ry="3" fill="url(#ro_mitt)" filter="url(#ro_sh)"/>
<ellipse cx="26.8" cy="18" rx="0.9" ry="1.4" fill="#ee5533" fill-opacity="0.85"/>
<ellipse cx="24.8" cy="17.5" rx="1" ry="0.7" fill="#cc3311" fill-opacity="0.8"/>
<!-- Oven controls / knobs at top -->
<circle cx="8" cy="9" r="1" fill="#888" filter="url(#ro_sh)"/>
<circle cx="8" cy="9" r="0.5" fill="#555"/>
<circle cx="16" cy="9" r="1" fill="#888" filter="url(#ro_sh)"/>
<circle cx="16" cy="9" r="0.5" fill="#555"/>
<circle cx="24" cy="9" r="1" fill="#888" filter="url(#ro_sh)"/>
<circle cx="24" cy="9" r="0.5" fill="#555"/>
</svg>
