<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<radialGradient id="brG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE4A8"/><stop offset="0.5" stop-color="#D89A48"/><stop offset="1" stop-color="#5A2A00"/></radialGradient>
<radialGradient id="bcG" cx="40%" cy="40%" r="80%"><stop offset="0" stop-color="#FFF4D0"/><stop offset="0.5" stop-color="#F0CC80"/><stop offset="1" stop-color="#A06820"/></radialGradient>
<radialGradient id="bdG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C8D2DC"/><stop offset="1" stop-color="#3A4250"/></radialGradient>
<radialGradient id="hdG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#9A6840"/><stop offset="0.5" stop-color="#5A2C10"/><stop offset="1" stop-color="#1A0800"/></radialGradient>
<radialGradient id="bdG2" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#E8C898"/><stop offset="0.5" stop-color="#A06838"/><stop offset="1" stop-color="#3A1808"/></radialGradient>
</defs>
<!-- cutting board -->
<ellipse cx="16" cy="26" rx="14" ry="1.5" fill="#1A0800" opacity="0.35"/>
<rect x="2" y="22" width="28" height="3.5" rx="0.5" fill="url(#bdG2)"/>
<rect x="2" y="22" width="28" height="0.7" fill="#FFFFFF" opacity="0.4"/>
<!-- bread loaf - main body -->
<path d="M5 22 L5 14 Q5 9 11 9 L23 9 Q26 9 26 14 L26 22 Z" fill="url(#brG)"/>
<!-- loaf crust top highlight -->
<path d="M6 13 Q11 11 25 13" stroke="#FFFFFF" stroke-width="0.3" fill="none" opacity="0.6"/>
<!-- crust scoring lines -->
<g stroke="#5A2A00" stroke-width="0.3" opacity="0.7">
<path d="M9 11 Q9.5 14 9 17"/>
<path d="M14 10 Q14.5 13 14 16"/>
<path d="M19 11 Q19.5 14 19 17"/>
</g>
<!-- cut slice on left side - tilted away, showing soft interior -->
<g transform="translate(2.5 16) rotate(-18)">
<path d="M-1 -6 L4 -6 Q5 -6 5 -5 L5 5 Q5 6 4 6 L-1 6 Z" fill="url(#bcG)"/>
<!-- crust ring around slice -->
<path d="M-1 -6 L4 -6 Q5 -6 5 -5 L5 5 Q5 6 4 6 L-1 6 Z" fill="none" stroke="#A06820" stroke-width="0.5"/>
<!-- interior holes (bread texture) -->
<g fill="#D8B080" opacity="0.6">
<circle cx="1" cy="-2" r="0.5"/>
<circle cx="2.5" cy="0" r="0.4"/>
<circle cx="1.5" cy="2" r="0.5"/>
<circle cx="3" cy="-3.5" r="0.3"/>
<circle cx="3.5" cy="3" r="0.3"/>
</g>
</g>
<!-- bread knife - diagonal across, just finished cutting -->
<g transform="translate(16 14) rotate(-30)">
<!-- blade (serrated) -->
<rect x="-2" y="-1.4" width="14" height="2.4" rx="0.3" fill="url(#bdG)"/>
<!-- serration teeth on bottom edge -->
<g fill="url(#bdG)">
<polygon points="-1.5,1 -0.9,2 -0.3,1"/>
<polygon points="0,1 0.6,2 1.2,1"/>
<polygon points="1.5,1 2.1,2 2.7,1"/>
<polygon points="3,1 3.6,2 4.2,1"/>
<polygon points="4.5,1 5.1,2 5.7,1"/>
<polygon points="6,1 6.6,2 7.2,1"/>
<polygon points="7.5,1 8.1,2 8.7,1"/>
<polygon points="9,1 9.6,2 10.2,1"/>
<polygon points="10.5,1 11.1,2 11.5,1"/>
</g>
<!-- blade highlight -->
<rect x="-2" y="-1.2" width="14" height="0.6" fill="#FFFFFF" opacity="0.65"/>
<!-- handle -->
<rect x="-7" y="-1.6" width="5.5" height="2.8" rx="0.6" fill="url(#hdG)"/>
<rect x="-6.5" y="-1.2" width="4.5" height="0.5" fill="#FFFFFF" opacity="0.4"/>
<circle cx="-6" cy="0" r="0.3" fill="#3A1A00"/>
<circle cx="-3" cy="0" r="0.3" fill="#3A1A00"/>
</g>
</svg>
