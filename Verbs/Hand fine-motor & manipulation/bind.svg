 <defs>
 <linearGradient id="bind-block" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4A7ABB"/><stop offset="100%" stop-color="#2A4A8A"/>
 </linearGradient>
 <linearGradient id="bind-rope" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#C8882A"/><stop offset="100%" stop-color="#8B5A00"/>
 </linearGradient>
 </defs>
 <!-- Left block -->
 <rect x="4" y="11" width="10" height="10" rx="2" fill="url(#bind-block)" filter="url(#bind-shad)"/>
 <!-- Right block -->
 <rect x="18" y="11" width="10" height="10" rx="2" fill="url(#bind-block)" filter="url(#bind-shad)"/>
 <!-- Rope wrapping: top loop -->
 <path d="M9 11 Q9 7 16 7 Q23 7 23 11" fill="none" stroke="url(#bind-rope)" stroke-width="2" stroke-linecap="round"/>
 <!-- Rope wrapping: bottom loop -->
 <path d="M9 21 Q9 25 16 25 Q23 25 23 21" fill="none" stroke="url(#bind-rope)" stroke-width="2" stroke-linecap="round"/>
 <!-- Rope vertical on sides -->
 <line x1="9" y1="11" x2="9" y2="21" stroke="url(#bind-rope)" stroke-width="2" stroke-linecap="round"/>
 <line x1="23" y1="11" x2="23" y2="21" stroke="url(#bind-rope)" stroke-width="2" stroke-linecap="round"/>
 <!-- Center knot -->
 <circle cx="16" cy="16" r="2.5" fill="url(#bind-rope)"/>
 <circle cx="16" cy="16" r="1.5" fill="#A06800"/>
 <!-- Rope cross through knot -->
 <line x1="13.5" y1="16" x2="18.5" y2="16" stroke="#8B5A00" stroke-width="1.5"/>
 <line x1="16" y1="13.5" x2="16" y2="18.5" stroke="#8B5A00" stroke-width="1.5"/>
</svg>
