<svg width="200" height="200" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
 <!-- Warm skin base -->
 <radialGradient id="face_grad" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FFE4A0"/>
 <stop offset="60%" stop-color="#FFD166"/>
 <stop offset="100%" stop-color="#F5A623"/>
 </radialGradient>
 <!-- Yellow warm face highlight -->
 <radialGradient id="face_hi" cx="35%" cy="30%" r="40%">
 <stop offset="0%" stop-color="#FFF6CC" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
 </radialGradient>
 <!-- Metal blade -->
 <radialGradient id="blade_grad" cx="30%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#E8EEF5"/>
 <stop offset="50%" stop-color="#B8C8D8"/>
 <stop offset="100%" stop-color="#7A8A99"/>
 </radialGradient>
 <!-- Wood handle -->
 <radialGradient id="handle_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#C8893A"/>
 <stop offset="100%" stop-color="#7A4A1A"/>
 </radialGradient>
 <!-- Bowl orange-warm -->
 <radialGradient id="bowl_grad" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF9B5E"/>
 <stop offset="60%" stop-color="#E8612A"/>
 <stop offset="100%" stop-color="#C04010"/>
 </radialGradient>
 <!-- Bowl interior -->
 <radialGradient id="bowl_inner" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFC09A"/>
 <stop offset="100%" stop-color="#FF8055"/>
 </radialGradient>
 <!-- Fire red-orange -->
 <radialGradient id="fire_grad" cx="50%" cy="80%" r="60%">
 <stop offset="0%" stop-color="#FFE066"/>
 <stop offset="40%" stop-color="#FF8C00"/>
 <stop offset="100%" stop-color="#CC2200"/>
 </radialGradient>
 <!-- Steam blue-white -->
 <radialGradient id="steam_grad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#E8F4FF"/>
 <stop offset="100%" stop-color="#A8C8EE" stop-opacity="0.3"/>
 </radialGradient>
 <!-- Ice blue -->
 <radialGradient id="ice_grad" cx="30%" cy="25%" r="70%">
 <stop offset="0%" stop-color="#D4F0FF"/>
 <stop offset="60%" stop-color="#7AC5F0"/>
 <stop offset="100%" stop-color="#3A8ABF"/>
 </radialGradient>
 <!-- Water blue -->
 <radialGradient id="water_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#88DDFF"/>
 <stop offset="60%" stop-color="#2299DD"/>
 <stop offset="100%" stop-color="#0055AA"/>
 </radialGradient>
 <!-- Thread red -->
 <radialGradient id="thread_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FF9999"/>
 <stop offset="100%" stop-color="#CC1111"/>
 </radialGradient>
 <!-- Fabric blue -->
 <radialGradient id="fabric_grad" cx="30%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#99BBFF"/>
 <stop offset="100%" stop-color="#2244BB"/>
 </radialGradient>
 <!-- Tool grey -->
 <radialGradient id="tool_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#D0D8E0"/>
 <stop offset="60%" stop-color="#8898A8"/>
 <stop offset="100%" stop-color="#445566"/>
 </radialGradient>
 <!-- Green garment -->
 <radialGradient id="garment_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#A0E080"/>
 <stop offset="60%" stop-color="#44AA44"/>
 <stop offset="100%" stop-color="#226622"/>
 </radialGradient>
 <!-- Angry red face -->
 <radialGradient id="angry_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FF9966"/>
 <stop offset="60%" stop-color="#FF5522"/>
 <stop offset="100%" stop-color="#CC2200"/>
 </radialGradient>
 <!-- Furious deep red -->
 <radialGradient id="furious_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FF6644"/>
 <stop offset="60%" stop-color="#DD2200"/>
 <stop offset="100%" stop-color="#881100"/>
 </radialGradient>
 <!-- Calm blue-green face -->
 <radialGradient id="calm_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FFFACC"/>
 <stop offset="60%" stop-color="#FFE066"/>
 <stop offset="100%" stop-color="#DDAA33"/>
 </radialGradient>
 <!-- Sparkle -->
 <radialGradient id="sparkle_grad" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#FFE566"/>
 </radialGradient>
 <!-- Pan dark -->
 <radialGradient id="pan_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#666666"/>
 <stop offset="60%" stop-color="#333333"/>
 <stop offset="100%" stop-color="#111111"/>
 </radialGradient>
 <!-- Pan surface -->
 <radialGradient id="pan_surface" cx="40%" cy="35%" r="55%">
 <stop offset="0%" stop-color="#888888"/>
 <stop offset="100%" stop-color="#222222"/>
 </radialGradient>
 <!-- Pot blue-grey -->
 <radialGradient id="pot_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#8899BB"/>
 <stop offset="60%" stop-color="#4455AA"/>
 <stop offset="100%" stop-color="#223366"/>
 </radialGradient>
 <!-- Oven warm grey -->
 <radialGradient id="oven_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#CCBBAA"/>
 <stop offset="60%" stop-color="#997766"/>
 <stop offset="100%" stop-color="#664433"/>
 </radialGradient>
 <!-- Yarn pink -->
 <radialGradient id="yarn_grad" cx="35%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFAACC"/>
 <stop offset="60%" stop-color="#DD4499"/>
 <stop offset="100%" stop-color="#881155"/>
 </radialGradient>
 <!-- Grill grey -->
 <radialGradient id="grill_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#999999"/>
 <stop offset="60%" stop-color="#555555"/>
 <stop offset="100%" stop-color="#222222"/>
 </radialGradient>
 <!-- Melt orange -->
 <radialGradient id="melt_grad" cx="40%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFE566"/>
 <stop offset="60%" stop-color="#FF9922"/>
 <stop offset="100%" stop-color="#CC5500"/>
 </radialGradient>
 <!-- Container warm -->
 <radialGradient id="container_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#FFCC88"/>
 <stop offset="60%" stop-color="#DD8833"/>
 <stop offset="100%" stop-color="#AA5500"/>
 </radialGradient>

</defs>

 <!-- Jacket being unzipped - gap opening -->
 <!-- Left side -->
 <path d="M4 6 L14 6 L12 28 L4 28 Z" fill="url(#fabric_grad)"/>
 <!-- Right side -->
 <path d="M18 6 L28 6 L28 28 L20 28 Z" fill="url(#fabric_grad)"/>
 <!-- Gap in the middle (open) -->
 <path d="M14 6 L18 6 L20 28 L12 28 Z" fill="#222244" opacity="0.5"/>
 <!-- Zipper pull (at top, unzipping) -->
 <rect x="13" y="5" width="6" height="4" rx="1" fill="#FFCC22"/>
 <circle cx="16" cy="7" r="1" fill="#CC9900"/>
 <!-- Teeth still at bottom -->
 <rect x="13" y="22" width="2" height="2" rx="0.3" fill="#CCCCCC"/>
 <rect x="17" y="22" width="2" height="2" rx="0.3" fill="#CCCCCC"/>
 <!-- Arrow showing unzip direction downward -->
 <path d="M16 12 L16 16 L14 14 M16 16 L18 14" stroke="#FFCC22" stroke-width="1" fill="none" stroke-linecap="round"/>

</svg>