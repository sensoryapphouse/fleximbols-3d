 <defs>
 <radialGradient id="cf-table" cx="40%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#d4a060"/>
 <stop offset="100%" stop-color="#906020"/>
 </radialGradient>
 <linearGradient id="cf-person" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#608080"/>
 <stop offset="100%" stop-color="#304050"/>
 </linearGradient>
 <radialGradient id="cf-head" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#f5c090"/>
 <stop offset="100%" stop-color="#d09060"/>
 </radialGradient>
 <linearGradient id="cf-bubble" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e0e8ff"/>
 <stop offset="100%" stop-color="#b0c0e0"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- round table -->
 <ellipse cx="16" cy="18" rx="10" ry="7" fill="url(#cf-table)"/>
 <ellipse cx="16" cy="17.5" rx="10" ry="7" fill="url(#cf-table)"/>
 <!-- table highlight -->
 <ellipse cx="13" cy="15" rx="4" ry="2" fill="white" fill-opacity="0.2"/>
 <!-- papers on table -->
 <rect x="13" y="15" width="4" height="3" rx="0.3" fill="white" fill-opacity="0.6" transform="rotate(-10 15 16.5)"/>
 <rect x="15" y="14" width="4" height="3" rx="0.3" fill="white" fill-opacity="0.5" transform="rotate(5 17 15.5)"/>
 <!-- Person top -->
 <circle cx="16" cy="6" r="2.2" fill="url(#cf-head)"/>
 <rect x="14" y="8" width="4" height="4" rx="1" fill="url(#cf-person)"/>
 <!-- Person bottom -->
 <circle cx="16" cy="28" r="2.2" fill="url(#cf-head)"/>
 <rect x="14" y="23" width="4" height="4" rx="1" fill="url(#cf-person)"/>
 <!-- Person left -->
 <circle cx="4" cy="18" r="2.2" fill="url(#cf-head)"/>
 <rect x="5" y="16" width="4" height="4" rx="1" fill="url(#cf-person)"/>
 <!-- Person right -->
 <circle cx="28" cy="18" r="2.2" fill="url(#cf-head)"/>
 <rect x="23" y="16" width="4" height="4" rx="1" fill="url(#cf-person)"/>
 <!-- speech bubbles -->
 <path d="M17 4 Q20 2 22 4 Q22 6.5 19 6.5 Q18 6.5 17 6 Z" fill="url(#cf-bubble)" stroke="#8090c0" stroke-width="0.4"/>
 <path d="M28 14 Q30 12 31 14 Q31 16 29 16 Q28.5 16 28 15 Z" fill="url(#cf-bubble)" stroke="#8090c0" stroke-width="0.4"/>
</svg>
