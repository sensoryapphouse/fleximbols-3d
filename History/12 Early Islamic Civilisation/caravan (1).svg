 <defs>
 <radialGradient id="body" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#9DA1A8"/>
 </radialGradient>
 <radialGradient id="stripe" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#C03A14"/>
 </radialGradient>
 <radialGradient id="window" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#7DBEFC"/>
 <stop offset="100%" stop-color="#1565C0"/>
 </radialGradient>
 <radialGradient id="wheel" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#5A5E64"/>
 <stop offset="100%" stop-color="#0A0A0A"/>
 </radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
