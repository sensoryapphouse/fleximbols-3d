 <!-- Caravan trailer body (rounded rectangle on wheels) -->
 <path d="M 3 12 Q 3 6 9 6 L 27 6 Q 30 6 30 9 L 30 22 Q 30 24 28 24 L 4 24 Q 3 24 3 22 Z" fill="url(#body)"/>
 <!-- Decorative stripe -->
 <rect x="3" y="14" width="27" height="2" fill="url(#stripe)"/>
 <!-- Windows -->
 <rect x="6" y="9" width="6" height="4" rx="0.5" fill="url(#window)"/>
 <rect x="14" y="9" width="6" height="4" rx="0.5" fill="url(#window)"/>
 <rect x="22" y="9" width="6" height="4" rx="0.5" fill="url(#window)"/>
 <!-- Door -->
 <rect x="17" y="17" width="5" height="7" rx="0.4" fill="#7A7E84"/>
 <circle cx="21" cy="20.5" r="0.4" fill="#FFD45E"/>
 <!-- Awning (folded out canopy on top) -->
 <path d="M 4 6 L 6 3 L 28 3 L 30 6" fill="none" stroke="#C03A14" stroke-width="0.6"/>
 <!-- Wheels -->
 <circle cx="9" cy="25" r="2.5" fill="url(#wheel)"/>
 <circle cx="24" cy="25" r="2.5" fill="url(#wheel)"/>
 <circle cx="9" cy="25" r="0.8" fill="#C9CDD3"/>
 <circle cx="24" cy="25" r="0.8" fill="#C9CDD3"/>
 <!-- Tow hitch -->
 <path d="M 3 17 L 1 19 L 1 21 L 3 21 Z" fill="#5A5E64"/>
 <circle cx="1.5" cy="20" r="0.4" fill="#16181D"/>
 <ellipse cx="8" cy="8" rx="5" ry="1.5" fill="url(#hl)"/>
</svg>
