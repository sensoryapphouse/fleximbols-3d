<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="bpln-body" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#DD3333"/><stop offset="100%" stop-color="#991111"/>
 </linearGradient>
 <linearGradient id="bpln-wing" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#EE5555"/><stop offset="100%" stop-color="#AA2222"/>
 </linearGradient>
 <linearGradient id="bpln-sky" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#60A0CC"/>
 </linearGradient>
 <linearGradient id="bpln-prop" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#8B5A2B"/><stop offset="100%" stop-color="#4A2A0A"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <!-- Small cloud -->
 <ellipse cx="26" cy="6" rx="4" ry="2" fill="white" fill-opacity="0.8"/>
 <ellipse cx="28" cy="5.5" rx="2.5" ry="1.5" fill="white" fill-opacity="0.8"/>
 <!-- Fuselage (banking slightly) -->
 <path d="M6 17 Q16 14 26 16 L24 20 Q14 22 4 20 Z" fill="url(#bpln-body)" filter="url(#bpln-shad)" transform="rotate(-5,16,18)"/>
 <!-- Nose cone -->
 <polygon points="26,16 26,20 30,18" fill="#CC1111" transform="rotate(-5,16,18)"/>
 <!-- Top wing -->
 <rect x="7" y="10" width="18" height="3" rx="1.5" fill="url(#bpln-wing)" transform="rotate(-5,16,11.5)"/>
 <!-- Bottom wing -->
 <rect x="8" y="19" width="16" height="2.5" rx="1.2" fill="url(#bpln-wing)" transform="rotate(-5,16,20.2)"/>
 <!-- Struts between wings -->
 <line x1="12" y1="12.5" x2="13" y2="19" stroke="#FF6666" stroke-width="0.8"/>
 <line x1="20" y1="12" x2="21" y2="18.5" stroke="#FF6666" stroke-width="0.8"/>
 <!-- Wire bracing -->
 <line x1="12" y1="12.5" x2="21" y2="18.5" stroke="#CC4444" stroke-width="0.4" stroke-opacity="0.7"/>
 <line x1="20" y1="12" x2="13" y2="19" stroke="#CC4444" stroke-width="0.4" stroke-opacity="0.7"/>
 <!-- Open cockpit -->
 <ellipse cx="20" cy="16" rx="2.5" ry="1.5" fill="#5A2A0A" transform="rotate(-5,20,16)"/>
 <!-- Pilot head -->
 <circle cx="20" cy="14.5" r="1.2" fill="#FFAB76" transform="rotate(-5,20,14.5)"/>
 <!-- Propeller (spinning) -->
 <ellipse cx="29" cy="17" rx="0.8" ry="3" fill="url(#bpln-prop)" transform="rotate(-5,29,17)"/>
 <ellipse cx="29" cy="17" rx="3" ry="0.8" fill="url(#bpln-prop)" transform="rotate(40,29,17)" fill-opacity="0.5"/>
 <!-- Tail -->
 <path d="M6 19 Q4 18 4 15 L7 14" fill="url(#bpln-body)" transform="rotate(-5,16,18)"/>
</svg>
