<defs>
<radialGradient id="body" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#7A8C5A"/><stop offset="100%" stop-color="#2A3A1A"/></radialGradient>
<radialGradient id="turret" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#8AA068"/><stop offset="100%" stop-color="#3A4A20"/></radialGradient>
<radialGradient id="tread" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#3A4250"/><stop offset="100%" stop-color="#0A0E18"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- tank treads (lower body) -->
<rect x="2" y="20" width="28" height="6" rx="2" fill="url(#tread)"/>
<!-- tread wheels -->
<circle cx="6" cy="24" r="2" fill="#5A6878"/>
<circle cx="12" cy="24" r="2" fill="#5A6878"/>
<circle cx="20" cy="24" r="2" fill="#5A6878"/>
<circle cx="26" cy="24" r="2" fill="#5A6878"/>
<circle cx="6" cy="24" r="0.8" fill="#0A0E18"/>
<circle cx="12" cy="24" r="0.8" fill="#0A0E18"/>
<circle cx="20" cy="24" r="0.8" fill="#0A0E18"/>
<circle cx="26" cy="24" r="0.8" fill="#0A0E18"/>
<!-- tread segment ticks -->
<line x1="3" y1="26" x2="3" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="6" y1="26" x2="6" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="9" y1="26" x2="9" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="12" y1="26" x2="12" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="15" y1="26" x2="15" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="18" y1="26" x2="18" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="21" y1="26" x2="21" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="24" y1="26" x2="24" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<line x1="27" y1="26" x2="27" y2="27" stroke="#0A0E18" stroke-width="0.3"/>
<!-- hull (main body) -->
<rect x="3" y="13" width="26" height="8" rx="1" fill="url(#body)"/>
<ellipse cx="8" cy="14.5" rx="5" ry="0.8" fill="url(#hi)"/>
<!-- turret -->
<ellipse cx="16" cy="11" rx="6" ry="3" fill="url(#turret)"/>
<rect x="10" y="11" width="12" height="3" fill="url(#turret)"/>
<ellipse cx="13" cy="9.5" rx="3" ry="0.8" fill="url(#hi)"/>
<!-- hatch on turret -->
<circle cx="14" cy="11" r="1" fill="#3A4A20" stroke="#1A2210" stroke-width="0.2"/>
<!-- main cannon barrel pointing right -->
<rect x="22" y="10.5" width="9" height="1.4" fill="url(#body)"/>
<rect x="30" y="10.3" width="1.5" height="1.8" rx="0.2" fill="#2A3A1A"/>
<!-- camo patches -->
<ellipse cx="9" cy="17" rx="2" ry="1" fill="#3A4A20" opacity="0.6"/>
<ellipse cx="20" cy="17" rx="2.5" ry="1.2" fill="#3A4A20" opacity="0.6"/>
</svg>