 <defs>
 <linearGradient id="bb-frame" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#a07848"/>
 <stop offset="100%" stop-color="#6a4820"/>
 </linearGradient>
 <linearGradient id="bb-board" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#2a3828"/>
 <stop offset="100%" stop-color="#141e12"/>
 </linearGradient>
 <linearGradient id="bb-chalk-stick" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f0f0f0"/>
 <stop offset="100%" stop-color="#c8c8c8"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- frame -->
 <rect x="2" y="3" width="28" height="22" rx="1.5" fill="url(#bb-frame)"/>
 <!-- board surface -->
 <rect x="3.5" y="4.5" width="25" height="19" rx="0.5" fill="url(#bb-board)"/>
 <!-- chalk writing (squiggly white lines) -->
 <path d="M6 9 Q8 8 10 9 Q12 10 14 9" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.9"/>
 <path d="M6 12 Q9 11 12 12 Q15 13 18 12" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.9"/>
 <path d="M6 15 Q8 14 10 15" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.85"/>
 <!-- ledge at bottom -->
 <rect x="2" y="24" width="28" height="2.5" rx="0.5" fill="url(#bb-frame)"/>
 <!-- chalk stick on ledge -->
 <rect x="18" y="24.2" width="7" height="1.5" rx="0.7" fill="url(#bb-chalk-stick)"/>
 <!-- chalk dust -->
 <ellipse cx="23" cy="25.5" rx="2.5" ry="0.5" fill="white" fill-opacity="0.3"/>
 <!-- frame highlight -->
 <rect x="2" y="3" width="28" height="1.5" rx="1.5" fill="white" fill-opacity="0.15"/>
</svg>
