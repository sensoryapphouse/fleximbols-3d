 <defs>
 <linearGradient id="wb-frame" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#d0d0d0"/>
 <stop offset="100%" stop-color="#909090"/>
 </linearGradient>
 <linearGradient id="wb-board" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#fafafa"/>
 <stop offset="100%" stop-color="#f0f0f0"/>
 </linearGradient>
 <linearGradient id="wb-stand" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#c0c0c0"/>
 <stop offset="100%" stop-color="#808080"/>
 </linearGradient>
 <linearGradient id="wb-eraser" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0a080"/>
 <stop offset="100%" stop-color="#806040"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- stand legs -->
 <line x1="10" y1="24" x2="8" y2="30" stroke="url(#wb-stand)" stroke-width="1.5" stroke-linecap="round"/>
 <line x1="22" y1="24" x2="24" y2="30" stroke="url(#wb-stand)" stroke-width="1.5" stroke-linecap="round"/>
 <line x1="16" y1="24" x2="16" y2="30" stroke="url(#wb-stand)" stroke-width="1.2" stroke-linecap="round"/>
 <!-- frame -->
 <rect x="2" y="3" width="28" height="21" rx="1.5" fill="url(#wb-frame)"/>
 <!-- board surface -->
 <rect x="3.5" y="4.5" width="25" height="18" rx="0.5" fill="url(#wb-board)"/>
 <!-- blue marker diagram -->
 <path d="M7 10 L12 7 L17 10 L17 15 L12 18 L7 15 Z" stroke="#3060d0" stroke-width="0.8" fill="none"/>
 <line x1="12" y1="7" x2="12" y2="18" stroke="#3060d0" stroke-width="0.6" stroke-dasharray="1,0.8"/>
 <line x1="7" y1="12.5" x2="17" y2="12.5" stroke="#3060d0" stroke-width="0.6" stroke-dasharray="1,0.8"/>
 <!-- arrows on diagram -->
 <line x1="19" y1="12.5" x2="25" y2="12.5" stroke="#e03020" stroke-width="0.8"/>
 <polygon points="25,12.5 23.5,11.5 23.5,13.5" fill="#e03020"/>
 <!-- ledge with eraser -->
 <rect x="2" y="23" width="28" height="2" rx="0.5" fill="url(#wb-frame)"/>
 <!-- eraser -->
 <rect x="4" y="23" width="6" height="2" rx="0.5" fill="url(#wb-eraser)"/>
</svg>
