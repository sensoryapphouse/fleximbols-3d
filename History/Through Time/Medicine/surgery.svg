 <defs>
 <linearGradient id="tableG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#9CA3AF"/>
 </linearGradient>
 <linearGradient id="drapeG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#7DBEFC"/>
 <stop offset="100%" stop-color="#1565C0"/>
 </linearGradient>
 <radialGradient id="skinG" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFE0BD"/>
 <stop offset="100%" stop-color="#D49D7A"/>
 </radialGradient>
 <radialGradient id="lampG" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFDE7"/>
 <stop offset="70%" stop-color="#FFF176"/>
 <stop offset="100%" stop-color="#F9A825"/>
 </radialGradient>
 <linearGradient id="lampBodyG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#6B7280"/>
 </linearGradient>
 <radialGradient id="gloveG" cx="40%" cy="35%" r="55%">
 <stop offset="0%" stop-color="#A5E68A"/>
 <stop offset="100%" stop-color="#43A047"/>
 </radialGradient>
 <linearGradient id="scalpelG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#6B7280"/>
 </linearGradient>
 <linearGradient id="monitorG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#374151"/>
 <stop offset="100%" stop-color="#111827"/>
 </linearGradient>
 <linearGradient id="ivbagG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#DBEAFE"/>
 <stop offset="100%" stop-color="#93C5FD"/>
 </linearGradient>
