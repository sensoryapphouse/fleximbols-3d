 <!-- OR background wall -->
 
 <!-- OR monitor (background right) — KEY GESTURE: OR equipment -->
 <rect x="25" y="2" width="6" height="9" rx="1" fill="url(#monitorG)"/>
 <rect x="26" y="3" width="4" height="5" rx="0.5" fill="#1E3A5F"/>
 <!-- Monitor screen lines (waveform) -->
 <path d="M26.3 5.5 L27 4.5 L27.5 6.5 L28 5 L28.5 5.5 L29.5 5.5" stroke="#69FBAB" stroke-width="0.4" fill="none" stroke-linecap="round"/>
 <!-- Monitor stand -->
 <rect x="27.5" y="11" width="1" height="4" rx="0.5" fill="url(#lampBodyG)"/>
 <!-- IV drip stand (background left) — OR equipment -->
 <line x1="2" y1="1" x2="2" y2="20" stroke="#9CA3AF" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="0.5" y1="20" x2="3.5" y2="20" stroke="#9CA3AF" stroke-width="0.8" stroke-linecap="round"/>
 <!-- IV bag -->
 <rect x="1" y="2" width="2.5" height="4" rx="0.8" fill="url(#ivbagG)"/>
 <line x1="2.25" y1="6" x2="2.25" y2="12" stroke="#93C5FD" stroke-width="0.5"/>
 <!-- Overhead surgical lamp -->
 <rect x="13.5" y="1" width="1.5" height="3.5" rx="0.5" fill="url(#lampBodyG)"/>
 <ellipse cx="14.25" cy="5" rx="4.8" ry="2.3" fill="url(#lampBodyG)"/>
 <ellipse cx="14.25" cy="5" rx="3.3" ry="1.5" fill="url(#lampG)"/>
 <path d="M10.8 6.5 Q12 13 17 13 Q19.5 13 17.5 6.5Z" fill="#FFFDE7" opacity="0.18"/>
 <!-- Surgical table -->
 <rect x="4" y="20" width="22" height="2.5" rx="1" fill="url(#tableG)"/>
 <rect x="4" y="22.5" width="2" height="7.5" rx="0.8" fill="url(#tableG)"/>
 <rect x="24" y="22.5" width="2" height="7.5" rx="0.8" fill="url(#tableG)"/>
 <!-- Blue surgical drape — KEY GESTURE -->
 <rect x="5" y="13.5" width="19" height="7" rx="1.5" fill="url(#drapeG)"/>
 <path d="M5 15.5 Q11 15 17 15.5 Q21 15.8 24 15.5" stroke="#1565C0" stroke-width="0.5" fill="none" opacity="0.5"/>
 <rect x="5.5" y="13.8" width="5" height="0.8" rx="0.4" fill="#FFFFFF" opacity="0.28"/>
 <!-- Patient head -->
 <ellipse cx="8.5" cy="13" rx="3" ry="2.8" fill="url(#skinG)"/>
 <path d="M7 12.5 Q8.5 11.8 10 12.5" stroke="#5D4037" stroke-width="0.5" fill="none"/>
 <!-- Gloved hand + scalpel entering from right — KEY GESTURE -->
 <path d="M32 12 Q29 13.5 26 17" stroke="url(#gloveG)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
 <ellipse cx="25.5" cy="17.5" rx="2" ry="1.5" fill="url(#gloveG)"/>
 <path d="M24.5 15 L22.5 18 L24.5 17.5Z" fill="url(#scalpelG)"/>
 <line x1="23" y1="16.5" x2="24" y2="15.2" stroke="#FFFFFF" stroke-width="0.4" opacity="0.65"/>
</svg>
