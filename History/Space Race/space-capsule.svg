<defs>
<radialGradient id="scBody" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#E0E4EA"/><stop offset="100%" stop-color="#8C9098"/></radialGradient>
<radialGradient id="scHeat" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#5A5E68"/><stop offset="100%" stop-color="#1E2026"/></radialGradient>
<radialGradient id="scWin" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#80C8FF"/><stop offset="100%" stop-color="#1A4878"/></radialGradient>
<radialGradient id="scChute" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#FF8060"/><stop offset="100%" stop-color="#C03000"/></radialGradient>
<radialGradient id="scChute2" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#B8BCC4"/></radialGradient>
</defs>
<!-- parachute canopy on top -->
<path d="M3 10 Q16 1 29 10 L29 11 Q16 9 3 11 Z" fill="url(#scChute)"/>
<path d="M8 10.2 Q16 8.5 24 10.2 Q16 8 8 10.2" fill="url(#scChute2)"/>
<!-- parachute panel seams -->
<line x1="8" y1="3.5" x2="8" y2="10.5" stroke="#FFFFFF" stroke-width="0.3"/>
<line x1="12" y1="2" x2="12" y2="10.5" stroke="#FFFFFF" stroke-width="0.3"/>
<line x1="16" y1="1" x2="16" y2="10" stroke="#FFFFFF" stroke-width="0.3"/>
<line x1="20" y1="2" x2="20" y2="10.5" stroke="#FFFFFF" stroke-width="0.3"/>
<line x1="24" y1="3.5" x2="24" y2="10.5" stroke="#FFFFFF" stroke-width="0.3"/>
<!-- shroud lines from canopy to capsule -->
<line x1="3" y1="11" x2="11" y2="16" stroke="#3A3D45" stroke-width="0.3"/>
<line x1="10" y1="11" x2="12" y2="15" stroke="#3A3D45" stroke-width="0.3"/>
<line x1="22" y1="11" x2="20" y2="15" stroke="#3A3D45" stroke-width="0.3"/>
<line x1="29" y1="11" x2="21" y2="16" stroke="#3A3D45" stroke-width="0.3"/>
<!-- capsule body (truncated cone with rounded top) -->
<path d="M11 16 Q11 14 16 14 Q21 14 21 16 L23 24 L9 24 Z" fill="url(#scBody)"/>
<!-- heat shield bottom -->
<path d="M9 24 L23 24 L22 26 Q16 27 10 26 Z" fill="url(#scHeat)"/>
<!-- char marks on heat shield -->
<path d="M11 25 L13 25.8 M15 25.2 L17 26 M19 25 L21 25.8" stroke="#000000" stroke-width="0.3" opacity="0.5"/>
<!-- circular window -->
<circle cx="16" cy="18" r="1.8" fill="url(#scWin)"/>
<circle cx="16" cy="18" r="1.8" fill="none" stroke="#5A5E68" stroke-width="0.4"/>
<circle cx="15.4" cy="17.4" r="0.5" fill="#FFFFFF" opacity="0.7"/>
<!-- panel lines -->
<path d="M12 20 L20 20" stroke="#5A5E68" stroke-width="0.3"/>
<path d="M11 22 L21 22" stroke="#5A5E68" stroke-width="0.3"/>
<ellipse cx="13" cy="15.5" rx="2" ry="0.4" fill="#FFFFFF" opacity="0.6"/>
</svg>
