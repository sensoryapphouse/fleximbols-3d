  <defs>
    <linearGradient id="swBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd3da"/>
      <stop offset="0.45" stop-color="#f4f6f9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eceef2"/>
      <stop offset="1" stop-color="#b4b9c2"/>
    </linearGradient>
    <linearGradient id="swGuard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd163"/>
      <stop offset="0.5" stop-color="#f3b425"/>
      <stop offset="1" stop-color="#c98a0e"/>
    </linearGradient>
    <linearGradient id="swGrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a4a22"/>
      <stop offset="0.5" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#5a1f0c"/>
    </linearGradient>
    <radialGradient id="swPommel" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fcd97a"/>
      <stop offset="1" stop-color="#cf960f"/>
    </radialGradient>
  </defs>
  <!-- Long tapered blade, pointing up -->
  <polygon points="100,12 115,40 115,124 100,140 85,124 85,40"
           fill="url(#swBlade)" stroke="#5d626b" stroke-width="3" stroke-linejoin="round"/>
  <!-- Fuller (center groove) -->
  <line x1="100" y1="42" x2="100" y2="122" stroke="#9aa0aa" stroke-width="2.4" opacity="0.8"/>
  <!-- Blade highlight -->
  <line x1="92" y1="46" x2="92" y2="118" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  <!-- Crossguard -->
  <rect x="58" y="132" width="84" height="18" rx="8" fill="url(#swGuard)" stroke="#9c6e10" stroke-width="3"/>
  <circle cx="64" cy="141" r="6" fill="#f0a818" stroke="#9c6e10" stroke-width="2"/>
  <circle cx="136" cy="141" r="6" fill="#f0a818" stroke="#9c6e10" stroke-width="2"/>
  <!-- Grip -->
  <rect x="88" y="150" width="24" height="34" rx="5" fill="url(#swGrip)" stroke="#4a190a" stroke-width="3"/>
  <line x1="89" y1="158" x2="111" y2="158" stroke="#4a190a" stroke-width="2"/>
