<!-- Main box body -->
<rect x="4" y="13" width="24" height="17" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#t_shd)"/>
<!-- Handle -->
<path d="M12 13 Q16 10 20 13" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
