<rect x="8" y="10.5" width="6" height="1.5" rx="0.5" fill="#fde8e8" stroke="#fca5a5" stroke-width="0.5"/>
<rect x="9" y="11" width="5" height="0.5" fill="#dc2626" opacity="0.6"/>
<rect x="10" y="9.5" width="3" height="2" rx="0.4" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.4"/>
