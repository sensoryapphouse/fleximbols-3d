 <defs>
 <radialGradient id="body" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#5A5E64"/>
 <stop offset="100%" stop-color="#16181D"/>
 </radialGradient>
 <radialGradient id="lens" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="40%" stop-color="#3B3F47"/>
 <stop offset="100%" stop-color="#0A0A0A"/>
 </radialGradient>
 <radialGradient id="screen" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#7DBEFC"/>
 <stop offset="100%" stop-color="#0D47A1"/>
 </radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Main camcorder body (rectangle, shoulder-mount style) -->
 <rect x="3" y="11" width="20" height="13" rx="1.5" fill="url(#body)"/>
 <!-- Lens barrel protruding right -->
 <rect x="22" y="13" width="6" height="9" rx="0.8" fill="url(#body)"/>
 <circle cx="27" cy="17.5" r="3.5" fill="url(#lens)"/>
 <circle cx="27" cy="17.5" r="1.8" fill="#0A0A0A"/>
 <circle cx="26" cy="16" r="0.6" fill="#FFFFFF" fill-opacity="0.8"/>
 <!-- Flip-out LCD screen on left side -->
 <rect x="2" y="13" width="8" height="6" rx="0.4" fill="url(#screen)"/>
 <!-- Eyepiece/viewfinder on top -->
 <rect x="8" y="6" width="6" height="5" rx="0.5" fill="url(#body)"/>
 <circle cx="11" cy="8.5" r="1.2" fill="#16181D" stroke="#5A5E64" stroke-width="0.3"/>
 <!-- Microphone on top -->
 <ellipse cx="18" cy="9" rx="2" ry="1" fill="#3B3F47"/>
 <rect x="16" y="9" width="4" height="2" fill="#3B3F47"/>
 <!-- Record button (red) -->
 <circle cx="6" cy="22" r="1" fill="#FF5252"/>
 <!-- Tape compartment lines -->
 <rect x="13" y="20" width="6" height="2" rx="0.2" fill="#3B3F47"/>
 <!-- Hand grip strap underneath -->
 <rect x="3" y="24" width="20" height="2" fill="#3B3F47"/>
 <ellipse cx="8" cy="14" rx="3" ry="0.8" fill="url(#hl)"/>
</svg>
