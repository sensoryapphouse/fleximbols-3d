 <defs>
 <radialGradient id="env" cx="25%" cy="20%" r="75%">
 <stop offset="0%" stop-color="#EF5350"/><stop offset="100%" stop-color="#B71C1C"/>
 </radialGradient>
 <linearGradient id="flap" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFCDD2"/><stop offset="100%" stop-color="#EF9A9A"/>
 </linearGradient>
 </defs>
 <!-- envelope body -->
 <rect x="2" y="8" width="28" height="20" rx="2" fill="url(#env)"/>
 <!-- envelope body highlight -->
 <rect x="3" y="9" width="26" height="9" rx="1.5" fill="#FFFFFF" fill-opacity="0.133"/>
 <!-- envelope flap (V shape from top) -->
 <path d="M2 8 L16 19 L30 8 Z" fill="url(#flap)"/>
 <!-- flap fold lines -->
 <path d="M2 28 L13 18" stroke="#C62828" stroke-width="0.7" fill="none"/>
 <path d="M30 28 L19 18" stroke="#C62828" stroke-width="0.7" fill="none"/>
 <!-- sender lines on envelope (letter peeking) -->
 <rect x="9" y="20" width="14" height="1.5" rx="0.7" fill="#FFFFFF" fill-opacity="0.333"/>
 <rect x="9" y="23" width="10" height="1.5" rx="0.7" fill="#FFFFFF" fill-opacity="0.267"/>
 <!-- @ symbol decorating -->
 <circle cx="23" cy="11" r="3" fill="none" stroke="#FFCDD2" stroke-width="1"/>
 <circle cx="23" cy="11" r="1.2" fill="#FFCDD2"/>
 <path d="M26 11 L27 13" stroke="#FFCDD2" stroke-width="0.8" fill="none"/>
 <!-- motion lines - email flying -->
 <path d="M1 5 L4 5" stroke="#EF5350" stroke-width="0.8" stroke-linecap="round" fill="none" opacity="0.5"/>
 <path d="M1 3 L3 3" stroke="#EF5350" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>