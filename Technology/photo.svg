<svg width="200" height="200" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<linearGradient id="pho_paper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/>
<stop offset="1" stop-color="#e7e9ec"/>
</linearGradient>
<linearGradient id="pho_sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8fd0f0"/>
<stop offset="1" stop-color="#5aa9da"/>
</linearGradient>
<radialGradient id="pho_sun" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffe98a"/>
<stop offset="1" stop-color="#ffc230"/>
</radialGradient>
<linearGradient id="pho_hill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5fbf5a"/>
<stop offset="1" stop-color="#3a8a3a"/>
</linearGradient>
<filter id="pho_sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="0.6" stdDeviation="0.6" flood-color="#000" flood-opacity="0.25"/>
</filter>
</defs>

<g transform="translate(16 16) rotate(-7) translate(-16 -16)" filter="url(#pho_sh)">
<!-- polaroid paper -->
<rect x="6" y="4.5" width="20" height="23" rx="1.2" fill="url(#pho_paper)" stroke="#c2c6cc" stroke-width="0.5"/>
<!-- photo window -->
<rect x="8" y="6.5" width="16" height="14" rx="0.6" fill="url(#pho_sky)"/>
<!-- sun -->
<circle cx="20" cy="10.5" r="2.6" fill="url(#pho_sun)"/>
<!-- hills (clipped within window) -->
<clipPath id="pho_clip"><rect x="8" y="6.5" width="16" height="14" rx="0.6"/></clipPath>
<g clip-path="url(#pho_clip)">
<path d="M8 20 L 13 13 L 17 17 L 21 12 L 24 16 L 24 20.5 L 8 20.5 Z" fill="url(#pho_hill)"/>
</g>
<!-- window frame -->
<rect x="8" y="6.5" width="16" height="14" rx="0.6" fill="none" stroke="#cfd3d8" stroke-width="0.4"/>
<!-- paper gloss -->
<rect x="7.5" y="5.2" width="6" height="1" rx="0.5" fill="#ffffff" opacity="0.6"/>
</g>
</svg>
