 <defs>
 <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4a90e0"/>
 <stop offset="50%" stop-color="#2a60b0"/>
 <stop offset="100%" stop-color="#0a3070"/>
 </linearGradient>
 <linearGradient id="rulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f0e0a0"/>
 <stop offset="100%" stop-color="#c0a840"/>
 </linearGradient>
 <linearGradient id="figSkin2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f5c880"/>
 <stop offset="100%" stop-color="#c08840"/>
 </linearGradient>
 <linearGradient id="figCloth" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#5080c0"/>
 <stop offset="100%" stop-color="#203060"/>
 </linearGradient>
 </defs>
 <!-- Ruler on right side -->
 
 <!-- Ruler tick marks -->
 <g stroke="#8a6820" stroke-width="0.5">
 <line x1="23" y1="5" x2="26" y2="5"/>
 <line x1="23" y1="7" x2="25" y2="7"/>
 <line x1="23" y1="9" x2="26" y2="9"/>
 <line x1="23" y1="11" x2="25" y2="11"/>
 <line x1="23" y1="13" x2="26" y2="13"/>
 <line x1="23" y1="15" x2="25" y2="15"/>
 <line x1="23" y1="17" x2="26" y2="17"/>
 <line x1="23" y1="19" x2="25" y2="19"/>
 <line x1="23" y1="21" x2="26" y2="21"/>
 <line x1="23" y1="23" x2="25" y2="23"/>
 <line x1="23" y1="25" x2="26" y2="25"/>
 <line x1="23" y1="27" x2="25" y2="27"/>
 </g>
 <!-- Double-headed vertical arrow -->
 <!-- Arrow shaft -->
 
 <!-- Top arrowhead -->
 <polygon points="10.25,2 7,7 13.5,7" fill="url(#arrowGrad)"/>
 <!-- Bottom arrowhead -->
 <polygon points="10.25,30 7,25 13.5,25" fill="url(#arrowGrad)"/>
 <!-- Human figure (simplified) -->
 <!-- Head -->
 
 <!-- Hair -->
 <path d="M16 6.5 Q18 4.5 20 6.5" fill="#4a2800"/>
 <!-- Neck -->
 <rect x="17.3" y="9" width="1.4" height="1.5" rx="0.5" fill="url(#figSkin2)"/>
 <!-- Torso -->
 <rect x="15" y="10.5" width="6" height="7" rx="1" fill="url(#figCloth)"/>
 <!-- Arms -->
 <path d="M15 11 L12 15 L13 15.5 L15.5 12" fill="url(#figSkin2)"/>
 <path d="M21 11 L24 15 L23 15.5 L20.5 12" fill="url(#figSkin2)"/>
 <!-- Hands -->
 <circle cx="12.5" cy="15.5" r="0.8" fill="url(#figSkin2)"/>
 <circle cx="23.5" cy="15.5" r="0.8" fill="url(#figSkin2)"/>
 <!-- Legs -->
 <rect x="15" y="17.5" width="2.5" height="7" rx="1" fill="url(#figCloth)"/>
 <rect x="18.5" y="17.5" width="2.5" height="7" rx="1" fill="url(#figCloth)"/>
 <!-- Feet -->
 <ellipse cx="16" cy="25" rx="2" ry="0.9" fill="#2a3040"/>
 <ellipse cx="20" cy="25" rx="2" ry="0.9" fill="#2a3040"/>
