<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
<radialGradient id="sk" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FFE0BD"/><stop offset="100%" stop-color="#A66744"/></radialGradient>
<radialGradient id="ring" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7BC8FF" stop-opacity="0.7"/><stop offset="100%" stop-color="#7BC8FF" stop-opacity="0"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- ripple circles emanating from touch point -->
<circle cx="14" cy="22" r="10" fill="none" stroke="url(#ring)" stroke-width="1"/>
<circle cx="14" cy="22" r="7" fill="none" stroke="url(#ring)" stroke-width="1"/>
<circle cx="14" cy="22" r="4" fill="none" stroke="url(#ring)" stroke-width="1"/>
<!-- contact dot -->
<circle cx="14" cy="22" r="1" fill="#3FCBE7"/>
<!-- hand entering from upper right (forearm sleeve) -->
<rect x="22" y="2" width="6" height="8" rx="1" fill="#5C6BC0" transform="rotate(20 22 2)"/>
<!-- wrist -->
<circle cx="22" cy="8" r="2" fill="url(#sk)"/>
<!-- palm/back of hand -->
<path d="M16 10 Q 14 14 16 16 Q 18 17 22 15 Q 25 13 25 10 Q 24 7 21 7 Q 17 7 16 10 Z" fill="url(#sk)"/>
<!-- thumb -->
<path d="M16 13 Q 14 15 15 17 Q 17 18 18 15 Z" fill="url(#sk)"/>
<!-- knuckles for other fingers (curled) -->
<circle cx="18" cy="12" r="1.2" fill="url(#sk)"/>
<circle cx="20" cy="11" r="1.2" fill="url(#sk)"/>
<circle cx="22" cy="11" r="1.2" fill="url(#sk)"/>
<!-- extended index finger pointing down to touch dot -->
<path d="M19 16 L 14 22 Q 13.5 22.5 14 23 Q 14.5 23.5 15 23 L 21 17 Z" fill="url(#sk)"/>
<!-- fingernail tip on index -->
<ellipse cx="14.5" cy="22.5" rx="0.4" ry="0.5" fill="#FFE9D6"/>
<!-- highlight on hand -->
<ellipse cx="18" cy="11" rx="2" ry="1" fill="url(#hi)"/>
</svg>