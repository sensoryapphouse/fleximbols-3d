      <stop offset="0" stop-color="#7ad0ff"/>
      <stop offset="0.25" stop-color="#bfeeff"/>
      <stop offset="0.5" stop-color="#5ab8e0"/>
      <stop offset="0.75" stop-color="#bfeeff"/>
