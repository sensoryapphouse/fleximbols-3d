<defs>
<linearGradient id="mg_wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c79a5e"/><stop offset="0.5" stop-color="#9c6f38"/><stop offset="1" stop-color="#7a5328"/></linearGradient>
<linearGradient id="mg_hay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffdf8a"/><stop offset="1" stop-color="#e0b048"/></linearGradient>
<linearGradient id="mg_swad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ee"/></linearGradient>
<radialGradient id="mg_sk" cx="42%" cy="35%" r="70%"><stop offset="0%" stop-color="#ffe0bd"/><stop offset="1" stop-color="#d49a68"/></radialGradient>
<radialGradient id="mg_star" cx="40%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff3b0"/><stop offset="1" stop-color="#f0c020"/></radialGradient>
</defs>
<!-- star above with rays -->
<g stroke="#d9a615" stroke-width="0.5" stroke-linecap="round">
<line x1="16" y1="1.5" x2="16" y2="3.5"/><line x1="11.5" y1="3.5" x2="12.8" y2="4.8"/><line x1="20.5" y1="3.5" x2="19.2" y2="4.8"/>
</g>
<path d="M16 2.6 L17.1 6 L20.6 6 L17.8 8.1 L18.9 11.4 L16 9.4 L13.1 11.4 L14.2 8.1 L11.4 6 L14.9 6 Z" fill="url(#mg_star)" stroke="#d9a615" stroke-width="0.4" stroke-linejoin="round"/>
<!-- crossed wooden legs -->
<g stroke="#5e3f1e" stroke-width="0.4">
<rect x="4.5" y="17" width="2.2" height="12" rx="1" fill="url(#mg_wood)" transform="rotate(18 5.6 23)"/>
<rect x="25.3" y="17" width="2.2" height="12" rx="1" fill="url(#mg_wood)" transform="rotate(-18 26.4 23)"/>
<rect x="4.5" y="17" width="2.2" height="12" rx="1" fill="url(#mg_wood)" transform="rotate(-18 5.6 23)"/>
<rect x="25.3" y="17" width="2.2" height="12" rx="1" fill="url(#mg_wood)" transform="rotate(18 26.4 23)"/>
</g>
<!-- trough body (V-shaped bin) -->
<path d="M4 16 L28 16 L23 25 C22.6 25.8 22 26 21 26 L11 26 C10 26 9.4 25.8 9 25 Z" fill="url(#mg_wood)" stroke="#5e3f1e" stroke-width="0.5" stroke-linejoin="round"/>
<rect x="4" y="15.4" width="24" height="2.4" rx="1.2" fill="#b08550" stroke="#5e3f1e" stroke-width="0.4"/>
