<path d="M10 18.5 L11.5 24.5 M16 18.5 L16 25 M22 18.5 L20.5 24.5" stroke="#6e4d28" stroke-width="0.4"/>
<!-- hay mound in trough -->
<path d="M6.5 16.5 C9 13.5 23 13.5 25.5 16.5 C22 18.5 10 18.5 6.5 16.5 Z" fill="url(#mg_hay)" stroke="#cc9a30" stroke-width="0.3"/>
<g stroke="#cc9a30" stroke-width="0.3" stroke-linecap="round">
<line x1="8" y1="15.5" x2="9.5" y2="14"/><line x1="24" y1="15.5" x2="22.5" y2="14"/><line x1="11" y1="14.6" x2="11.5" y2="13"/>
</g>
<!-- swaddled baby -->
<path d="M11.5 16 C11.5 13.5 14 12 16.5 12.5 C19.5 13 21 15 20.5 16.4 C18 17 13 17 11.5 16 Z" fill="url(#mg_swad)" stroke="#c2ccd6" stroke-width="0.3"/>
<!-- baby head -->
