  <defs>
    <radialGradient id="wr_ring" cx="42%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4fae45"/>
      <stop offset="60%" stop-color="#2f8a32"/>
      <stop offset="100%" stop-color="#1c5e22"/>
    </radialGradient>
    <radialGradient id="wr_berry" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff6a5a"/>
      <stop offset="100%" stop-color="#c01818"/>
    </radialGradient>
    <linearGradient id="wr_bow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a5a"/>
      <stop offset="100%" stop-color="#b81818"/>
    </linearGradient>
  </defs>
  <!-- Foliage ring (thick torus look) -->
  <circle cx="50" cy="52" r="36" fill="none" stroke="url(#wr_ring)" stroke-width="20"/>
  <!-- darker inner/outer edge to add depth -->
  <circle cx="50" cy="52" r="42" fill="none" stroke="#1c5e22" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="52" r="26" fill="none" stroke="#16491a" stroke-width="2" opacity="0.5"/>
  <!-- Holly leaves dotted around -->
  <g fill="#3aa03a" stroke="#16491a" stroke-width="1.2">
    <ellipse cx="50" cy="14" rx="9" ry="4.5" transform="rotate(0 50 14)"/>
    <ellipse cx="78" cy="24" rx="9" ry="4.5" transform="rotate(40 78 24)"/>
    <ellipse cx="88" cy="52" rx="9" ry="4.5" transform="rotate(90 88 52)"/>
    <ellipse cx="78" cy="80" rx="9" ry="4.5" transform="rotate(135 78 80)"/>
    <ellipse cx="50" cy="90" rx="9" ry="4.5" transform="rotate(0 50 90)"/>
    <ellipse cx="22" cy="80" rx="9" ry="4.5" transform="rotate(45 22 80)"/>
    <ellipse cx="12" cy="52" rx="9" ry="4.5" transform="rotate(90 12 52)"/>
    <ellipse cx="22" cy="24" rx="9" ry="4.5" transform="rotate(140 22 24)"/>
  </g>
  <!-- lighter foliage highlights -->
  <g fill="#5cc154" opacity="0.6">
    <ellipse cx="64" cy="20" rx="6" ry="3" transform="rotate(25 64 20)"/>
    <ellipse cx="84" cy="38" rx="6" ry="3" transform="rotate(65 84 38)"/>
    <ellipse cx="34" cy="20" rx="6" ry="3" transform="rotate(-25 34 20)"/>
    <ellipse cx="16" cy="38" rx="6" ry="3" transform="rotate(-65 16 38)"/>
  </g>
  <!-- Red berries -->
  <g stroke="#7a1010" stroke-width="0.8">
    <circle cx="36" cy="22" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="70" cy="26" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="84" cy="60" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="64" cy="84" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="30" cy="74" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="16" cy="46" r="3.5" fill="url(#wr_berry)"/>
    <circle cx="52" cy="88" r="3.2" fill="url(#wr_berry)"/>
  </g>
  <!-- Bow at top -->
  <g>
    <path d="M50 10 L40 4 Q34 8 40 14 Z" fill="url(#wr_bow)" stroke="#7a1010" stroke-width="1.4"/>
    <path d="M50 10 L60 4 Q66 8 60 14 Z" fill="url(#wr_bow)" stroke="#7a1010" stroke-width="1.4"/>
    <circle cx="50" cy="10" r="3.5" fill="#e23030" stroke="#7a1010" stroke-width="1.2"/>
    <path d="M48 12 L44 22 M52 12 L56 22" stroke="#c01818" stroke-width="3" stroke-linecap="round"/>
  </g>
