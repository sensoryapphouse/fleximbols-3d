<defs>
<linearGradient id="skWall" x1="6" y1="12" x2="6" y2="27" gradientUnits="userSpaceOnUse">
<stop stop-color="#D6A56A"/><stop offset="1" stop-color="#B07E44"/>
</linearGradient>
<linearGradient id="skWall2" x1="16" y1="12" x2="16" y2="27" gradientUnits="userSpaceOnUse">
<stop stop-color="#E3B878"/><stop offset="1" stop-color="#C49356"/>
</linearGradient>
<linearGradient id="skLeaf" x1="16" y1="4" x2="16" y2="12" gradientUnits="userSpaceOnUse">
<stop stop-color="#5FB84E"/><stop offset="1" stop-color="#3E8F33"/>
</linearGradient>
</defs>
<!-- ground -->
<ellipse cx="16" cy="27.0" rx="13" ry="2.4" fill="#C8A06A" opacity="0.5"/>
<!-- back wall -->
<rect x="6.5" y="11.5" width="19" height="14.5" fill="url(#skWall2)"/>
<!-- horizontal plank lines -->
<g stroke="#9C7038" stroke-width="0.35" opacity="0.6">
<line x1="6.5" y1="14.5" x2="25.5" y2="14.5"/>
<line x1="6.5" y1="17.5" x2="25.5" y2="17.5"/>
<line x1="6.5" y1="20.5" x2="25.5" y2="20.5"/>
<line x1="6.5" y1="23.5" x2="25.5" y2="23.5"/>
</g>
<!-- side wall (left, 3D depth) -->
<path d="M6.5 11.5 L3.6 13.0 L3.6 27.0 L6.5 26.0 Z" fill="url(#skWall)"/>
<!-- corner posts -->
<rect x="6.2" y="11.5" width="0.9" height="14.5" fill="#8C6230"/>
<rect x="24.8" y="11.5" width="0.9" height="14.5" fill="#8C6230"/>
<!-- leafy roof (s'chach): overlapping branch/leaf clusters across the top -->
<g fill="url(#skLeaf)">
<ellipse cx="6" cy="10.5" rx="3.4" ry="1.7"/>
<ellipse cx="11" cy="9.6" rx="3.6" ry="1.8"/>
<ellipse cx="16" cy="9.2" rx="3.8" ry="1.9"/>
<ellipse cx="21" cy="9.6" rx="3.6" ry="1.8"/>
<ellipse cx="26" cy="10.5" rx="3.4" ry="1.7"/>
</g>
<!-- leaf veins / branch hints -->
<g stroke="#2E6B26" stroke-width="0.4" opacity="0.7">
<line x1="9" y1="8.4" x2="13" y2="10.2"/>
<line x1="15" y1="8.0" x2="18" y2="10.0"/>
<line x1="20" y1="8.4" x2="23" y2="10.2"/>
</g>
<!-- hanging fruit inside the sukkah -->
<line x1="11" y1="11.6" x2="11" y2="14.2" stroke="#7A5A2E" stroke-width="0.3"/>
<circle cx="11" cy="15.4" r="1.7" fill="#F2D23A"/>
<ellipse cx="10.4" cy="14.8" rx="0.5" ry="0.35" fill="#FFF0A0" opacity="0.8"/>
<line x1="16" y1="11.6" x2="16" y2="13.6" stroke="#7A5A2E" stroke-width="0.3"/>
<g fill="#8E4FB0"><circle cx="15.3" cy="14.6" r="0.8"/><circle cx="16.5" cy="14.6" r="0.8"/><circle cx="15.9" cy="15.6" r="0.8"/><circle cx="16.0" cy="13.8" r="0.7"/></g>
<line x1="21" y1="11.6" x2="21" y2="14.2" stroke="#7A5A2E" stroke-width="0.3"/>
<circle cx="21" cy="15.4" r="1.6" fill="#E2473B"/>
<ellipse cx="20.5" cy="14.9" rx="0.45" ry="0.3" fill="#FF9A8A" opacity="0.8"/>
</svg>
