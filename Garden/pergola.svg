<defs>
<linearGradient id="pg_woodv" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#d8b98a"/>
<stop offset="1" stop-color="#a87f4e"/>
</linearGradient>
<linearGradient id="pg_beam" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c79f6e"/>
<stop offset="1" stop-color="#8f6a3e"/>
</linearGradient>
<radialGradient id="pg_ground" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#8fd07a"/>
<stop offset="1" stop-color="#5fa84a"/>
</radialGradient>
<filter id="pg_sh" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
</filter>
</defs>

<!-- ground -->
<ellipse cx="100" cy="176" rx="78" ry="11" fill="url(#pg_ground)"/>

<g filter="url(#pg_sh)">
<!-- back overhead slats -->
<g fill="url(#pg_beam)" stroke="#5e451f" stroke-width="2" stroke-linejoin="round">
<rect x="40" y="44" width="11" height="34" rx="2"/>
<rect x="64" y="44" width="11" height="34" rx="2"/>
<rect x="88" y="44" width="11" height="34" rx="2"/>
<rect x="112" y="44" width="11" height="34" rx="2"/>
<rect x="136" y="44" width="11" height="34" rx="2"/>
</g>

<!-- top crossbeam -->
<rect x="26" y="60" width="148" height="16" rx="4" fill="url(#pg_beam)" stroke="#5e451f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="30" y="63" width="140" height="4" rx="2" fill="#e2c79b" opacity="0.6"/>

<!-- posts -->
<rect x="38" y="72" width="18" height="92" rx="3" fill="url(#pg_woodv)" stroke="#5e451f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="144" y="72" width="18" height="92" rx="3" fill="url(#pg_woodv)" stroke="#5e451f" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="41" y="76" width="4" height="84" rx="2" fill="#e8cfa3" opacity="0.55"/>
<rect x="147" y="76" width="4" height="84" rx="2" fill="#e8cfa3" opacity="0.55"/>
</g>

<!-- climbing greenery on top -->
<g fill="#5fa84a" stroke="#3f7d30" stroke-width="1.5">
<circle cx="58" cy="50" r="7"/>
<circle cx="84" cy="47" r="8"/>
<circle cx="112" cy="49" r="7"/>
<circle cx="138" cy="48" r="8"/>
<circle cx="100" cy="44" r="7"/>
</g>
</svg>
