 <defs>
 <linearGradient id="nailShaft" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#9A9AB0"/><stop offset="50%" stop-color="#E8E8F8"/><stop offset="100%" stop-color="#5A5A7A"/></linearGradient>
