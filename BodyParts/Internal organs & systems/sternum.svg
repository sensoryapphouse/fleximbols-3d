<defs>
<radialGradient id="snG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F0E8D0"/><stop offset="1" stop-color="#A89878"/></radialGradient>
<radialGradient id="rbG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#E0D8B8"/><stop offset="1" stop-color="#90805A"/></radialGradient>
<radialGradient id="hiG" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#FFB098"/><stop offset="0.5" stop-color="#C84830" stop-opacity="0.3"/><stop offset="1" stop-color="#5A0A00" stop-opacity="0"/></radialGradient>
</defs>
<!-- subtle chest silhouette (faded) for context -->
<path d="M3 9 Q3 4 16 4 Q29 4 29 9 L29 28 Q29 30 27 30 L5 30 Q3 30 3 28 Z" fill="url(#hiG)" opacity="0.45"/>
<!-- ribs left side -->
<g fill="url(#rbG)" stroke="#7A6A48" stroke-width="0.25">
<path d="M14 9 Q6 8 3 11 Q3 12 4 12 Q7 10 13.5 11 Z"/>
<path d="M14 13 Q5 12.5 2 16 Q2 17 3 17 Q6 14 13.5 15 Z"/>
<path d="M14 17 Q5 17 2 20.5 Q2 21.5 3 21.5 Q6 19 13.5 19 Z"/>
<path d="M14 21 Q6 21.5 4 25 Q4 26 5 26 Q8 23.5 13.5 23 Z"/>
</g>
<!-- ribs right side -->
<g fill="url(#rbG)" stroke="#7A6A48" stroke-width="0.25">
<path d="M18 9 Q26 8 29 11 Q29 12 28 12 Q25 10 18.5 11 Z"/>
<path d="M18 13 Q27 12.5 30 16 Q30 17 29 17 Q26 14 18.5 15 Z"/>
<path d="M18 17 Q27 17 30 20.5 Q30 21.5 29 21.5 Q26 19 18.5 19 Z"/>
<path d="M18 21 Q26 21.5 28 25 Q28 26 27 26 Q24 23.5 18.5 23 Z"/>
</g>
<!-- sternum bone in center (manubrium + body + xiphoid) -->
<!-- manubrium (top wide part) -->
<path d="M12 6 Q12 5 13 5 L19 5 Q20 5 20 6 L20 10 Q20 11 19 11 L13 11 Q12 11 12 10 Z" fill="url(#snG)"/>
<rect x="13" y="6" width="6" height="0.8" fill="#FFFFFF" opacity="0.6"/>
<!-- sternal angle -->
<line x1="12.5" y1="11" x2="19.5" y2="11" stroke="#7A6A48" stroke-width="0.3"/>
<!-- body of sternum (long flat) -->
<path d="M13 11 L19 11 L19 22 Q19 23 18 23 L14 23 Q13 23 13 22 Z" fill="url(#snG)"/>
<rect x="13.5" y="12" width="1" height="10" fill="#FFFFFF" opacity="0.5"/>
<!-- transverse ridges -->
<g stroke="#A89878" stroke-width="0.25" opacity="0.7">
<line x1="13" y1="14" x2="19" y2="14"/>
<line x1="13" y1="17" x2="19" y2="17"/>
<line x1="13" y1="20" x2="19" y2="20"/>
</g>
<!-- xiphoid process (pointed tip) -->
<path d="M14 23 L18 23 L17 25 Q16 27 16 25 Q16 27 15 25 Z" fill="url(#snG)"/>
<path d="M14.2 23.2 L17.8 23.2 L16 26.5 Z" fill="none" stroke="#7A6A48" stroke-width="0.25"/>
<!-- clavicle hint at top -->
<path d="M5 7 Q9 5 12 6 L12 7 Q9 6 5 8 Z" fill="url(#rbG)" stroke="#7A6A48" stroke-width="0.25"/>
<path d="M27 7 Q23 5 20 6 L20 7 Q23 6 27 8 Z" fill="url(#rbG)" stroke="#7A6A48" stroke-width="0.25"/>
</svg>
