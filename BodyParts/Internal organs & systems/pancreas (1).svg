 <defs>
 <!-- Stomach (faint context shape) gradient -->
 <radialGradient id="stomachG" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#ffddcc"/>
 <stop offset="100%" stop-color="#cc8866"/>
 </radialGradient>
 <!-- Pancreas gradient: pink-orange tapered gland -->
 <linearGradient id="pancrG" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ff9988"/>
 <stop offset="100%" stop-color="#cc3333"/>
 </linearGradient>
 <!-- Duct gradient -->
 <linearGradient id="ductG" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#ffddcc"/>
 <stop offset="100%" stop-color="#aa5533"/>
 </linearGradient>
 <!-- Highlight gradient -->
 <linearGradient id="hlG" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ffeeee"/>
 <stop offset="100%" stop-color="#ffbbaa"/>
 </linearGradient>
 </defs>
 <!-- Faint stomach outline for anatomical context -->
 <path d="M8 6 Q6 8 6 12 Q5 18 8 22 Q12 26 16 24 Q20 22 20 18 Q22 12 20 8 Q18 4 14 4 Q10 4 8 6 Z"
 fill="url(#stomachG)" fill-opacity="0.25" stroke="#cc8866" stroke-width="0.8" stroke-opacity="0.4"/>
 <!-- Pancreas: elongated tapered gland, roughly horizontal, wider left tapering right -->
 <!-- Main body of pancreas -->
 <path d="M4 17 Q5 14 9 14 Q14 13.5 20 15 Q26 16 29 19 Q28 21.5 25 21.5 Q18 21 13 20.5 Q8 20 5 20 Q3.5 19 4 17 Z"
 fill="url(#pancrG)" filter="url(#shad)"/>
 <!-- Highlight gloss on top surface -->
 <path d="M6 16 Q10 14.5 18 16 Q22 17 25 19.5 Q20 18.5 14 18.5 Q9 18.5 6 17 Z"
 fill="url(#hlG)" fill-opacity="0.3"/>
 <!-- Main pancreatic duct running through center -->
 <path d="M6 18 Q14 17.5 27 20" fill="none" stroke="url(#ductG)" stroke-width="1.2" stroke-linecap="round"/>
 <!-- Small lobule texture -->
 <circle cx="9" cy="17.5" r="1" fill="none" stroke="#dd5544" stroke-width="0.5" stroke-opacity="0.5"/>
 <circle cx="13" cy="17" r="1.1" fill="none" stroke="#dd5544" stroke-width="0.5" stroke-opacity="0.5"/>
 <circle cx="18" cy="17.5" r="1" fill="none" stroke="#dd5544" stroke-width="0.5" stroke-opacity="0.5"/>
 <circle cx="22.5" cy="18.5" r="0.9" fill="none" stroke="#dd5544" stroke-width="0.5" stroke-opacity="0.5"/>
</svg>
