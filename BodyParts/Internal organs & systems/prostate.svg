<defs>
<radialGradient id="blG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFF4B0"/><stop offset="0.5" stop-color="#E8B438"/><stop offset="1" stop-color="#6E4400"/></radialGradient>
<radialGradient id="prG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFB098"/><stop offset="0.5" stop-color="#C84830"/><stop offset="1" stop-color="#5A0A00"/></radialGradient>
<radialGradient id="tbG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE0CC"/><stop offset="0.5" stop-color="#E08858"/><stop offset="1" stop-color="#6A2A10"/></radialGradient>
</defs>
<!-- bladder above (smaller, faded to indicate context) -->
<ellipse cx="16" cy="8" rx="7" ry="4.2" fill="url(#blG)" opacity="0.9"/>
<ellipse cx="13.5" cy="6.5" rx="3" ry="1.2" fill="#FFFFFF" opacity="0.55"/>
<!-- urethra exiting bladder -->
<rect x="15" y="11.5" width="2" height="3" fill="url(#tbG)"/>
<!-- prostate (walnut/heart-shaped, two lobes) -->
<path d="M16 13 Q9 13 8 18 Q8 23 12 25.5 Q14 26.5 16 25 Q18 26.5 20 25.5 Q24 23 24 18 Q23 13 16 13 Z" fill="url(#prG)"/>
<!-- median sulcus (groove between lobes) -->
<path d="M16 14 Q15.5 19 16 25" stroke="#5A0A00" stroke-width="0.45" fill="none" opacity="0.75"/>
<!-- highlights -->
<ellipse cx="12" cy="16" rx="2.5" ry="1" fill="#FFFFFF" opacity="0.5"/>
<ellipse cx="20" cy="16" rx="2.5" ry="1" fill="#FFFFFF" opacity="0.5"/>
<!-- urethra passing through prostate (visible channel) -->
<path d="M16 14 Q15.8 18 16 22" stroke="#FFE0CC" stroke-width="1" fill="none" opacity="0.6"/>
<!-- urethra continuing below -->
<path d="M15.2 24.5 Q15.5 27 16 29 Q16.5 27 16.8 24.5" fill="url(#tbG)"/>
<!-- texture dots on prostate (glandular surface) -->
<g fill="#5A0A00" opacity="0.4">
<circle cx="11.5" cy="20" r="0.3"/>
<circle cx="13" cy="22.5" r="0.25"/>
<circle cx="19.5" cy="22" r="0.3"/>
<circle cx="21" cy="19.5" r="0.25"/>
<circle cx="14.5" cy="18" r="0.2"/>
<circle cx="18" cy="20" r="0.25"/>
</g>
</svg>
