 <defs>
 <radialGradient id="sky" cx="0.5" cy="0.5" r="0.6">
 <stop offset="0%" stop-color="#2a3060"/>
 <stop offset="60%" stop-color="#0a1028"/>
 <stop offset="100%" stop-color="#05080e"/>
 </radialGradient>
 <radialGradient id="star" cx="0.4" cy="0.3" r="0.7">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="60%" stop-color="#ffe890"/>
 <stop offset="100%" stop-color="#a070d0"/>
 </radialGradient>
 <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- night sky background -->
 <circle cx="16" cy="16" r="14" fill="url(#sky)"/>
 <ellipse cx="10" cy="8" rx="3" ry="1" fill="#ffffff" opacity="0.1"/>
 <!-- tiny background stars -->
 <circle cx="8" cy="6" r="0.3" fill="white" fill-opacity="0.6"/>
 <circle cx="24" cy="8" r="0.3" fill="white" fill-opacity="0.6"/>
 <circle cx="5" cy="20" r="0.3" fill="white" fill-opacity="0.5"/>
 <circle cx="27" cy="22" r="0.3" fill="white" fill-opacity="0.6"/>
 <circle cx="12" cy="28" r="0.3" fill="white" fill-opacity="0.5"/>
 <circle cx="20" cy="26" r="0.25" fill="white" fill-opacity="0.5"/>
 <!-- W/M zigzag of Cassiopeia: 5 main stars connected -->
 <!-- Connecting lines (faint) -->
 <line x1="6" y1="16" x2="11" y2="10" stroke="#a0b0e0" stroke-width="0.4" stroke-opacity="0.6"/>
 <line x1="11" y1="10" x2="16" y2="15" stroke="#a0b0e0" stroke-width="0.4" stroke-opacity="0.6"/>
 <line x1="16" y1="15" x2="21" y2="9" stroke="#a0b0e0" stroke-width="0.4" stroke-opacity="0.6"/>
 <line x1="21" y1="9" x2="26" y2="14" stroke="#a0b0e0" stroke-width="0.4" stroke-opacity="0.6"/>
 <!-- Star glows -->
 <circle cx="6" cy="16" r="3" fill="url(#starGlow)"/>
 <circle cx="11" cy="10" r="3.5" fill="url(#starGlow)"/>
 <circle cx="16" cy="15" r="4" fill="url(#starGlow)"/>
 <circle cx="21" cy="9" r="3.2" fill="url(#starGlow)"/>
 <circle cx="26" cy="14" r="3" fill="url(#starGlow)"/>
 <!-- Bright stars -->
 <circle cx="6" cy="16" r="1.4" fill="url(#star)"/>
 <circle cx="11" cy="10" r="1.7" fill="url(#star)"/>
 <circle cx="16" cy="15" r="1.9" fill="url(#star)"/>
 <circle cx="21" cy="9" r="1.5" fill="url(#star)"/>
 <circle cx="26" cy="14" r="1.4" fill="url(#star)"/>
 <!-- star inner white -->
 <circle cx="6" cy="16" r="0.5" fill="#ffffff"/>
 <circle cx="11" cy="10" r="0.6" fill="#ffffff"/>
 <circle cx="16" cy="15" r="0.7" fill="#ffffff"/>
 <circle cx="21" cy="9" r="0.5" fill="#ffffff"/>
 <circle cx="26" cy="14" r="0.5" fill="#ffffff"/>
 <!-- star spikes on center star -->
 <line x1="16" y1="13" x2="16" y2="11" stroke="white" stroke-width="0.4" stroke-opacity="0.8"/>
 <line x1="14.5" y1="15" x2="12.5" y2="15" stroke="white" stroke-width="0.4" stroke-opacity="0.8"/>
 <line x1="17.5" y1="15" x2="19.5" y2="15" stroke="white" stroke-width="0.4" stroke-opacity="0.8"/>
 <line x1="16" y1="17" x2="16" y2="19" stroke="white" stroke-width="0.4" stroke-opacity="0.8"/>
</svg>
