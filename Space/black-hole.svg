 <defs>
 <radialGradient id="bkh-disk" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="25%" stop-color="#FFDD44"/>
 <stop offset="55%" stop-color="#FF6600"/>
 <stop offset="80%" stop-color="#881100"/>
 <stop offset="100%" stop-color="#220000" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="bkh-core" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#000000"/>
 <stop offset="100%" stop-color="#000000"/>
 </radialGradient>
 <filter id="bkh-glow">
 <feGaussianBlur stdDeviation="1.5" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Space background -->
 <!-- Distant stars -->
 <circle cx="3" cy="4" r="0.3" fill="white" fill-opacity="0.7"/>
 <circle cx="28" cy="6" r="0.25" fill="white" fill-opacity="0.6"/>
 <circle cx="6" cy="28" r="0.3" fill="white" fill-opacity="0.7"/>
 <circle cx="29" cy="26" r="0.2" fill="white" fill-opacity="0.5"/>
 <!-- Gravitational lensing distortion arcs -->
 <path d="M4 16 Q6 8 16 6" fill="none" stroke="#FF9900" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
 <path d="M28 16 Q26 8 16 6" fill="none" stroke="#FF9900" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
 <path d="M4 16 Q6 24 16 26" fill="none" stroke="#FF9900" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
 <path d="M28 16 Q26 24 16 26" fill="none" stroke="#FF9900" stroke-width="0.5" stroke-opacity="0.4" stroke-linecap="round"/>
 <!-- Accretion disk (elliptical, warped) -->
 <ellipse cx="16" cy="16" rx="13" ry="5" fill="url(#bkh-disk)" filter="url(#bkh-glow)"/>
 <!-- Behind the black hole portion of disk (darker) -->
 <path d="M6 15 Q16 12 26 15 L26 17 Q16 14 6 17 Z" fill="#220000" fill-opacity="0.8"/>
 <!-- Black hole sphere -->
 <circle cx="16" cy="16" r="6" fill="url(#bkh-core)" filter="url(#bkh-shad)"/>
 <!-- Innermost edge glow -->
 <circle cx="16" cy="16" r="6.5" fill="none" stroke="#FF6600" stroke-width="0.8" stroke-opacity="0.7"/>
</svg>
