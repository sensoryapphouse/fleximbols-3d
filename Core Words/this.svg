<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="ts-box" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#60a0e8"/>
 <stop offset="100%" stop-color="#2060c0"/>
 </linearGradient>
 <linearGradient id="ts-hand" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f5c090"/>
 <stop offset="100%" stop-color="#d09060"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- single highlighted box -->
 <rect x="10" y="6" width="12" height="12" rx="2" fill="url(#ts-box)"/>
 <rect x="10" y="6" width="12" height="4" rx="2" fill="white" fill-opacity="0.25"/>
 <!-- highlight glow ring -->
 <rect x="9" y="5" width="14" height="14" rx="2.5" fill="none" stroke="#80c0ff" stroke-width="1" stroke-opacity="0.7"/>
 <!-- pointing hand - index finger pointing AT box -->
 <!-- palm/hand -->
 <rect x="3" y="20" width="14" height="4" rx="2" fill="url(#ts-hand)"/>
 <!-- index finger pointing right up -->
 <rect x="16" y="17" width="5" height="2.5" rx="1.2" fill="url(#ts-hand)"/>
 <!-- fingernail -->
 <rect x="20" y="17" width="1.2" height="2" rx="0.4" fill="#e0a870"/>
 <!-- thumb -->
 <path d="M9 20 Q8 23 10 24 Q12 24 12 22" fill="url(#ts-hand)"/>
 <!-- arrow pointing at box -->
 <line x1="21" y1="18" x2="22" y2="14" stroke="#e05020" stroke-width="1" stroke-linecap="round"/>
 <polygon points="22,13.5 20.5,15 23,15.5" fill="#e05020"/>
</svg>
