 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="bank" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 <rect x="0" y="0" width="32" height="14" fill="url(#sky)"/>
 <!-- Distant mountains -->
 <polygon points="0,14 5,7 10,14" fill="url(#mountain)"/>
 <polygon points="20,14 27,5 34,14" fill="url(#mountain)"/>
 <polygon points="7,14 13,8 19,14" fill="url(#mountain)"/>
 <!-- Mountain snow -->
 <polygon points="3.5,10 5,7 6.5,10" fill="#FFFFFF" fill-opacity="0.9"/>
 <polygon points="25.5,8 27,5 28.5,8" fill="#FFFFFF" fill-opacity="0.9"/>
 <!-- Green ground / banks -->
 <rect x="0" y="14" width="32" height="18" fill="url(#bank)"/>
 <!-- S-curve river (key gesture) -->
 <!-- River path from top-center to bottom, S-curve -->
 <path d="M14,14 Q18,18 16,22 Q14,26 18,32 L22,32 Q18,26 20,22 Q22,18 18,14 Z" fill="url(#water)"/>
 <!-- River reflections -->
 <path d="M16,17 Q18,19 16,21" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
 <path d="M18,24 Q20,26 18,28" stroke="#FFFFFF" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
 <!-- Trees on left bank -->
 <ellipse cx="5" cy="20" rx="4" ry="3" fill="#33691E" fill-opacity="0.85"/>
 <ellipse cx="4" cy="18" rx="3" ry="2.5" fill="#7BAA48" fill-opacity="0.8"/>
 <!-- Trees on right bank -->
 <ellipse cx="27" cy="22" rx="4" ry="3" fill="#33691E" fill-opacity="0.85"/>
 <ellipse cx="28" cy="20" rx="3" ry="2.5" fill="#7BAA48" fill-opacity="0.8"/>
</svg>
