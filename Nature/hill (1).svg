 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#A6D9F5"/>
 <stop offset="100%" stop-color="#5CA3FF"/>
 </linearGradient>
 <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#9DC45A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="treeTrunk" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="treeTop" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 </defs>
 <!-- Sky -->
 
 <!-- Small cloud -->
 <ellipse cx="6" cy="5" rx="3" ry="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
 <ellipse cx="9" cy="5" rx="2" ry="1.2" fill="#FFFFFF" fill-opacity="0.8"/>
 <ellipse cx="24" cy="7" rx="4" ry="1.8" fill="#FFFFFF" fill-opacity="0.75"/>
 <ellipse cx="28" cy="7" rx="2.5" ry="1.3" fill="#FFFFFF" fill-opacity="0.75"/>
 <!-- Rounded hill mound -->
 <ellipse cx="16" cy="26" rx="17" ry="12" fill="url(#hillGrad)"/>
 <!-- Hill highlight (lighter top) -->
 <ellipse cx="14" cy="18" rx="7" ry="4" fill="#FFFFFF" fill-opacity="0.15"/>
 <!-- Tree trunk on top of hill -->
 <rect x="15" y="11" width="2" height="5" fill="url(#treeTrunk)"/>
 <!-- Tree canopy -->
 <ellipse cx="16" cy="10" rx="4" ry="4" fill="url(#treeTop)"/>
 <ellipse cx="16" cy="8" rx="3" ry="3" fill="#7BAA48" fill-opacity="0.8"/>
</svg>
