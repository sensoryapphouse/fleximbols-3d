 <defs>
 <linearGradient id="mr-rock" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#b0a898"/>
 <stop offset="100%" stop-color="#706858"/>
 </linearGradient>
 <linearGradient id="mr-sky" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#a8c8f0"/>
 <stop offset="100%" stop-color="#d0e8ff"/>
 </linearGradient>
 <linearGradient id="mr-mountain" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0b8a8"/>
 <stop offset="100%" stop-color="#807060"/>
 </linearGradient>
 <linearGradient id="mr-tree" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#408030"/>
 <stop offset="100%" stop-color="#204018"/>
 </linearGradient>
 </defs>
 <!-- Sky background tint (light gradient, no rect) -->
 <path d="M0 0 L32 0 L32 18 L0 18 Z" fill="url(#mr-sky)" fill-opacity="0.5"/>
 <!-- Mountain cliff body -->
 
 <!-- Rock face highlight -->
 <path d="M2 32 L2 12 Q5 8 9 10 L30 10 L30 32" fill="url(#mr-rock)" fill-opacity="0.7"/>
 <!-- 4 presidential heads carved in row -->
 <!-- Head 1 (Washington) -->
 <ellipse cx="6" cy="14" rx="3" ry="3.5" fill="#b0a898"/>
 <ellipse cx="6" cy="11.5" rx="3" ry="1.8" fill="#c0b8a0"/>
 <line x1="4" y1="15" x2="8" y2="15" stroke="#907868" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Head 2 (Jefferson) -->
 <ellipse cx="13" cy="13.5" rx="3" ry="3.5" fill="#b0a898"/>
 <ellipse cx="13" cy="11" rx="3" ry="1.8" fill="#c0b8a0"/>
 <line x1="11" y1="14.5" x2="15" y2="14.5" stroke="#907868" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Head 3 (Lincoln) -->
 <ellipse cx="20" cy="13" rx="3" ry="3.8" fill="#b0a898"/>
 <ellipse cx="20" cy="10.5" rx="3" ry="2" fill="#c0b8a0"/>
 <line x1="18" y1="14" x2="22" y2="14" stroke="#907868" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Head 4 (Roosevelt) -->
 <ellipse cx="27" cy="14" rx="3" ry="3.5" fill="#b0a898"/>
 <ellipse cx="27" cy="11.5" rx="3" ry="1.8" fill="#c0b8a0"/>
 <line x1="25" y1="15" x2="29" y2="15" stroke="#907868" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Pine trees at base -->
 <polygon points="3,32 5,24 7,32" fill="url(#mr-tree)"/>
 <polygon points="1,32 2.5,27 4,32" fill="url(#mr-tree)" fill-opacity="0.8"/>
 <polygon points="25,32 27,25 29,32" fill="url(#mr-tree)"/>
 <polygon points="27,32 29,26 31,32" fill="url(#mr-tree)" fill-opacity="0.8"/>
 <!-- Flag hint -->
 <line x1="29" y1="3" x2="29" y2="9" stroke="#c0c0c0" stroke-width="0.7"/>
 <rect x="29" y="3" width="3" height="2" fill="#cc2020" fill-opacity="0.8"/>
 <line x1="29" y1="4" x2="32" y2="4" stroke="#ffffff" stroke-width="0.4"/>
 <line x1="29" y1="5" x2="32" y2="5" stroke="#ffffff" stroke-width="0.3"/>
