<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="nf_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#88c8f0"/>
    </linearGradient>
    <linearGradient id="nf_cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8a4a"/>
      <stop offset="1" stop-color="#5c6633"/>
    </linearGradient>
    <linearGradient id="nf_water" x1="0" y1="8" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="0.5" stop-color="#bfe4f7"/>
      <stop offset="1" stop-color="#8fc8e8"/>
    </linearGradient>
    <linearGradient id="nf_pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aedcf2"/>
      <stop offset="1" stop-color="#5ea8d8"/>
    </linearGradient>
  </defs>
  <!-- sky background -->
  <rect x="2" y="2" width="28" height="28" rx="2.5" fill="url(#nf_sky)"/>
  <!-- cliff ledges (left + right) over which water falls -->
  <path d="M2 11 L13 11 L13 9 L2 9 Z" fill="url(#nf_cliff)"/>
  <path d="M19 11 L30 11 L30 9 L19 9 Z" fill="url(#nf_cliff)"/>
  <!-- the big curved horseshoe falls (wide sheet of falling water) -->
  <path d="M9 10 L23 10 L21.5 24 Q16 26 10.5 24 Z" fill="url(#nf_water)" stroke="#cfeaf7" stroke-width="0.5"/>
  <!-- vertical streak lines of falling water -->
  <g stroke="#ffffff" stroke-width="0.6" opacity="0.85" stroke-linecap="round">
    <line x1="12" y1="11" x2="11.3" y2="23"/>
    <line x1="14.5" y1="11" x2="14.2" y2="24"/>
    <line x1="16" y1="11" x2="16" y2="24.5"/>
    <line x1="17.5" y1="11" x2="17.8" y2="24"/>
    <line x1="20" y1="11" x2="20.7" y2="23"/>
  </g>
  <!-- misty pool / spray at the base -->
  <ellipse cx="16" cy="25.5" rx="8.5" ry="3.2" fill="url(#nf_pool)"/>
  <circle cx="11" cy="24.5" r="1.6" fill="#ffffff" opacity="0.9"/>
  <circle cx="14" cy="25.6" r="1.9" fill="#ffffff" opacity="0.85"/>
  <circle cx="18" cy="25.2" r="1.7" fill="#ffffff" opacity="0.9"/>
  <circle cx="21" cy="25.8" r="1.5" fill="#ffffff" opacity="0.8"/>
  <!-- Canadian red maple leaf (identifies Niagara) on a white roundel -->
  <circle cx="25.4" cy="6.4" r="4.6" fill="#ffffff" stroke="#e8392b" stroke-width="0.7"/>
  <g transform="translate(25.4 6.6) scale(0.5)" fill="#e8392b">
    <!-- simplified Canadian maple leaf -->
    <path d="M0 -7.5
             L0.9 -5 L3 -5.8 L2.2 -3.2 L4.7 -3.8 L3.6 -1.6 L6.8 -0.4 L4.4 0.9 L5 2.2 L1.6 1.6 L2 4
             L0.6 3.2 L0.9 6.5 L-0.9 6.5 L-0.6 3.2 L-2 4 L-1.6 1.6 L-5 2.2 L-4.4 0.9 L-6.8 -0.4
             L-3.6 -1.6 L-4.7 -3.8 L-2.2 -3.2 L-3 -5.8 L-0.9 -5 Z"/>
  </g>
</svg>
