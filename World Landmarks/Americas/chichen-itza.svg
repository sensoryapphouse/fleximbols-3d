 <defs>
 <linearGradient id="stone-g" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e8d4a0"/>
 <stop offset="50%" stop-color="#c8a870"/>
 <stop offset="100%" stop-color="#8a6030"/>
 </linearGradient>
 </defs>
 <!-- Ground -->
 <rect x="2" y="28" width="28" height="2" rx="0.5" fill="#c8a870" fill-opacity="0.4"/>
 <!-- Pyramid terraces (bottom to top, wide to narrow) -->
 <!-- Terrace 1 (widest, bottom) -->
 <rect x="3" y="25" width="26" height="3" rx="0.3" fill="url(#stone-g)" filter="url(#drop)"/>
 <!-- Terrace 2 -->
 <rect x="5" y="22.2" width="22" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 3 -->
 <rect x="7" y="19.5" width="18" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 4 -->
 <rect x="9" y="16.8" width="14" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 5 -->
 <rect x="11" y="14.1" width="10" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 6 -->
 <rect x="12.5" y="11.5" width="7" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 7 -->
 <rect x="13.5" y="9" width="5" height="3" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 8 -->
 <rect x="14" y="6.8" width="4" height="2.5" rx="0.3" fill="url(#stone-g)"/>
 <!-- Terrace 9 (top platform) -->
 <rect x="14.5" y="5" width="3" height="2.2" rx="0.3" fill="url(#stone-g)"/>
 <!-- Temple at apex -->
 <rect x="14" y="3" width="4" height="2.5" rx="0.3" fill="url(#stone-g)" filter="url(#drop)"/>
 <!-- Temple doorway -->
 <rect x="15.3" y="3.5" width="1.4" height="2" rx="0.2" fill="#5a3a10" fill-opacity="0.7"/>
 <!-- Central staircase line -->
 <line x1="16" y1="5" x2="16" y2="25" stroke="#8a6030" stroke-width="0.6" stroke-opacity="0.6"/>
 <!-- Shadow sides of terraces -->
 <rect x="3" y="25" width="13" height="3" rx="0.3" fill="#8a6030" fill-opacity="0.15"/>
</svg>
