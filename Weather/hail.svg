<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sky_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#303840"/>
 <stop offset="100%" stop-color="#484c58"/>
 </linearGradient>
 <linearGradient id="cloud_g" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#585c6a"/>
 <stop offset="100%" stop-color="#303440"/>
 </linearGradient>
 <linearGradient id="cloud2_g" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#484c58"/>
 <stop offset="100%" stop-color="#202430"/>
 </linearGradient>
 <radialGradient id="hailstone_g" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#ffffff"/>
 <stop offset="50%" stop-color="#d8e8f8"/>
 <stop offset="100%" stop-color="#90aac8"/>
 </radialGradient>
 <linearGradient id="ground_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#d8e4f0"/>
 <stop offset="100%" stop-color="#9ab0c8"/>
 </linearGradient>
 <linearGradient id="grass_g" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#5a9048"/>
 <stop offset="100%" stop-color="#304820"/>
 </linearGradient>
 </defs>

 <!-- Dark storm sky -->
 <rect x="0" y="0" width="32" height="24" fill="url(#sky_g)"/>

 <!-- Ground with accumulated hailstones -->
 <rect x="0" y="24" width="32" height="8" fill="url(#grass_g)"/>
 <!-- Hail accumulation layer on ground -->
 <ellipse cx="8" cy="24.5" rx="6" ry="1.5" fill="url(#ground_g)"/>
 <ellipse cx="20" cy="25" rx="8" ry="1.8" fill="url(#ground_g)"/>
 <ellipse cx="30" cy="24.5" rx="4" ry="1.2" fill="url(#ground_g)"/>

 <!-- Storm clouds -->
 <ellipse cx="9" cy="6" rx="8" ry="5" fill="url(#cloud2_g)"/>
 <ellipse cx="5" cy="5" rx="5" ry="3.5" fill="#282c38"/>
 <ellipse cx="20" cy="5" rx="11" ry="5.5" fill="url(#cloud_g)"/>
 <ellipse cx="27" cy="6" rx="7" ry="4" fill="url(#cloud2_g)"/>
 <ellipse cx="16" cy="3.5" rx="6" ry="3.5" fill="#282c38"/>

 <!-- HAILSTONES falling diagonally (round balls, NOT snowflakes) -->
 <!-- Large stones -->
 <circle cx="3" cy="14" r="1.4" fill="url(#hailstone_g)"/>
 <circle cx="8" cy="12" r="1.6" fill="url(#hailstone_g)"/>
 <circle cx="13" cy="15" r="1.3" fill="url(#hailstone_g)"/>
 <circle cx="18" cy="13" r="1.5" fill="url(#hailstone_g)"/>
 <circle cx="23" cy="14" r="1.4" fill="url(#hailstone_g)"/>
 <circle cx="28" cy="12" r="1.6" fill="url(#hailstone_g)"/>
 <!-- Medium stones -->
 <circle cx="5" cy="20" r="1.1" fill="url(#hailstone_g)"/>
 <circle cx="11" cy="21" r="1.2" fill="url(#hailstone_g)"/>
 <circle cx="17" cy="20" r="1.0" fill="url(#hailstone_g)"/>
 <circle cx="22" cy="21" r="1.1" fill="url(#hailstone_g)"/>
 <circle cx="27" cy="20" r="1.2" fill="url(#hailstone_g)"/>
 <!-- Small stones (different z-layer) -->
 <circle cx="2" cy="18" r="0.7" fill="url(#hailstone_g)"/>
 <circle cx="7" cy="17" r="0.8" fill="url(#hailstone_g)"/>
 <circle cx="15" cy="18" r="0.7" fill="url(#hailstone_g)"/>
 <circle cx="20" cy="17" r="0.9" fill="url(#hailstone_g)"/>
 <circle cx="30" cy="18" r="0.7" fill="url(#hailstone_g)"/>

 <!-- Motion lines on each falling hailstone (diagonal) -->
 <line x1="3" y1="12" x2="3.5" y2="11" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>
 <line x1="8" y1="10" x2="8.5" y2="9" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>
 <line x1="13" y1="13" x2="13.5" y2="12" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>
 <line x1="18" y1="11" x2="18.5" y2="10" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>
 <line x1="23" y1="12" x2="23.5" y2="11" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>
 <line x1="28" y1="10" x2="28.5" y2="9" stroke="#a0b8d0" stroke-width="0.3" opacity="0.6"/>

 <!-- Bouncing hailstones on ground -->
 <circle cx="6" cy="24" r="0.9" fill="url(#hailstone_g)"/>
 <circle cx="14" cy="23.5" r="1.0" fill="url(#hailstone_g)"/>
 <circle cx="21" cy="24" r="0.9" fill="url(#hailstone_g)"/>
 <circle cx="26" cy="23.5" r="1.0" fill="url(#hailstone_g)"/>
</svg>
