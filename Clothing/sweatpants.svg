<defs>
<radialGradient id="sw" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#9AA4B4"/><stop offset="100%" stop-color="#3A4250"/></radialGradient>
<radialGradient id="band" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#7A8494"/><stop offset="100%" stop-color="#1A2230"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- waistband elastic -->
<rect x="6" y="4" width="20" height="2.5" rx="0.6" fill="url(#band)"/>
<!-- waistband stitching lines -->
<line x1="6" y1="4.5" x2="26" y2="4.5" stroke="#0E1320" stroke-width="0.15"/>
<line x1="6" y1="6" x2="26" y2="6" stroke="#0E1320" stroke-width="0.15"/>
<!-- drawstring cords -->
<path d="M14 6 Q 14 9 12 10" stroke="#FFFFFF" stroke-width="0.4" fill="none"/>
<path d="M18 6 Q 18 9 20 10" stroke="#FFFFFF" stroke-width="0.4" fill="none"/>
<circle cx="12" cy="10" r="0.3" fill="#FFFFFF"/>
<circle cx="20" cy="10" r="0.3" fill="#FFFFFF"/>
<!-- left leg (loose to ankle) -->
<path d="M6 6.5 L 6 24 Q 6 27 8 27 L 13 27 Q 14 27 14 25 L 15 6.5 Z" fill="url(#sw)"/>
<!-- right leg -->
<path d="M26 6.5 L 26 24 Q 26 27 24 27 L 19 27 Q 18 27 18 25 L 17 6.5 Z" fill="url(#sw)"/>
