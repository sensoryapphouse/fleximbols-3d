<rect x="7" y="8" width="0.5" height="17" fill="#FFFFFF" opacity="0.3"/>
<rect x="24.5" y="8" width="0.5" height="17" fill="#FFFFFF" opacity="0.3"/>
<!-- highlight on left leg -->
<ellipse cx="8" cy="12" rx="1.5" ry="5" fill="url(#hi)"/>
