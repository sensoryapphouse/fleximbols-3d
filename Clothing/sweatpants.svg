<rect x="6" y="25.5" width="8" height="2" rx="0.5" fill="url(#band)"/>
<rect x="18" y="25.5" width="8" height="2" rx="0.5" fill="url(#band)"/>
<path d="M7 26 L 7 27.3 M 8 26 L 8 27.3 M 9 26 L 9 27.3 M 10 26 L 10 27.3 M 11 26 L 11 27.3 M 12 26 L 12 27.3 M 13 26 L 13 27.3" stroke="#0E1320" stroke-width="0.15"/>
<path d="M19 26 L 19 27.3 M 20 26 L 20 27.3 M 21 26 L 21 27.3 M 22 26 L 22 27.3 M 23 26 L 23 27.3 M 24 26 L 24 27.3 M 25 26 L 25 27.3" stroke="#0E1320" stroke-width="0.15"/>
