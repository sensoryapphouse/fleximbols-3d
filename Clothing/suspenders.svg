<defs>
<radialGradient id="shirt" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#C8D0E0"/></radialGradient>
<radialGradient id="pants" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#5C6BC0"/><stop offset="100%" stop-color="#1A237E"/></radialGradient>
<linearGradient id="strap" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E04A4A"/><stop offset="100%" stop-color="#7A0C0C"/></linearGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- shirt torso (no head, just clothing) -->
<path d="M6 6 L 12 4 L 20 4 L 26 6 L 26 22 L 6 22 Z" fill="url(#shirt)"/>
<ellipse cx="11" cy="8" rx="3" ry="2" fill="url(#hi)"/>
<!-- collar V -->
<path d="M14 4 L 16 8 L 18 4" fill="url(#shirt)" stroke="#A8B0C0" stroke-width="0.3"/>
<!-- pants waist -->
<rect x="6" y="22" width="20" height="6" fill="url(#pants)"/>
<rect x="6" y="22" width="20" height="0.6" fill="#0E1340"/>
<!-- left suspender strap -->
<path d="M10 5 L 12 22" stroke="url(#strap)" stroke-width="1.6" fill="none"/>
<!-- right suspender strap -->
<path d="M22 5 L 20 22" stroke="url(#strap)" stroke-width="1.6" fill="none"/>
<!-- cross at back (X visible at top) -->
<path d="M10 5 L 22 5" stroke="url(#strap)" stroke-width="0.8" fill="none" opacity="0.7"/>
<!-- clip buttons at waist -->
<rect x="11" y="21.5" width="2" height="1.5" rx="0.3" fill="#3A2410"/>
<rect x="19" y="21.5" width="2" height="1.5" rx="0.3" fill="#3A2410"/>
<!-- clip buttons at top -->
<circle cx="11" cy="5" r="0.6" fill="#C8A84B"/>
<circle cx="21" cy="5" r="0.6" fill="#C8A84B"/>
</svg>