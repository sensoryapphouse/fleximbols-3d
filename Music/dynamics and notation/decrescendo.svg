<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="dcr-wedge" x1="0%" y1="50%" x2="100%" y2="50%">
 <stop offset="0%" stop-color="#182848"/>
 <stop offset="60%" stop-color="#203060"/>
 <stop offset="100%" stop-color="#101828"/>
 </linearGradient>
 <linearGradient id="dcr-staff" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#808898"/>
 <stop offset="100%" stop-color="#606878"/>
 </linearGradient>
 <radialGradient id="dcr-dot" cx="50%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#444"/>
 <stop offset="100%" stop-color="#000"/>
 </radialGradient>
 </defs>
 <!-- Staff line (single horizontal line) -->
 <line x1="3" y1="16" x2="29" y2="16" stroke="url(#dcr-staff)" stroke-width="0.7" stroke-opacity="0.55"/>
 <!-- Decrescendo hairpin: wide on left, tapering to a sharp point at right -->
 <!-- Upper arm -->
 <line x1="4" y1="10.5" x2="27" y2="16" stroke="url(#dcr-wedge)" stroke-width="1.3" stroke-linecap="round"/>
 <!-- Lower arm -->
 <line x1="4" y1="21.5" x2="27" y2="16" stroke="url(#dcr-wedge)" stroke-width="1.3" stroke-linecap="round"/>
 <!-- Filled wedge shape for solid appearance -->
 <polygon points="4,10.5 27,15.5 27,16.5 4,21.5" fill="url(#dcr-wedge)" fill-opacity="0.35"/>
 <!-- Left wide opening markers -->
 <line x1="4" y1="10.5" x2="4" y2="21.5" stroke="url(#dcr-wedge)" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
 <!-- Tip dot on the right -->
 <circle cx="27.4" cy="16" r="0.9" fill="url(#dcr-dot)"/>
</svg>
