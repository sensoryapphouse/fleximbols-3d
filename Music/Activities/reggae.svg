 <clipPath id="reg_bodyclip"><ellipse cx="16" cy="21" rx="9.5" ry="8.5"/></clipPath>
 <g clip-path="url(#reg_bodyclip)">
  <rect x="6" y="13.5" width="20" height="2.5" fill="#D32F2F"/>
  <rect x="6" y="16.0" width="20" height="2.5" fill="#FFD400"/>
  <rect x="6" y="18.5" width="20" height="2.5" fill="#1B8A3A"/>
 </g>
 <!-- sound hole -->
 <circle cx="16" cy="24.5" r="2.3" fill="url(#mnd_hole)"/>
 <!-- bridge -->
 <rect x="13.6" y="27.6" width="4.8" height="1.3" rx="0.6" fill="#4a3320"/>
 <!-- strings -->
 <line x1="15.2" y1="5" x2="15.2" y2="27.8" stroke="#e8e0d0" stroke-width="0.3"/>
 <line x1="16" y1="5" x2="16" y2="27.8" stroke="#e8e0d0" stroke-width="0.3"/>
 <line x1="16.8" y1="5" x2="16.8" y2="27.8" stroke="#e8e0d0" stroke-width="0.3"/>
 <ellipse cx="11.5" cy="16.5" rx="3.0" ry="2.0" fill="url(#mnd_shine)" opacity="0.35"/>
<defs>
 <linearGradient id="mnd_neck" x1="14.6" y1="3" x2="17.4" y2="3" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#7a5230"/>
  <stop offset="1" stop-color="#4a3018"/>
 </linearGradient>
 <linearGradient id="mnd_head" x1="13.8" y1="2" x2="18.2" y2="5" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#6a4525"/>
  <stop offset="1" stop-color="#3a2410"/>
 </linearGradient>
 <radialGradient id="mnd_body" cx="0.35" cy="0.3" r="0.9">
  <stop offset="0" stop-color="#E0A86A"/>
  <stop offset="0.55" stop-color="#C08240"/>
  <stop offset="1" stop-color="#8A5520"/>
 </radialGradient>
 <radialGradient id="mnd_bshade" cx="0.7" cy="0.8" r="0.7">
  <stop offset="0" stop-color="#5a3410" stop-opacity="0.4"/>
  <stop offset="1" stop-color="#5a3410" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="mnd_hole" cx="0.5" cy="0.4" r="0.7">
  <stop offset="0" stop-color="#2a1c0e"/>
  <stop offset="1" stop-color="#100a04"/>
 </radialGradient>
 <radialGradient id="mnd_shine" cx="0.3" cy="0.3" r="0.7">
  <stop offset="0" stop-color="#ffffff"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
