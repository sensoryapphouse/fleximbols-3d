 <!-- headstock -->
 <rect x="13.8" y="2" width="4.4" height="3.2" rx="1" fill="url(#mnd_head)"/>
 <circle cx="13.4" cy="2.8" r="0.8" fill="#3a2a1a"/>
 <circle cx="18.6" cy="2.8" r="0.8" fill="#3a2a1a"/>
 <circle cx="13.4" cy="4.4" r="0.8" fill="#3a2a1a"/>
 <circle cx="18.6" cy="4.4" r="0.8" fill="#3a2a1a"/>
 <!-- rounded teardrop body -->
 <ellipse cx="16" cy="21" rx="9.5" ry="8.5" fill="url(#mnd_body)"/>
 <ellipse cx="16" cy="21" rx="9.5" ry="8.5" fill="url(#mnd_bshade)"/>
