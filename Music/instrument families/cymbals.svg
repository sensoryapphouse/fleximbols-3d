 <defs>
 <radialGradient id="cymbalGrad" cx="40%" cy="35%">
 <stop offset="0%" stop-color="#f0d860"/>
 <stop offset="100%" stop-color="#a08010"/>
 </radialGradient>
 <radialGradient id="cymbal2Grad" cx="40%" cy="35%">
 <stop offset="0%" stop-color="#e8d050"/>
 <stop offset="100%" stop-color="#907000"/>
 </radialGradient>
 <radialGradient id="strapGrad" cx="50%" cy="50%">
 <stop offset="0%" stop-color="#a05028"/>
 <stop offset="100%" stop-color="#5c2c10"/>
 </radialGradient>
 </defs>
 <!-- Left cymbal (angled) -->
 <g transform="rotate(-20 10 16)">
 <ellipse cx="10" cy="16" rx="8" ry="2.6" fill="url(#cymbalGrad)"/>
 <ellipse cx="10" cy="15.5" rx="2" ry="0.8" fill="#f8e470"/>
 <circle cx="10" cy="16" r="0.6" fill="#5c3c00"/>
 <ellipse cx="10" cy="14.6" rx="7" ry="0.4" fill="#fff" fill-opacity="0.3"/>
 </g>
 <!-- Right cymbal (angled opposite) -->
 <g transform="rotate(20 22 16)">
 <ellipse cx="22" cy="16" rx="8" ry="2.6" fill="url(#cymbal2Grad)"/>
 <ellipse cx="22" cy="15.5" rx="2" ry="0.8" fill="#f0dc60"/>
 <circle cx="22" cy="16" r="0.6" fill="#5c3c00"/>
 <ellipse cx="22" cy="14.6" rx="7" ry="0.4" fill="#fff" fill-opacity="0.3"/>
 </g>
 <!-- Straps -->
 <rect x="9" y="14" width="2" height="2.5" rx="0.4" fill="url(#strapGrad)" transform="rotate(-20 10 15)"/>
 <rect x="21" y="14" width="2" height="2.5" rx="0.4" fill="url(#strapGrad)" transform="rotate(20 22 15)"/>
 <!-- Motion lines at clash point -->
 <path d="M14 12 Q16 10 18 12" fill="none" stroke="#f0e060" stroke-width="0.8" stroke-opacity="0.6"/>
 <path d="M13 16 Q16 14 19 16" fill="none" stroke="#f0d840" stroke-width="0.8" stroke-opacity="0.5"/>
 <line x1="16" y1="8" x2="16" y2="11" stroke="#e0c830" stroke-width="0.8" stroke-opacity="0.5"/>
 <!-- Crash symbols scattered -->
 <path d="M12 10 L14 13" stroke="#e8d040" stroke-width="0.7" stroke-opacity="0.5"/>
 <path d="M20 10 L18 13" stroke="#e8d040" stroke-width="0.7" stroke-opacity="0.5"/>
</svg>
