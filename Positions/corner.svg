<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="wall-left-g" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#b8c0d0"/>
 <stop offset="100%" stop-color="#808898"/>
 </linearGradient>
 <linearGradient id="wall-right-g" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#d8dce8"/>
 <stop offset="100%" stop-color="#a8aec0"/>
 </linearGradient>
 <linearGradient id="floor-g" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c8c4b0"/>
 <stop offset="100%" stop-color="#8a8470"/>
 </linearGradient>
 </defs>
 <!-- Isometric corner layout -->
 <!-- Left wall (facing viewer left-ish) -->
 <polygon points="16,6 3,14 3,26 16,18" fill="url(#wall-left-g)"/>
 <!-- Left wall vertical edge highlight -->
 <line x1="16" y1="6" x2="16" y2="18" stroke="#d0d4e0" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Right wall (facing viewer right-ish) -->
 <polygon points="16,6 29,14 29,26 16,18" fill="url(#wall-right-g)"/>
 <!-- Floor (bottom area) -->
 <polygon points="3,26 16,18 29,26 16,31" fill="url(#floor-g)"/>
 <!-- Corner vertical line (the meeting edge) -->
 <line x1="16" y1="6" x2="16" y2="18" stroke="#707888" stroke-width="1.2"/>
 <!-- Subtle mortar line on left wall -->
 <line x1="3" y1="18" x2="16" y2="11" stroke="#909aac" stroke-width="0.3" stroke-opacity="0.4"/>
 <line x1="3" y1="22" x2="16" y2="15" stroke="#909aac" stroke-width="0.3" stroke-opacity="0.4"/>
 <!-- Floor tile line -->
 <line x1="3" y1="26" x2="29" y2="26" stroke="#a0a090" stroke-width="0.4" stroke-opacity="0.4"/>
 <line x1="16" y1="18" x2="29" y2="26" stroke="#a0a090" stroke-width="0.3" stroke-opacity="0.35"/>
</svg>
