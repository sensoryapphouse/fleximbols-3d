 <!-- Foot shadows -->
 
 
 <!-- === LEFT FIGURE (pink top) === -->
 <rect x="5.8" y="23" width="1.8" height="7" rx="0.9" fill="url(#leg)"/>
 <rect x="8.3" y="23" width="1.8" height="7" rx="0.9" fill="url(#leg)"/>
