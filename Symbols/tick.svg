<defs>
<radialGradient id="body" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#A85A2A"/><stop offset="100%" stop-color="#3A1808"/></radialGradient>
<radialGradient id="head" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#5A3A1A"/><stop offset="100%" stop-color="#1A0E04"/></radialGradient>
<radialGradient id="leg" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#5A3A1A"/><stop offset="100%" stop-color="#1A0E04"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- fat oval body -->
<ellipse cx="16" cy="18" rx="10" ry="8" fill="url(#body)"/>
<ellipse cx="12" cy="14" rx="3" ry="2" fill="url(#hi)"/>
<!-- back plate dorsal shield -->
<ellipse cx="16" cy="16" rx="4" ry="3" fill="#5A2208"/>
<ellipse cx="14" cy="14.5" rx="1.5" ry="0.8" fill="url(#hi)"/>
<!-- small triangular head at top -->
<path d="M14 10 L 18 10 L 17 7 L 15 7 Z" fill="url(#head)"/>
<!-- chelicerae mouthparts -->
<line x1="15.5" y1="7" x2="14.5" y2="5" stroke="#1A0E04" stroke-width="0.4" stroke-linecap="round"/>
<line x1="16.5" y1="7" x2="17.5" y2="5" stroke="#1A0E04" stroke-width="0.4" stroke-linecap="round"/>
<!-- 8 legs (4 each side) - thin -->
<path d="M7 13 Q 4 10 2 11" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M6 16 Q 3 16 1 16" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M6 19 Q 3 20 1 21" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M7 22 Q 4 24 2 25" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M25 13 Q 28 10 30 11" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M26 16 Q 29 16 31 16" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M26 19 Q 29 20 31 21" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M25 22 Q 28 24 30 25" stroke="url(#leg)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<!-- segmentation lines on body -->
<path d="M8 20 Q 16 22 24 20" stroke="#1A0E04" stroke-width="0.25" fill="none" opacity="0.6"/>
<path d="M8 22 Q 16 24 24 22" stroke="#1A0E04" stroke-width="0.25" fill="none" opacity="0.6"/>
</svg>