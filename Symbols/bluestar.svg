 <defs>
 <radialGradient id="bls-star" cx="50%" cy="45%" r="55%">
 <stop offset="0%" stop-color="#88CCFF"/>
 <stop offset="40%" stop-color="#2266DD"/>
 <stop offset="100%" stop-color="#0033AA"/>
 </radialGradient>
 <radialGradient id="bls-glow" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#4488FF" stop-opacity="0.8"/>
 <stop offset="100%" stop-color="#0044FF" stop-opacity="0"/>
 </radialGradient>
 <filter id="bls-glow2">
 <feGaussianBlur stdDeviation="2" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Outer glow -->
 <circle cx="16" cy="16" r="14" fill="url(#bls-glow)" filter="url(#bls-glow2)"/>
 <!-- Five-pointed star -->
 <polygon points="16,3 19.3,12.5 29.5,12.5 21.5,18.5 24.5,28 16,22 7.5,28 10.5,18.5 2.5,12.5 12.7,12.5"
 fill="url(#bls-star)" filter="url(#bls-glow2)"/>
 <!-- Inner bevel highlight on star -->
 <polygon points="16,5 18.7,13.2 27.5,13.2 20.5,18.5 23,26.5 16,21 9,26.5 11.5,18.5 4.5,13.2 13.3,13.2"
 fill="none" stroke="#AADDFF" stroke-width="0.5" stroke-opacity="0.6" fill-opacity="0"/>
 <!-- Sparkle accents -->
 <line x1="16" y1="1" x2="16" y2="3" stroke="#88CCFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8"/>
 <line x1="29" y1="8" x2="28" y2="9.5" stroke="#88CCFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8"/>
 <line x1="3" y1="8" x2="4" y2="9.5" stroke="#88CCFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8"/>
 <line x1="28" y1="25" x2="27" y2="23.5" stroke="#88CCFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
 <line x1="4" y1="25" x2="5" y2="23.5" stroke="#88CCFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>
 <!-- Small star sparkles -->
 <circle cx="5" cy="6" r="0.8" fill="#AADDFF" fill-opacity="0.7"/>
 <circle cx="27" cy="6" r="0.8" fill="#AADDFF" fill-opacity="0.7"/>
 <circle cx="29" cy="20" r="0.6" fill="#AADDFF" fill-opacity="0.5"/>
