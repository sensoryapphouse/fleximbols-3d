<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="bg" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <radialGradient id="sym" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#3B3F47"/>
 <stop offset="100%" stop-color="#16181D"/>
 </radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Yellow warning triangle -->
 <path d="M 16 3 L 30 28 L 2 28 Z" fill="url(#bg)" stroke="#3B3F47" stroke-width="0.6"/>
 <!-- Biohazard symbol: 3 interlocking rings around center -->
 <g transform="translate(16 19)">
 <!-- Center circle (dark) -->
 <circle cx="0" cy="0" r="2" fill="url(#sym)"/>
 <!-- Three outer rings positioned at 12, 4, 8 -->
 <!-- Top ring -->
 <g transform="translate(0 -5)">
 <circle cx="0" cy="0" r="2.8" fill="none" stroke="url(#sym)" stroke-width="1.4"/>
 </g>
 <!-- Bottom-right ring -->
 <g transform="rotate(120) translate(0 -5)">
 <circle cx="0" cy="0" r="2.8" fill="none" stroke="url(#sym)" stroke-width="1.4"/>
 </g>
 <!-- Bottom-left ring -->
 <g transform="rotate(-120) translate(0 -5)">
 <circle cx="0" cy="0" r="2.8" fill="none" stroke="url(#sym)" stroke-width="1.4"/>
 </g>
 <!-- Inner arcs connecting -->
 <path d="M -1.7 -1 Q -3 -3 -2 -4" stroke="url(#sym)" stroke-width="1.2" fill="none"/>
 <path d="M 1.7 -1 Q 3 -3 2 -4" stroke="url(#sym)" stroke-width="1.2" fill="none"/>
 <path d="M 0 2 Q 0 4 0 5" stroke="url(#sym)" stroke-width="1.2" fill="none"/>
 </g>
 <ellipse cx="11" cy="20" rx="4" ry="1.5" fill="url(#hl)"/>
</svg>
