<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="filledHalf" cx="25%" cy="30%" r="80%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#E54A1E"/>
 </radialGradient>
 <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
 <stop offset="80%" stop-color="#E54A1E" stop-opacity="0"/>
 <stop offset="100%" stop-color="#8B2500" stop-opacity="0.3"/>
 </radialGradient>
 <radialGradient id="hlGrad" cx="25%" cy="30%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <clipPath id="leftHalf">
 <rect x="0" y="0" width="16" height="32"/>
 </clipPath>
 <clipPath id="rightHalf">
 <rect x="16" y="0" width="16" height="32"/>
 </clipPath>
 </defs>
 <!-- Half disc: LEFT half filled orange, RIGHT half empty outlined — 50-50 split -->
 <!-- Outer outline ring for whole disc shape -->
 <circle cx="16" cy="16" r="11" fill="none" stroke="#9CA3AF" stroke-width="0.8"/>
 <!-- LEFT half filled -->
 <circle cx="16" cy="16" r="11" fill="url(#filledHalf)" clip-path="url(#leftHalf)"/>
 <circle cx="16" cy="16" r="11" fill="url(#rimGrad)" clip-path="url(#leftHalf)"/>
 <!-- Highlight on left half -->
 <ellipse cx="10.5" cy="11.5" rx="4.5" ry="2.5" fill="url(#hlGrad)"/>
 <!-- Vertical bisector line — the essential divider -->
 <line x1="16" y1="5" x2="16" y2="27" stroke="#9CA3AF" stroke-width="0.9" stroke-linecap="round"/>
</svg>
