 <defs>
 <linearGradient id="kc-key" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#5880d0"/>
 <stop offset="60%" stop-color="#3050a0"/>
 <stop offset="100%" stop-color="#1a2870"/>
 </linearGradient>
 <linearGradient id="kc-face" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#7090e0"/>
 <stop offset="100%" stop-color="#4060b0"/>
 </linearGradient>
 <linearGradient id="kc-pie" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#ffd060"/>
 <stop offset="100%" stop-color="#e09010"/>
 </linearGradient>
 </defs>
 <rect x="2" y="4" width="28" height="25" rx="4" fill="url(#kc-key)"/>
 <rect x="3.5" y="5" width="25" height="22" rx="3" fill="url(#kc-face)"/>
 <rect x="3.5" y="5" width="25" height="5" rx="3" fill="white" fill-opacity="0.2"/>
 <!-- fraction "1/4" as shapes -->
 <!-- numerator 1 (small top-left) -->
 <rect x="7" y="9" width="1.5" height="4" rx="0.5" fill="white"/>
 <!-- dividing line -->
 <line x1="6" y1="13.5" x2="12" y2="13.5" stroke="white" stroke-width="1"/>
 <!-- denominator 4 (bottom-left) -->
 <rect x="6.5" y="14" width="1.5" height="4" rx="0.5" fill="white"/>
 <rect x="6.5" y="16" width="3.5" height="1.2" rx="0.3" fill="white"/>
 <rect x="8.5" y="14" width="1.5" height="4" rx="0.5" fill="white"/>
 <!-- pie chart quarter coloured -->
 <circle cx="21" cy="14" r="6" fill="white" fill-opacity="0.15"/>
 <circle cx="21" cy="14" r="6" fill="none" stroke="white" stroke-width="0.8"/>
 <!-- quarter wedge (top-right) -->
 <path d="M21 14 L21 8 A6 6 0 0 1 27 14 Z" fill="url(#kc-pie)"/>
 <!-- pie grid lines -->
 <line x1="21" y1="8" x2="21" y2="20" stroke="white" stroke-width="0.6" stroke-opacity="0.6"/>
 <line x1="15" y1="14" x2="27" y2="14" stroke="white" stroke-width="0.6" stroke-opacity="0.6"/>
 <!-- word bar -->
 <rect x="5" y="22" width="22" height="3" rx="1" fill="white" fill-opacity="0.12"/>
 <rect x="6" y="22.8" width="20" height="1.2" rx="0.4" fill="white" fill-opacity="0.45"/>
</svg>
