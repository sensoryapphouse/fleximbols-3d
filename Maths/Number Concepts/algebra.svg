<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="algFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07a43"/>
      <stop offset="1" stop-color="#7c4f23"/>
    </linearGradient>
    <linearGradient id="algBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#356b4f"/>
      <stop offset="1" stop-color="#1f4732"/>
    </linearGradient>
  </defs>
  <!-- wooden frame -->
  <rect x="2.5" y="5" width="27" height="20" rx="2.2" fill="url(#algFrame)"/>
  <!-- board -->
  <rect x="4.6" y="7.1" width="22.8" height="15.8" rx="1.3" fill="url(#algBoard)"/>
  <!-- subtle gloss -->
  <rect x="5.6" y="8" width="20.8" height="4.4" rx="1" fill="#ffffff" opacity="0.07"/>
  <!-- equation: x + 5 = 12  (all vector, chalk white) -->
  <g fill="none" stroke="#f4f1e6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- x -->
    <path d="M6.2 11 L9.2 15.4 M9.2 11 L6.2 15.4"/>
    <!-- + -->
    <path d="M11 13.2 H14 M12.5 11.7 V14.7"/>
    <!-- 5 -->
    <path d="M18.2 11 H16.1 V13 Q17.2 12.4 18 13.1 Q18.8 13.9 18 14.9 Q17.2 15.6 16.1 15"/>
    <!-- = -->
    <path d="M20.2 12.5 H22.9 M20.2 14.2 H22.9"/>
    <!-- 1 -->
    <path d="M24.4 11.6 L25.2 11 V15.4"/>
    <!-- 2 -->
    <path d="M26.7 11.7 Q28 10.7 28.9 11.9 Q29.4 12.8 28.2 13.8 L26.7 15.4 H29.2"/>
  </g>
  <!-- second line: 2x = y -->
  <g fill="none" stroke="#bfe3cf" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round">
    <!-- 2 -->
    <path d="M8.2 18 Q9.2 17.2 10 18.2 Q10.4 19 9.4 19.9 L8.2 21.2 H10.4"/>
    <!-- x -->
    <path d="M11.4 18 L13.6 21.2 M13.6 18 L11.4 21.2"/>
    <!-- = -->
    <path d="M15 19 H17.4 M15 20.4 H17.4"/>
    <!-- y -->
    <path d="M19 18 L20.4 20.2 L21.8 18 M20.4 20.2 L19.6 22.2"/>
  </g>
  <!-- chalk ledge -->
  <rect x="3.6" y="24.4" width="24.8" height="1.9" rx="0.95" fill="#5c3a1a"/>
  <rect x="20.5" y="24.7" width="5" height="1.1" rx="0.55" fill="#f4f1e6" opacity="0.9"/>
</svg>
