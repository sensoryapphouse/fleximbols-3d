 <defs>
 <linearGradient id="plasticGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#B2EBF2" stop-opacity="0.85"/>
 <stop offset="100%" stop-color="#4DD0E1" stop-opacity="0.75"/>
 </linearGradient>
 <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#26C6DA"/>
 <stop offset="100%" stop-color="#00838F"/>
 </linearGradient>
 <linearGradient id="markGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#00838F"/>
 <stop offset="100%" stop-color="#004D40"/>
 </linearGradient>
 </defs>
 <!-- Semicircle protractor body -->
 <path d="M4 22 A12 12 0 0 1 28 22 Z" fill="url(#plasticGrad)" stroke="url(#edgeGrad)" stroke-width="1"/>
 <!-- Flat straight edge at bottom -->
 <rect x="4" y="22" width="24" height="2.5" rx="0.5" fill="url(#edgeGrad)"/>
 <!-- Inner arc cutout (hollow center) -->
 <path d="M8 22 A8 8 0 0 1 24 22 Z" fill="#E0F7FA" opacity="0.6"/>
 <!-- Degree markings around curved edge -->
 <!-- 0 deg (right) -->
 <line x1="27" y1="22" x2="28" y2="22" stroke="url(#markGrad)" stroke-width="0.8"/>
 <!-- 30 deg -->
 <line x1="25.4" y1="16" x2="26.2" y2="14.8" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 45 deg -->
 <line x1="23.5" y1="13.5" x2="24.5" y2="12.5" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 60 deg -->
 <line x1="21" y1="11.8" x2="21.8" y2="10.6" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 90 deg (top center) -->
 <line x1="16" y1="10" x2="16" y2="11.2" stroke="url(#markGrad)" stroke-width="0.8"/>
 <!-- 120 deg -->
 <line x1="11" y1="11.8" x2="10.2" y2="10.6" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 135 deg -->
 <line x1="8.5" y1="13.5" x2="7.5" y2="12.5" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 150 deg -->
 <line x1="6.6" y1="16" x2="5.8" y2="14.8" stroke="url(#markGrad)" stroke-width="0.6"/>
 <!-- 180 deg (left) -->
 <line x1="5" y1="22" x2="4" y2="22" stroke="url(#markGrad)" stroke-width="0.8"/>
 <!-- Minor ticks -->
 <line x1="26.3" y1="19" x2="27" y2="18.5" stroke="url(#markGrad)" stroke-width="0.4"/>
 <line x1="24.6" y1="15.2" x2="25.2" y2="14.5" stroke="url(#markGrad)" stroke-width="0.4"/>
 <line x1="19" y1="11.1" x2="19.5" y2="10.3" stroke="url(#markGrad)" stroke-width="0.4"/>
 <line x1="13" y1="11.1" x2="12.5" y2="10.3" stroke="url(#markGrad)" stroke-width="0.4"/>
 <line x1="7.4" y1="15.2" x2="6.8" y2="14.5" stroke="url(#markGrad)" stroke-width="0.4"/>
 <line x1="5.7" y1="19" x2="5" y2="18.5" stroke="url(#markGrad)" stroke-width="0.4"/>
 <!-- Central crosshair at baseline center -->
 <line x1="16" y1="20" x2="16" y2="25" stroke="url(#markGrad)" stroke-width="0.7"/>
 <line x1="14" y1="22" x2="18" y2="22" stroke="url(#markGrad)" stroke-width="0.7"/>
 <circle cx="16" cy="22" r="1" fill="none" stroke="url(#markGrad)" stroke-width="0.7"/>
</svg>
