<defs>
<linearGradient id="cv-curve" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1060e0"/>
<stop offset="50%" stop-color="#4aa0ff"/>
<stop offset="100%" stop-color="#0840c0"/>
