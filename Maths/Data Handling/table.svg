 <defs>
 <linearGradient id="tableTop" x1="0" y1="0" x2="0.15" y2="1">
 <stop offset="0%" stop-color="#dfc070"/>
 <stop offset="50%" stop-color="#b89040"/>
 <stop offset="100%" stop-color="#886820"/>
 </linearGradient>
 <linearGradient id="tableEdge" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c09040"/>
 <stop offset="100%" stop-color="#806010"/>
 </linearGradient>
 <linearGradient id="tableTopFace" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#f0d880"/>
 <stop offset="100%" stop-color="#c8a848"/>
 </linearGradient>
 <linearGradient id="tableLeg" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#d0a858"/>
 <stop offset="100%" stop-color="#907030"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- table legs (4 legs) -->
 <rect x="8" y="19" width="2.5" height="11" rx="0.7" fill="url(#tableLeg)"/>
 <rect x="21.5" y="19" width="2.5" height="11" rx="0.7" fill="url(#tableLeg)"/>
 <rect x="10" y="19" width="2.5" height="10" rx="0.7" fill="url(#tableLeg)"/>
 <rect x="19.5" y="19" width="2.5" height="10" rx="0.7" fill="url(#tableLeg)"/>
 <!-- apron / rail under table -->
 <rect x="9" y="19" width="14" height="2" rx="0.5" fill="url(#tableEdge)" fill-opacity="0.7"/>
 <!-- table top front edge (gives 3D) -->
 <rect x="5" y="17" width="22" height="2.5" rx="0.5" fill="url(#tableEdge)"/>
 <!-- table top surface -->
 <path d="M5,14 L24,14 L27,17 L5,17 Z" fill="url(#tableTopFace)"/>
 <!-- wood grain on top -->
 <line x1="7" y1="14.3" x2="8.7" y2="16.7" stroke="#c0a040" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="11" y1="14.1" x2="12.7" y2="16.8" stroke="#c0a040" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="15" y1="14.1" x2="16.7" y2="16.8" stroke="#c0a040" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="19" y1="14.1" x2="20.7" y2="16.8" stroke="#c0a040" stroke-width="0.4" stroke-opacity="0.5"/>
 <!-- highlight sheen -->
 <path d="M6,14.2 Q10,14 15,14.2" stroke="#ffffff" stroke-width="1" fill="none" stroke-opacity="0.4"/>
</svg>
