<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="th3-box1" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#a090d0"/>
 <stop offset="100%" stop-color="#504090"/>
 </linearGradient>
 <linearGradient id="th3-box2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0a0e0"/>
 <stop offset="100%" stop-color="#705090"/>
 </linearGradient>
 <linearGradient id="th3-hand" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f5c090"/>
 <stop offset="100%" stop-color="#d09060"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- two distant/smaller boxes (showing distance = smaller) -->
 <!-- box 1 (far left) -->
 <rect x="18" y="6" width="6" height="6" rx="1" fill="url(#th3-box1)"/>
 <rect x="18" y="6" width="6" height="2" rx="1" fill="white" fill-opacity="0.2"/>
 <!-- box 2 (far right) -->
 <rect x="25" y="7" width="6" height="6" rx="1" fill="url(#th3-box2)"/>
 <rect x="25" y="7" width="6" height="2" rx="1" fill="white" fill-opacity="0.2"/>
 <!-- distance lines (perspective) -->
 <line x1="2" y1="22" x2="18" y2="9" stroke="#8080c0" stroke-width="0.5" stroke-dasharray="1,1" stroke-opacity="0.6"/>
 <line x1="2" y1="22" x2="25" y2="10" stroke="#8080c0" stroke-width="0.5" stroke-dasharray="1,1" stroke-opacity="0.6"/>
 <!-- pointing hand (pointing far away, upward angle) -->
 <!-- arm -->
 <rect x="2" y="20" width="12" height="4" rx="2" fill="url(#th3-hand)"/>
 <!-- index finger (pointing diagonally upward-right toward distant boxes) -->
 <rect x="13" y="17" width="6" height="2" rx="1" fill="url(#th3-hand)" transform="rotate(-30 16 18)"/>
 <!-- finger tip -->
 <rect x="17.5" y="14.5" width="2" height="1.5" rx="0.7" fill="url(#th3-hand)"/>
 <rect x="19" y="14.5" width="0.8" height="1.5" rx="0.3" fill="#e0a870"/>
 <!-- thumb -->
 <path d="M8 20 Q7 23 9 24 Q11 24 11 22" fill="url(#th3-hand)"/>
 <!-- arrow indicating far-ness -->
 <line x1="20" y1="13" x2="22" y2="8" stroke="#8060c0" stroke-width="0.8" stroke-dasharray="1,0.5"/>
 <polygon points="22.5,7.5 21,9 23.5,9.5" fill="#8060c0"/>
</svg>
