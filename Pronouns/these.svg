<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="th2-box1" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#60a0e8"/>
 <stop offset="100%" stop-color="#2060c0"/>
 </linearGradient>
 <linearGradient id="th2-box2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#50d090"/>
 <stop offset="100%" stop-color="#1090508"/>
 </linearGradient>
 <linearGradient id="th2-hand" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f5c090"/>
 <stop offset="100%" stop-color="#d09060"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- two boxes close together -->
 <!-- box 1 -->
 <rect x="14" y="8" width="9" height="9" rx="1.5" fill="url(#th2-box1)"/>
 <rect x="14" y="8" width="9" height="3" rx="1.5" fill="white" fill-opacity="0.2"/>
 <!-- box 2 -->
 <rect x="4" y="10" width="9" height="9" rx="1.5" fill="url(#th2-box2)"/>
 <rect x="4" y="10" width="9" height="3" rx="1.5" fill="white" fill-opacity="0.2"/>
 <!-- proximity arc between boxes -->
 <path d="M13 13 Q16.5 11.5 14 13" stroke="#e05020" stroke-width="0.8" fill="none" stroke-dasharray="0.5,0.5"/>
 <!-- pointing hand index finger (close, pointing RIGHT at boxes) -->
 <!-- arm -->
 <rect x="4" y="22" width="14" height="3" rx="1.5" fill="url(#th2-hand)"/>
 <!-- index finger -->
 <rect x="17" y="20" width="4" height="2" rx="1" fill="url(#th2-hand)"/>
 <!-- fingernail -->
 <rect x="20" y="20" width="1" height="1.5" rx="0.4" fill="#e0a870"/>
 <!-- thumb curl -->
 <path d="M10 22 Q9 25 11 26 Q13 26 13 24" fill="url(#th2-hand)"/>
 <!-- arc showing "these" = close / nearby -->
 <path d="M21 21 Q26 17 22 13" stroke="#e05020" stroke-width="1" fill="none" stroke-dasharray="1,0.8"/>
 <polygon points="22,12.5 20.5,14 22.5,14.5" fill="#e05020"/>
</svg>
