 <defs>
 <radialGradient id="is_ball" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#9ed6f5"/><stop offset="55%" stop-color="#4a9fdd"/><stop offset="100%" stop-color="#1a5a96"/></radialGradient>
