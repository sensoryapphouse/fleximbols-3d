 <defs>
 <radialGradient id="it_ball" cx="38%" cy="32%" r="72%"><stop offset="0" stop-color="#9ed6f5"/><stop offset="55%" stop-color="#4a9fdd"/><stop offset="100%" stop-color="#1a5a96"/></radialGradient>
 <linearGradient id="it_arrow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#d6342a"/></linearGradient>
 <linearGradient id="it_tag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe06a"/><stop offset="1" stop-color="#e0a814"/></linearGradient>
 </defs>
 <!-- object: glossy beach ball / thing -->
 <circle cx="17" cy="16" r="8.6" fill="url(#it_ball)" stroke="#15498f" stroke-width="0.4"/>
 <!-- ball segment lines -->
 <path d="M8.4 16 h17.2" fill="none" stroke="#15498f" stroke-width="0.4" opacity="0.6"/>
 <path d="M11 9 Q17 16 11 23" fill="none" stroke="#15498f" stroke-width="0.4" opacity="0.6"/>
 <path d="M23 9 Q17 16 23 23" fill="none" stroke="#15498f" stroke-width="0.4" opacity="0.6"/>
 <!-- gloss highlight -->
 <ellipse cx="13.6" cy="12" rx="3" ry="1.8" fill="#ffffff" opacity="0.4"/>
 <!-- possession tag (its = belongs to the thing) -->
 <rect x="25.5" y="13.5" width="5" height="4.6" rx="0.7" fill="url(#it_tag)" stroke="#a87c08" stroke-width="0.4"/>
 <line x1="26.4" y1="15" x2="29.6" y2="15" stroke="#9a7a44" stroke-width="0.4"/>
 <line x1="28" y1="13.7" x2="28" y2="16.4" stroke="#9a7a44" stroke-width="0.4"/>
 <line x1="26.4" y1="16.4" x2="29.6" y2="16.4" stroke="#9a7a44" stroke-width="0.4"/>
 <!-- arrow pointing to the object -->
 <path d="M3 26 Q9 24 11 19" fill="none" stroke="url(#it_arrow)" stroke-width="1.7" stroke-linecap="round"/>
 <path d="M12.4 16.4 L8.8 17.6 L11 20.4 Z" fill="#d6342a"/>
</svg>
