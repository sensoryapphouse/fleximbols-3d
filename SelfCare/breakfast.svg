 <rect x="22" y="20" width="8" height="8" rx="2" fill="url(#bk_cup)"/>
 <ellipse cx="26" cy="22" rx="3" ry="1.2" fill="url(#bk_coffee)"/>
 <!-- cup handle -->
 <path d="M30 22 Q33 22 33 25 Q33 28 30 28" fill="none" stroke="#a07050" stroke-width="1.5" stroke-linecap="round"/>
 <!-- steam -->
 <path d="M24 19 Q24.5 17 24 15" fill="none" stroke="#ddd" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
 <path d="M27 18 Q27.5 16 27 14" fill="none" stroke="#ddd" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
