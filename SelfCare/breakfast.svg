 <defs>
 <radialGradient id="bk_cake" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#f5c878"/><stop offset="70%" stop-color="#d4943a"/><stop offset="100%" stop-color="#a06020"/></radialGradient>
 <radialGradient id="bk_cup" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#e8d0b0"/><stop offset="70%" stop-color="#c09060"/><stop offset="100%" stop-color="#806040"/></radialGradient>
 <radialGradient id="bk_coffee" cx="45%" cy="40%" r="55%"><stop offset="0%" stop-color="#6b3a1f"/><stop offset="100%" stop-color="#2a0f00"/></radialGradient>
 <radialGradient id="bk_butter" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#fff7aa"/><stop offset="100%" stop-color="#e8c840"/></radialGradient>
 </defs>
 <!-- stack of pancakes -->
 <ellipse cx="12" cy="26" rx="8" ry="2" fill="url(#bk_cake)"/>
 <ellipse cx="12" cy="24" rx="7.5" ry="2" fill="url(#bk_cake)"/>
 <ellipse cx="12" cy="22" rx="7" ry="2" fill="url(#bk_cake)"/>
