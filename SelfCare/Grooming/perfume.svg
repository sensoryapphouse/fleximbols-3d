<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Perfume: decorative rounded glass, pink liquid, ornate -->
 <radialGradient id="perfGlassGrad" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#F8E8F0"/>
 <stop offset="50%" stop-color="#E8A8C8"/>
 <stop offset="100%" stop-color="#B05888"/>
 </radialGradient>
 <linearGradient id="perfLiquidGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#F5C8DC" stop-opacity="0.85"/>
 <stop offset="100%" stop-color="#D06090" stop-opacity="0.85"/>
 </linearGradient>
 <linearGradient id="perfNeckGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#C888A8"/>
 <stop offset="50%" stop-color="#F0C0D8"/>
 <stop offset="100%" stop-color="#A05878"/>
 </linearGradient>
 <linearGradient id="atomiserBulbGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#F0D0DC"/>
 <stop offset="100%" stop-color="#C06888"/>
 </linearGradient>
 <linearGradient id="perfCapGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F8D0E4"/>
 <stop offset="100%" stop-color="#B86090"/>
 </linearGradient>
 </defs>

 <!-- Decorative rounded bottle body (faceted/rounded) -->
 <rect x="8" y="14" width="16" height="16" rx="8" fill="url(#perfGlassGrad)"/>

 <!-- Pink liquid inside (slightly inset) -->
 <rect x="9.5" y="18" width="13" height="11" rx="6.5" fill="url(#perfLiquidGrad)"/>

 <!-- Facet highlights (decorative glass catches light) -->
 <path d="M10 15 Q16 13 22 15 Q16 14 10 15Z" fill="#FFFFFF" opacity="0.4"/>
 <path d="M9 20 Q10 17 11 20" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.3"/>

 <!-- Elegant narrow neck -->
 <rect x="12" y="9" width="8" height="6" rx="2" fill="url(#perfNeckGrad)"/>

 <!-- Ornate cap/stopper -->
 <ellipse cx="16" cy="9" rx="5" ry="2.5" fill="url(#perfCapGrad)"/>
 <ellipse cx="16" cy="7" rx="3.5" ry="2" fill="url(#perfCapGrad)"/>
 <ellipse cx="16" cy="5.5" rx="2" ry="1.5" fill="#F8D0E4"/>

 <!-- Atomiser bulb (squeezer) on side — ornate gold cord -->
 <ellipse cx="24" cy="18" rx="3" ry="2.5" fill="url(#atomiserBulbGrad)"/>
 <!-- Cord connecting bulb to neck -->
 <path d="M22 18 Q21 14 17 12" stroke="#D090B0" stroke-width="1" fill="none" stroke-dasharray="1,1"/>

 <!-- Spray nozzle tip from bulb -->
 <line x1="25" y1="17" x2="27" y2="15" stroke="#D090B0" stroke-width="1.2" stroke-linecap="round"/>
 <circle cx="27.5" cy="14.5" r="1" fill="#E8B0C8"/>
</svg>
