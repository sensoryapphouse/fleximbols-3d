 <defs>
 <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#d04030"/>
 <stop offset="100%" stop-color="#801810"/>
 </linearGradient>
 <linearGradient id="colGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#f0ece0"/>
 <stop offset="100%" stop-color="#c0b890"/>
 </linearGradient>
 <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8b878"/>
 <stop offset="100%" stop-color="#886830"/>
 </linearGradient>
 </defs>
 <!-- floor/platform octagonal -->
 <path d="M10 28 L6 26 L4 22 L4 18 L6 14 L16 28Z" fill="url(#floorGrad)" fill-opacity="0.5"/>
 
 <!-- columns on octagon -->
 <rect x="5.5" y="14" width="2" height="14" rx="0.5" fill="url(#colGrad)"/>
 <rect x="24.5" y="14" width="2" height="14" rx="0.5" fill="url(#colGrad)"/>
 <rect x="10" y="11" width="2" height="4" rx="0.5" fill="url(#colGrad)"/>
 <rect x="20" y="11" width="2" height="4" rx="0.5" fill="url(#colGrad)"/>
 <!-- conical roof -->
 
 <path d="M6 14 L16 4 L26 14Z" fill="url(#roofGrad)" fill-opacity="0.7"/>
 <!-- roof finial -->
 <circle cx="16" cy="4" r="1.5" fill="#d0a848"/>
 <!-- railing -->
 <path d="M6 21 L10 28 M22 28 L26 21" stroke="#d0c890" stroke-width="0.8" fill="none"/>
 <line x1="6" y1="21" x2="26" y2="21" stroke="#d0c890" stroke-width="0.8"/>
</svg>
