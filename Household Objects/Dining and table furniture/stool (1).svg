 <defs>
 <linearGradient id="stoolSeat" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#e0c080"/>
 <stop offset="50%" stop-color="#c09850"/>
 <stop offset="100%" stop-color="#907030"/>
 </linearGradient>
 <linearGradient id="stoolSeatEdge" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#b08040"/>
 <stop offset="100%" stop-color="#806020"/>
 </linearGradient>
 <linearGradient id="stoolLeg" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#c8a060"/>
 <stop offset="100%" stop-color="#906030"/>
 </linearGradient>
 <radialGradient id="seatRadG" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#f0d898"/>
 <stop offset="100%" stop-color="#a07830"/>
 </radialGradient>
 </defs>
 <!-- drop shadow -->
 <!-- legs splayed out (3 legs) -->
 <!-- leg 1 front-left -->
 <line x1="14" y1="19" x2="9" y2="30" stroke="url(#stoolLeg)" stroke-width="2" stroke-linecap="round"/>
 <!-- leg 2 front-right -->
 <line x1="18" y1="19" x2="23" y2="30" stroke="url(#stoolLeg)" stroke-width="2" stroke-linecap="round"/>
 <!-- leg 3 back -->
 <line x1="16" y1="19" x2="16" y2="30" stroke="url(#stoolLeg)" stroke-width="2" stroke-linecap="round"/>
 <!-- stretcher brace rings -->
 <ellipse cx="16" cy="25" rx="5" ry="1.5" fill="none" stroke="url(#stoolLeg)" stroke-width="0.8"/>
 <!-- seat top surface -->
 <ellipse cx="16" cy="18" rx="8" ry="2.5" fill="url(#seatRadG)"/>
 <!-- seat edge thickness -->
 <path d="M8,18 Q8,20.5 16,20.5 Q24,20.5 24,18" fill="url(#stoolSeatEdge)"/>
 <!-- grain lines on seat top -->
 <path d="M10,17.5 Q13,17 16,17 Q19,17 22,17.5" stroke="#b89040" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <path d="M11,19 Q14,18.5 16,18.5 Q18,18.5 21,19" stroke="#b89040" stroke-width="0.4" fill="none" stroke-opacity="0.5"/>
 <!-- highlight sheen -->
 <ellipse cx="13" cy="17" rx="3.5" ry="1" fill="#ffffff" fill-opacity="0.3"/>
</svg>
