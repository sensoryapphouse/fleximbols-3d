 <defs>
 <radialGradient id="baubleGrad" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FF6B6B"/>
 <stop offset="50%" stop-color="#C0392B"/>
 <stop offset="100%" stop-color="#7B241C"/>
 </radialGradient>
 <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="hookGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#B0B5BD"/>
 <stop offset="100%" stop-color="#5A5E64"/>
 </linearGradient>
 <linearGradient id="stripeGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
 <stop offset="50%" stop-color="#FFD700" stop-opacity="0.5"/>
 <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
 </linearGradient>
 <radialGradient id="shineGrad" cx="30%" cy="25%" r="40%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 </defs>
 <!-- Bauble sphere -->
 <circle cx="16" cy="19" r="11" fill="url(#baubleGrad)"/>
 <!-- Decorative stripes -->
 <ellipse cx="16" cy="19" rx="11" ry="4" fill="url(#stripeGrad)" transform="rotate(-30,16,19)"/>
 <ellipse cx="16" cy="19" rx="11" ry="4" fill="url(#stripeGrad)" transform="rotate(30,16,19)"/>
 <!-- Shine highlight -->
 <circle cx="16" cy="19" r="11" fill="url(#shineGrad)"/>
 <!-- Metal cap -->
 <rect x="13" y="7" width="6" height="3.5" rx="0.8" fill="url(#capGrad)"/>
 <!-- Cap detail ring -->
 <rect x="13.5" y="9.5" width="5" height="1" rx="0.3" fill="#9CA3AF"/>
 <!-- Hook -->
 <path d="M16,7 Q16,4 19,4 Q21,4 21,6" fill="none" stroke="url(#hookGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
