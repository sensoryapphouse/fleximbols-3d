 <defs>
 <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#D4D8DE"/>
 <stop offset="100%" stop-color="#8A8E94"/>
 </linearGradient>
 <linearGradient id="valveGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#B0B5BD"/>
 <stop offset="100%" stop-color="#5A5E64"/>
 </linearGradient>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E8ECF0"/>
 <stop offset="100%" stop-color="#C4C8CE"/>
 </linearGradient>
 <linearGradient id="warmGrad" x1="0" y1="1" x2="0" y2="0">
 <stop offset="0%" stop-color="#FF8800" stop-opacity="0.15"/>
 <stop offset="100%" stop-color="#FF8800" stop-opacity="0"/>
 </linearGradient>
 </defs>
 <!-- Wall behind -->
 <rect x="1" y="2" width="30" height="28" rx="0.5" fill="url(#wallGrad)"/>
 <!-- Radiator main panel -->
 <rect x="3" y="8" width="26" height="18" rx="1" fill="url(#panelGrad)"/>
 <!-- Vertical fins -->
 <rect x="5" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="8" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="11" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="14" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="17" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="20" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="23" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <rect x="26" y="9" width="1.5" height="16" rx="0.4" fill="url(#finGrad)"/>
 <!-- Warm glow gradient on panel -->
 <rect x="3" y="8" width="26" height="18" rx="1" fill="url(#warmGrad)"/>
 <!-- Top rail -->
 <rect x="3" y="8" width="26" height="1.5" rx="0.5" fill="url(#valveGrad)"/>
 <!-- Bottom rail -->
 <rect x="3" y="24.5" width="26" height="1.5" rx="0.5" fill="url(#valveGrad)"/>
 <!-- Left valve handle -->
 <rect x="1.5" y="24" width="3" height="2" rx="0.5" fill="url(#valveGrad)"/>
 <circle cx="3" cy="25" r="1.2" fill="url(#valveGrad)" stroke="#9CA3AF" stroke-width="0.4"/>
 <!-- Right valve handle -->
 <rect x="27.5" y="24" width="3" height="2" rx="0.5" fill="url(#valveGrad)"/>
 <circle cx="29" cy="25" r="1.2" fill="url(#valveGrad)" stroke="#9CA3AF" stroke-width="0.4"/>
 <!-- Wall mounting brackets hint -->
 <rect x="3" y="7" width="3" height="1.5" rx="0.3" fill="#9CA3AF"/>
 <rect x="26" y="7" width="3" height="1.5" rx="0.3" fill="#9CA3AF"/>
</svg>
