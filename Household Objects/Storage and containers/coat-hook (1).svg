<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="chPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c89a64"/>
      <stop offset="1" stop-color="#9a6f3e"/>
    </linearGradient>
    <linearGradient id="chHook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ebf1"/>
      <stop offset="0.5" stop-color="#aab0bc"/>
      <stop offset="1" stop-color="#6f7682"/>
    </linearGradient>
    <linearGradient id="chCoat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2645f"/>
      <stop offset="1" stop-color="#b53b3a"/>
    </linearGradient>
  </defs>
  <!-- wall mounting plate (backboard) -->
  <rect x="9" y="3.5" width="14" height="5.2" rx="1.2" fill="url(#chPlate)" stroke="#7c5630" stroke-width="0.5"/>
  <!-- mounting screws -->
  <circle cx="11.6" cy="6.1" r="0.7" fill="#6b4a28"/><path d="M11.1 6.1 h1" stroke="#caa570" stroke-width="0.25"/>
  <circle cx="20.4" cy="6.1" r="0.7" fill="#6b4a28"/><path d="M19.9 6.1 h1" stroke="#caa570" stroke-width="0.25"/>
  <!-- metal hook: stem down then curve up -->
  <path d="M16 8.6 L16 13.2 q0 2.6 2.6 2.6 q2.2 0 2.2 -2.0"
        fill="none" stroke="url(#chHook)" stroke-width="1.7" stroke-linecap="round"/>
  <!-- hook base knob -->
  <circle cx="16" cy="9" r="1.4" fill="url(#chHook)" stroke="#5e646f" stroke-width="0.3"/>

  <!-- coat hanging from the hook -->
  <g>
    <!-- collar wraps over hook stem -->
    <path d="M16 11 q-3.4 0.4 -4.2 4 L11 26.5 Q16 27.6 21 26.5 L20.2 15 q-0.8 -3.6 -4.2 -4 Z" fill="url(#chCoat)" stroke="#8f2e2d" stroke-width="0.5"/>
    <!-- lapels -->
    <path d="M16 11 L13.4 16 L15.4 15.4 Z" fill="#c44f4d"/>
    <path d="M16 11 L18.6 16 L16.6 15.4 Z" fill="#c44f4d"/>
    <!-- button placket -->
    <path d="M16 15.5 L16 26.4" stroke="#8f2e2d" stroke-width="0.4"/>
    <circle cx="16" cy="18" r="0.5" fill="#7e2625"/>
    <circle cx="16" cy="21" r="0.5" fill="#7e2625"/>
    <circle cx="16" cy="24" r="0.5" fill="#7e2625"/>
    <!-- sheen -->
    <path d="M12.6 16.5 Q12 21 12.4 26" stroke="#ffffff" stroke-width="0.5" opacity="0.3" fill="none"/>
  </g>
</svg>
