 <defs>
 <linearGradient id="cupbFrame" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8a870"/>
 <stop offset="100%" stop-color="#907040"/>
 </linearGradient>
 <linearGradient id="cupbInside" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#f0e8d0"/>
 <stop offset="100%" stop-color="#d8c8a0"/>
 </linearGradient>
 <linearGradient id="doorG3" x1="0" y1="0" x2="0.3" y2="1">
 <stop offset="0%" stop-color="#d8b870"/>
 <stop offset="100%" stop-color="#a07838"/>
 </linearGradient>
 <linearGradient id="plateG" x1="0" y1="0" x2="0.3" y2="1">
 <stop offset="0%" stop-color="#f8f4ee"/>
 <stop offset="100%" stop-color="#d8ccc0"/>
 </linearGradient>
 <linearGradient id="cupG2" x1="0" y1="0" x2="0.3" y2="1">
 <stop offset="0%" stop-color="#88b8d8"/>
 <stop offset="100%" stop-color="#486890"/>
 </linearGradient>
 <linearGradient id="wallG2" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e8e0d0"/>
 <stop offset="100%" stop-color="#c8c0b0"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- wall background suggest -->
 <rect x="4" y="4" width="24" height="24" rx="1" fill="url(#wallG2)" fill-opacity="0.3"/>
 <!-- cupboard frame -->
 <rect x="5" y="5" width="22" height="22" rx="1" fill="url(#cupbFrame)"/>
 <!-- inside visible when open -->
 <rect x="6" y="6" width="20" height="20" fill="url(#cupbInside)"/>
 <!-- middle shelf -->
 <rect x="6" y="15" width="20" height="1.5" rx="0.3" fill="url(#cupbFrame)"/>
 <!-- plates on upper shelf -->
 <ellipse cx="10" cy="12" rx="2.5" ry="2.5" fill="url(#plateG)"/>
 <ellipse cx="10" cy="12" rx="1.5" ry="1.5" fill="#e8e0d0"/>
 <ellipse cx="10" cy="12" rx="0.5" ry="0.5" fill="url(#plateG)"/>
 <ellipse cx="16" cy="12" rx="2.5" ry="2.5" fill="url(#plateG)"/>
 <ellipse cx="16" cy="12" rx="1.5" ry="1.5" fill="#e8e0d0"/>
 <ellipse cx="22" cy="12" rx="2.5" ry="2.5" fill="url(#plateG)"/>
 <ellipse cx="22" cy="12" rx="1.5" ry="1.5" fill="#e8e0d0"/>
 <!-- cups on lower shelf -->
 <path d="M9,20 Q9,17.5 11,17.5 Q13,17.5 13,20 Z" fill="url(#cupG2)"/>
 <rect x="9" y="19.8" width="4" height="1.5" rx="0.3" fill="url(#cupG2)"/>
 <path d="M13,19.5 Q13.5,19 13,18" stroke="#3a6888" stroke-width="0.7" fill="none"/>
 <path d="M18,20 Q18,17.5 20,17.5 Q22,17.5 22,20 Z" fill="url(#cupG2)"/>
 <rect x="18" y="19.8" width="4" height="1.5" rx="0.3" fill="url(#cupG2)"/>
 <path d="M22,19.5 Q22.5,19 22,18" stroke="#3a6888" stroke-width="0.7" fill="none"/>
 <!-- left door open (swung left) -->
 <path d="M6,6 Q1,8 2,15 L2,6 Z" fill="url(#doorG3)" fill-opacity="0.8"/>
 <rect x="1" y="6" width="5" height="15" rx="0.5" fill="url(#doorG3)" fill-opacity="0.85" transform="skewY(-8)"/>
 <!-- right door open (swung right) -->
 <path d="M26,6 Q31,8 30,15 L30,6 Z" fill="url(#doorG3)" fill-opacity="0.8"/>
 <rect x="26" y="6" width="5" height="15" rx="0.5" fill="url(#doorG3)" fill-opacity="0.85" transform="skewY(8)"/>
</svg>
