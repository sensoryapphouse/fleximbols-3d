<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="drBox" x1="0" y1="0" x2="0.2" y2="1">
 <stop offset="0%" stop-color="#d0b070"/>
 <stop offset="50%" stop-color="#b08848"/>
 <stop offset="100%" stop-color="#806020"/>
 </linearGradient>
 <linearGradient id="drFront" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e0c080"/>
 <stop offset="100%" stop-color="#c09848"/>
 </linearGradient>
 <linearGradient id="drInside" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#f0e8d0"/>
 <stop offset="100%" stop-color="#d8c8a0"/>
 </linearGradient>
 <linearGradient id="clothesG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e0ecf8"/>
 <stop offset="100%" stop-color="#b0c8e8"/>
 </linearGradient>
 <linearGradient id="clothes2G" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#f8e0e0"/>
 <stop offset="100%" stop-color="#e0b0b0"/>
 </linearGradient>
 <linearGradient id="knob2G" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#e8d8a0"/>
 <stop offset="100%" stop-color="#a09048"/>
 </linearGradient>
 <linearGradient id="drSide" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#c0a050"/>
 <stop offset="100%" stop-color="#807028"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- chest carcass back (where drawer is pulled from) -->
 <rect x="12" y="14" width="14" height="12" rx="0.5" fill="#907030" fill-opacity="0.5"/>
 <!-- drawer box extended out -->
 <rect x="4" y="12" width="20" height="16" rx="1" fill="url(#drBox)"/>
 <!-- drawer side depth right -->
 <rect x="23" y="13" width="2.5" height="14" rx="0.5" fill="url(#drSide)"/>
 <!-- drawer top (open top) perspective -->
 <path d="M4,12 L23,12 L25.5,13 L4,13 Z" fill="#e8d090"/>
 <!-- inside of drawer -->
 <rect x="5" y="13.5" width="18" height="13" rx="0.5" fill="url(#drInside)"/>
 <!-- folded clothes inside -->
 <rect x="6" y="16" width="7" height="8" rx="1" fill="url(#clothesG)"/>
 <rect x="6" y="16" width="7" height="2" rx="0.5" fill="#d0e0f8"/>
 <!-- fold lines -->
 <line x1="6" y1="18.5" x2="13" y2="18.5" stroke="#a0c0e0" stroke-width="0.4"/>
 <line x1="6" y1="21" x2="13" y2="21" stroke="#a0c0e0" stroke-width="0.4"/>
 <rect x="14.5" y="16" width="7" height="8" rx="1" fill="url(#clothes2G)"/>
 <rect x="14.5" y="16" width="7" height="2" rx="0.5" fill="#f0d0d0"/>
 <line x1="14.5" y1="18.5" x2="21.5" y2="18.5" stroke="#e0b0b0" stroke-width="0.4"/>
 <line x1="14.5" y1="21" x2="21.5" y2="21" stroke="#e0b0b0" stroke-width="0.4"/>
 <!-- drawer front face -->
 <rect x="3" y="12" width="2.5" height="16" rx="0.5" fill="url(#drFront)"/>
 <!-- knob on front -->
 <circle cx="4.25" cy="20" r="1.2" fill="url(#knob2G)"/>
 <!-- highlight on front -->
 <rect x="3.2" y="12.3" width="1.5" height="5" rx="0.4" fill="#ffffff" fill-opacity="0.3"/>
</svg>
