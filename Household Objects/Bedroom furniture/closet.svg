 <!-- Shelf 2 -->
 
 <!-- Folded clothes on shelf 2 -->
 
 <rect x="18.2" y="11.5" width="4.1" height="0.3" fill="#2050A0" opacity="0.5"/>
 
 <!-- Shelf 3 -->
 
 <!-- Folded clothes on shelf 3 -->
 
 
