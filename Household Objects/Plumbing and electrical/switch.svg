<defs>
<radialGradient id="plate" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#BAC2D0"/></radialGradient>
<radialGradient id="rocker" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#F4F8FC"/><stop offset="100%" stop-color="#8A95A8"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- wall plate -->
<rect x="6" y="3" width="20" height="26" rx="1.2" fill="url(#plate)"/>
<rect x="6" y="3" width="20" height="26" rx="1.2" fill="none" stroke="#7A85A0" stroke-width="0.3"/>
<!-- inner rocker recess -->
<rect x="11" y="8" width="10" height="16" rx="0.8" fill="#3A4250"/>
<!-- rocker switch (top half pressed) -->
<path d="M11.5 8.5 L 20.5 8.5 L 19.5 16 L 12.5 16 Z" fill="url(#rocker)"/>
<!-- bottom half (raised) -->
<path d="M12.5 16 L 19.5 16 L 20.5 23.5 L 11.5 23.5 Z" fill="url(#rocker)"/>
<ellipse cx="14" cy="10" rx="2.5" ry="0.8" fill="url(#hi)"/>
<!-- divider line between halves -->
<line x1="11.5" y1="16" x2="20.5" y2="16" stroke="#1A1F2C" stroke-width="0.3"/>
<!-- mounting screws -->
<circle cx="8.5" cy="5.5" r="0.6" fill="#7A85A0"/>
<line x1="8" y1="5" x2="9" y2="6" stroke="#3A4250" stroke-width="0.2"/>
<circle cx="23.5" cy="26.5" r="0.6" fill="#7A85A0"/>
<line x1="23" y1="26" x2="24" y2="27" stroke="#3A4250" stroke-width="0.2"/>
</svg>