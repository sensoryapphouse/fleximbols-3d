<defs>
<radialGradient id="pG" cx="40%" cy="25%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#C0C8D2"/><stop offset="1" stop-color="#3A4250"/></radialGradient>
<radialGradient id="fG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#E0E4EC"/><stop offset="0.5" stop-color="#8890A0"/><stop offset="1" stop-color="#2A3040"/></radialGradient>
<radialGradient id="iG" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#2A3040"/><stop offset="1" stop-color="#050810"/></radialGradient>
