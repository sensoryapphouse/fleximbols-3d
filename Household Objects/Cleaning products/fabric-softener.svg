 <defs>
 <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#80c8f0"/>
 <stop offset="50%" stop-color="#4090d0"/>
 <stop offset="100%" stop-color="#1050a0"/>
 </linearGradient>
 <radialGradient id="liquidGrad" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#a0d8f8"/>
 <stop offset="100%" stop-color="#3080c0"/>
 </radialGradient>
 <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f0f0f8"/>
 <stop offset="100%" stop-color="#c0c8e0"/>
 </linearGradient>
 <radialGradient id="flowerPetal" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ffccee"/>
 <stop offset="100%" stop-color="#e060a0"/>
 </radialGradient>
 </defs>
 <!-- Bottle body (squat, curved) -->
 
 <!-- Liquid visible through bottle (fill line) -->
 <path d="M9.5 21 Q9 22 9 26 Q9 30 16 30 Q23 30 23 26 Q23 22 22.5 21 Z"
 fill="url(#liquidGrad)" fill-opacity="0.5"/>
 <!-- Bottle sheen -->
 <path d="M10.5 12 Q10 15 10 22 L11.5 22 Q11.5 15 11 12 Z" fill="#ffffff" fill-opacity="0.3"/>
 <!-- Cap -->
 <ellipse cx="16" cy="8.5" rx="4" ry="1.5" fill="url(#capGrad)"/>
 <rect x="12" y="6" width="8" height="3" rx="1" fill="url(#capGrad)" stroke="#b0b8d0" stroke-width="0.4"/>
 <!-- Floral label -->
 <rect x="11" y="14" width="10" height="9" rx="1" fill="#d8eeff" fill-opacity="0.6" stroke="#80b0e0" stroke-width="0.3"/>
 <!-- Flower centre -->
 <circle cx="16" cy="18.5" r="1" fill="#ffe080"/>
 <!-- Petals -->
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(0,16,18.5)"/>
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(60,16,18.5)"/>
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(120,16,18.5)"/>
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(180,16,18.5)"/>
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(240,16,18.5)"/>
 <ellipse cx="16" cy="16.2" rx="0.9" ry="1.5" fill="url(#flowerPetal)" transform="rotate(300,16,18.5)"/>
 <!-- Base sheen -->
 
</svg>
