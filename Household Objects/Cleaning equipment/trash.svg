<defs>
<radialGradient id="can" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#E8E8E8"/><stop offset="100%" stop-color="#3A4250"/></radialGradient>
<radialGradient id="lid" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#7A8898"/><stop offset="100%" stop-color="#1A1F2C"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- pedal at bottom -->
<rect x="22" y="27" width="6" height="1.2" rx="0.3" fill="url(#lid)"/>
<line x1="22" y1="26" x2="20" y2="22" stroke="#7A8898" stroke-width="0.4"/>
<!-- lid (raised slightly) -->
<ellipse cx="14" cy="5" rx="10" ry="2.5" fill="url(#lid)"/>
<ellipse cx="10" cy="4" rx="4" ry="0.8" fill="url(#hi)"/>
<!-- lid handle indent -->
<rect x="11" y="3" width="6" height="1" rx="0.3" fill="#0A0E18"/>
<!-- can body (cylindrical) -->
<path d="M4 5.5 L 24 5.5 L 22 28 Q 22 29 21 29 L 7 29 Q 6 29 6 28 Z" fill="url(#can)"/>
<!-- vertical brushed steel highlight -->
<rect x="6" y="6" width="1.5" height="22" fill="url(#hi)"/>
<rect x="8" y="6" width="0.4" height="22" fill="#FFFFFF" opacity="0.3"/>
<rect x="10" y="6" width="0.4" height="22" fill="#FFFFFF" opacity="0.2"/>
<rect x="20" y="6" width="0.4" height="22" fill="#FFFFFF" opacity="0.3"/>
<!-- horizontal rim band -->
<rect x="4" y="6" width="20" height="0.8" fill="#1A1F2C" opacity="0.5"/>
<rect x="6" y="27" width="16" height="0.8" fill="#1A1F2C" opacity="0.5"/>
<!-- recycling symbol on front -->
<g transform="translate(14 16)">
<path d="M-2 -2 L 0 -3 L 2 -2 L 1 0 L -1 0 Z" fill="none" stroke="#5AC85A" stroke-width="0.5"/>
<path d="M-2 1 L 0 3 L 2 1" fill="none" stroke="#5AC85A" stroke-width="0.5"/>
</g>
