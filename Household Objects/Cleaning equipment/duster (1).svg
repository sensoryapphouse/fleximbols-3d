<defs>
<linearGradient id="duHandle" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#C88A4A"/>
<stop offset="50%" stop-color="#9A5E26"/>
<stop offset="100%" stop-color="#5E3412"/>
</linearGradient>
<radialGradient id="duPlume" cx="50%" cy="30%" r="75%">
<stop offset="0%" stop-color="#FFE890"/>
<stop offset="55%" stop-color="#F2C238"/>
<stop offset="100%" stop-color="#C68A14"/>
</radialGradient>
<filter id="dus0" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="0.5"/><feOffset dx="0.3" dy="0.6" result="off"/><feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<!-- handle -->
<rect x="14.6" y="16" width="2.8" height="13" rx="1.4" fill="url(#duHandle)" filter="url(#dus0)"/>
<rect x="15.2" y="17" width="0.8" height="11" rx="0.4" fill="#FFFFFF" fill-opacity="0.25"/>
<!-- collar band -->
<rect x="13.4" y="14.5" width="5.2" height="2.4" rx="1" fill="#B23A2A"/>
<rect x="13.4" y="15" width="5.2" height="0.6" fill="#E06A4A" opacity="0.7"/>
<!-- feather plume (teardrop bundle of fronds) -->
<g filter="url(#dus0)">
<path d="M16 3 C 9 6 8 11 11 15 Q 16 16.5 21 15 C 24 11 23 6 16 3 Z" fill="url(#duPlume)"/>
</g>
<!-- frond strands -->
<g stroke="#B8860C" stroke-width="0.4" opacity="0.55" fill="none" stroke-linecap="round">
<path d="M16 4 L 16 15"/>
<path d="M13 5 Q 13 10 13.5 14.5"/>
<path d="M19 5 Q 19 10 18.5 14.5"/>
<path d="M10.5 9 Q 13 11 12 14.5"/>
<path d="M21.5 9 Q 19 11 20 14.5"/>
</g>
<!-- wispy tips -->
<g stroke="#FFE890" stroke-width="0.5" opacity="0.7" fill="none" stroke-linecap="round">
<path d="M16 3 Q 16 1.5 15 1"/>
<path d="M11 5 Q 9.5 4 8.5 4.5"/>
<path d="M21 5 Q 22.5 4 23.5 4.5"/>
<path d="M9 11 Q 7.5 11 7 12"/>
<path d="M23 11 Q 24.5 11 25 12"/>
