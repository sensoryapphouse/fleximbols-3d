 <defs>
 <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#9E9E9E"/>
 <stop offset="100%" stop-color="#5E5E5E"/>
 </linearGradient>
 <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7E7E7E"/>
 <stop offset="100%" stop-color="#4A4A4A"/>
 </linearGradient>
 <linearGradient id="stairGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="pipeGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="heaterGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="brickGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#8A8A8A"/>
 <stop offset="100%" stop-color="#5A5A5A"/>
 </linearGradient>
 </defs>
 <!-- Back wall (concrete/grey brick) -->
 <rect x="2" y="3" width="28" height="20" fill="url(#wallGrad)"/>
 <!-- Brick pattern rows -->
 <rect x="2" y="5" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <rect x="2" y="8" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <rect x="2" y="11" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <rect x="2" y="14" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <rect x="2" y="17" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <rect x="2" y="20" width="28" height="0.4" fill="#5A5A5A" opacity="0.5"/>
 <!-- Vertical brick offsets row 1 -->
 <line x1="6" y1="3" x2="6" y2="5" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="12" y1="3" x2="12" y2="5" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="18" y1="3" x2="18" y2="5" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="24" y1="3" x2="24" y2="5" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <!-- Vertical brick offsets row 2 -->
 <line x1="9" y1="5" x2="9" y2="8" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="15" y1="5" x2="15" y2="8" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="21" y1="5" x2="21" y2="8" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <line x1="27" y1="5" x2="27" y2="8" stroke="#5A5A5A" stroke-width="0.4" opacity="0.5"/>
 <!-- Floor -->
 <rect x="2" y="23" width="28" height="6" fill="url(#floorGrad)"/>
 <!-- Floor cracks -->
 <line x1="5" y1="24" x2="10" y2="26" stroke="#3A3A3A" stroke-width="0.3" opacity="0.5"/>
 <line x1="18" y1="25" x2="23" y2="27" stroke="#3A3A3A" stroke-width="0.3" opacity="0.4"/>
 <!-- Ceiling pipes -->
 <rect x="2" y="3" width="28" height="1.5" fill="#6A6A6A" opacity="0.6"/>
 <!-- Main pipe horizontal -->
 
 <!-- Branch pipe -->
 
 
 <!-- Pipe flange -->
 <rect x="11.5" y="7.5" width="2.2" height="0.6" rx="0.2" fill="url(#pipeGrad)"/>
 <!-- Staircase descending from top-left -->
 
 <rect x="2" y="6" width="7.5" height="2.5" rx="0.3" fill="url(#stairGrad)"/>
 <rect x="2" y="9" width="6" height="2.5" rx="0.3" fill="url(#stairGrad)"/>
 <rect x="2" y="12" width="4.5" height="2.5" rx="0.3" fill="url(#stairGrad)"/>
 <rect x="2" y="15" width="3" height="2.5" rx="0.3" fill="url(#stairGrad)"/>
 <!-- Handrail -->
 <polyline points="11,3 3,3 3,18" fill="none" stroke="#8B5C3A" stroke-width="0.7" stroke-linecap="round"/>
 <!-- Water heater (right corner) -->
 
 <!-- Heater top dome -->
 <ellipse cx="26" cy="16" rx="3" ry="0.8" fill="#D0D4DA"/>
 <!-- Heater pipe top -->
 <rect x="25.2" y="13" width="1.5" height="3" rx="0.4" fill="url(#pipeGrad)"/>
 <!-- Heater dial -->
 <circle cx="26" cy="20" r="1" fill="#9E9E9E" stroke="#7A7E84" stroke-width="0.3"/>
 <line x1="26" y1="19.2" x2="26" y2="20.8" stroke="#5A5A5A" stroke-width="0.4"/>
 <!-- Heater label line -->
 <line x1="24" y1="22" x2="28" y2="22" stroke="#7A7E84" stroke-width="0.3"/>
 <!-- Dim bulb light -->
 <circle cx="16" cy="5" r="0.8" fill="#F5D060" opacity="0.7"/>
 <line x1="16" y1="3" x2="16" y2="4.2" stroke="#7A7E84" stroke-width="0.4"/>
 <ellipse cx="16" cy="5.5" rx="2" ry="0.6" fill="#F5D060" opacity="0.2"/>
</svg>
