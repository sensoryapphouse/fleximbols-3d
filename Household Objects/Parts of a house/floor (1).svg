  <line x1="456" y1="280" x2="508" y2="464" stroke="#a07840" stroke-width="2"/>
  <!-- floor board lines (lateral) -->
  <line x1="56"  y1="340" x2="456" y2="340" stroke="#a07840" stroke-width="2"/>
  <line x1="30"  y1="406" x2="482" y2="406" stroke="#a07840" stroke-width="2"/>
  <!-- arrow pointing to floor -->
  <line x1="256" y1="130" x2="256" y2="262" stroke="#0a6a0a" stroke-width="2" stroke-linecap="round"/>
  <polygon points="256,280 236,254 276,254" fill="url(#loc3d_arrow)" stroke="#2a1a08" stroke-width="2"/>
