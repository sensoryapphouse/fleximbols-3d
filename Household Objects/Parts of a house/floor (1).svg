  <defs>
    <radialGradient id="loc3d_ball" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#ffd4d4"/>
      <stop offset="25%"  stop-color="#ff8080"/>
      <stop offset="65%"  stop-color="#e52d2d"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <radialGradient id="loc3d_ball_spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="loc3d_grey" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#e0e0e0"/>
      <stop offset="60%"  stop-color="#909090"/>
      <stop offset="100%" stop-color="#505050"/>
