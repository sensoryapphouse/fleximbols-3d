  <!-- floor board lines (longitudinal) -->
  <line x1="256" y1="280" x2="256" y2="464" stroke="#a07840" stroke-width="2"/>
  <line x1="156" y1="280" x2="130" y2="464" stroke="#a07840" stroke-width="2"/>
  <line x1="356" y1="280" x2="382" y2="464" stroke="#a07840" stroke-width="2"/>
