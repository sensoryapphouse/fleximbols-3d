 <defs>
 <linearGradient id="machineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#606870"/>
 <stop offset="100%" stop-color="#202830"/>
 </linearGradient>
 <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#a08060"/>
 <stop offset="100%" stop-color="#604030"/>
 </linearGradient>
 <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f5f5f0"/>
 <stop offset="100%" stop-color="#d0d0c8"/>
 </linearGradient>
 <linearGradient id="coffeeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
 <stop offset="0%" stop-color="#3a1808"/>
 <stop offset="100%" stop-color="#7a3818"/>
 </linearGradient>
 </defs>
 <!-- Machine body -->
 
 <!-- Top panel with controls -->
 <rect x="5" y="6" width="16" height="4" rx="1" fill="#404850"/>
 <!-- Control buttons -->
 <circle cx="8" cy="8" r="1" fill="#c0c0c8"/>
 <circle cx="11" cy="8" r="1" fill="#60c060"/>
 <circle cx="14" cy="8" r="1" fill="#c06060"/>
 <!-- Group head/portafilter area -->
 <rect x="7" y="12" width="12" height="6" rx="1" fill="#303840"/>
 <!-- Spout holes -->
 <circle cx="13" cy="17" r="1.2" fill="#1a2028"/>
 <circle cx="16" cy="17" r="1.2" fill="#1a2028"/>
 <!-- Coffee drip -->
 <path d="M13 18 Q13 21 13 23" stroke="url(#coffeeGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <path d="M16 18 Q16 21 16 23" stroke="url(#coffeeGrad)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <!-- Drip tray -->
 <rect x="5" y="23" width="16" height="1.5" rx="0.5" fill="#505860"/>
 <!-- Cup -->
 
 <!-- Coffee in cup -->
 <ellipse cx="15" cy="25" rx="3.5" ry="1" fill="url(#coffeeGrad)"/>
 <!-- Cup handle -->
 <path d="M19 25 Q22 25 22 27.5 Q22 30 19 30" stroke="url(#cupGrad)" stroke-width="1.5" fill="none"/>
 <!-- Water reservoir (right side) -->
 <rect x="24" y="6" width="5" height="14" rx="1" fill="#404858" fill-opacity="0.8"/>
 <rect x="24.5" y="7" width="4" height="12" rx="0.5" fill="#304058" fill-opacity="0.6"/>
</svg>
