<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="dh-body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#f0f0f0"/>
 <stop offset="50%" stop-color="#e0e0e0"/>
 <stop offset="100%" stop-color="#c0c4c8"/>
 </linearGradient>
 <linearGradient id="dh-tank" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c8e8f8" stop-opacity="0.85"/>
 <stop offset="60%" stop-color="#98c8e8" stop-opacity="0.75"/>
 <stop offset="100%" stop-color="#6098c0" stop-opacity="0.7"/>
 </linearGradient>
 <linearGradient id="dh-water" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#5090c8" stop-opacity="0.65"/>
 <stop offset="100%" stop-color="#3070a8" stop-opacity="0.55"/>
 </linearGradient>
 <linearGradient id="dh-display" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#20e080"/>
 <stop offset="100%" stop-color="#008040"/>
 </linearGradient>
 </defs>
 <!-- Main white box-shaped body -->
 
 <!-- Slatted air intake grille (front) -->
 <line x1="8.5" y1="10" x2="24.5" y2="10" stroke="#c0c0c0" stroke-width="0.7"/>
 <line x1="8.5" y1="12" x2="24.5" y2="12" stroke="#c0c0c0" stroke-width="0.7"/>
 <line x1="8.5" y1="14" x2="24.5" y2="14" stroke="#c0c0c0" stroke-width="0.7"/>
 <line x1="8.5" y1="16" x2="24.5" y2="16" stroke="#c0c0c0" stroke-width="0.7"/>
 <line x1="8.5" y1="18" x2="24.5" y2="18" stroke="#c0c0c0" stroke-width="0.7"/>
 <!-- Top control panel area -->
 <rect x="7" y="5" width="18" height="7" rx="1.5" fill="#d8d8d8"/>
 <!-- Digital display (green) -->
 <rect x="10" y="6.5" width="8" height="4" rx="0.7" fill="url(#dh-display)"/>
 <!-- Display readout numbers suggestion (block shapes) -->
 <rect x="11" y="7.5" width="1.5" height="2" rx="0.3" fill="#00ff80" fill-opacity="0.7"/>
 <rect x="13" y="7.5" width="1.5" height="2" rx="0.3" fill="#00ff80" fill-opacity="0.7"/>
 <rect x="15" y="7.5" width="1.5" height="2" rx="0.3" fill="#00ff80" fill-opacity="0.7"/>
 <!-- Control button -->
 <circle cx="21" cy="8.5" r="1.5" fill="#a0b0c0"/>
 <!-- Transparent water-collection tank at base -->
 <rect x="8" y="21" width="16" height="7" rx="1" fill="url(#dh-tank)" stroke="#80b0d0" stroke-width="0.5"/>
 <!-- Water level inside tank -->
 <rect x="8.5" y="25" width="15" height="2.5" rx="0.5" fill="url(#dh-water)"/>
 <!-- Water surface line -->
 <line x1="8.5" y1="25" x2="23.5" y2="25" stroke="#5090c8" stroke-width="0.5" stroke-opacity="0.6"/>
 <!-- Body outline -->
 <rect x="7" y="5" width="18" height="24" rx="1.5" fill="none" stroke="#b0b8c0" stroke-width="0.5"/>
</svg>
