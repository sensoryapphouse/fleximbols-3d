 <defs>
 <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#7A7E84"/>
 </linearGradient>
 <linearGradient id="grilleFace" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#3A3A3A"/>
 <stop offset="100%" stop-color="#1A1A1A"/>
 </linearGradient>
 <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FF8800"/>
 <stop offset="100%" stop-color="#CC4400"/>
 </linearGradient>
 <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#B0B5BD"/>
 <stop offset="100%" stop-color="#5A5E64"/>
 </linearGradient>
 <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#9CA0A6"/>
 <stop offset="100%" stop-color="#5A5E64"/>
 </linearGradient>
 </defs>
 <!-- Heater body -->
 <rect x="7" y="8" width="16" height="18" rx="1.2" fill="url(#bodyGrad)"/>
 <!-- Right side face (3D) -->
 <polygon points="23,8 27,10 27,26 23,26" fill="url(#sideFace)"/>
 <!-- Grille area -->
 <rect x="8" y="10" width="14" height="11" rx="0.5" fill="url(#grilleFace)"/>
 <!-- Glowing heating elements -->
 <rect x="9" y="11" width="12" height="1.5" rx="0.3" fill="url(#glowGrad)" opacity="0.9"/>
 <rect x="9" y="13.5" width="12" height="1.5" rx="0.3" fill="url(#glowGrad)" opacity="0.9"/>
 <rect x="9" y="16" width="12" height="1.5" rx="0.3" fill="url(#glowGrad)" opacity="0.9"/>
 <rect x="9" y="18.5" width="12" height="1.5" rx="0.3" fill="url(#glowGrad)" opacity="0.9"/>
 <!-- Glow highlight over elements -->
 <rect x="8" y="10" width="14" height="11" rx="0.5" fill="#FF8800" opacity="0.08"/>
 <!-- Control knobs top area -->
 <rect x="9" y="23" width="12" height="2" rx="0.5" fill="url(#knobGrad)"/>
 <!-- Knob 1 -->
 <circle cx="12" cy="24" r="0.9" fill="#7A7E84"/>
 <circle cx="12" cy="24" r="0.5" fill="#C9CDD3"/>
 <!-- Knob 2 -->
 <circle cx="16" cy="24" r="0.9" fill="#7A7E84"/>
 <circle cx="16" cy="24" r="0.5" fill="#C9CDD3"/>
 <!-- Knob 3 -->
 <circle cx="20" cy="24" r="0.9" fill="#7A7E84"/>
 <circle cx="20" cy="24" r="0.5" fill="#C9CDD3"/>
 <!-- Heat shimmer lines above -->
 <path d="M11,7 Q11.5,5.5 11,4" fill="none" stroke="#FF8800" stroke-width="0.5" opacity="0.5"/>
 <path d="M16,7 Q16.5,5.5 16,4" fill="none" stroke="#FF8800" stroke-width="0.5" opacity="0.5"/>
 <path d="M21,7 Q21.5,5.5 21,4" fill="none" stroke="#FF8800" stroke-width="0.5" opacity="0.5"/>
</svg>
