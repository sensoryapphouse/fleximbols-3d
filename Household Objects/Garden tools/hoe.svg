 <defs>
 <linearGradient id="hoeHandle" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8A030"/><stop offset="100%" stop-color="#7A5800"/></linearGradient>
 <linearGradient id="hoeBlade" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#B8B8C8"/><stop offset="100%" stop-color="#4A4A6A"/></linearGradient>
 </defs>
 <!-- Long handle (angled diagonally) -->
 <line x1="28" y1="3" x2="14" y2="23" stroke="url(#hoeHandle)" stroke-width="2" stroke-linecap="round" filter="url(#sdHoe)"/>
 <!-- Right angle joint -->
 <circle cx="14" cy="23" r="1.3" fill="url(#hoeBlade)" filter="url(#sdHoe)"/>
 <!-- Flat blade (horizontal from handle end) -->
 <rect x="8" y="22" width="10" height="3" rx="0.6" fill="url(#hoeBlade)" filter="url(#sdHoe)"/>
 <!-- Blade highlight -->
 <rect x="8" y="22.2" width="10" height="1" rx="0.3" fill="white" fill-opacity="0.25"/>
</svg>
