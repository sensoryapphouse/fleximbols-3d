 <defs>
 <linearGradient id="hoseG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5AB85A"/><stop offset="100%" stop-color="#2A6A2A"/></linearGradient>
 <linearGradient id="nozzleG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8C8A0"/><stop offset="100%" stop-color="#787840"/></linearGradient>
 <linearGradient id="waterG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6AB8F8"/><stop offset="100%" stop-color="#1A58A8"/></linearGradient>
 </defs>
 <!-- Coiled hose loops -->
 <g filter="url(#sdHose)">
 <circle cx="14" cy="18" r="9" fill="none" stroke="url(#hoseG)" stroke-width="2.5"/>
 <circle cx="14" cy="18" r="6" fill="none" stroke="url(#hoseG)" stroke-width="2.5"/>
 <circle cx="14" cy="18" r="3" fill="none" stroke="url(#hoseG)" stroke-width="2.5"/>
 </g>
 <!-- Hose end leading to nozzle -->
 <path d="M14 9 Q18 7 22 9" stroke="url(#hoseG)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Nozzle -->
 <rect x="21" y="7" width="6" height="3" rx="0.8" fill="url(#nozzleG)" filter="url(#sdHose)"/>
 <rect x="25" y="6" width="2" height="1.5" rx="0.5" fill="url(#nozzleG)"/>
 <!-- Water spray lines -->
 <line x1="27" y1="7.5" x2="30" y2="5" stroke="url(#waterG)" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="27" y1="8.5" x2="31" y2="7.5" stroke="url(#waterG)" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="27" y1="9.5" x2="30" y2="11" stroke="url(#waterG)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
