<defs>
<linearGradient id="lm_body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FF8A7A"/>
<stop offset="0.5" stop-color="#E5483A"/>
<stop offset="1" stop-color="#A82A1A"/>
</linearGradient>
<linearGradient id="lm_deck" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#D63A2C"/>
<stop offset="1" stop-color="#8E1F12"/>
</linearGradient>
<radialGradient id="lm_wheel" cx="0.4" cy="0.35" r="0.75">
<stop offset="0" stop-color="#4A4A55"/>
<stop offset="1" stop-color="#16161E"/>
</radialGradient>
<linearGradient id="lm_grass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7BD267"/>
<stop offset="1" stop-color="#3C8A2E"/>
</linearGradient>
<linearGradient id="lm_handle" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#9AA0AC"/>
<stop offset="1" stop-color="#52586A"/>
</linearGradient>
</defs>
<!-- grass ground -->
<rect x="0" y="24.5" width="32" height="4.5" fill="url(#lm_grass)"/>
<g stroke="#2E6E22" stroke-width="0.5" stroke-linecap="round">
<path d="M2 25 l0.8 -1.4 M5 25 l0.6 -1.6 M27 25 l0.7 -1.5 M30 25 l-0.6 -1.4"/>
</g>
<!-- cut/short grass under mower lighter -->
<rect x="6" y="24.5" width="15" height="1.0" fill="#A8E08A" opacity="0.7"/>
<!-- push handle (U-bar going up-right to grips) -->
<path d="M12 19 L25 7" stroke="url(#lm_handle)" stroke-width="1.4" stroke-linecap="round"/>
<path d="M14.5 19 L27 7" stroke="url(#lm_handle)" stroke-width="1.4" stroke-linecap="round"/>
<!-- top cross grip -->
<path d="M24.4 7.6 L27.6 6.4" stroke="#3A3F4C" stroke-width="1.6" stroke-linecap="round"/>
<!-- engine / motor box on deck -->
<rect x="7.5" y="13.0" width="5.5" height="4.2" rx="0.6" fill="#5A5A66" stroke="#36363F" stroke-width="0.3"/>
<rect x="9.0" y="11.6" width="2.2" height="1.6" rx="0.3" fill="#43434E"/>
<circle cx="12.6" cy="13.6" r="0.5" fill="#FFEC9A"/>
<!-- pull-cord handle -->
<path d="M13 13.5 q2 -1 2.6 0.4" fill="none" stroke="#3A3F4C" stroke-width="0.4"/>
<!-- mower deck / cutting body -->
<path d="M4.5 17.0 H20.5 C21.2 17.0 21.6 17.6 21.4 18.3 L20.6 22.2 C20.4 23.0 19.7 23.6 18.9 23.6 H6.1 C5.3 23.6 4.6 23.0 4.4 22.2 L3.6 18.3 C3.5 17.6 3.9 17.0 4.5 17.0 Z" fill="url(#lm_deck)" stroke="#7A1808" stroke-width="0.4"/>
<rect x="4.5" y="16.2" width="16" height="2.0" rx="0.8" fill="url(#lm_body)" stroke="#8E1F12" stroke-width="0.3"/>
<ellipse cx="8" cy="16.9" rx="5" ry="0.8" fill="#FFFFFF" opacity="0.22"/>
<!-- wheels -->
<circle cx="7" cy="23.4" r="2.7" fill="url(#lm_wheel)" stroke="#0C0C12" stroke-width="0.3"/>
<circle cx="7" cy="23.4" r="1.0" fill="#7A7A86"/>
<circle cx="18" cy="23.4" r="2.7" fill="url(#lm_wheel)" stroke="#0C0C12" stroke-width="0.3"/>
<circle cx="18" cy="23.4" r="1.0" fill="#7A7A86"/>
<!-- flying clippings -->
<g fill="#5AB85A"><circle cx="23" cy="20" r="0.4"/><circle cx="24.5" cy="21.5" r="0.35"/><circle cx="22.5" cy="22.5" r="0.3"/></g>
</svg>
