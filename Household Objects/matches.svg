 <defs>
 <linearGradient id="mWood" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#f3d9a6"/>
 <stop offset="50%" stop-color="#e9c483"/>
 <stop offset="100%" stop-color="#c89a52"/>
 </linearGradient>
 <radialGradient id="mHead" cx="40%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#ff7a5a"/>
 <stop offset="55%" stop-color="#e0301f"/>
 <stop offset="100%" stop-color="#9c1410"/>
 </radialGradient>
 <radialGradient id="mFlame" cx="50%" cy="70%" r="70%">
 <stop offset="0%" stop-color="#fff0a0"/>
 <stop offset="55%" stop-color="#ffb02e"/>
 <stop offset="100%" stop-color="#f0561f"/>
 </radialGradient>
 </defs>
 <!-- A reusable matchstick: head + stick. Three of them, fanned. -->
 <!-- match 1 (lit, leftmost, leaning left) -->
 <g transform="rotate(-16 11 17)">
 <rect x="9.6" y="11" width="2.6" height="17" rx="1.1" fill="url(#mWood)" stroke="#b88f4c" stroke-width="0.35"/>
 <ellipse cx="10.9" cy="10" rx="2.6" ry="3.3" fill="url(#mHead)" stroke="#7e120e" stroke-width="0.35"/>
 <!-- flame -->
 <path d="M10.9 5.5 Q8.7 3.5 10.6 1 Q10.7 2.6 11.4 2.9 Q12.7 1.2 11.6 -0.8 Q14.4 0.8 13.6 4 Q13.1 5.4 10.9 5.5 Z" fill="url(#mFlame)"/>
 </g>
 <!-- match 2 (centre, upright) -->
 <g transform="rotate(2 16 17)">
 <rect x="14.7" y="11" width="2.6" height="17" rx="1.1" fill="url(#mWood)" stroke="#b88f4c" stroke-width="0.35"/>
 <ellipse cx="16" cy="10" rx="2.6" ry="3.3" fill="url(#mHead)" stroke="#7e120e" stroke-width="0.35"/>
 </g>
 <!-- match 3 (right, leaning right) -->
 <g transform="rotate(18 21 17)">
 <rect x="19.8" y="11" width="2.6" height="17" rx="1.1" fill="url(#mWood)" stroke="#b88f4c" stroke-width="0.35"/>
 <ellipse cx="21.1" cy="10" rx="2.6" ry="3.3" fill="url(#mHead)" stroke="#7e120e" stroke-width="0.35"/>
 </g>
</svg>
