 <defs>
 <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F3F4F6"/>
 <stop offset="45%" stop-color="#D1D5DB"/>
 <stop offset="100%" stop-color="#6B7280"/>
 </linearGradient>
 <linearGradient id="metalSide" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#9CA3AF"/>
 <stop offset="100%" stop-color="#4B5563"/>
 </linearGradient>
 <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </linearGradient>
 </defs>
 <!-- Single U-shaped metal staple (legs pointing down) -->
 <!-- side/depth shadow for 3D feel -->
 <path d="M9.4 24 L9.4 11.8 Q9.4 9.4 11.8 9.4 L21.6 9.4 Q24 9.4 24 11.8 L24 24"
 fill="none" stroke="url(#metalSide)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(0.9,0.9)"/>
 <!-- main bright metal body -->
 <path d="M8.5 24 L8.5 11 Q8.5 8.5 11 8.5 L21 8.5 Q23.5 8.5 23.5 11 L23.5 24"
 fill="none" stroke="url(#metalGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- top highlight along the crown -->
 <path d="M11 7.6 L21 7.6 Q22.4 7.6 22.4 9.4"
 fill="none" stroke="url(#shineGrad)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- pointed leg tips -->
 <path d="M7.2 23.5 L8.5 25.8 L9.8 23.5 Z" fill="#6B7280"/>
 <path d="M22.2 23.5 L23.5 25.8 L24.8 23.5 Z" fill="#6B7280"/>
</svg>
