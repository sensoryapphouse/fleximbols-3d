 <defs>
 <linearGradient id="rugGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C0392B"/>
 <stop offset="100%" stop-color="#7B241C"/>
 </linearGradient>
 <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#D4AC0D"/>
 <stop offset="100%" stop-color="#9A7D0A"/>
 </linearGradient>
 <linearGradient id="innerGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#E8A89B"/>
 <stop offset="100%" stop-color="#C45C50"/>
 </linearGradient>
 <linearGradient id="motifGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#F0C060"/>
 <stop offset="100%" stop-color="#C08020"/>
 </linearGradient>
 </defs>
 <!-- Rug body (slightly oval-ish rectangle) -->
 <rect x="3" y="6" width="26" height="20" rx="3" fill="url(#rugGrad)"/>
 <!-- Outer border -->
 <rect x="3" y="6" width="26" height="20" rx="3" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
 <!-- Inner border -->
 <rect x="6" y="9" width="20" height="14" rx="1.5" fill="none" stroke="url(#borderGrad)" stroke-width="0.8"/>
 <!-- Centre medallion -->
 <ellipse cx="16" cy="16" rx="5" ry="4" fill="url(#innerGrad)" opacity="0.7"/>
 <!-- Medallion motif -->
 <ellipse cx="16" cy="16" rx="2.5" ry="2" fill="url(#motifGrad)" opacity="0.8"/>
 <!-- Corner motifs -->
 <circle cx="8" cy="11" r="1.2" fill="url(#motifGrad)" opacity="0.7"/>
 <circle cx="24" cy="11" r="1.2" fill="url(#motifGrad)" opacity="0.7"/>
 <circle cx="8" cy="21" r="1.2" fill="url(#motifGrad)" opacity="0.7"/>
 <circle cx="24" cy="21" r="1.2" fill="url(#motifGrad)" opacity="0.7"/>
 <!-- Small cross patterns -->
 <line x1="16" y1="10" x2="16" y2="22" stroke="url(#motifGrad)" stroke-width="0.4" opacity="0.4"/>
 <line x1="10" y1="16" x2="22" y2="16" stroke="url(#motifGrad)" stroke-width="0.4" opacity="0.4"/>
 <!-- Fringe left -->
 <line x1="3" y1="8" x2="1" y2="8" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="10" x2="1" y2="10" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="12" x2="1" y2="12" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="14" x2="1" y2="14" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="16" x2="1" y2="16" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="18" x2="1" y2="18" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="20" x2="1" y2="20" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="22" x2="1" y2="22" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="3" y1="24" x2="1" y2="24" stroke="#D4AC0D" stroke-width="0.7"/>
 <!-- Fringe right -->
 <line x1="29" y1="8" x2="31" y2="8" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="10" x2="31" y2="10" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="12" x2="31" y2="12" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="14" x2="31" y2="14" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="16" x2="31" y2="16" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="18" x2="31" y2="18" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="20" x2="31" y2="20" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="22" x2="31" y2="22" stroke="#D4AC0D" stroke-width="0.7"/>
 <line x1="29" y1="24" x2="31" y2="24" stroke="#D4AC0D" stroke-width="0.7"/>
</svg>
