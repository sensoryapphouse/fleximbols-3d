 <defs>
 <radialGradient id="rug" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FF8B3D"/>
 <stop offset="100%" stop-color="#8B1A1A"/>
 </radialGradient>
 <radialGradient id="border" cx="35%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#8B5C00"/>
 </radialGradient>
 <radialGradient id="motif" cx="35%" cy="30%" r="70%">
