 <defs>
 <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#E5E7EB"/>
 <stop offset="100%" stop-color="#9CA3AF"/>
 </linearGradient>
 <linearGradient id="lightGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFF9E6"/>
 <stop offset="100%" stop-color="#E8D8A0"/>
 </linearGradient>
 <linearGradient id="cordGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 </defs>
 <!-- Window frame outer -->
 <rect x="3" y="3" width="26" height="26" rx="1" fill="url(#frameGrad)" stroke="#6B4226" stroke-width="0.5"/>
 <!-- Window frame inner (light) -->
 <rect x="5" y="5" width="22" height="22" rx="0.5" fill="url(#lightGrad)"/>
 <!-- Blind header rail -->
 <rect x="5" y="5" width="22" height="2.5" rx="0.3" fill="url(#slatGrad)"/>
 <!-- Slats (8 slats, slightly angled) -->
 <rect x="5.5" y="9" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,9.75)"/>
 <rect x="5.5" y="11.5" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,12.25)"/>
 <rect x="5.5" y="14" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,14.75)"/>
 <rect x="5.5" y="16.5" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,17.25)"/>
 <rect x="5.5" y="19" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,19.75)"/>
 <rect x="5.5" y="21.5" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)" transform="rotate(-3,15,22.25)"/>
 <!-- Bottom slat rail -->
 <rect x="5.5" y="24" width="19" height="1.5" rx="0.4" fill="url(#slatGrad)"/>
 <!-- Cord on right side -->
 <line x1="25" y1="7.5" x2="25" y2="25" stroke="url(#cordGrad)" stroke-width="0.7"/>
 <!-- Cord tassel -->
 <circle cx="25" cy="25.5" r="0.8" fill="url(#cordGrad)"/>
</svg>
