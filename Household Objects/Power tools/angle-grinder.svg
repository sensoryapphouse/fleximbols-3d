<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <defs>
    <linearGradient id="ag_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD24D"/>
      <stop offset="0.5" stop-color="#F2A11E"/>
      <stop offset="1" stop-color="#C97A10"/>
    </linearGradient>
    <linearGradient id="ag_motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDB6B"/>
      <stop offset="1" stop-color="#D6890F"/>
    </linearGradient>
    <radialGradient id="ag_disc" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#8A8F99"/>
      <stop offset="60%" stop-color="#5A5F69"/>
      <stop offset="100%" stop-color="#34383F"/>
    </radialGradient>
    <linearGradient id="ag_guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5F69"/>
      <stop offset="1" stop-color="#2C3036"/>
    </linearGradient>
    <linearGradient id="ag_hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8ECF2"/>
      <stop offset="1" stop-color="#A7AEBA"/>
    </linearGradient>
    <filter id="ag_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="0.9" stdDeviation="0.7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#ag_sh)">
    <!-- rear motor barrel -->
    <rect x="22" y="11.5" width="8" height="8" rx="3.2" fill="url(#ag_motor)"/>
    <!-- motor vent lines -->
    <g stroke="#9c5f08" stroke-width="0.6" stroke-linecap="round">
      <line x1="24.6" y1="13" x2="24.6" y2="18"/>
      <line x1="26" y1="13" x2="26" y2="18"/>
      <line x1="27.4" y1="13" x2="27.4" y2="18"/>
    </g>
    <!-- main body / handle -->
    <rect x="10.5" y="11.8" width="13" height="7.4" rx="2.4" fill="url(#ag_body)"/>
    <!-- gear head housing near the disc -->
    <rect x="8.5" y="11" width="5.5" height="9" rx="2.2" fill="url(#ag_motor)"/>
    <!-- spindle hub -->
    <circle cx="11" cy="20.5" r="2.2" fill="url(#ag_hub)"/>
    <!-- grinding disc -->
    <circle cx="11" cy="22" r="6.6" fill="url(#ag_disc)"/>
    <circle cx="11" cy="22" r="6.6" fill="none" stroke="#23262b" stroke-width="0.5"/>
    <!-- disc inner rings -->
    <circle cx="11" cy="22" r="3.4" fill="none" stroke="#7A8089" stroke-width="0.6"/>
    <circle cx="11" cy="22" r="1.4" fill="#3A3E45"/>
    <!-- protective guard arc over top half of disc -->
    <path d="M3.6 22 A7.4 7.4 0 0 1 18.4 22 L16.4 22 A5.4 5.4 0 0 0 5.6 22 Z" fill="url(#ag_guard)"/>
    <!-- side handle on top of head -->
    <rect x="9.4" y="6.4" width="3.2" height="5.2" rx="1.5" fill="url(#ag_body)"/>
    <!-- power switch detail -->
    <rect x="14.5" y="13.4" width="4" height="1.6" rx="0.8" fill="#9c5f08"/>
  </g>
  <!-- gloss highlight on body -->
  <rect x="11.5" y="12.6" width="10.5" height="1.5" rx="0.7" fill="#FFFFFF" fill-opacity="0.30"/>
</svg>
