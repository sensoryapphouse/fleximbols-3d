<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
<defs>
 <radialGradient id="ch_skin" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#ffe0b0"/>
 <stop offset="100%" stop-color="#d4804a"/>
 </radialGradient>
 <radialGradient id="ch_blade" cx="30%" cy="30%" r="70%">
 <stop offset="0%" stop-color="#e8eef5"/>
 <stop offset="50%" stop-color="#b8c8d8"/>
 <stop offset="100%" stop-color="#7a8a99"/>
 </radialGradient>
 <linearGradient id="ch_handle" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c8893a"/>
 <stop offset="100%" stop-color="#7a4a1a"/>
 </linearGradient>
 <linearGradient id="ch_board" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d4a858"/>
 <stop offset="100%" stop-color="#9a6828"/>
 </linearGradient>
 <radialGradient id="ch_carrot" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#ff9944"/>
 <stop offset="70%" stop-color="#ff6600"/>
 <stop offset="100%" stop-color="#cc3300"/>
 </radialGradient>
</defs>
<!-- ground shadow -->
<!-- CHOPPING BOARD -->
<rect x="3" y="24" width="26" height="5" rx="1" fill="url(#ch_board)" filter="url(#ch_sh)"/>
<!-- Board grain lines -->
<line x1="3" y1="25.5" x2="29" y2="25.5" stroke="#b88030" stroke-width="0.3" stroke-opacity="0.5"/>
<line x1="3" y1="27" x2="29" y2="27" stroke="#b88030" stroke-width="0.3" stroke-opacity="0.45"/>
<!-- Board rim -->
<rect x="3" y="24" width="26" height="0.8" rx="0.4" fill="#e8c070" fill-opacity="0.6"/>
<!-- ALREADY-CHOPPED PIECES (left side of board — rough chunks) -->
<!-- Carrot chunk 1 -->
<ellipse cx="5.5" cy="25.5" rx="1.8" ry="1.2" fill="url(#ch_carrot)" filter="url(#ch_sh)"/>
<ellipse cx="5.5" cy="25.5" rx="1.4" ry="0.8" fill="#ff8833" fill-opacity="0.6"/>
<!-- Carrot chunk 2 -->
<ellipse cx="8.5" cy="26.5" rx="1.6" ry="1" fill="url(#ch_carrot)" filter="url(#ch_sh)"/>
<!-- Carrot chunk 3 -->
<ellipse cx="7" cy="24.8" rx="1.2" ry="0.9" fill="#ff7722" fill-opacity="0.9"/>
<!-- Carrot chunk 4 -->
<ellipse cx="10.5" cy="25.3" rx="1.3" ry="1" fill="url(#ch_carrot)" filter="url(#ch_sh)"/>
<!-- Small piece -->
<ellipse cx="9.5" cy="27.2" rx="0.8" ry="0.7" fill="#ff8833" fill-opacity="0.8"/>
<!-- Cross-cut pattern on chunk tops -->
<line x1="4.5" y1="25" x2="6.5" y2="25" stroke="#cc5500" stroke-width="0.4" stroke-opacity="0.7"/>
<line x1="7.5" y1="26.2" x2="9.5" y2="26.2" stroke="#cc5500" stroke-width="0.4" stroke-opacity="0.65"/>
<!-- WHOLE CARROT being chopped (right side) -->
<!-- Carrot body -->
<ellipse cx="18" cy="25.5" rx="5.5" ry="1.2" fill="url(#ch_carrot)"/>
<!-- Carrot highlight -->
<path d="M14,25 Q18,24.2 22,25" stroke="#ffaa55" stroke-width="0.5" fill="none" stroke-opacity="0.6"/>
<!-- Carrot leaves/top -->
<path d="M22,24.8 Q24,23 23.5,22" stroke="#44aa22" stroke-width="0.8" fill="none" stroke-linecap="round"/>
<path d="M22,24.5 Q25,22.5 24.5,21" stroke="#44aa22" stroke-width="0.7" fill="none" stroke-linecap="round"/>
<path d="M22,25" stroke="#44aa22" stroke-width="0.7"/>
<!-- STABILISING HAND (left, fingers curled safely) -->
<path d="M13.5,23 Q13,24.5 13,25.5" stroke="url(#ch_skin)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#ch_sh)"/>
<circle cx="13" cy="25.5" r="1.3" fill="url(#ch_skin)" filter="url(#ch_sh)"/>
<!-- Fingers curled (knuckle forward) -->
<ellipse cx="13.8" cy="24.8" rx="0.9" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.9"/>
<ellipse cx="14.3" cy="25.7" rx="0.9" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.85"/>
<ellipse cx="13.8" cy="26.5" rx="0.8" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.8"/>
<ellipse cx="12.8" cy="26.8" rx="0.8" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.8"/>
<!-- KNIFE (blade + handle, downward chopping motion) -->
<!-- Blade (large kitchen knife) -->
<path d="M16,10 L22,10 L22,24 L16,23 Z" fill="url(#ch_blade)" filter="url(#ch_sh)"/>
<!-- Blade bevel edge -->
<path d="M22,10 L22,24" stroke="#ddeeff" stroke-width="0.5" fill="none" stroke-opacity="0.6"/>
<!-- Blade bottom (cutting edge) -->
<path d="M16,23 L22,24" stroke="#ccd8e8" stroke-width="0.4" fill="none"/>
<!-- Blade shine -->
<path d="M17,11 L19,11 L19,22" stroke="#fff" stroke-width="0.4" fill="none" stroke-opacity="0.4"/>
<!-- Handle -->
<rect x="15.5" y="7" width="7" height="3.5" rx="1" fill="url(#ch_handle)" filter="url(#ch_sh)"/>
<!-- Handle rivets -->
<circle cx="17" cy="8.5" r="0.4" fill="#c8893a" fill-opacity="0.7"/>
<circle cx="19" cy="8.5" r="0.4" fill="#c8893a" fill-opacity="0.7"/>
<circle cx="21" cy="8.5" r="0.4" fill="#c8893a" fill-opacity="0.7"/>
<!-- Handle shine -->
<rect x="16" y="7.5" width="5" height="0.7" rx="0.3" fill="#e8a850" fill-opacity="0.4"/>
<!-- HAND gripping knife handle (from above, power grip) -->
<ellipse cx="19" cy="8" rx="3.5" ry="2.5" fill="url(#ch_skin)" filter="url(#ch_sh)"/>
<!-- Fingers wrapped around handle -->
<ellipse cx="16.5" cy="7" rx="1.2" ry="0.6" fill="url(#ch_skin)" fill-opacity="0.9"/>
<ellipse cx="22" cy="7.2" rx="1" ry="0.6" fill="url(#ch_skin)" fill-opacity="0.85"/>
<ellipse cx="22.5" cy="8.8" rx="0.9" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.85"/>
<ellipse cx="22.5" cy="10" rx="0.9" ry="0.5" fill="url(#ch_skin)" fill-opacity="0.8"/>
<!-- DOWNWARD MOTION LINES beside knife -->
<line x1="23.5" y1="10" x2="23.5" y2="20" stroke="#ff8833" stroke-width="0.6" stroke-opacity="0.7"/>
<polygon points="23.5,20 22.5,17.5 24.5,17.5" fill="#ff8833" fill-opacity="0.7"/>
<line x1="24.5" y1="11" x2="24.5" y2="19" stroke="#ffcc55" stroke-width="0.4" stroke-opacity="0.55"/>
</svg>
