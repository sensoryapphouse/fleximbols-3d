 <radialGradient id="calm_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FFFACC"/>
 <stop offset="60%" stop-color="#FFE066"/>
 <stop offset="100%" stop-color="#DDAA33"/>
