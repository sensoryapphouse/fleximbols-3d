 <radialGradient id="pot_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#8899BB"/>
 <stop offset="60%" stop-color="#4455AA"/>
 <stop offset="100%" stop-color="#223366"/>
 </radialGradient>
 <!-- Oven warm grey -->
 <radialGradient id="oven_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#CCBBAA"/>
 <stop offset="60%" stop-color="#997766"/>
 <stop offset="100%" stop-color="#664433"/>
 </radialGradient>
 <!-- Yarn pink -->
 <radialGradient id="yarn_grad" cx="35%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFAACC"/>
 <stop offset="60%" stop-color="#DD4499"/>
 <stop offset="100%" stop-color="#881155"/>
 </radialGradient>
 <!-- Grill grey -->
 <radialGradient id="grill_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#999999"/>
 <stop offset="60%" stop-color="#555555"/>
 <stop offset="100%" stop-color="#222222"/>
 </radialGradient>
 <!-- Melt orange -->
 <radialGradient id="melt_grad" cx="40%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#FFE566"/>
 <stop offset="60%" stop-color="#FF9922"/>
 <stop offset="100%" stop-color="#CC5500"/>
 </radialGradient>
 <!-- Container warm -->
 <radialGradient id="container_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#FFCC88"/>
 <stop offset="60%" stop-color="#DD8833"/>
 <stop offset="100%" stop-color="#AA5500"/>
 </radialGradient>

</defs>

 <!-- Microwave body -->
 <rect x="2" y="6" width="28" height="22" rx="3" fill="#BBBBBB"/>
 <rect x="2" y="6" width="28" height="22" rx="3" fill="url(#tool_grad)" opacity="0.3"/>
 <!-- Door window -->
 <rect x="4" y="8" width="18" height="18" rx="2" fill="#222222"/>
 <rect x="4" y="8" width="18" height="18" rx="2" fill="#FFFFFF" opacity="0.08"/>
 <!-- Food rotating inside -->
 <circle cx="13" cy="17" r="5" fill="#CC7744" opacity="0.8"/>
 <circle cx="13" cy="17" r="3" fill="#FFAA66" opacity="0.7"/>
 <!-- Rotating ring -->
 <circle cx="13" cy="17" r="6.5" stroke="#444" stroke-width="0.5" fill="none" opacity="0.5"/>
 <!-- Control panel -->
 <rect x="23" y="8" width="6" height="18" rx="1" fill="#999999"/>
 <!-- Buttons -->
 <circle cx="26" cy="12" r="1.5" fill="#CCDDEE"/>
 <circle cx="26" cy="17" r="1.5" fill="#66CCAA"/>
 <circle cx="26" cy="22" r="1.5" fill="#FFAA44"/>
 <!-- Microwave emission lines -->
 <path d="M9 13 Q11 15 9 17" stroke="#AAFFEE" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>
 <path d="M17 13 Q15 15 17 17" stroke="#AAFFEE" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>

</svg>