 <!-- Green garment -->
 <radialGradient id="garment_grad" cx="30%" cy="25%" r="65%">
 <stop offset="0%" stop-color="#A0E080"/>
 <stop offset="60%" stop-color="#44AA44"/>
 <stop offset="100%" stop-color="#226622"/>
 </radialGradient>
 <!-- Angry red face -->
 <radialGradient id="angry_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FF9966"/>
 <stop offset="60%" stop-color="#FF5522"/>
 <stop offset="100%" stop-color="#CC2200"/>
 </radialGradient>
 <!-- Furious deep red -->
 <radialGradient id="furious_face" cx="50%" cy="40%" r="55%">
 <stop offset="0%" stop-color="#FF6644"/>
 <stop offset="60%" stop-color="#DD2200"/>
 <stop offset="100%" stop-color="#881100"/>
 </radialGradient>
