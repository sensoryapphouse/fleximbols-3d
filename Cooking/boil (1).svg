<defs>
 <radialGradient id="bl_pot" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#7a9acc"/>
 <stop offset="60%" stop-color="#3a5a9a"/>
 <stop offset="100%" stop-color="#1a2a60"/>
 </radialGradient>
 <radialGradient id="bl_water" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#aaddff"/>
 <stop offset="60%" stop-color="#44aadd"/>
 <stop offset="100%" stop-color="#1166aa"/>
 </radialGradient>
 <radialGradient id="bl_fire" cx="50%" cy="80%" r="60%">
 <stop offset="0%" stop-color="#ffe060"/>
 <stop offset="40%" stop-color="#ff8800"/>
 <stop offset="100%" stop-color="#cc2000"/>
 </radialGradient>
</defs>
<!-- ground shadow -->
<!-- STOVE burner ring -->
<!-- FLAMES beneath pot -->
<path d="M10,28 Q11,25.5 12,28 Q12.5,25 13,28" stroke="url(#bl_fire)" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#bl_sh)"/>
<path d="M15,27.5 Q16,24.5 17,27.5 Q17.5,24 18,27.5" stroke="url(#bl_fire)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#bl_sh)"/>
<path d="M19,28 Q20,25.5 21,28 Q21.5,25 22,28" stroke="url(#bl_fire)" stroke-width="1.8" fill="none" stroke-linecap="round" filter="url(#bl_sh)"/>
<!-- POT body (open, cross-section style) -->
<path d="M7,19 L8.5,28.5 L23.5,28.5 L25,19 Z" fill="url(#bl_pot)" filter="url(#bl_sh)"/>
<!-- Pot rim top -->
<ellipse cx="16" cy="19" rx="9" ry="2.2" fill="#5577bb" filter="url(#bl_sh)"/>
<!-- Pot handles -->
<rect x="3.5" y="18.5" width="4" height="2.5" rx="1" fill="#334488" filter="url(#bl_sh)"/>
<rect x="24.5" y="18.5" width="4" height="2.5" rx="1" fill="#334488" filter="url(#bl_sh)"/>
<!-- Pot shine -->
<path d="M9,21 Q12,20 15,21" stroke="#aabbdd" stroke-width="0.6" fill="none" stroke-opacity="0.5"/>
<!-- BOILING WATER inside pot (open top) -->
<ellipse cx="16" cy="19" rx="7.5" ry="1.8" fill="url(#bl_water)" fill-opacity="0.9"/>
<!-- Water surface turbulence ripples -->
<ellipse cx="14" cy="19" rx="2.5" ry="0.6" fill="#88ddff" fill-opacity="0.45"/>
<ellipse cx="19" cy="19.2" rx="2" ry="0.5" fill="#88ddff" fill-opacity="0.4"/>
<!-- BUBBLES rising inside pot -->
<!-- Large bubbles at surface -->
<circle cx="12" cy="18" r="1.4" fill="#fff" fill-opacity="0.7"/>
<circle cx="16" cy="17" r="1.7" fill="#fff" fill-opacity="0.65"/>
<circle cx="20" cy="18.2" r="1.2" fill="#fff" fill-opacity="0.7"/>
<!-- Smaller mid-bubbles -->
<circle cx="10.5" cy="20" r="0.8" fill="#bbddff" fill-opacity="0.6"/>
<circle cx="14" cy="21" r="0.7" fill="#bbddff" fill-opacity="0.55"/>
<circle cx="18.5" cy="21.5" r="0.6" fill="#bbddff" fill-opacity="0.55"/>
<circle cx="22" cy="20.5" r="0.7" fill="#bbddff" fill-opacity="0.5"/>
<!-- Rising trail bubbles -->
<circle cx="16" cy="23" r="0.5" fill="#cceeFF" fill-opacity="0.55"/>
<circle cx="16.3" cy="25" r="0.4" fill="#cceeFF" fill-opacity="0.45"/>
<circle cx="11.5" cy="24" r="0.45" fill="#cceeFF" fill-opacity="0.5"/>
<!-- Wispy steam from surface -->
<path d="M12,17 Q11,14 12,11" stroke="#d8eeff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-opacity="0.65"/>
<path d="M16,16 Q15,13 16,10" stroke="#d8eeff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
<path d="M20,17 Q21,14 20,11" stroke="#d8eeff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
