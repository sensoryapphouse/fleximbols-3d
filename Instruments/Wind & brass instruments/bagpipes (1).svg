<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Bag gradient: green/tartan base -->
 <radialGradient id="bagGrad" cx="45%" cy="55%" r="50%">
 <stop offset="0%" stop-color="#6DB36D"/>
 <stop offset="100%" stop-color="#2A5C2A"/>
 </radialGradient>
 <!-- Drone pipe gradient -->
 <linearGradient id="droneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#C99878"/>
 <stop offset="100%" stop-color="#8B5C3A"/>
 </linearGradient>
 <!-- Chanter gradient -->
 <linearGradient id="chanterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#8B5C3A"/>
 <stop offset="100%" stop-color="#5A3A1A"/>
 </linearGradient>
 <!-- Tartan red lines -->
 <pattern id="tartan" width="4" height="4" patternUnits="userSpaceOnUse">
 <rect width="4" height="4" fill="none"/>
 <line x1="0" y1="2" x2="4" y2="2" stroke="#CC2222" stroke-width="1" stroke-opacity="0.6"/>
 <line x1="2" y1="0" x2="2" y2="4" stroke="#CC2222" stroke-width="1" stroke-opacity="0.6"/>
 </pattern>
 <!-- Stock/joint gradient -->
 <linearGradient id="stockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#A07848"/>
 <stop offset="100%" stop-color="#6B4828"/>
 </linearGradient>
 <!-- Cap/ferrule gradient -->
 <linearGradient id="ferruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#E8E0D0"/>
 <stop offset="100%" stop-color="#B0A890"/>
 </linearGradient>
 </defs>

 <!-- BAG: large rounded body center-left -->
 <ellipse cx="13" cy="20" rx="10" ry="8" fill="url(#bagGrad)"/>
 <ellipse cx="13" cy="20" rx="10" ry="8" fill="url(#tartan)" fill-opacity="0.4"/>
 <!-- Bag highlight -->
 <ellipse cx="10" cy="17" rx="4" ry="3" fill="#8BC88B" fill-opacity="0.3"/>

 <!-- STOCK (bag connector, top of bag) -->
 <rect x="11" y="12" width="4" height="4" rx="1" fill="url(#stockGrad)"/>

 <!-- DRONE PIPE 1 (left, tallest) -->
 <rect x="8" y="2" width="2.5" height="11" rx="1" fill="url(#droneGrad)"/>
 <!-- ferrule ring on drone 1 -->
 <rect x="7.8" y="5" width="2.9" height="1.2" rx="0.5" fill="url(#ferruleGrad)"/>
 <!-- cap top drone 1 -->
 <ellipse cx="9.25" cy="2" rx="1.5" ry="0.8" fill="url(#ferruleGrad)"/>

 <!-- DRONE PIPE 2 (center) -->
 <rect x="12" y="1" width="2.5" height="12" rx="1" fill="url(#droneGrad)"/>
 <!-- ferrule ring on drone 2 -->
 <rect x="11.8" y="4" width="2.9" height="1.2" rx="0.5" fill="url(#ferruleGrad)"/>
 <!-- cap top drone 2 -->
 <ellipse cx="13.25" cy="1" rx="1.5" ry="0.8" fill="url(#ferruleGrad)"/>

 <!-- DRONE PIPE 3 (right) -->
 <rect x="16" y="2.5" width="2.5" height="10.5" rx="1" fill="url(#droneGrad)"/>
 <!-- ferrule ring on drone 3 -->
 <rect x="15.8" y="5.5" width="2.9" height="1.2" rx="0.5" fill="url(#ferruleGrad)"/>
 <!-- cap top drone 3 -->
 <ellipse cx="17.25" cy="2.5" rx="1.5" ry="0.8" fill="url(#ferruleGrad)"/>

 <!-- CHANTER: extends downward from bottom of bag -->
 <rect x="14.5" y="24" width="2" height="7" rx="0.8" fill="url(#chanterGrad)"/>
 <!-- chanter finger holes -->
 <circle cx="15.5" cy="26" r="0.35" fill="#3B2010" fill-opacity="0.8"/>
 <circle cx="15.5" cy="27.5" r="0.35" fill="#3B2010" fill-opacity="0.8"/>
 <circle cx="15.5" cy="29" r="0.35" fill="#3B2010" fill-opacity="0.8"/>
 <!-- chanter bell bottom -->
 <ellipse cx="15.5" cy="31" rx="1.2" ry="0.6" fill="url(#chanterGrad)"/>

 <!-- BLOWPIPE (mouthpiece extending right) -->
 <line x1="23" y1="18" x2="16" y2="21" stroke-width="1.8" stroke="url(#droneGrad)" stroke-linecap="round"/>
 <circle cx="23.5" cy="17.8" r="0.8" fill="url(#ferruleGrad)"/>
</svg>
