 <defs>
 <linearGradient id="amp-body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#3a3a3a"/>
 <stop offset="100%" stop-color="#111111"/>
 </linearGradient>
 <linearGradient id="amp-top" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#505050"/>
 <stop offset="100%" stop-color="#282828"/>
 </linearGradient>
 <radialGradient id="amp-grille" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#4a4a5a"/>
 <stop offset="100%" stop-color="#1a1a22"/>
 </radialGradient>
 <radialGradient id="amp-speaker" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#6a6a7a"/>
 <stop offset="100%" stop-color="#1a1a22"/>
 </radialGradient>
 <radialGradient id="amp-knob" cx="35%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#808080"/>
 <stop offset="100%" stop-color="#303030"/>
 </radialGradient>
 </defs>
 <!-- Amp body -->
 
 <!-- Top control panel -->
 <rect x="3" y="10" width="24" height="5" rx="2" fill="url(#amp-top)"/>
 <!-- Grille mesh area -->
 <rect x="5" y="16" width="18" height="11" rx="1.5" fill="url(#amp-grille)"/>
 <!-- Speaker cone rings -->
 <circle cx="14" cy="21.5" r="5" fill="none" stroke="#3a3a4a" stroke-width="0.6"/>
 <circle cx="14" cy="21.5" r="3.5" fill="none" stroke="#4a4a5a" stroke-width="0.5"/>
 <circle cx="14" cy="21.5" r="2" fill="none" stroke="#5a5a6a" stroke-width="0.4"/>
 <circle cx="14" cy="21.5" r="0.8" fill="url(#amp-speaker)"/>
 <!-- Grille dot pattern (mesh suggestion) -->
 <rect x="6" y="17" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <rect x="6" y="18.5" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <rect x="6" y="20" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <rect x="6" y="21.5" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <rect x="6" y="23" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <rect x="6" y="24.5" width="16" height="0.4" fill="#5a5a6a" fill-opacity="0.4"/>
 <!-- Knobs on top panel -->
 <circle cx="7" cy="12.5" r="1.5" fill="url(#amp-knob)"/>
 <circle cx="7" cy="12.5" r="0.4" fill="#d0d0d0"/>
 <circle cx="11" cy="12.5" r="1.5" fill="url(#amp-knob)"/>
 <circle cx="11" cy="12.5" r="0.4" fill="#d0d0d0"/>
 <circle cx="15" cy="12.5" r="1.5" fill="url(#amp-knob)"/>
 <circle cx="15" cy="12.5" r="0.4" fill="#d0d0d0"/>
 <circle cx="19" cy="12.5" r="1.5" fill="url(#amp-knob)"/>
 <circle cx="19" cy="12.5" r="0.4" fill="#d0d0d0"/>
 <!-- Power LED -->
 <circle cx="24" cy="12.5" r="1" fill="#ff4040" fill-opacity="0.9"/>
 <circle cx="23.7" cy="12.2" r="0.35" fill="white" fill-opacity="0.5"/>
 <!-- Jack cable plug -->
 <line x1="27" y1="20" x2="31" y2="22" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
 <circle cx="27" cy="20" r="1" fill="#707070"/>
 <line x1="30.5" y1="21.8" x2="31" y2="22" stroke="#c0a040" stroke-width="0.8" stroke-linecap="round"/>
