<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Main gourd body - warm wood -->
 <radialGradient id="gourdGrad" cx="38%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#D4A858"/>
 <stop offset="55%" stop-color="#A0722A"/>
 <stop offset="100%" stop-color="#5C3A10"/>
 </radialGradient>
 <!-- Upper small gourd -->
 <radialGradient id="smallGourdGrad" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#C49040"/>
 <stop offset="100%" stop-color="#7A5018"/>
 </radialGradient>
 <!-- Neck gradient -->
 <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#D4B896"/>
 <stop offset="50%" stop-color="#C4956A"/>
 <stop offset="100%" stop-color="#8B6950"/>
 </linearGradient>
 <!-- Tuning pegs -->
 <radialGradient id="pegGrad" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#A07800"/>
 </radialGradient>
 </defs>
 <!-- SITAR - oriented vertically, bottom gourd at bottom, neck going up -->
 <!-- MAIN GOURD BODY (large, bottom) - KEY GESTURE: double-gourd shape -->
 
 <!-- Gourd highlight -->
 <ellipse cx="13.5" cy="22" rx="3" ry="2.2" fill="#FFFFFF" fill-opacity="0.32"/>
 <!-- Gourd flat face/soundboard detail -->
 <ellipse cx="16" cy="25" rx="6" ry="5.5" fill="none" stroke="#7A5018" stroke-width="0.4" stroke-opacity="0.6"/>
 <!-- Sound hole -->
 <circle cx="16" cy="25" r="1.5" fill="#3D1F00" fill-opacity="0.8"/>
 <circle cx="16" cy="25" r="1" fill="#5C3010" fill-opacity="0.6"/>
 <!-- NECK (very long, broad, fretted) -->
 
 <!-- Neck highlight -->
 <rect x="13.8" y="7.5" width="1.2" height="14" rx="0.6" fill="#FFFFFF" fill-opacity="0.28"/>
 <!-- FRETS on neck (mandatory visual) -->
 <line x1="13.5" y1="9.5" x2="18.5" y2="9.5" stroke="#8B6950" stroke-width="0.6"/>
 <line x1="13.5" y1="11.5" x2="18.5" y2="11.5" stroke="#8B6950" stroke-width="0.5"/>
 <line x1="13.5" y1="13.5" x2="18.5" y2="13.5" stroke="#8B6950" stroke-width="0.5"/>
 <line x1="13.5" y1="15.5" x2="18.5" y2="15.5" stroke="#8B6950" stroke-width="0.5"/>
 <line x1="13.5" y1="17.5" x2="18.5" y2="17.5" stroke="#8B6950" stroke-width="0.5"/>
 <line x1="13.5" y1="19.5" x2="18.5" y2="19.5" stroke="#8B6950" stroke-width="0.5"/>
 <line x1="13.5" y1="21.5" x2="18.5" y2="21.5" stroke="#8B6950" stroke-width="0.5"/>
 <!-- Strings on neck (3 visible) -->
 <line x1="14.5" y1="7.5" x2="14.5" y2="22" stroke="#E0C060" stroke-width="0.35" opacity="0.7"/>
 <line x1="16" y1="7.5" x2="16" y2="22" stroke="#E0C060" stroke-width="0.35" opacity="0.7"/>
 <line x1="17.5" y1="7.5" x2="17.5" y2="22" stroke="#E0C060" stroke-width="0.35" opacity="0.65"/>
 <!-- SECOND SMALL GOURD near top - KEY GESTURE: double-gourd -->
 
 <!-- Small gourd highlight -->
 <ellipse cx="14.2" cy="8.5" rx="1.8" ry="1.2" fill="#FFFFFF" fill-opacity="0.35"/>
 <!-- Small gourd striation -->
 <ellipse cx="16" cy="10" rx="3.8" ry="2.8" fill="none" stroke="#7A5018" stroke-width="0.35" stroke-opacity="0.5"/>
 <!-- TUNING PEGS along the side of neck - KEY GESTURE -->
 <!-- Left side pegs -->
 <rect x="11" y="12.5" width="2.5" height="1" rx="0.5" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="13" r="0.9" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="13" r="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
 <rect x="11" y="15" width="2.5" height="1" rx="0.5" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="15.5" r="0.9" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="15.5" r="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
 <rect x="11" y="17.5" width="2.5" height="1" rx="0.5" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="18" r="0.9" fill="url(#pegGrad)"/>
 <circle cx="10.5" cy="18" r="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
 <!-- Right side pegs -->
 <rect x="18.5" y="12.5" width="2.5" height="1" rx="0.5" fill="url(#pegGrad)"/>
 <circle cx="21.5" cy="13" r="0.9" fill="url(#pegGrad)"/>
 <circle cx="21.5" cy="13" r="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
 <rect x="18.5" y="15" width="2.5" height="1" rx="0.5" fill="url(#pegGrad)"/>
 <circle cx="21.5" cy="15.5" r="0.9" fill="url(#pegGrad)"/>
 <circle cx="21.5" cy="15.5" r="0.5" fill="#FFFFFF" fill-opacity="0.4"/>
 <!-- Headstock (top of neck, peg box) -->
 <rect x="13.5" y="5" width="5" height="2.5" rx="1" fill="url(#neckGrad)"/>
 <ellipse cx="16" cy="5" rx="2.5" ry="1.2" fill="url(#neckGrad)"/>
</svg>