 <defs>
 <linearGradient id="stampGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#F8BBD9"/>
 <stop offset="100%" stop-color="#EC407A"/>
 </linearGradient>
 <linearGradient id="innerGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FFEEFF"/>
 <stop offset="100%" stop-color="#F8BBD9"/>
 </linearGradient>
 <linearGradient id="flowerGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#FF80AB"/>
 <stop offset="100%" stop-color="#E91E63"/>
 </linearGradient>
 <linearGradient id="denomGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7DBEFC"/>
 <stop offset="100%" stop-color="#1565C0"/>
 </linearGradient>
 </defs>
 <!-- Stamp outer rectangle with perforated edges -->
 <rect x="6" y="5" width="20" height="22" rx="0.5" fill="url(#stampGrad)"/>
 <!-- Perforations (top) -->
 <circle cx="8" cy="5" r="1.2" fill="white"/>
 <circle cx="11" cy="5" r="1.2" fill="white"/>
 <circle cx="14" cy="5" r="1.2" fill="white"/>
 <circle cx="17" cy="5" r="1.2" fill="white"/>
 <circle cx="20" cy="5" r="1.2" fill="white"/>
 <circle cx="23" cy="5" r="1.2" fill="white"/>
 <!-- Perforations (bottom) -->
 <circle cx="8" cy="27" r="1.2" fill="white"/>
 <circle cx="11" cy="27" r="1.2" fill="white"/>
 <circle cx="14" cy="27" r="1.2" fill="white"/>
 <circle cx="17" cy="27" r="1.2" fill="white"/>
 <circle cx="20" cy="27" r="1.2" fill="white"/>
 <circle cx="23" cy="27" r="1.2" fill="white"/>
 <!-- Perforations (left) -->
 <circle cx="6" cy="8" r="1.2" fill="white"/>
 <circle cx="6" cy="12" r="1.2" fill="white"/>
 <circle cx="6" cy="16" r="1.2" fill="white"/>
 <circle cx="6" cy="20" r="1.2" fill="white"/>
 <circle cx="6" cy="24" r="1.2" fill="white"/>
 <!-- Perforations (right) -->
 <circle cx="26" cy="8" r="1.2" fill="white"/>
 <circle cx="26" cy="12" r="1.2" fill="white"/>
 <circle cx="26" cy="16" r="1.2" fill="white"/>
 <circle cx="26" cy="20" r="1.2" fill="white"/>
 <circle cx="26" cy="24" r="1.2" fill="white"/>
 <!-- Inner white border -->
 <rect x="8" y="7" width="16" height="15" rx="0.5" fill="url(#innerGrad)"/>
 <!-- Flower in center -->
 <circle cx="16" cy="14.5" r="3.5" fill="url(#flowerGrad)"/>
 <circle cx="16" cy="11" r="1.5" fill="url(#flowerGrad)" opacity="0.7"/>
 <circle cx="16" cy="18" r="1.5" fill="url(#flowerGrad)" opacity="0.7"/>
 <circle cx="12.5" cy="14.5" r="1.5" fill="url(#flowerGrad)" opacity="0.7"/>
 <circle cx="19.5" cy="14.5" r="1.5" fill="url(#flowerGrad)" opacity="0.7"/>
 <circle cx="16" cy="14.5" r="2" fill="#FFCDD2"/>
 <!-- Denomination in bottom-right -->
 <rect x="19" y="20" width="5" height="3" rx="0.5" fill="url(#denomGrad)"/>
 <line x1="19.5" y1="21.5" x2="23.5" y2="21.5" stroke="#FFFFFF" stroke-width="0.6"/>
</svg>
