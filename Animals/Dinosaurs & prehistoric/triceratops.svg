<circle cx="5.5" cy="17" r="0.2" fill="#1A1F2C"/>
<path d="M5 18 Q 7 19 9 18" stroke="#1A1F2C" stroke-width="0.3" fill="none" stroke-linecap="round"/>
<!-- back ridge bumps -->
<circle cx="15" cy="16" r="0.4" fill="#3A5A1A"/>
<circle cx="20" cy="15.5" r="0.4" fill="#3A5A1A"/>
<circle cx="25" cy="16.5" r="0.4" fill="#3A5A1A"/>
