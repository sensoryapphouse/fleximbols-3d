<defs>
<radialGradient id="body" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#A8C870"/><stop offset="100%" stop-color="#3A5A1A"/></radialGradient>
<radialGradient id="frill" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#C8A878"/><stop offset="100%" stop-color="#5A3A18"/></radialGradient>
<radialGradient id="horn" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#5A4A30"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- body -->
<ellipse cx="18" cy="20" rx="11" ry="6" fill="url(#body)"/>
<!-- legs -->
<rect x="11" y="22" width="2.5" height="6" rx="0.4" fill="url(#body)"/>
<rect x="15" y="24" width="2.5" height="4" rx="0.4" fill="url(#body)"/>
<rect x="20" y="24" width="2.5" height="4" rx="0.4" fill="url(#body)"/>
<rect x="24" y="22" width="2.5" height="6" rx="0.4" fill="url(#body)"/>
<!-- toes -->
<ellipse cx="12.25" cy="28" rx="1.5" ry="0.4" fill="#3A2010"/>
<ellipse cx="16.25" cy="28" rx="1.5" ry="0.4" fill="#3A2010"/>
<ellipse cx="21.25" cy="28" rx="1.5" ry="0.4" fill="#3A2010"/>
<ellipse cx="25.25" cy="28" rx="1.5" ry="0.4" fill="#3A2010"/>
<!-- tail -->
<path d="M28 19 Q 31 18 31 16 Q 30 14 28 15 Q 27 17 28 19 Z" fill="url(#body)"/>
<!-- neck frill (large fan behind head) -->
<path d="M5 13 Q 2 9 4 6 Q 8 4 12 6 Q 15 8 14 13 Q 14 17 11 18 Q 6 17 5 13 Z" fill="url(#frill)"/>
