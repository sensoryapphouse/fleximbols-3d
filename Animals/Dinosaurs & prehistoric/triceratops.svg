<circle cx="4" cy="9" r="0.7" fill="#3A2010"/>
<circle cx="4.5" cy="13" r="0.6" fill="#3A2010"/>
<circle cx="6" cy="6" r="0.6" fill="#3A2010"/>
<circle cx="9" cy="4.5" r="0.6" fill="#3A2010"/>
<circle cx="12" cy="5.5" r="0.6" fill="#3A2010"/>
<circle cx="14" cy="9" r="0.6" fill="#3A2010"/>
<circle cx="13.5" cy="13" r="0.7" fill="#3A2010"/>
