<path d="M6 13 Q 6 18 11 19 L 16 18 Q 17 16 16 13 Q 15 11 12 11 Q 8 11 6 13 Z" fill="url(#body)"/>
<ellipse cx="8" cy="13" rx="1.5" ry="1" fill="url(#hi)"/>
