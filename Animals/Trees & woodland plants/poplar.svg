 <defs>
 <linearGradient id="pp-trunk" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#a08848"/>
 <stop offset="100%" stop-color="#6a5820"/>
 </linearGradient>
 <radialGradient id="pp-canopy" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#50c030"/>
 <stop offset="100%" stop-color="#206010"/>
 </radialGradient>
 </defs>
 <!-- tall narrow trunk -->
 <rect x="14.5" y="18" width="3" height="12" rx="1" fill="url(#pp-trunk)"/>
 <!-- bark lines -->
 <line x1="15.5" y1="19" x2="15.5" y2="29" stroke="#6a5820" stroke-width="0.4" stroke-opacity="0.4"/>
 <!-- columnar canopy - very narrow, tall, pointed top -->
 <ellipse cx="16" cy="12" rx="5" ry="14" fill="url(#pp-canopy)"/>
 <!-- tight foliage texture -->
 <ellipse cx="16" cy="6" rx="3.5" ry="5" fill="#60d040" fill-opacity="0.5"/>
 <ellipse cx="13" cy="14" rx="2.5" ry="5" fill="#40a020" fill-opacity="0.5"/>
 <ellipse cx="19" cy="14" rx="2.5" ry="5" fill="#40a020" fill-opacity="0.5"/>
 <!-- pointed tip highlight -->
 <ellipse cx="15" cy="4" rx="1.5" ry="3" fill="white" fill-opacity="0.15"/>
</svg>
