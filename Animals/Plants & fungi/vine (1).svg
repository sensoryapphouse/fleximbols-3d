 <defs>
 <linearGradient id="vn-trellis" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c09060"/>
 <stop offset="100%" stop-color="#7a5020"/>
 </linearGradient>
 <radialGradient id="vn-leaf" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#60c040"/>
 <stop offset="100%" stop-color="#208010"/>
 </radialGradient>
 </defs>
 <!-- trellis vertical posts -->
 <rect x="6" y="2" width="1.5" height="28" rx="0.5" fill="url(#vn-trellis)"/>
 <rect x="14" y="2" width="1.5" height="28" rx="0.5" fill="url(#vn-trellis)"/>
 <rect x="22" y="2" width="1.5" height="28" rx="0.5" fill="url(#vn-trellis)"/>
 <!-- trellis horizontal bars -->
 <rect x="5" y="6" width="24" height="1.2" rx="0.5" fill="url(#vn-trellis)"/>
 <rect x="5" y="14" width="24" height="1.2" rx="0.5" fill="url(#vn-trellis)"/>
 <rect x="5" y="22" width="24" height="1.2" rx="0.5" fill="url(#vn-trellis)"/>
 <!-- vine stem (winding) -->
 <path d="M7 2 Q10 6 7 10 Q10 14 14 14 Q18 14 22 10 Q26 6 22 2" stroke="#508020" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <path d="M14 14 Q10 18 14 22 Q18 26 22 22 Q26 18 22 14" stroke="#508020" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <!-- tendrils (spirals) -->
 <path d="M10 8 Q13 7 12 10" stroke="#70a030" stroke-width="0.7" fill="none"/>
 <path d="M20 16 Q23 15 22 18" stroke="#70a030" stroke-width="0.7" fill="none"/>
 <!-- leaves -->
 <ellipse cx="8" cy="5" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(-20 8 5)"/>
 <ellipse cx="15" cy="8" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(10 15 8)"/>
 <ellipse cx="21" cy="12" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(-15 21 12)"/>
 <ellipse cx="12" cy="17" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(20 12 17)"/>
 <ellipse cx="20" cy="20" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(-10 20 20)"/>
 <ellipse cx="15" cy="25" rx="2.5" ry="1.8" fill="url(#vn-leaf)" transform="rotate(15 15 25)"/>
 <!-- leaf highlights -->
 <ellipse cx="8" cy="4.5" rx="1" ry="0.6" fill="white" fill-opacity="0.2" transform="rotate(-20 8 5)"/>
</svg>
