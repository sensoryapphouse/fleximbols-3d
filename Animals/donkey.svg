<defs>
<linearGradient id="dk_body" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#b9bdc2"/>
<stop offset="60%" stop-color="#989da3"/>
<stop offset="100%" stop-color="#777c82"/>
</linearGradient>
<linearGradient id="dk_leg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#9a9fa5"/>
<stop offset="100%" stop-color="#6c7177"/>
</linearGradient>
<radialGradient id="dk_muzzle" cx="45%" cy="40%" r="65%">
<stop offset="0%" stop-color="#dcdfe3"/>
<stop offset="100%" stop-color="#aeb3b9"/>
</radialGradient>
<filter id="dk_shd" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="0.6" stdDeviation="0.5" flood-color="#000" flood-opacity="0.2"/></filter>
</defs>
<!-- ground shadow -->
<ellipse cx="16" cy="27.5" rx="11" ry="1.4" fill="#000" opacity="0.12"/>
<!-- Back legs -->
<rect x="20.5" y="19" width="2.6" height="8.4" rx="1.1" fill="url(#dk_leg)" stroke="#5a5f64" stroke-width="0.4"/>
<rect x="24" y="19" width="2.6" height="8.4" rx="1.1" fill="url(#dk_leg)" stroke="#5a5f64" stroke-width="0.4"/>
<!-- hooves back -->
<rect x="20.4" y="26.6" width="2.8" height="1.4" rx="0.5" fill="#3a3f44"/>
<rect x="23.9" y="26.6" width="2.8" height="1.4" rx="0.5" fill="#3a3f44"/>
<!-- Body -->
<g filter="url(#dk_shd)">
<ellipse cx="17.5" cy="16" rx="9" ry="5.6" fill="url(#dk_body)" stroke="#5e6369" stroke-width="0.6"/>
</g>
<!-- Front legs -->
<rect x="9.5" y="18.5" width="2.6" height="9" rx="1.1" fill="url(#dk_leg)" stroke="#5a5f64" stroke-width="0.4"/>
<rect x="13" y="19" width="2.6" height="8.4" rx="1.1" fill="url(#dk_leg)" stroke="#5a5f64" stroke-width="0.4"/>
<rect x="9.4" y="26.6" width="2.8" height="1.4" rx="0.5" fill="#3a3f44"/>
<rect x="12.9" y="26.6" width="2.8" height="1.4" rx="0.5" fill="#3a3f44"/>
<!-- Neck + head -->
<path d="M9.5 14.5 Q6 13 5 8.5 Q4.6 6 6.6 6 L8.8 6.4 Q9.2 10 12 12 Z" fill="url(#dk_body)" stroke="#5e6369" stroke-width="0.6"/>
<!-- Head -->
<path d="M3.4 5 Q3 9.5 5.4 11.4 Q8 12.6 9.2 10 Q9.6 6.4 8 4.6 Q5.6 3 3.4 5 Z" fill="url(#dk_body)" stroke="#5e6369" stroke-width="0.6"/>
<!-- Muzzle (lighter) -->
<ellipse cx="4.6" cy="9.6" rx="2.1" ry="1.9" fill="url(#dk_muzzle)" stroke="#8a8f95" stroke-width="0.4"/>
<!-- nostril + mouth -->
<ellipse cx="3.9" cy="9.4" rx="0.5" ry="0.7" fill="#4a4f54"/>
<path d="M3.2 10.8 Q4.4 11.4 5.4 10.8" stroke="#5a5f64" stroke-width="0.4" fill="none"/>
<!-- eye -->
<circle cx="6.6" cy="6.6" r="0.8" fill="#26292d"/>
<circle cx="6.35" cy="6.35" r="0.25" fill="#fff" opacity="0.8"/>
<!-- LONG donkey ears -->
<path d="M6 4.4 Q4.6 -0.5 6.4 -0.6 Q8.4 -0.4 7.8 4.4 Q6.9 3 6 4.4 Z" fill="url(#dk_body)" stroke="#5e6369" stroke-width="0.55"/>
<path d="M6.5 3.8 Q5.9 0.6 6.7 0.5" stroke="#5a5f64" stroke-width="0.4" fill="none" opacity="0.6"/>
<path d="M8.4 4.6 Q8.6 -0.3 10.4 0.2 Q12.2 0.9 10.6 5.2 Q9.6 3.4 8.4 4.6 Z" fill="url(#dk_body)" stroke="#5e6369" stroke-width="0.55"/>
<path d="M9.5 4.4 Q9.7 1.2 10.5 1.2" stroke="#5a5f64" stroke-width="0.4" fill="none" opacity="0.6"/>
<!-- Dark mane along neck -->
<path d="M8.6 5.8 Q10.4 8 12.4 11.6 Q11 11.2 10.6 12.2 Q9 9.4 7.6 6.6 Z" fill="#3a3530"/>
<!-- Tail with dark tuft -->
<path d="M26.3 14 Q29 15 28.6 19" fill="none" stroke="#8a8f95" stroke-width="1.4" stroke-linecap="round"/>
<path d="M28.6 18.5 Q30 20 28.4 22 Q27.2 20 28.6 18.5 Z" fill="#3a3530"/>
