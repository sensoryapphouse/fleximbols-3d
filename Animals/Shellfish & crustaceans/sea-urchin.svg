 <defs>
 <radialGradient id="su-body" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#7e57c2"/>
 <stop offset="70%" stop-color="#4527a0"/>
 <stop offset="100%" stop-color="#1a237e"/>
 </radialGradient>
 <linearGradient id="su-spine" x1="0%" y1="100%" x2="0%" y2="0%">
 <stop offset="0%" stop-color="#7e57c2"/>
 <stop offset="100%" stop-color="#e1bee7"/>
 </linearGradient>
 <linearGradient id="su-spine2" x1="0%" y1="100%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#4527a0"/>
 <stop offset="100%" stop-color="#ce93d8"/>
 </linearGradient>
 </defs>
 <!-- Spines radiating outward (drawn first so body covers roots) -->
 <!-- Top spines -->
 <line x1="16" y1="13" x2="16" y2="3" stroke="url(#su-spine)" stroke-width="1.2" stroke-linecap="round"/>
 <line x1="16" y1="13" x2="21" y2="4" stroke="url(#su-spine)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="16" y1="13" x2="11" y2="4" stroke="url(#su-spine)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="16" y1="13" x2="25" y2="7" stroke="url(#su-spine)" stroke-width="1" stroke-linecap="round"/>
 <line x1="16" y1="13" x2="7" y2="7" stroke="url(#su-spine)" stroke-width="1" stroke-linecap="round"/>
 <!-- Right spines -->
 <line x1="19" y1="16" x2="29" y2="13" stroke="url(#su-spine2)" stroke-width="1.2" stroke-linecap="round"/>
 <line x1="19" y1="16" x2="29" y2="19" stroke="url(#su-spine2)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="18" y1="19" x2="27" y2="24" stroke="url(#su-spine2)" stroke-width="1" stroke-linecap="round"/>
 <!-- Left spines -->
 <line x1="13" y1="16" x2="3" y2="13" stroke="url(#su-spine2)" stroke-width="1.2" stroke-linecap="round"/>
 <line x1="13" y1="16" x2="3" y2="19" stroke="url(#su-spine2)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="14" y1="19" x2="5" y2="24" stroke="url(#su-spine2)" stroke-width="1" stroke-linecap="round"/>
 <!-- Bottom spines -->
 <line x1="16" y1="20" x2="16" y2="29" stroke="url(#su-spine)" stroke-width="1.2" stroke-linecap="round"/>
 <line x1="16" y1="20" x2="21" y2="28" stroke="url(#su-spine)" stroke-width="1.1" stroke-linecap="round"/>
 <line x1="16" y1="20" x2="11" y2="28" stroke="url(#su-spine)" stroke-width="1.1" stroke-linecap="round"/>
 <!-- Diagonal spines -->
 <line x1="19" y1="13" x2="26" y2="6" stroke="url(#su-spine)" stroke-width="0.9" stroke-linecap="round"/>
 <line x1="13" y1="13" x2="6" y2="6" stroke="url(#su-spine)" stroke-width="0.9" stroke-linecap="round"/>
 <line x1="19" y1="20" x2="26" y2="27" stroke="url(#su-spine)" stroke-width="0.9" stroke-linecap="round"/>
 <line x1="13" y1="20" x2="6" y2="27" stroke="url(#su-spine)" stroke-width="0.9" stroke-linecap="round"/>
 <!-- Round dark body (covers spine roots) -->
 
 <!-- Ambulacra pattern (5 rows of pores) -->
 <circle cx="16" cy="11" r="0.5" fill="#e1bee7" fill-opacity="0.6"/>
 <circle cx="20" cy="13.5" r="0.5" fill="#e1bee7" fill-opacity="0.6"/>
 <circle cx="19" cy="19.5" r="0.5" fill="#e1bee7" fill-opacity="0.6"/>
 <circle cx="13" cy="19.5" r="0.5" fill="#e1bee7" fill-opacity="0.6"/>
 <circle cx="12" cy="13.5" r="0.5" fill="#e1bee7" fill-opacity="0.6"/>
 <!-- Central highlight -->
 <circle cx="14" cy="14.5" r="2.5" fill="#fff" fill-opacity="0.15"/>
 <!-- Oral surface (bottom light spot) -->
 <circle cx="16" cy="18" r="1.5" fill="#1a237e" fill-opacity="0.5"/>
 <circle cx="16" cy="18" r="0.7" fill="#7e57c2" fill-opacity="0.7"/>
</svg>
