 <defs>
 <linearGradient id="rt-soil" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#a07040"/>
 <stop offset="100%" stop-color="#6a4010"/>
 </linearGradient>
 <linearGradient id="rt-sky" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#b0d0f0"/>
 <stop offset="100%" stop-color="#d0e8f8"/>
 </linearGradient>
 <linearGradient id="rt-root" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c09060"/>
 <stop offset="100%" stop-color="#7a5020"/>
 </linearGradient>
 </defs>
 <!-- sky section (above soil) -->
 <rect x="2" y="2" width="28" height="12" rx="1" fill="url(#rt-sky)"/>
 <!-- soil section -->
 <rect x="2" y="14" width="28" height="17" rx="1" fill="url(#rt-soil)"/>
 <!-- soil surface line -->
 <path d="M2 14 Q8 12 16 14 Q24 16 30 14" fill="none" stroke="#906030" stroke-width="0.8"/>
 <!-- small stones in soil -->
 <circle cx="8" cy="20" r="1.2" fill="#c0a060" fill-opacity="0.6"/>
 <circle cx="24" cy="25" r="0.8" fill="#b09050" fill-opacity="0.6"/>
 <!-- root system (brown branching) -->
 <!-- main tap root -->
 <path d="M16 14 Q16 20 16 28" stroke="url(#rt-root)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- lateral roots -->
 <path d="M16 17 Q10 18 6 22" stroke="url(#rt-root)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 <path d="M16 17 Q22 18 26 22" stroke="url(#rt-root)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 <path d="M16 21 Q11 22 8 26" stroke="url(#rt-root)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
 <path d="M16 21 Q21 22 24 26" stroke="url(#rt-root)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
 <!-- tertiary roots -->
 <path d="M6 22 Q4 24 5 27" stroke="url(#rt-root)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
 <path d="M26 22 Q28 24 27 27" stroke="url(#rt-root)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
 <path d="M8 26 Q7 29 9 30" stroke="url(#rt-root)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <!-- trunk stub above ground -->
 <rect x="14.5" y="4" width="3" height="12" rx="1" fill="#8B5010"/>
 <!-- trunk highlight -->
 <rect x="15" y="4.5" width="1" height="10" rx="0.5" fill="white" fill-opacity="0.15"/>
</svg>
