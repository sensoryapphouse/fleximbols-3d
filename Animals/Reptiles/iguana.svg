 <defs>
 <linearGradient id="igu_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4CAF50"/>
 <stop offset="100%" stop-color="#1B5E20"/>
 </linearGradient>
 <linearGradient id="igu_belly" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#A5D6A7"/>
 <stop offset="100%" stop-color="#4CAF50"/>
 </linearGradient>
 <linearGradient id="igu_dewlap" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF8A65"/>
 <stop offset="100%" stop-color="#BF360C"/>
 </linearGradient>
 <linearGradient id="igu_tail" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#388E3C"/>
 <stop offset="100%" stop-color="#1B5E20"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Tail (long, tapering) -->
 <path d="M24 20 Q28 22 31 26 Q32 29 30 30 Q28 30 27 28 Q25 25 22 23" stroke="url(#igu_tail)" stroke-width="3" fill="none" stroke-linecap="round"/>
 <!-- Tail banding -->
 <path d="M25 21 Q27 23 29 26" stroke="#1B5E20" stroke-width="0.5" fill="none" stroke-dasharray="1.5,1"/>
 <!-- Body main -->
 <path d="M6 16 Q6 12 10 11 Q18 9 24 13 Q26 16 25 20 Q23 24 18 25 Q12 26 8 23 Q6 21 6 16 Z" fill="url(#igu_body)"/>
 <!-- Belly lighter -->
 <path d="M8 19 Q12 22 18 22 Q22 22 24 20" stroke="url(#igu_belly)" stroke-width="3" fill="none" stroke-opacity="0.5"/>
 <!-- Dorsal spine row (from head to tail tip) -->
 <path d="M8 12 Q12 9 16 8 Q20 7 23 10 Q26 14 27 19" stroke="#2E7D32" stroke-width="0.5" fill="none"/>
 <!-- Individual spikes along dorsal -->
 <polygon points="8,12 7.5,9 8.5,9" fill="#388E3C"/>
 <polygon points="11,10.5 10.5,7.5 11.5,7.5" fill="#388E3C"/>
 <polygon points="14,9.5 13.5,6.5 14.5,6.5" fill="#388E3C"/>
 <polygon points="17,9 16.5,6 17.5,6" fill="#388E3C"/>
 <polygon points="20,9.5 19.5,6.5 20.5,6.5" fill="#388E3C"/>
 <polygon points="23,11 22.5,8 23.5,8" fill="#388E3C"/>
 <polygon points="25,14 24.5,11 25.5,11" fill="#388E3C"/>
 <!-- Head -->
 <ellipse cx="7" cy="16" rx="5.5" ry="5" fill="url(#igu_body)"/>
 <!-- Head crest/casque -->
 <path d="M5 12 Q7 10 9 12" fill="#2E7D32"/>
 <!-- Snout -->
 <ellipse cx="4.5" cy="17" rx="2.5" ry="1.8" fill="#388E3C"/>
 <!-- Nostril -->
 <ellipse cx="3.5" cy="16.5" rx="0.5" ry="0.4" fill="#1B5E20"/>
 <!-- Eye -->
 <circle cx="7.5" cy="14.5" r="1.8" fill="#1a2a4a"/>
 <circle cx="7.5" cy="14.5" r="1" fill="#FF8F00"/>
 <circle cx="7.5" cy="14.5" r="0.5" fill="#1a2a4a"/>
 <circle cx="7" cy="14" r="0.4" fill="white" fill-opacity="0.7"/>
 <!-- Dewlap (throat flap, large) -->
 <path d="M5 18 Q3 22 4 26 Q6 28 8 26 Q9 22 8 18 Z" fill="url(#igu_dewlap)"/>
 <!-- Dewlap rays -->
 <line x1="5.5" y1="19" x2="3.5" y2="22" stroke="#BF360C" stroke-width="0.4"/>
 <line x1="6" y1="20" x2="4" y2="23.5" stroke="#BF360C" stroke-width="0.4"/>
 <line x1="6.5" y1="22" x2="5" y2="25" stroke="#BF360C" stroke-width="0.4"/>
 <!-- Front leg -->
 <path d="M10 23 Q8 25 7 28" stroke="url(#igu_body)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <!-- Front claws -->
 <line x1="7" y1="28" x2="5.5" y2="30" stroke="#2E7D32" stroke-width="0.8"/>
 <line x1="7" y1="28" x2="7" y2="30.5" stroke="#2E7D32" stroke-width="0.8"/>
 <line x1="7" y1="28" x2="8.5" y2="30" stroke="#2E7D32" stroke-width="0.8"/>
 <!-- Back leg -->
 <path d="M20 24 Q19 27 18 30" stroke="url(#igu_body)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <line x1="18" y1="30" x2="16.5" y2="32" stroke="#2E7D32" stroke-width="0.8"/>
 <line x1="18" y1="30" x2="18.5" y2="32" stroke="#2E7D32" stroke-width="0.8"/>
 <line x1="18" y1="30" x2="20" y2="32" stroke="#2E7D32" stroke-width="0.8"/>
</svg>
