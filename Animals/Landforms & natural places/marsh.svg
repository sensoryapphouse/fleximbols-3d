<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#C9CDD3"/>
 <stop offset="100%" stop-color="#A6D9F5"/>
 </linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="mud" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="50%" stop-color="#5CC8D0"/>
 <stop offset="100%" stop-color="#1F8A93"/>
 </linearGradient>
 <linearGradient id="reed" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="cattail" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#8B5C3A"/>
 <stop offset="100%" stop-color="#C99878"/>
 </linearGradient>
 </defs>
 <!-- Hazy sky -->
 <rect x="0" y="0" width="32" height="16" fill="url(#sky)"/>
 <!-- Mist in background -->
 <rect x="0" y="12" width="32" height="6" fill="#FFFFFF" fill-opacity="0.35"/>
 <!-- Shallow water/muddy ground -->
 <rect x="0" y="18" width="32" height="14" fill="url(#mud)"/>
 <!-- Water patches -->
 <ellipse cx="8" cy="25" rx="6" ry="3" fill="url(#water)" fill-opacity="0.7"/>
 <ellipse cx="22" cy="26" rx="7" ry="2.5" fill="url(#water)" fill-opacity="0.65"/>
 <!-- Reed / grass stalks - tall vertical -->
 <rect x="5" y="10" width="0.8" height="18" fill="url(#reed)"/>
 <rect x="8" y="12" width="0.8" height="16" fill="url(#reed)"/>
 <rect x="11" y="9" width="0.8" height="19" fill="url(#reed)"/>
 <rect x="14" y="11" width="0.8" height="17" fill="url(#reed)"/>
 <rect x="18" y="8" width="0.8" height="20" fill="url(#reed)"/>
 <rect x="21" y="11" width="0.8" height="17" fill="url(#reed)"/>
 <rect x="24" y="10" width="0.8" height="18" fill="url(#reed)"/>
 <rect x="27" y="12" width="0.8" height="16" fill="url(#reed)"/>
 <!-- Cattail tops -->
 <ellipse cx="5.4" cy="11" rx="0.8" ry="2" fill="url(#cattail)"/>
 <ellipse cx="11.4" cy="10" rx="0.8" ry="2" fill="url(#cattail)"/>
 <ellipse cx="18.4" cy="9" rx="0.8" ry="2" fill="url(#cattail)"/>
 <ellipse cx="24.4" cy="11" rx="0.8" ry="2" fill="url(#cattail)"/>
 <!-- Leaf blades angled -->
 <path d="M8,16 Q12,14 14,18" stroke="#7BAA48" stroke-width="0.8" fill="none" stroke-opacity="0.8"/>
 <path d="M21,15 Q25,13 26,17" stroke="#33691E" stroke-width="0.8" fill="none" stroke-opacity="0.8"/>
 <!-- Small bird (heron silhouette) -->
 <ellipse cx="28" cy="17" rx="1.5" ry="0.6" fill="#7A7E84" fill-opacity="0.7"/>
 <line x1="28" y1="17" x2="28" y2="14" stroke="#7A7E84" stroke-width="0.5" stroke-opacity="0.7"/>
 <line x1="28" y1="17" x2="30" y2="18" stroke="#7A7E84" stroke-width="0.5" stroke-opacity="0.7"/>
 <line x1="28" y1="17" x2="26" y2="18" stroke="#7A7E84" stroke-width="0.5" stroke-opacity="0.7"/>
</svg>
