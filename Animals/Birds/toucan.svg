 <defs>
 <radialGradient id="bodyG" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#212121"/>
 <stop offset="100%" stop-color="#050505"/>
 </radialGradient>
 <radialGradient id="throatG" cx="40%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#E0E0E0"/>
 </radialGradient>
 <!-- Massive rainbow beak — KEY GESTURE -->
 <linearGradient id="beakTopG" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#FF6F00"/>
 <stop offset="40%" stop-color="#FFD600"/>
 <stop offset="70%" stop-color="#76FF03"/>
 <stop offset="100%" stop-color="#FF6F00"/>
 </linearGradient>
 <linearGradient id="beakBotG" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#E65100"/>
 <stop offset="50%" stop-color="#F9A825"/>
 <stop offset="100%" stop-color="#E65100"/>
 </linearGradient>
 <linearGradient id="legG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#37474F"/>
 <stop offset="100%" stop-color="#0D0D0D"/>
 </linearGradient>
 </defs>
 <!-- Perch -->
 <rect x="6" y="27" width="20" height="2" rx="1" fill="#5D4037"/>
 <!-- Black body — KEY GESTURE -->
 <ellipse cx="19" cy="21" rx="8.5" ry="6.5" fill="url(#bodyG)"/>
 <!-- Tail -->
 <path d="M25.5 22 L31 25 L30 27 L24.5 24Z" fill="url(#bodyG)"/>
 <!-- Wing highlight -->
 <ellipse cx="19" cy="19.5" rx="6" ry="3" fill="#37474F" opacity="0.5"/>
 <!-- White throat patch — KEY GESTURE -->
 <ellipse cx="13.5" cy="21" rx="5" ry="5.5" fill="url(#throatG)"/>
 <!-- Red undertail -->
 <ellipse cx="23" cy="25" rx="3" ry="2" fill="#FF1744" opacity="0.8"/>
 <!-- Head -->
 <ellipse cx="11" cy="16.5" rx="5" ry="4.5" fill="url(#bodyG)"/>
 <!-- Eye with blue ring (characteristic) -->
 <circle cx="9.5" cy="16.5" r="2" fill="#1565C0"/>
 <circle cx="9.5" cy="16.5" r="1.3" fill="#1A1A1A"/>
 <circle cx="9.1" cy="16.1" r="0.55" fill="#FFFFFF" opacity="0.9"/>
 <!-- MASSIVE colourful curved beak — KEY GESTURE: oversized rainbow beak -->
 <!-- Upper mandible -->
 <path d="M8 15 Q5 13 1 14 Q0 17 2 19 Q5 20 9 19 L8 15Z" fill="url(#beakTopG)"/>
 <!-- Lower mandible -->
 <path d="M8 17.5 Q5 17 1.5 18 Q2 19.5 4 20 L9 19Z" fill="url(#beakBotG)"/>
 <!-- Beak highlight -->
 <path d="M8 14.5 Q5 12.5 2 14" stroke="#FFFFFF" stroke-width="0.5" fill="none" opacity="0.35"/>
 <!-- Beak ridge detail -->
 <path d="M8 15 Q5 13.5 2 14.5" stroke="#E65100" stroke-width="0.3" fill="none" opacity="0.5"/>
 <!-- Legs -->
 <line x1="17" y1="26.5" x2="16" y2="27.3" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <line x1="21" y1="26.5" x2="21.5" y2="27.3" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <line x1="16" y1="27.3" x2="14" y2="27.8" stroke="url(#legG)" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="21.5" y1="27.3" x2="20" y2="27.8" stroke="url(#legG)" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="21.5" y1="27.3" x2="23" y2="27.8" stroke="url(#legG)" stroke-width="0.8" stroke-linecap="round"/>
</svg>
