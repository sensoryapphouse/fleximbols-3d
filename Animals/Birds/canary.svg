 <defs>
 <radialGradient id="ca_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#fff066"/><stop offset="60%" stop-color="#f0c000"/><stop offset="100%" stop-color="#b08800"/></radialGradient>
 <radialGradient id="ca_head" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#fff288"/><stop offset="70%" stop-color="#f0d020"/><stop offset="100%" stop-color="#c09000"/></radialGradient>
 <radialGradient id="ca_wing" cx="35%" cy="30%" r="65%"><stop offset="0%" stop-color="#e8c000"/><stop offset="60%" stop-color="#b89000"/><stop offset="100%" stop-color="#806000"/></radialGradient>
 </defs>
 <!-- tail -->
 <path d="M16 26 Q14 30 13 31 M16 26 Q16 31 16 32 M16 26 Q18 30 19 31" fill="none" stroke="#b08800" stroke-width="1.5" stroke-linecap="round"/>
 <!-- body - slightly plumper than budgie -->
 <ellipse cx="16" cy="22" rx="7.5" ry="6" fill="url(#ca_body)"/>
 <!-- wing -->
 <ellipse cx="18.5" cy="22" rx="5" ry="4" fill="url(#ca_wing)" transform="rotate(15,18.5,22)"/>
 <!-- head - rounder -->
 <ellipse cx="16" cy="14.5" rx="6.5" ry="6" fill="url(#ca_head)"/>
 <!-- no cheek patches on canary - distinguishes from budgie -->
 <!-- eye -->
 <circle cx="13.5" cy="13.5" r="1.5" fill="#1a1a1a"/>
 <circle cx="14" cy="13" r="0.5" fill="#fff" fill-opacity="0.7"/>
 <!-- beak - smaller, more pointed -->
 <path d="M16 17 Q14.5 18 16 19 Q17.5 18 16 17Z" fill="#cc8833"/>
 <!-- tiny breast blush -->
 <ellipse cx="16" cy="21" rx="3.5" ry="2.5" fill="#fff8aa" fill-opacity="0.4"/>
</svg>