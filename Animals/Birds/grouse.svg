<!-- ground -->
<!-- shadow -->
<ellipse cx="16.5" cy="22" rx="11" ry="7" fill="#000" fill-opacity="0.28" filter="url(#blur)"/>
<!-- plump body -->
<ellipse cx="16" cy="19" rx="10" ry="7.5" fill="url(#gr_body)"/>
