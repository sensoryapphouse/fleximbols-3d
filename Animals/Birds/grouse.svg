<radialGradient id="gr_body" cx="0.4" cy="0.4" r="0.85">
<stop offset="0" stop-color="#B89060"/>
<stop offset="0.5" stop-color="#7A4F2A"/>
<stop offset="1" stop-color="#3D2410"/>
</radialGradient>
<radialGradient id="gr_belly" cx="0.5" cy="0.5" r="0.7">
<stop offset="0" stop-color="#E8C896"/>
<stop offset="1" stop-color="#A07442"/>
</radialGradient>
<linearGradient id="gr_beak" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3A2410"/>
<stop offset="1" stop-color="#1A0F05"/>
</linearGradient>
<linearGradient id="gr_ground" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#5A8A3D"/>
<stop offset="1" stop-color="#2E5520"/>
</linearGradient>
