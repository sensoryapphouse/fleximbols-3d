<circle cx="20" cy="16" r="0.5" fill="#1A0F05" fill-opacity="0.6"/>
<circle cx="12" cy="20" r="0.4" fill="#E8C896" fill-opacity="0.8"/>
<circle cx="18" cy="20" r="0.4" fill="#E8C896" fill-opacity="0.8"/>
