 <defs>
 <radialGradient id="bodyG" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#A1887F"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </radialGradient>
 <radialGradient id="underG" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#F5F5F5"/>
 <stop offset="100%" stop-color="#BCAAA4"/>
 </radialGradient>
 <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#3E2723"/>
 </linearGradient>
 <radialGradient id="headG" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </radialGradient>
 <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#5D4037"/>
 <stop offset="100%" stop-color="#212121"/>
 </linearGradient>
 <linearGradient id="twigG" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </linearGradient>
 </defs>
 <!-- Perch twig -->
 <path d="M4 26 Q16 25 28 26.5" stroke="url(#twigG)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
 <!-- Brown/grey streaked body — KEY GESTURE: small bird, streaked plumage -->
 <ellipse cx="16" cy="21" rx="8" ry="5.5" fill="url(#bodyG)"/>
 <!-- Streaks on body (darker brown lines) -->
 <line x1="12" y1="18.5" x2="11" y2="24" stroke="#3E2723" stroke-width="0.5" opacity="0.6" stroke-linecap="round"/>
 <line x1="15" y1="18" x2="14.5" y2="24" stroke="#3E2723" stroke-width="0.5" opacity="0.6" stroke-linecap="round"/>
 <line x1="18" y1="18.5" x2="17.5" y2="24" stroke="#3E2723" stroke-width="0.45" opacity="0.55" stroke-linecap="round"/>
 <!-- Wing bar pale stripe -->
 <path d="M10 20.5 Q16 18.5 22 20.5" stroke="#BCAAA4" stroke-width="0.7" fill="none" opacity="0.6"/>
 <!-- Pale underside -->
 <ellipse cx="16" cy="22.5" rx="5" ry="3.5" fill="url(#underG)"/>
 <!-- Tail -->
 <path d="M22 22 L27 25 L26.5 27 L21.5 24Z" fill="url(#wingG)"/>
 <!-- Head (small, brown/grey) -->
 <ellipse cx="9.5" cy="17" rx="4.2" ry="3.8" fill="url(#headG)"/>
 <ellipse cx="8" cy="15" rx="1.5" ry="1" fill="#A1887F" opacity="0.35"/>
 <!-- Chestnut crown stripe -->
 <path d="M6 15 Q9.5 13 13 15 Q11 13.5 9.5 14 Q8 13.5 6 15Z" fill="#5D4037" opacity="0.8"/>
 <!-- Eye -->
 <circle cx="8" cy="17" r="1.2" fill="#1A1A1A"/>
 <circle cx="7.7" cy="16.7" r="0.5" fill="#FFFFFF" opacity="0.85"/>
 <!-- Supercilium (pale eyebrow stripe) -->
 <path d="M5.5 15.5 Q8 14.5 11 15.5" stroke="#E0E0E0" stroke-width="0.5" fill="none" opacity="0.7"/>
 <!-- Short conical beak — KEY GESTURE: seed-eater beak -->
 <path d="M5.5 17.2 L3 16.5 Q3 18.2 5 18Z" fill="url(#beakG)"/>
 <!-- Legs -->
 <line x1="14" y1="25.5" x2="13.5" y2="26.5" stroke="#8D6E63" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="18" y1="25.5" x2="18" y2="26.5" stroke="#8D6E63" stroke-width="0.8" stroke-linecap="round"/>
 <line x1="13.5" y1="26.5" x2="11.5" y2="27" stroke="#8D6E63" stroke-width="0.6" stroke-linecap="round"/>
 <line x1="18" y1="26.5" x2="16.5" y2="27" stroke="#8D6E63" stroke-width="0.6" stroke-linecap="round"/>
 <line x1="18" y1="26.5" x2="19.5" y2="27" stroke="#8D6E63" stroke-width="0.6" stroke-linecap="round"/>
</svg>
