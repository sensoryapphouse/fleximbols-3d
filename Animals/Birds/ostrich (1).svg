 <defs>
 <radialGradient id="bodyG" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#424242"/>
 <stop offset="100%" stop-color="#121212"/>
 </radialGradient>
 <radialGradient id="fluffG" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#616161"/>
 <stop offset="100%" stop-color="#1A1A1A"/>
 </radialGradient>
 <linearGradient id="neckG" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#EF9A9A"/>
 <stop offset="100%" stop-color="#C62828"/>
 </linearGradient>
 <radialGradient id="headG" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFCDD2"/>
 <stop offset="100%" stop-color="#E57373"/>
 </radialGradient>
 <linearGradient id="legG" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#EF9A9A"/>
 <stop offset="100%" stop-color="#BF360C"/>
 </linearGradient>
 </defs>
 <!-- Very long bare legs — KEY GESTURE -->
 <line x1="15" y1="21" x2="13" y2="31.5" stroke="url(#legG)" stroke-width="1.5" stroke-linecap="round"/>
 <line x1="19" y1="21" x2="21" y2="31.5" stroke="url(#legG)" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Two toes per foot -->
 <line x1="13" y1="31.5" x2="11" y2="32" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <line x1="13" y1="31.5" x2="14.5" y2="32" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <line x1="21" y1="31.5" x2="19.5" y2="32" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <line x1="21" y1="31.5" x2="23" y2="32" stroke="url(#legG)" stroke-width="1" stroke-linecap="round"/>
 <!-- Large fluffy body — KEY GESTURE -->
 <ellipse cx="17" cy="18" rx="9.5" ry="7.5" fill="url(#bodyG)"/>
 <!-- Fluffy white tail/wing tips -->
 <ellipse cx="25" cy="19" rx="4" ry="3.5" fill="url(#fluffG)"/>
 <ellipse cx="23" cy="22" rx="3.5" ry="2.5" fill="#BDBDBD" opacity="0.6"/>
 <!-- Very long bare neck — KEY GESTURE -->
 <path d="M12 12 Q13 8 15 5 Q16.5 3 17 2" stroke="url(#neckG)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Small head with large eye — KEY GESTURE -->
 <ellipse cx="17" cy="2" rx="3.5" ry="3" fill="url(#headG)"/>
 <!-- Large eye -->
 <circle cx="15.5" cy="1.8" r="1.5" fill="#1A1A1A"/>
 <circle cx="15" cy="1.4" r="0.6" fill="#FFFFFF" opacity="0.85"/>
 <!-- Eye ring lashes -->
 <circle cx="15.5" cy="1.8" r="1.5" fill="none" stroke="#8D6E63" stroke-width="0.5"/>
 <!-- Small beak -->
 <path d="M19.5 2 L22 2.5 L21 3.5Z" fill="#FFA726"/>
</svg>
