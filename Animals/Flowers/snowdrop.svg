<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- White drooping outer petals — KEY GESTURE -->
 <radialGradient id="sn_outer" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="70%" stop-color="#F4EFEA"/>
 <stop offset="100%" stop-color="#F0E4D0"/>
 </radialGradient>
 <radialGradient id="sn_hl" cx="30%" cy="22%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <!-- Inner green-tipped petals — KEY GESTURE -->
 <radialGradient id="sn_inner" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="55%" stop-color="#E8F5E9"/>
 <stop offset="100%" stop-color="#81C784"/>
 </radialGradient>
 <!-- Green stem + narrow grass-like leaves — KEY GESTURE -->
 <linearGradient id="sn_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="sn_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#A5C97A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 <!-- Snow at base — KEY GESTURE -->
 <radialGradient id="sn_snow" cx="45%" cy="40%" r="65%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#D8E8F0"/>
 </radialGradient>
 <!-- Ovary (green top before pedicel bends) -->
 <radialGradient id="sn_ovary" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#A5D46A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 </defs>
 <!-- SNOW MOUND at base — KEY GESTURE -->
 <ellipse cx="16" cy="30" rx="13" ry="4" fill="url(#sn_snow)"/>
 <!-- Slim grass-like leaves emerging from snow — KEY GESTURE -->
 <!-- Left leaf -->
 <path d="M13 29.5 Q11.5 23 12 16 Q13 22 14 29.5 Z" fill="url(#sn_leaf)"/>
 <path d="M13 29.5 Q14.5 23 14 17 Q13 23 12.5 29.5 Z" fill="url(#sn_leaf)"/>
 <path d="M13.5 29 Q12.5 24 12.5 17.5" stroke="#FFFFFF" stroke-width="0.3" fill="none" opacity="0.5"/>
 <!-- Right leaf -->
 <path d="M19 29.5 Q20.5 22 20 15 Q19 22 18 29.5 Z" fill="url(#sn_leaf)"/>
 <path d="M19 29.5 Q17.5 22 18 16 Q19 22.5 20 29.5 Z" fill="url(#sn_leaf)"/>
 <path d="M19 29 Q19.5 24 19.5 16.5" stroke="#FFFFFF" stroke-width="0.3" fill="none" opacity="0.5"/>
 <!-- Main thin stem, arching — flower droops down at top -->
 <path d="M16 29 Q16 22 16 16 Q16 13 16 11" stroke="url(#sn_stem)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
 <!-- Pedicel — bends over so flower hangs DOWN — KEY GESTURE -->
 <path d="M16 11 Q17 9 16.5 7" stroke="url(#sn_stem)" stroke-width="1" fill="none" stroke-linecap="round"/>
 <!-- Small green ovary at bend -->
 <ellipse cx="16.5" cy="7.5" rx="1.5" ry="1" fill="url(#sn_ovary)" transform="rotate(-20 16.5 7.5)"/>
 <!-- THREE DROOPING WHITE OUTER PETALS — KEY GESTURE -->
 <!-- The flower hangs downward, petals splay outward/downward -->
 <!-- Left outer petal -->
 <path d="M16.5 8 Q12 9 11 13 Q13 10.5 16.5 8 Z" fill="url(#sn_outer)"/>
 <ellipse cx="13" cy="11" rx="1.5" ry="2.2" fill="url(#sn_hl)" transform="rotate(20 13 11)"/>
 <!-- Centre outer petal -->
 <path d="M16.5 8 Q15.5 12 14.5 16 Q15.5 12 16.5 8 Z" fill="url(#sn_outer)"/>
 <path d="M16.5 8 Q17.5 12 18.5 16 Q17.5 12 16.5 8 Z" fill="url(#sn_outer)"/>
 <!-- Right outer petal -->
 <path d="M16.5 8 Q21 9 22 13 Q20 10.5 16.5 8 Z" fill="url(#sn_outer)"/>
 <ellipse cx="20" cy="11" rx="1.5" ry="2.2" fill="url(#sn_hl)" transform="rotate(-20 20 11)"/>
 <!-- Bottom petal curves down/forward -->
 <path d="M14.5 16 Q15 19 16 19.5 Q17 19 17.5 16 Q16.5 17 16 17 Q15.5 17 14.5 16 Z" fill="url(#sn_outer)"/>
 <ellipse cx="16" cy="18" rx="1.3" ry="1.2" fill="url(#sn_hl)"/>
 <!-- THREE INNER PETALS with green tips — KEY GESTURE -->
 <path d="M16.5 9 Q14.5 10 14 13 Q15 11 16.5 9 Z" fill="url(#sn_inner)"/>
 <path d="M16.5 9 Q16 12 15.5 15 Q16 12.5 16.5 9 Z" fill="url(#sn_inner)"/>
 <path d="M16.5 9 Q18.5 10 19 13 Q18 11 16.5 9 Z" fill="url(#sn_inner)"/>
 <!-- Green notch marking on each inner petal tip -->
 <path d="M14 13 Q14.5 14 15 13.5" stroke="#4CAF50" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <path d="M15.5 15 Q16 16 16.5 15.5" stroke="#4CAF50" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <path d="M19 13 Q18.5 14 18 13.5" stroke="#4CAF50" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
