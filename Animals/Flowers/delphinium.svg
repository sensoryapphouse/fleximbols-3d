<defs>
<radialGradient id="dlp-petal" cx="35%" cy="30%" r="65%">
<stop offset="0%" stop-color="#8a8af8"/>
<stop offset="50%" stop-color="#4848d8"/>
<stop offset="100%" stop-color="#1818a0"/>
</radialGradient>
<radialGradient id="dlp-petal2" cx="35%" cy="30%" r="65%">
<stop offset="0%" stop-color="#9a78f0"/>
<stop offset="50%" stop-color="#5838c8"/>
<stop offset="100%" stop-color="#281880"/>
</radialGradient>
<linearGradient id="dlp-stem" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#3a7010"/>
<stop offset="100%" stop-color="#6aaa30"/>
</linearGradient>
<linearGradient id="dlp-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#6aaa28"/>
<stop offset="100%" stop-color="#386018"/>
</linearGradient>
</defs>
<!-- Main stem -->
<line x1="16" y1="6" x2="16" y2="30" stroke="url(#dlp-stem)" stroke-width="1.6" stroke-linecap="round"/>
<!-- Palmate lobed leaves at base -->
<path d="M16 24 C12 23 9.5 24.5 8.5 27 C11 27.5 13.5 26.5 16 25.5 Z" fill="url(#dlp-leaf)"/>
<path d="M16 26 C20 25 22.5 26.5 23.5 29 C21 29.5 18.5 28.5 16 27.5 Z" fill="url(#dlp-leaf)"/>
<!-- Tapered conical flower spike: narrow at top, widest mid, narrowing to stem -->
<!-- Row 1 (tip) -->
<circle cx="16" cy="6.5" r="1.5" fill="url(#dlp-petal)"/>
<!-- Row 2 -->
<circle cx="14.6" cy="8.6" r="1.8" fill="url(#dlp-petal2)"/>
<circle cx="17.4" cy="8.6" r="1.8" fill="url(#dlp-petal)"/>
<!-- Row 3 -->
<circle cx="13.6" cy="11" r="2" fill="url(#dlp-petal)"/>
<circle cx="16" cy="10.6" r="2" fill="url(#dlp-petal2)"/>
<circle cx="18.4" cy="11" r="2" fill="url(#dlp-petal)"/>
<!-- Row 4 (widest) -->
<circle cx="13" cy="13.6" r="2.1" fill="url(#dlp-petal2)"/>
<circle cx="16" cy="13.2" r="2.1" fill="url(#dlp-petal)"/>
<circle cx="19" cy="13.6" r="2.1" fill="url(#dlp-petal2)"/>
<!-- Row 5 -->
<circle cx="13.4" cy="16.2" r="1.9" fill="url(#dlp-petal)"/>
<circle cx="16" cy="15.8" r="1.9" fill="url(#dlp-petal2)"/>
<circle cx="18.6" cy="16.2" r="1.9" fill="url(#dlp-petal)"/>
<!-- Row 6 -->
<circle cx="14.4" cy="18.6" r="1.6" fill="url(#dlp-petal2)"/>
<circle cx="17.6" cy="18.6" r="1.6" fill="url(#dlp-petal)"/>
<!-- Row 7 (taper to stem) -->
<circle cx="16" cy="20.6" r="1.4" fill="url(#dlp-petal)"/>
<!-- Flower white eyes -->
<g fill="#fff" fill-opacity="0.7">
<circle cx="16" cy="6.5" r="0.45"/>
<circle cx="14.6" cy="8.6" r="0.45"/>
<circle cx="17.4" cy="8.6" r="0.45"/>
<circle cx="16" cy="10.6" r="0.5"/>
<circle cx="13.6" cy="11" r="0.45"/>
<circle cx="18.4" cy="11" r="0.45"/>
<circle cx="16" cy="13.2" r="0.5"/>
<circle cx="13" cy="13.6" r="0.45"/>
<circle cx="19" cy="13.6" r="0.45"/>
<circle cx="16" cy="15.8" r="0.5"/>
<circle cx="13.4" cy="16.2" r="0.4"/>
<circle cx="18.6" cy="16.2" r="0.4"/>
<circle cx="16" cy="20.6" r="0.4"/>
</g>
</svg>
