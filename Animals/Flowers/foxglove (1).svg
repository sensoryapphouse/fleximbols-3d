 <stop offset="0%" stop-color="#FFB3C1"/>
 <stop offset="50%" stop-color="#FF8FAB"/>
 <stop offset="100%" stop-color="#C8375A"/>
 </radialGradient>
 <radialGradient id="fox_tube2" cx="30%" cy="25%" r="70%">
