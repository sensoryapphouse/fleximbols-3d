 <!-- TALL VERTICAL STEM — KEY GESTURE -->
 <path d="M17 31 Q17 24 17 16 Q17 10 17 4" stroke="url(#fox_stem)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

