 <defs>
 <radialGradient id="bc_petal" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFF9C4"/>
 <stop offset="30%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <!-- Glossy sheen overlay on petals -->
 <radialGradient id="bc_sheen" cx="35%" cy="25%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
 <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.15"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="bc_centre" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FFF59D"/>
 <stop offset="55%" stop-color="#FFD740"/>
 <stop offset="100%" stop-color="#E65100"/>
 </radialGradient>
 <linearGradient id="bc_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#8BC34A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="bc_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#AED581"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 </defs>

 <!-- Stem -->
 <path d="M16 22 Q15.5 26 15 31" stroke="url(#bc_stem)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
 <!-- Small rounded leaf on stem -->
 <path d="M15.5 26 Q10 24 9.5 20 Q13 23 15.5 26 Z" fill="url(#bc_leaf)"/>
 <path d="M15 25.5 Q10.5 23 10 20" stroke="#FFFFFF" stroke-width="0.35" fill="none" opacity="0.4"/>

 <!-- 5 GLOSSY CUPPED YELLOW PETALS — KEY GESTURE -->
 <!-- Petal 1 — top -->
 <ellipse cx="16" cy="10.5" rx="3.2" ry="4.8" fill="url(#bc_petal)"/>
 <ellipse cx="16" cy="10.5" rx="3.2" ry="4.8" fill="url(#bc_sheen)"/>
 <!-- Petal 2 — upper-right (72deg) -->
 <ellipse cx="21" cy="13.5" rx="3.2" ry="4.8" fill="url(#bc_petal)" transform="rotate(72 21 13.5)"/>
 <ellipse cx="21" cy="13.5" rx="3.2" ry="4.8" fill="url(#bc_sheen)" transform="rotate(72 21 13.5)"/>
 <!-- Petal 3 — lower-right (144deg) -->
 <ellipse cx="19.3" cy="19.8" rx="3.2" ry="4.8" fill="url(#bc_petal)" transform="rotate(144 19.3 19.8)"/>
 <ellipse cx="19.3" cy="19.8" rx="3.2" ry="4.8" fill="url(#bc_sheen)" transform="rotate(144 19.3 19.8)"/>
 <!-- Petal 4 — lower-left (216deg) -->
 <ellipse cx="12.7" cy="19.8" rx="3.2" ry="4.8" fill="url(#bc_petal)" transform="rotate(-144 12.7 19.8)"/>
 <ellipse cx="12.7" cy="19.8" rx="3.2" ry="4.8" fill="url(#bc_sheen)" transform="rotate(-144 12.7 19.8)"/>
 <!-- Petal 5 — upper-left (288deg) -->
 <ellipse cx="11" cy="13.5" rx="3.2" ry="4.8" fill="url(#bc_petal)" transform="rotate(-72 11 13.5)"/>
 <ellipse cx="11" cy="13.5" rx="3.2" ry="4.8" fill="url(#bc_sheen)" transform="rotate(-72 11 13.5)"/>

 <!-- Glossy centre disc -->
 <circle cx="16" cy="16" r="4" fill="url(#bc_centre)"/>
 <!-- Centre highlight -->
 <ellipse cx="14.8" cy="14.8" rx="1.5" ry="1" fill="#FFFFFF" fill-opacity="0.45"/>
 <!-- Stamen dots -->
 <circle cx="15.2" cy="15.5" r="0.45" fill="#BF6000" fill-opacity="0.7"/>
 <circle cx="16.8" cy="15.5" r="0.45" fill="#BF6000" fill-opacity="0.7"/>
 <circle cx="16" cy="16.8" r="0.45" fill="#BF6000" fill-opacity="0.7"/>
 <circle cx="15" cy="17" r="0.4" fill="#BF6000" fill-opacity="0.65"/>
 <circle cx="17" cy="17" r="0.4" fill="#BF6000" fill-opacity="0.65"/>
</svg>
