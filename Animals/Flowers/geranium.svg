 <defs>
 <!-- Red/pink cluster petals — KEY GESTURE -->
 <radialGradient id="ger_petal" cx="30%" cy="25%" r="70%">
 <stop offset="0%" stop-color="#FF9EBC"/>
 <stop offset="50%" stop-color="#FF5252"/>
 <stop offset="100%" stop-color="#C62828"/>
 </radialGradient>
 <radialGradient id="ger_petal2" cx="30%" cy="25%" r="70%">
 <stop offset="0%" stop-color="#FFB3C1"/>
 <stop offset="50%" stop-color="#FF8FAB"/>
 <stop offset="100%" stop-color="#D63060"/>
 </radialGradient>
 <radialGradient id="ger_hl" cx="30%" cy="22%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <!-- Scalloped broad leaves — KEY GESTURE -->
 <radialGradient id="ger_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#8DBE5A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 <linearGradient id="ger_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <!-- Flower centres -->
 <radialGradient id="ger_centre" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="100%" stop-color="#FFE0E8"/>
 </radialGradient>
 </defs>

 <!-- Stem -->
 <path d="M16 22 Q15.5 26 15 31" stroke="url(#ger_stem)" stroke-width="1.4" fill="none" stroke-linecap="round"/>

 <!-- BROAD SCALLOPED LEAVES — KEY GESTURE: wide, rounded lobes -->
