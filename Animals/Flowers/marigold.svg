 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(80)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(120)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(160)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(200)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(240)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(280)"/>
 <circle cx="0" cy="-7.5" r="2.4" transform="rotate(320)"/>
