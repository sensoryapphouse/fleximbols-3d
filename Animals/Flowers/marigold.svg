 <g fill="#ffce6a">
 <circle cx="-1.2" cy="-1" r="0.7"/><circle cx="1.1" cy="-1.2" r="0.7"/>
 <circle cx="0" cy="0.4" r="0.7"/><circle cx="-1" cy="1.2" r="0.7"/><circle cx="1.2" cy="1" r="0.7"/>
