 <path d="M16 22 Q20.5 20.5 22 23 Q18.5 24.8 16 22 Z" fill="#3f9437" stroke="#246322" stroke-width="0.3"/>
 <!-- marigold bloom: dense ruffled rounded petals in layered rings -->
