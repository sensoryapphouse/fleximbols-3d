<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Purple pansy petals (upper 2) -->
 <radialGradient id="pan_purple" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#C4B0FC"/>
 <stop offset="50%" stop-color="#A78BFA"/>
 <stop offset="100%" stop-color="#6D4FD9"/>
 </radialGradient>
 <!-- Yellow lower petals -->
 <radialGradient id="pan_yellow" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFF9C4"/>
 <stop offset="40%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <!-- White/pale side petals -->
 <radialGradient id="pan_white" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="50%" stop-color="#F5EEFF"/>
 <stop offset="100%" stop-color="#D4C0FC"/>
 </radialGradient>
 <radialGradient id="pan_hl" cx="30%" cy="22%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <!-- Dark face-like markings — KEY GESTURE -->
 <radialGradient id="pan_mark" cx="50%" cy="50%" r="60%">
 <stop offset="0%" stop-color="#1A0040"/>
 <stop offset="100%" stop-color="#4A0080"/>
 </radialGradient>
 <linearGradient id="pan_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="pan_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#9CCC65"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 <!-- Yellow centre -->
 <radialGradient id="pan_centre" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFF176"/>
 <stop offset="100%" stop-color="#FFD740"/>
 </radialGradient>
 </defs>

 <!-- Short stem -->
 <path d="M16 22 Q15.5 26.5 15 31" stroke="url(#pan_stem)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
 <!-- Leaf -->
 <path d="M15.5 27 Q11 25 10 21 Q13 24 15.5 27 Z" fill="url(#pan_leaf)"/>

 <!-- FLAT FIVE-PETAL FLOWER — KEY GESTURE: flat-face arrangement -->
 <!-- Two large upper purple petals (back) -->
 <ellipse cx="12" cy="10.5" rx="4.5" ry="6" fill="url(#pan_purple)" transform="rotate(35 12 10.5)"/>
 <ellipse cx="12" cy="10.5" rx="4.5" ry="6" fill="url(#pan_hl)" transform="rotate(35 12 10.5)"/>
 <ellipse cx="20" cy="10.5" rx="4.5" ry="6" fill="url(#pan_purple)" transform="rotate(-35 20 10.5)"/>
 <ellipse cx="20" cy="10.5" rx="4.5" ry="6" fill="url(#pan_hl)" transform="rotate(-35 20 10.5)"/>

 <!-- Two side petals (white/pale) -->
 <ellipse cx="8.5" cy="15.5" rx="4.8" ry="3.2" fill="url(#pan_white)" transform="rotate(15 8.5 15.5)"/>
 <ellipse cx="8.5" cy="15.5" rx="4.8" ry="3.2" fill="url(#pan_hl)" transform="rotate(15 8.5 15.5)"/>
 <ellipse cx="23.5" cy="15.5" rx="4.8" ry="3.2" fill="url(#pan_white)" transform="rotate(-15 23.5 15.5)"/>
 <ellipse cx="23.5" cy="15.5" rx="4.8" ry="3.2" fill="url(#pan_hl)" transform="rotate(-15 23.5 15.5)"/>

 <!-- Large lower yellow petal (front, biggest) -->
 <ellipse cx="16" cy="21.5" rx="5" ry="6.5" fill="url(#pan_yellow)"/>
 <ellipse cx="16" cy="21.5" rx="5" ry="6.5" fill="url(#pan_hl)"/>

 <!-- DARK FACE-LIKE CENTRE MARKINGS — KEY GESTURE (the 'face' of pansy) -->
 <!-- Radiating dark lines from centre ("whiskers" of face markings) -->
 <!-- Lower petal markings -->
 <path d="M16 18 L14 22" stroke="url(#pan_mark)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
 <path d="M16 18 L16 23.5" stroke="url(#pan_mark)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
 <path d="M16 18 L18 22" stroke="url(#pan_mark)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
 <path d="M16 18 L12.5 23.5" stroke="url(#pan_mark)" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
 <path d="M16 18 L19.5 23.5" stroke="url(#pan_mark)" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
 <!-- Side petal markings -->
 <path d="M16 18 L9.5 16" stroke="url(#pan_mark)" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
 <path d="M16 18 L10 13.5" stroke="url(#pan_mark)" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
 <path d="M16 18 L22.5 16" stroke="url(#pan_mark)" stroke-width="0.9" stroke-linecap="round" opacity="0.7"/>
 <path d="M16 18 L22 13.5" stroke="url(#pan_mark)" stroke-width="0.8" stroke-linecap="round" opacity="0.65"/>
 <!-- Upper petal markings (shorter) -->
 <path d="M16 18 L13.5 12" stroke="url(#pan_mark)" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
 <path d="M16 18 L18.5 12" stroke="url(#pan_mark)" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>

 <!-- Small yellow centre -->
 <circle cx="16" cy="18" r="2.5" fill="url(#pan_centre)"/>
 <ellipse cx="15.2" cy="17.2" rx="0.9" ry="0.6" fill="#FFFFFF" fill-opacity="0.55"/>
 <!-- Centre dot (nectar guide) -->
 <circle cx="16" cy="18.5" r="0.6" fill="#E65100"/>
</svg>
