 <defs>
 <!-- White ray petals -->
 <radialGradient id="ds_petal" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="60%" stop-color="#F8F4F0"/>
 <stop offset="100%" stop-color="#F0E4D0"/>
 </radialGradient>
 <radialGradient id="ds_petal_hl" cx="30%" cy="25%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <!-- Yellow centre disc -->
 <radialGradient id="ds_centre" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#FFF176"/>
 <stop offset="55%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 <linearGradient id="ds_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#8BC34A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="ds_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#AED581"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 </defs>

 <!-- Thin stem -->
 <path d="M16 21 Q15.5 25.5 15 31" stroke="url(#ds_stem)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <!-- Simple leaf -->
 <path d="M15.5 26.5 Q10 24 10 20 Q13.5 23 15.5 26.5 Z" fill="url(#ds_leaf)"/>

 <!-- WHITE RAY PETALS — 12 thin petals radiating around yellow centre -->
 <!-- Petals at 0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330 deg -->
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(30 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)" transform="rotate(30 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(60 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)" transform="rotate(60 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(90 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)" transform="rotate(90 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(120 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)" transform="rotate(120 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(150 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal_hl)" transform="rotate(150 16 16)"/>
 <!-- Back half petals (behind centre) -->
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(180 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(210 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(240 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(270 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(300 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.6" ry="4.2" fill="url(#ds_petal)" transform="rotate(330 16 16)"/>

 <!-- Yellow centre disc — KEY GESTURE -->
 <circle cx="16" cy="16" r="5" fill="url(#ds_centre)"/>
 <ellipse cx="14.5" cy="14.5" rx="1.8" ry="1.2" fill="#FFFFFF" fill-opacity="0.4"/>
 <!-- Centre texture dots -->
 <circle cx="15" cy="15.5" r="0.55" fill="#BF6000" fill-opacity="0.6"/>
 <circle cx="17" cy="15.5" r="0.55" fill="#BF6000" fill-opacity="0.6"/>
 <circle cx="16" cy="17" r="0.55" fill="#BF6000" fill-opacity="0.6"/>
 <circle cx="14.5" cy="16.8" r="0.5" fill="#BF6000" fill-opacity="0.55"/>
 <circle cx="17.5" cy="16.8" r="0.5" fill="#BF6000" fill-opacity="0.55"/>
 <circle cx="16" cy="14.8" r="0.5" fill="#BF6000" fill-opacity="0.55"/>
</svg>
