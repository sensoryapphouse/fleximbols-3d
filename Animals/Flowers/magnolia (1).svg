 <defs>
 <!-- Broad smooth petal — white/pink -->
 <radialGradient id="mag_petal" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="50%" stop-color="#FFE4EC"/>
 <stop offset="100%" stop-color="#FF8FAB"/>
 </radialGradient>
 <radialGradient id="mag_petal2" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFFFFF"/>
 <stop offset="40%" stop-color="#FFF0F3"/>
 <stop offset="100%" stop-color="#D63060"/>
 </radialGradient>
 <radialGradient id="mag_hl" cx="30%" cy="22%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <!-- Woody branch -->
 <linearGradient id="mag_branch" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </linearGradient>
 <!-- Glossy dark leaves -->
 <radialGradient id="mag_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#81C784"/>
 <stop offset="100%" stop-color="#1B5E20"/>
 </radialGradient>
 <!-- Centre stamens -->
 <radialGradient id="mag_centre" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#FFD45E"/>
 <stop offset="100%" stop-color="#E5A700"/>
 </radialGradient>
 </defs>

 <!-- WOODY BRANCH — KEY GESTURE: on branch, not stem -->
 <path d="M4 31 Q8 26 12 22 Q14 20 16 19" stroke="url(#mag_branch)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
 <path d="M4 31 Q8 26 12 22" stroke="#A1887F" stroke-width="0.5" fill="none" opacity="0.5"/>

 <!-- GLOSSY DARK LEAVES on branch — KEY GESTURE -->
 <path d="M7 29 Q4 24 6 20 Q8 24 9 29 Z" fill="url(#mag_leaf)"/>
 <path d="M8 28.5 Q6 24 7.5 21" stroke="#FFFFFF" stroke-width="0.35" fill="none" opacity="0.45"/>
 <path d="M11 27 Q8 22 10 18 Q12 22 13 27 Z" fill="url(#mag_leaf)"/>
 <path d="M12 26.5 Q10 22 11.5 19" stroke="#FFFFFF" stroke-width="0.35" fill="none" opacity="0.45"/>
 <!-- Leaf right side -->
 <path d="M20 24 Q24 20 22 15 Q20 20 19 24 Z" fill="url(#mag_leaf)"/>
 <path d="M20 23 Q23 20 21.5 16" stroke="#FFFFFF" stroke-width="0.35" fill="none" opacity="0.4"/>

 <!-- LARGE GOBLET-SHAPED BLOOM — KEY GESTURE: 6-9 broad petals -->
 <!-- Back petals (lower layer) -->
 <path d="M16 19 Q9 14 8 7 Q13 12 16 19 Z" fill="url(#mag_petal2)"/>
 <path d="M13 17 Q9.5 12 9.5 8.5" stroke="#FFFFFF" stroke-width="0.4" fill="none" opacity="0.4"/>
 <path d="M16 19 Q23 14 24 7 Q19 12 16 19 Z" fill="url(#mag_petal2)"/>
 <path d="M19 17 Q22.5 12 22.5 8.5" stroke="#FFFFFF" stroke-width="0.4" fill="none" opacity="0.4"/>
 <path d="M16 19 Q16 8 16 3 Q17 10 16 19 Z" fill="url(#mag_petal)"/>
 <path d="M15.5 18 Q15.5 10 16 4.5" stroke="#FFFFFF" stroke-width="0.4" fill="none" opacity="0.4"/>

 <!-- Middle petals -->
 <path d="M16 19 Q5 15 4 10 Q11 14 16 19 Z" fill="url(#mag_petal)"/>
 <path d="M12 17.5 Q7 14 5.5 11" stroke="#FFFFFF" stroke-width="0.4" fill="none" opacity="0.4"/>
 <ellipse cx="10" cy="17" rx="1.3" ry="0.8" fill="url(#mag_hl)" transform="rotate(-20 10 17)"/>
 <path d="M16 19 Q27 15 28 10 Q21 14 16 19 Z" fill="url(#mag_petal)"/>
 <path d="M20 17.5 Q25 14 26.5 11" stroke="#FFFFFF" stroke-width="0.4" fill="none" opacity="0.4"/>
 <ellipse cx="22" cy="17" rx="1.3" ry="0.8" fill="url(#mag_hl)" transform="rotate(20 22 17)"/>

 <!-- Front cupping petals — completes goblet -->
 <path d="M16 19 Q9 19 7 23 Q12 20.5 16 19 Z" fill="url(#mag_petal)"/>
 <path d="M16 19 Q23 19 25 23 Q20 20.5 16 19 Z" fill="url(#mag_petal)"/>

 <!-- Highlight on main petals -->
 <ellipse cx="16" cy="13" rx="2" ry="4" fill="url(#mag_hl)" opacity="0.6"/>

 <!-- Centre stamens cluster — KEY GESTURE -->
 <circle cx="16" cy="19" r="2.8" fill="url(#mag_centre)"/>
 <circle cx="16" cy="19" r="2" fill="#B8860B"/>
 <circle cx="15.2" cy="18.4" r="0.38" fill="#FFD45E"/>
 <circle cx="16.8" cy="18.4" r="0.38" fill="#FFD45E"/>
 <circle cx="15.5" cy="19.6" r="0.38" fill="#FFD45E"/>
 <circle cx="16.5" cy="19.6" r="0.38" fill="#FFD45E"/>
 <circle cx="16" cy="18.2" r="0.35" fill="#FFFDE7"/>
</svg>
