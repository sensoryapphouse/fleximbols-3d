 <defs>
 <radialGradient id="dhl-petal-outer" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ff60a0"/>
 <stop offset="100%" stop-color="#c01860"/>
 </radialGradient>
 <radialGradient id="dhl-petal-mid" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ff80b8"/>
 <stop offset="100%" stop-color="#d03070"/>
 </radialGradient>
 <radialGradient id="dhl-centre" cx="40%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#ff90c0"/>
 <stop offset="100%" stop-color="#c82868"/>
 </radialGradient>
 <linearGradient id="dhl-stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#3a7010"/>
 <stop offset="100%" stop-color="#5a9020"/>
 </linearGradient>
 <linearGradient id="dhl-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#6aaa20"/>
 <stop offset="100%" stop-color="#386010"/>
 </linearGradient>
 </defs>
 <!-- Stem -->
 <line x1="16" y1="20" x2="16" y2="30" stroke="url(#dhl-stem)" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Two leaves -->
 <ellipse cx="12.5" cy="25" rx="4" ry="1.5" fill="url(#dhl-leaf)" transform="rotate(-20 12.5 25)"/>
 <ellipse cx="19.5" cy="26" rx="4" ry="1.5" fill="url(#dhl-leaf)" transform="rotate(20 19.5 26)"/>
 <!-- Outer ring petals (12 petals) -->
 
 <!-- Mid ring petals (8 petals, slightly smaller) -->
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(15 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(60 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(105 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(150 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(195 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(240 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(285 16 16)"/>
 <ellipse cx="16" cy="9.5" rx="1.2" ry="3.5" fill="url(#dhl-petal-mid)" transform="rotate(330 16 16)"/>
 <!-- Centre disk -->
 <circle cx="16" cy="16" r="3.5" fill="url(#dhl-centre)"/>
 <circle cx="15.2" cy="15" r="0.9" fill="white" fill-opacity="0.4"/>
</svg>
