 <defs>
 <!-- Ruffled frilly petals — pink/red KEY GESTURE -->
 <radialGradient id="car_petal" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FFB3C1"/>
 <stop offset="55%" stop-color="#FF8FAB"/>
 <stop offset="100%" stop-color="#D63060"/>
 </radialGradient>
 <radialGradient id="car_petal2" cx="30%" cy="25%" r="72%">
 <stop offset="0%" stop-color="#FF8FAB"/>
 <stop offset="50%" stop-color="#E0405A"/>
 <stop offset="100%" stop-color="#9B1535"/>
 </radialGradient>
 <radialGradient id="car_hl" cx="30%" cy="22%" r="55%">
 <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
 <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="car_stem" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#7BAA48"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <radialGradient id="car_leaf" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#90A96E"/>
 <stop offset="100%" stop-color="#4A6741"/>
 </radialGradient>
 <radialGradient id="car_calyx" cx="30%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#8BC34A"/>
 <stop offset="100%" stop-color="#33691E"/>
 </radialGradient>
 </defs>

 <!-- Thin green stem -->
 <path d="M16 26 Q15.5 28.5 15 31" stroke="url(#car_stem)" stroke-width="1.3" fill="none" stroke-linecap="round"/>

 <!-- Narrow grey-green leaves -->
 <path d="M15.8 28 Q12 26 11 22 Q13.5 25 15.5 28 Z" fill="url(#car_leaf)"/>
 <path d="M15.8 28 Q19.5 26.5 20 22 Q18 25 16 28 Z" fill="url(#car_leaf)"/>

 <!-- Calyx (green tube at base of flower) -->
 <path d="M13 22 Q13.5 25 16 25.5 Q18.5 25 19 22 Q17.5 23.5 16 23.5 Q14.5 23.5 13 22 Z" fill="url(#car_calyx)"/>
 <!-- Calyx tips -->
 <path d="M13 22 L12 20 L13.5 22 Z" fill="url(#car_calyx)"/>
 <path d="M16 22 L16 19.5 L16.2 22 Z" fill="url(#car_calyx)"/>
 <path d="M19 22 L20 20 L18.5 22 Z" fill="url(#car_calyx)"/>

 <!-- RUFFLED DENSELY-FRILLY PETALS — KEY GESTURE: serrated wave edges, many layers -->
 <!-- Back layer of frilled petals -->
 <path d="M16 22 Q9 19 8 13 Q9 12 10 14 Q10.5 11 11.5 13 Q12 10.5 13 13 Q13.5 10 14.5 12.5 Q15 9.5 16 12 Q16 9.5 17 12.5 Q17.5 10 18.5 13 Q19 10.5 20 13 Q20.5 11 21.5 13 Q22 12 23 14 Q24 11 24 13 Q23 19 16 22 Z" fill="url(#car_petal2)"/>

 <!-- Middle layer frilly -->
 <path d="M16 21.5 Q10.5 18.5 9.5 13.5 Q10.5 12.5 11 14 Q11.5 11.5 12.5 13.5 Q13 11 14 13 Q14.5 10.5 15.5 13 Q16 10 16.5 13 Q17 10.5 18 13 Q18.5 11 19.5 13.5 Q20.5 11.5 21 14 Q21.5 12.5 22.5 13.5 Q21.5 18.5 16 21.5 Z" fill="url(#car_petal)"/>
 <ellipse cx="16" cy="17" rx="6" ry="4" fill="url(#car_hl)" opacity="0.5"/>

 <!-- Front top layer — tight ruffled fringe at top -->
 <path d="M16 19 Q11 17 10.5 13 Q11.5 12 12 13.5 Q12.5 11 13.5 13 Q14 10.5 15 12.5 Q15.5 10 16 12 Q16.5 10 17 12.5 Q17.5 10.5 18.5 13 Q19.5 11 20 13.5 Q20.5 12 21.5 13 Q21 17 16 19 Z" fill="url(#car_petal)"/>
 <ellipse cx="16" cy="15.5" rx="5" ry="3" fill="url(#car_hl)" opacity="0.45"/>

 <!-- Top frilled crown -->
 <path d="M16 17.5 Q12.5 16 12.5 13 Q13 12 13.5 13.5 Q14 11.5 14.8 13 Q15.2 11 16 12.5 Q16.8 11 17.2 13 Q18 11.5 18.5 13.5 Q19 12 19.5 13 Q19.5 16 16 17.5 Z" fill="url(#car_petal2)"/>
 <ellipse cx="16" cy="14.5" rx="3.5" ry="2" fill="url(#car_hl)" opacity="0.5"/>
</svg>
