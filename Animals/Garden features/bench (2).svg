 <defs>
 <linearGradient id="benchSlat" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#d0a060"/>
 <stop offset="100%" stop-color="#a07030"/>
 </linearGradient>
 <linearGradient id="benchBack" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#c89050"/>
 <stop offset="100%" stop-color="#987028"/>
 </linearGradient>
 <linearGradient id="benchLeg" x1="0" y1="0" x2="1" y2="0">
