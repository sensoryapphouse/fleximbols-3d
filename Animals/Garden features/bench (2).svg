 <!-- drop shadow -->
 <!-- metal frame legs -->
 <path d="M7,22 L7,29" stroke="url(#benchLeg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
 <path d="M25,22 L25,29" stroke="url(#benchLeg)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
