 <defs>
 <radialGradient id="degu-body" cx="40%" cy="35%" r="65%">
 <stop offset="0%" stop-color="#c0a878"/>
 <stop offset="55%" stop-color="#907848"/>
 <stop offset="100%" stop-color="#605030"/>
 </radialGradient>
 <radialGradient id="degu-belly" cx="45%" cy="40%" r="60%">
 <stop offset="0%" stop-color="#e8d8b0"/>
 <stop offset="100%" stop-color="#c8b880"/>
 </radialGradient>
 <radialGradient id="degu-head" cx="35%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#b89870"/>
 <stop offset="60%" stop-color="#886840"/>
 <stop offset="100%" stop-color="#584828"/>
 </radialGradient>
 <linearGradient id="degu-ear" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#c0a878"/>
 <stop offset="100%" stop-color="#785840"/>
 </linearGradient>
 <linearGradient id="degu-tail" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#787060"/>
 <stop offset="100%" stop-color="#504840"/>
 </linearGradient>
 </defs>
 <!-- Plump rounded body (perched on hind legs, nibbling) -->
 
 <!-- Paler underbelly -->
 <ellipse cx="16" cy="21" rx="4" ry="6" fill="url(#degu-belly)" fill-opacity="0.6"/>
 <!-- Head (rounded, large) -->
 
 <!-- Large rounded ears -->
 <ellipse cx="11.5" cy="6.5" rx="2.8" ry="3.2" fill="url(#degu-ear)"/>
 <ellipse cx="12" cy="6.8" rx="1.6" ry="2.1" fill="#f0c0a0" fill-opacity="0.5"/>
 <ellipse cx="20.5" cy="6.5" rx="2.8" ry="3.2" fill="url(#degu-ear)"/>
 <ellipse cx="20" cy="6.8" rx="1.6" ry="2.1" fill="#f0c0a0" fill-opacity="0.5"/>
 <!-- Eyes (large, bright dark) -->
 <circle cx="13.5" cy="10" r="1.5" fill="#101008"/>
 <circle cx="13.1" cy="9.6" r="0.55" fill="white" fill-opacity="0.75"/>
 <circle cx="18.5" cy="10" r="1.5" fill="#101008"/>
 <circle cx="18.1" cy="9.6" r="0.55" fill="white" fill-opacity="0.75"/>
 <!-- Nose (small) -->
 <ellipse cx="16" cy="13.5" rx="0.8" ry="0.6" fill="#583828"/>
 <!-- Front paws raised to mouth (nibbling) -->
 <ellipse cx="13" cy="18" rx="1.5" ry="1" fill="#888060" transform="rotate(-20 13 18)"/>
 <ellipse cx="19" cy="18" rx="1.5" ry="1" fill="#888060" transform="rotate(20 19 18)"/>
 <!-- Food item being nibbled -->
 <rect x="14.5" y="15.5" width="3" height="1.5" rx="0.5" fill="#c8a840"/>
 <!-- Hind legs -->
 <ellipse cx="12.5" cy="27" rx="2.5" ry="1.5" fill="#706048"/>
 <ellipse cx="19.5" cy="27" rx="2.5" ry="1.5" fill="#706048"/>
 <!-- Long slim tail with tufted tip -->
 <path d="M16,27.5 Q20,28.5 24,27 Q27,26 28,24" fill="none" stroke="url(#degu-tail)" stroke-width="1.5" stroke-linecap="round"/>
 <!-- Tuft at tip -->
 <ellipse cx="28.2" cy="23.5" rx="1.5" ry="0.8" fill="#383028" transform="rotate(-30 28.2 23.5)"/>
</svg>
