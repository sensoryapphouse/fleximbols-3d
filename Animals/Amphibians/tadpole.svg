<defs>
<radialGradient id="body" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#5A6878"/><stop offset="100%" stop-color="#0E1320"/></radialGradient>
<radialGradient id="tail" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#7A8898"/><stop offset="100%" stop-color="#1A2230"/></radialGradient>
<radialGradient id="water" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7BC8E6" stop-opacity="0.3"/><stop offset="100%" stop-color="#0E4878" stop-opacity="0.1"/></radialGradient>
<radialGradient id="hi" cx="30%" cy="25%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
</defs>
<!-- water tint -->
<ellipse cx="16" cy="16" rx="15" ry="13" fill="url(#water)"/>
<!-- big rounded head -->
<ellipse cx="11" cy="14" rx="7" ry="6" fill="url(#body)"/>
<!-- highlight on head -->
<ellipse cx="8" cy="11" rx="2.5" ry="2" fill="url(#hi)"/>
<!-- single eye -->
<circle cx="8" cy="13" r="1" fill="#FFFFFF"/>
<circle cx="8" cy="13" r="0.5" fill="#1A1F2C"/>
<circle cx="7.8" cy="12.8" r="0.18" fill="#FFFFFF"/>
<!-- wavy tail -->
<path d="M18 14 Q 22 12 24 15 Q 26 18 28 14 Q 29 12 30 14" stroke="url(#tail)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M28 14 L 30 13 L 30 15 Z" fill="url(#tail)"/>
<!-- bubbles -->
<circle cx="3" cy="6" r="0.4" fill="#FFFFFF" opacity="0.6"/>
<circle cx="5" cy="4" r="0.3" fill="#FFFFFF" opacity="0.6"/>
<circle cx="2" cy="22" r="0.3" fill="#FFFFFF" opacity="0.6"/>
