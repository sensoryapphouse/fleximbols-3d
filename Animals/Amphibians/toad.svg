 <defs>
 <linearGradient id="tod_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#8D6E63"/>
 <stop offset="100%" stop-color="#4E342E"/>
 </linearGradient>
 <linearGradient id="tod_belly" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#D7CCC8"/>
 <stop offset="100%" stop-color="#A1887F"/>
 </linearGradient>
 <linearGradient id="tod_eye" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FFD54F"/>
 <stop offset="100%" stop-color="#F57F17"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Body (wide, flat, squatting) -->
 <ellipse cx="16" cy="22" rx="12" ry="8" fill="url(#tod_body)"/>
 <!-- Belly (lighter) -->
 <ellipse cx="16" cy="24" rx="9" ry="5" fill="url(#tod_belly)" fill-opacity="0.7"/>
 <!-- Warty bumps on body -->
 <circle cx="10" cy="20" r="1" fill="#6D4C41" fill-opacity="0.6"/>
 <circle cx="13" cy="18" r="1.2" fill="#6D4C41" fill-opacity="0.5"/>
 <circle cx="17" cy="17.5" r="1" fill="#6D4C41" fill-opacity="0.6"/>
 <circle cx="21" cy="19" r="1.2" fill="#6D4C41" fill-opacity="0.5"/>
 <circle cx="22" cy="22" r="0.8" fill="#6D4C41" fill-opacity="0.5"/>
 <circle cx="8" cy="22" r="0.8" fill="#6D4C41" fill-opacity="0.5"/>
 <circle cx="15" cy="20.5" r="0.7" fill="#6D4C41" fill-opacity="0.4"/>
 <circle cx="19" cy="21" r="0.7" fill="#6D4C41" fill-opacity="0.4"/>
 <!-- Parotoid glands (behind eyes - large wart-like) -->
 <ellipse cx="11" cy="16" rx="2.5" ry="1.5" fill="#5D4037" fill-opacity="0.7"/>
 <ellipse cx="21" cy="16" rx="2.5" ry="1.5" fill="#5D4037" fill-opacity="0.7"/>
 <!-- Head (merged with body, toad-like) -->
 <ellipse cx="16" cy="17" rx="8" ry="6" fill="url(#tod_body)"/>
 <!-- Eyes (golden, prominent) -->
 <circle cx="12" cy="15" r="2.5" fill="url(#tod_eye)"/>
 <circle cx="12" cy="15" r="2.5" fill="none" stroke="#4E342E" stroke-width="0.6"/>
 <ellipse cx="12" cy="15" rx="0.8" ry="2" fill="#1a2a4a"/>
 <circle cx="11.5" cy="14" r="0.7" fill="white" fill-opacity="0.7"/>
 <circle cx="20" cy="15" r="2.5" fill="url(#tod_eye)"/>
 <circle cx="20" cy="15" r="2.5" fill="none" stroke="#4E342E" stroke-width="0.6"/>
 <ellipse cx="20" cy="15" rx="0.8" ry="2" fill="#1a2a4a"/>
 <circle cx="19.5" cy="14" r="0.7" fill="white" fill-opacity="0.7"/>
 <!-- Nostrils (small) -->
 <ellipse cx="14.5" cy="18" rx="0.5" ry="0.4" fill="#3E2723"/>
 <ellipse cx="17.5" cy="18" rx="0.5" ry="0.4" fill="#3E2723"/>
 <!-- Mouth (wide) -->
 <path d="M10 20 Q16 22 22 20" stroke="#3E2723" stroke-width="0.8" fill="none" stroke-linecap="round"/>
 <!-- Front legs (short) -->
 <path d="M6 23 Q4 26 3 28" stroke="url(#tod_body)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <path d="M26 23 Q28 26 29 28" stroke="url(#tod_body)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
 <!-- Front toes -->
 <line x1="3" y1="28" x2="1" y2="29.5" stroke="#4E342E" stroke-width="0.8"/>
 <line x1="3" y1="28" x2="3" y2="30" stroke="#4E342E" stroke-width="0.8"/>
 <line x1="3" y1="28" x2="5" y2="29.5" stroke="#4E342E" stroke-width="0.8"/>
 <line x1="29" y1="28" x2="27" y2="29.5" stroke="#4E342E" stroke-width="0.8"/>
 <line x1="29" y1="28" x2="29" y2="30" stroke="#4E342E" stroke-width="0.8"/>
 <line x1="29" y1="28" x2="31" y2="29.5" stroke="#4E342E" stroke-width="0.8"/>
 <!-- Back legs (short, fat, folded under) -->
 <path d="M9 28 Q8 30 7 31" stroke="url(#tod_body)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <path d="M23 28 Q24 30 25 31" stroke="url(#tod_body)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
