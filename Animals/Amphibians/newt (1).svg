 <!-- Water surface -->
 <path d="M1 22 Q5 20 9 22 Q13 24 17 22 Q21 20 25 22 Q29 24 32 22 L32 32 L1 32 Z" fill="url(#nwt_water)" fill-opacity="0.5"/>
