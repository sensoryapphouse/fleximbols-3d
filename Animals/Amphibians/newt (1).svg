 <stop offset="0%" stop-color="#5D4037"/>
 <stop offset="100%" stop-color="#2E1503"/>
 </linearGradient>
 <linearGradient id="nwt_belly" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#FF7043"/>
 <stop offset="100%" stop-color="#BF360C"/>
