 <path d="M9 23 Q8 25 7 27" stroke="url(#nwt_back)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
 <path d="M11 24 Q10 26 9 28" stroke="url(#nwt_back)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
