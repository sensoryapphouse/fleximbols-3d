 <defs>
 <radialGradient id="bu_body" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#c88840"/><stop offset="60%" stop-color="#8a5010"/><stop offset="100%" stop-color="#4a2800"/></radialGradient>
 <radialGradient id="bu_face" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#d49850"/><stop offset="70%" stop-color="#a06020"/><stop offset="100%" stop-color="#5a3000"/></radialGradient>
 <radialGradient id="bu_muzzle" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#f0d0b0"/><stop offset="100%" stop-color="#d4a880"/></radialGradient>
 <radialGradient id="bu_horn" cx="40%" cy="30%" r="60%"><stop offset="0%" stop-color="#f0e0a0"/><stop offset="100%" stop-color="#b09040"/></radialGradient>
 </defs>
 <!-- body - large, muscular -->
 <ellipse cx="18" cy="23" rx="11" ry="7" fill="url(#bu_body)"/>
 <!-- legs -->
 <rect x="9" y="27" width="3.5" height="4" rx="1.5" fill="url(#bu_body)"/>
 <rect x="14" y="27" width="3.5" height="4" rx="1.5" fill="url(#bu_body)"/>
 <rect x="20" y="27" width="3.5" height="4" rx="1.5" fill="url(#bu_body)"/>
 <rect x="25" y="27" width="3.5" height="4" rx="1.5" fill="url(#bu_body)"/>
 <!-- neck -->
 <ellipse cx="9" cy="21" rx="5" ry="4" fill="url(#bu_body)"/>
 <!-- head -->
 <ellipse cx="7" cy="17" rx="7" ry="6" fill="url(#bu_face)"/>
 <!-- horns -->
 <path d="M4 13 Q2 8 5 6" fill="none" stroke="url(#bu_horn)" stroke-width="2.5" stroke-linecap="round"/>
 <path d="M10 12 Q12 7 10 5" fill="none" stroke="url(#bu_horn)" stroke-width="2.5" stroke-linecap="round"/>
 <!-- muzzle -->
 <ellipse cx="5" cy="19" rx="4" ry="3" fill="url(#bu_muzzle)"/>
 <!-- nostrils -->
 <ellipse cx="3.5" cy="19.5" rx="1" ry="0.8" fill="#c08870"/>
 <ellipse cx="6.5" cy="19.5" rx="1" ry="0.8" fill="#c08870"/>
 <!-- eyes -->
 <circle cx="4.5" cy="15.5" r="1.2" fill="#1a1a1a"/>
 <circle cx="4.1" cy="15.1" r="0.4" fill="#fff" fill-opacity="0.7"/>
 <!-- ears -->
 <ellipse cx="13" cy="16" rx="2.5" ry="2" fill="url(#bu_face)" transform="rotate(-20,13,16)"/>
 <!-- tail -->
 <path d="M29 20 Q32 18 32 22" fill="none" stroke="#8a5010" stroke-width="1.5" stroke-linecap="round"/>
</svg>