 <defs>
 <linearGradient id="grs_body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#7CB342"/>
 <stop offset="100%" stop-color="#33691E"/>
 </linearGradient>
 <linearGradient id="grs_wing" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#AED581"/>
 <stop offset="100%" stop-color="#558B2F"/>
 </linearGradient>
 <linearGradient id="grs_leg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#558B2F"/>
 <stop offset="100%" stop-color="#1B5E20"/>
 </linearGradient>
 <linearGradient id="grs_bigleg" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#7CB342"/>
 <stop offset="100%" stop-color="#2E7D32"/>
 </linearGradient>
 </defs>
 <!-- Drop shadow -->
 <!-- Body (abdomen, elongated) -->
 <path d="M12 18 Q14 16 20 15 Q26 14 28 17 Q27 22 24 24 Q20 26 15 25 Q12 24 12 18 Z" fill="url(#grs_body)"/>
 <!-- Abdomen segments -->
 <line x1="17" y1="15.5" x2="16.5" y2="24.5" stroke="#33691E" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="20" y1="15" x2="19.5" y2="24" stroke="#33691E" stroke-width="0.4" stroke-opacity="0.5"/>
 <line x1="23" y1="15.5" x2="22" y2="23.5" stroke="#33691E" stroke-width="0.4" stroke-opacity="0.5"/>
 <!-- Thorax -->
 <ellipse cx="12" cy="19" rx="5" ry="5" fill="url(#grs_body)"/>
 <!-- Pronotum (shield over thorax) -->
 <path d="M8 17 Q12 15 16 17 Q14 21 12 22 Q9 21 8 17 Z" fill="#558B2F"/>
 <!-- Wings folded -->
 <path d="M14 16 Q20 13 26 15 Q25 18 20 18 Q16 19 14 16 Z" fill="url(#grs_wing)" fill-opacity="0.7"/>
 <!-- Head -->
 <ellipse cx="7" cy="17" rx="4" ry="4.5" fill="url(#grs_body)"/>
 <!-- Eye (large compound) -->
 <ellipse cx="6" cy="16" rx="2" ry="2" fill="#1A3A1A"/>
 <ellipse cx="6" cy="16" rx="1.5" ry="1.5" fill="#2E7D32"/>
 <circle cx="5.5" cy="15.5" r="0.6" fill="white" fill-opacity="0.8"/>
 <!-- Antennae (long) -->
 <path d="M5 14 Q3 9 2 5" stroke="#558B2F" stroke-width="0.7" fill="none" stroke-linecap="round"/>
 <path d="M7 14 Q8 9 9 5" stroke="#558B2F" stroke-width="0.7" fill="none" stroke-linecap="round"/>
 <!-- Mouth -->
 <path d="M5 19 Q7 20.5 9 19" stroke="#1B5E20" stroke-width="0.5" fill="none"/>
 <!-- Small front legs -->
 <path d="M9 21 Q7 23 6 26" stroke="url(#grs_leg)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <path d="M12 23 Q10 25 9 28" stroke="url(#grs_leg)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <!-- Middle legs -->
 <path d="M13 22 Q15 24 16 27" stroke="url(#grs_leg)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
 <!-- BIG rear jumping legs (L-shape bent) -->
 <!-- Femur (thick upper part) -->
 <path d="M14 21 Q14 15 18 13" stroke="url(#grs_bigleg)" stroke-width="3" fill="none" stroke-linecap="round"/>
 <!-- Tibia (long lower spike) -->
 <path d="M18 13 Q22 17 24 22" stroke="url(#grs_bigleg)" stroke-width="2" fill="none" stroke-linecap="round"/>
 <!-- Foot spikes -->
 <line x1="22" y1="20" x2="23" y2="22" stroke="#1B5E20" stroke-width="0.7"/>
 <line x1="23" y1="21" x2="24" y2="23" stroke="#1B5E20" stroke-width="0.7"/>
 <line x1="24" y1="22" x2="25" y2="24" stroke="#1B5E20" stroke-width="0.7"/>
</svg>
