<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#40c0f0"/>
 <stop offset="50%" stop-color="#2080e0"/>
 <stop offset="100%" stop-color="#4040c0"/>
 </linearGradient>
 <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#80e8ff" stop-opacity="0.6"/>
 <stop offset="100%" stop-color="#8080ff" stop-opacity="0"/>
 </linearGradient>
 <linearGradient id="hzLetterH" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e0a030"/>
 <stop offset="100%" stop-color="#a06010"/>
 </linearGradient>
 <linearGradient id="hzLetterZ" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#e84040"/>
 <stop offset="100%" stop-color="#901010"/>
 </linearGradient>
 <filter id="waveGlowFilter">
 <feGaussianBlur stdDeviation="0.5" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- Baseline -->
 <line x1="2" y1="16" x2="30" y2="16" stroke="#aaaaaa" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.4"/>
 <!-- Sine wave (single oscillation cycle) -->
 
 <!-- Glow overlay -->
 <path d="M2 16 Q5 6 10 16 Q15 26 20 16 Q23 9 26 16" fill="none" stroke="url(#waveGlow)" stroke-width="3.5"/>
 <!-- Amplitude markers -->
 <line x1="10" y1="26" x2="10" y2="16" stroke="#4080c0" stroke-width="0.5" stroke-dasharray="1.5,1.5" opacity="0.5"/>
 <line x1="20" y1="6" x2="20" y2="16" stroke="#4080c0" stroke-width="0.5" stroke-dasharray="1.5,1.5" opacity="0.5"/>
 <!-- 'H' letter using shapes (no text element) -->
 <!-- Left vertical bar of H -->
 <rect x="27" y="5" width="1.5" height="8" rx="0.5" fill="url(#hzLetterH)"/>
 <!-- Right vertical bar of H -->
 <rect x="30" y="5" width="1.5" height="8" rx="0.5" fill="url(#hzLetterH)"/>
 <!-- Crossbar of H -->
 <rect x="27" y="8.5" width="4.5" height="1.2" rx="0.4" fill="url(#hzLetterH)"/>
 <!-- 'z' letter using shapes -->
 <!-- Top bar of z -->
 <rect x="27" y="15" width="4.5" height="1.2" rx="0.4" fill="url(#hzLetterZ)"/>
 <!-- Diagonal of z -->
 <line x1="31.5" y1="15" x2="27" y2="21.5" stroke="url(#hzLetterZ)" stroke-width="1.2" stroke-linecap="round"/>
 <!-- Bottom bar of z -->
 <rect x="27" y="21" width="4.5" height="1.2" rx="0.4" fill="url(#hzLetterZ)"/>
</svg>
