 <defs>
 <linearGradient id="treeGrad" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0%" stop-color="#40a040"/>
 <stop offset="100%" stop-color="#186018"/>
 </linearGradient>
 <radialGradient id="appleGrad" cx="35%" cy="30%">
 <stop offset="0%" stop-color="#ff7060"/>
 <stop offset="100%" stop-color="#cc1010"/>
 </radialGradient>
 <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e05030"/>
 <stop offset="100%" stop-color="#a01008"/>
 </linearGradient>
 </defs>
 <!-- tree trunk -->
 <rect x="7" y="14" width="4" height="16" rx="1.2" fill="#8a5820"/>
 <!-- tree foliage layers -->
 
 <ellipse cx="9" cy="9" rx="6" ry="5" fill="url(#treeGrad)"/>
 <ellipse cx="9" cy="5" rx="4" ry="4" fill="url(#treeGrad)"/>
 <!-- branch where apple was -->
 <line x1="13" y1="10" x2="17" y2="8" stroke="#8a5820" stroke-width="1" stroke-linecap="round"/>
 <!-- falling apple (mid-fall) -->
 
 <circle cx="19" cy="15" r="1.2" fill="#ffffff" fill-opacity="0.35"/>
 <!-- apple stem -->
 <line x1="20" y1="13" x2="21" y2="11" stroke="#5a3010" stroke-width="0.8" stroke-linecap="round"/>
 <!-- motion lines (falling) -->
 <line x1="19" y1="11" x2="19" y2="8" stroke="#c04020" stroke-width="0.6" stroke-opacity="0.6" stroke-dasharray="1.5,1"/>
 <line x1="21" y1="11" x2="21" y2="8.5" stroke="#c04020" stroke-width="0.5" stroke-opacity="0.5" stroke-dasharray="1.5,1"/>
 <!-- downward arrow -->
 <line x1="26" y1="6" x2="26" y2="26" stroke="url(#arrowGrad)" stroke-width="2"/>
 <path d="M23 23 L26 29 L29 23Z" fill="url(#arrowGrad)"/>
</svg>
