 <defs>
 <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0%" stop-color="#4a90d9"/>
 <stop offset="50%" stop-color="#a040d0"/>
 <stop offset="100%" stop-color="#4a90d9"/>
 </linearGradient>
 <linearGradient id="tickGrad" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0%" stop-color="#e05030"/>
 <stop offset="100%" stop-color="#a02010"/>
 </linearGradient>
 <filter id="glow">
 <feGaussianBlur stdDeviation="0.5" result="blur"/>
 <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 </defs>
 <!-- axis line -->
 <line x1="2" y1="16" x2="30" y2="16" stroke="#c0c8d0" stroke-width="0.8"/>
 <!-- sine wave path -->
 <path d="M2 16 Q5 6 8 16 Q11 26 14 16 Q17 6 20 16 Q23 26 26 16 Q29 10 30 16"
 stroke="url(#waveGrad)" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glow)"/>
 <!-- tick marks -->
 <rect x="7.5" y="10" width="1" height="12" rx="0.3" fill="url(#tickGrad)" fill-opacity="0.8"/>
 <rect x="13.5" y="10" width="1" height="12" rx="0.3" fill="url(#tickGrad)" fill-opacity="0.8"/>
 <rect x="19.5" y="10" width="1" height="12" rx="0.3" fill="url(#tickGrad)" fill-opacity="0.8"/>
 <!-- small Hz label dots (decorative) -->
 <circle cx="8" cy="7" r="1.2" fill="#e05030" fill-opacity="0.8"/>
 <circle cx="14" cy="7" r="1.2" fill="#e05030" fill-opacity="0.8"/>
 <circle cx="20" cy="7" r="1.2" fill="#e05030" fill-opacity="0.8"/>
</svg>
