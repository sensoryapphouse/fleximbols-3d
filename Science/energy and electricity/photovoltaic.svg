<defs>
<linearGradient id="pv_panel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4a90d9"/>
<stop offset="1" stop-color="#2a5f9e"/>
</linearGradient>
<linearGradient id="pv_cell" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6fb0ef"/>
<stop offset="1" stop-color="#356bb0"/>
</linearGradient>
<radialGradient id="pv_sun" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#fff19a"/>
<stop offset="1" stop-color="#ffc230"/>
</radialGradient>
<linearGradient id="pv_post" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#9aa0a8"/>
<stop offset="1" stop-color="#5a606a"/>
</linearGradient>
<filter id="pv_sh" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
</filter>
</defs>

<!-- ground shadow -->
<ellipse cx="92" cy="178" rx="64" ry="9" fill="#000" opacity="0.08"/>

<!-- sun (behind, top right) -->
<g>
<g stroke="#ffb52e" stroke-width="5" stroke-linecap="round">
<line x1="158" y1="40" x2="158" y2="26"/>
<line x1="180" y1="62" x2="194" y2="62"/>
<line x1="158" y1="84" x2="158" y2="98"/>
<line x1="136" y1="62" x2="122" y2="62"/>
<line x1="174" y1="46" x2="184" y2="36"/>
<line x1="174" y1="78" x2="184" y2="88"/>
<line x1="142" y1="78" x2="132" y2="88"/>
<line x1="142" y1="46" x2="132" y2="36"/>
</g>
<circle cx="158" cy="62" r="22" fill="url(#pv_sun)" stroke="#f0a824" stroke-width="2"/>
</g>

<!-- post / stand -->
<rect x="62" y="116" width="8" height="56" rx="3" fill="url(#pv_post)"/>
<rect x="40" y="168" width="52" height="7" rx="3" fill="url(#pv_post)"/>

<!-- solar panel (tilted) -->
<g filter="url(#pv_sh)" transform="translate(66 86) rotate(-12) translate(-66 -86)">
<rect x="20" y="56" width="92" height="62" rx="4" fill="url(#pv_panel)" stroke="#1f4a7c" stroke-width="3"/>
<!-- cell grid -->
<g fill="url(#pv_cell)" stroke="#1f4a7c" stroke-width="1.5">
<rect x="25" y="61" width="26" height="16"/>
<rect x="53" y="61" width="26" height="16"/>
<rect x="81" y="61" width="26" height="16"/>
<rect x="25" y="79" width="26" height="16"/>
<rect x="53" y="79" width="26" height="16"/>
<rect x="81" y="79" width="26" height="16"/>
<rect x="25" y="97" width="26" height="16"/>
<rect x="53" y="97" width="26" height="16"/>
<rect x="81" y="97" width="26" height="16"/>
</g>
<!-- gloss streak -->
<path d="M28 64 L 44 64 L 30 114 L 25 114 Z" fill="#ffffff" opacity="0.18"/>
</g>
</svg>
