<defs>
<radialGradient id="skG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE4C8"/><stop offset="0.5" stop-color="#E0A878"/><stop offset="1" stop-color="#6E3E1A"/></radialGradient>
<radialGradient id="hG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#4A2A10"/><stop offset="1" stop-color="#1A0A00"/></radialGradient>
<radialGradient id="shG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#8A2A2A"/><stop offset="0.5" stop-color="#4A0A0A"/><stop offset="1" stop-color="#200000"/></radialGradient>
<radialGradient id="cbG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#3A3A48"/><stop offset="0.5" stop-color="#1A1A24"/><stop offset="1" stop-color="#000008"/></radialGradient>
<radialGradient id="wG" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#D8D8E0"/><stop offset="1" stop-color="#6A6A78"/></radialGradient>
</defs>
<!-- producer figure (left) -->
<!-- head -->
<circle cx="10" cy="10" r="3.6" fill="url(#skG)"/>
<!-- hair (slicked) -->
<path d="M6.5 9.5 Q6.5 6 10 6 Q13.5 6 13.5 9.5 Q12 7.5 10 7.8 Q8 7.5 6.5 9.5 Z" fill="url(#hG)"/>
<!-- eyes -->
<circle cx="8.7" cy="10" r="0.35" fill="#1A0A00"/>
<circle cx="11.3" cy="10" r="0.35" fill="#1A0A00"/>
<!-- smile -->
<path d="M8.7 11.7 Q10 12.4 11.3 11.7" stroke="#6E3E1A" stroke-width="0.3" fill="none"/>
<!-- body in suit jacket -->
<path d="M4 28 L4 19 Q4 15 8 15 L12 15 Q16 15 16 19 L16 28 Z" fill="url(#shG)"/>
<!-- white shirt + tie -->
<path d="M9 15 L11 15 L11 22 L9 22 Z" fill="#FFFFFF"/>
<path d="M9.5 15 L10.5 15 L11.2 18 L10 22 L8.8 18 Z" fill="#1A1A24"/>
<!-- lapels -->
<path d="M8 15 L10 17 L8 19 Z" fill="#5A1A1A"/>
<path d="M12 15 L10 17 L12 19 Z" fill="#5A1A1A"/>
<!-- arm holding clapperboard up -->
<path d="M15 17 Q18 16 20 14" stroke="url(#shG)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<!-- clapperboard (right side) -->
<g transform="translate(22 14) rotate(-12)">
<!-- board body -->
<rect x="-7" y="0" width="14" height="9" rx="0.4" fill="url(#wG)"/>
<rect x="-7" y="0" width="14" height="1.2" fill="#FFFFFF" opacity="0.6"/>
<!-- horizontal lines on board -->
<line x1="-6" y1="3.5" x2="6" y2="3.5" stroke="#3A3A48" stroke-width="0.3"/>
<line x1="-6" y1="5" x2="6" y2="5" stroke="#3A3A48" stroke-width="0.3"/>
<line x1="-6" y1="6.5" x2="6" y2="6.5" stroke="#3A3A48" stroke-width="0.3"/>
<line x1="-6" y1="8" x2="6" y2="8" stroke="#3A3A48" stroke-width="0.3"/>
<!-- top arm with diagonal stripes -->
<rect x="-7" y="-3" width="14" height="2.2" rx="0.3" fill="url(#cbG)"/>
<g fill="#FFFFFF">
<polygon points="-7,-3 -5,-3 -6.2,-0.8 -7,-0.8"/>
<polygon points="-3,-3 -1,-3 -2.2,-0.8 -4.2,-0.8"/>
<polygon points="1,-3 3,-3 1.8,-0.8 -0.2,-0.8"/>
<polygon points="5,-3 7,-3 5.8,-0.8 3.8,-0.8"/>
</g>
<!-- hinge pin -->
<circle cx="-6.5" cy="-2" r="0.4" fill="#3A3A48"/>
</g>
</svg>
