<!-- steam: pot with bold rising vapor wisps (visible grey, not white) -->
<defs>
<radialGradient id="kt" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#eef3f8"/><stop offset="0.6" stop-color="#9aa6b1"/><stop offset="1" stop-color="#5a6770"/></radialGradient>
<linearGradient id="kt_rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd7df"/><stop offset="1" stop-color="#8a96a1"/></linearGradient>
</defs>
<!-- rising steam wisps (bold, grey so visible on white) -->
<g fill="none" stroke="#aeb8c2" stroke-width="1.7" stroke-linecap="round" opacity="0.95">
<path d="M10.5 17 C8.6 14.4 12.4 12.2 10.4 9.4 C9.2 7.7 10.6 6.4 9.8 5"/>
<path d="M16 17 C14.1 14.0 17.9 11.8 15.9 9.0 C14.7 7.3 16.1 6.0 15.3 4.4"/>
<path d="M21.5 17 C19.6 14.4 23.4 12.2 21.4 9.4 C20.2 7.7 21.6 6.4 20.8 5"/>
</g>
<!-- soft inner highlight on wisps -->
<g fill="none" stroke="#dfe6ec" stroke-width="0.6" stroke-linecap="round" opacity="0.8">
<path d="M10.5 16.4 C8.9 14.2 12.2 12.2 10.4 9.6"/>
<path d="M16 16.4 C14.4 14.2 17.7 12.2 15.9 9.6"/>
</g>
<!-- pot body -->
<path d="M6.5 18.2 Q6.5 16.6 8.2 16.6 L23.8 16.6 Q25.5 16.6 25.5 18.2 L24.8 24.4 Q24.6 26.4 22.6 26.4 L9.4 26.4 Q7.4 26.4 7.2 24.4 Z" fill="url(#kt)"/>
<!-- pot rim/lid -->
<ellipse cx="16" cy="16.8" rx="9.8" ry="1.8" fill="url(#kt_rim)"/>
<ellipse cx="16" cy="16.4" rx="8.4" ry="1.3" fill="#b6c0ca"/>
<!-- lid knob -->
<rect x="14.2" y="14.6" width="3.6" height="1.6" rx="0.6" fill="#5a6770"/>
<circle cx="16" cy="14.2" r="0.7" fill="#7a8690"/>
<!-- handles -->
<path d="M6.6 19 Q3.4 19 3.4 21.6 Q3.4 23.4 5.2 23.4" stroke="#5a6770" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M25.4 19 Q28.6 19 28.6 21.6 Q28.6 23.4 26.8 23.4" stroke="#5a6770" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<!-- body gloss -->
<ellipse cx="11.5" cy="20" rx="3.2" ry="0.7" fill="#ffffff" opacity="0.45"/>
</svg>
