 <defs>
 <linearGradient id="sp-handle" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#a0672a"/>
 <stop offset="100%" stop-color="#5a3010"/>
 </linearGradient>
 <linearGradient id="sp-blade" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#e0e0e0"/>
 <stop offset="100%" stop-color="#909090"/>
 </linearGradient>
 <linearGradient id="sp-pancake" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#f5c060"/>
 <stop offset="100%" stop-color="#c07020"/>
 </linearGradient>
 </defs>
 <!-- drop shadow -->
 <!-- handle (angled) -->
 <rect x="20" y="18" width="3.5" height="12" rx="1.7" fill="url(#sp-handle)" transform="rotate(-25 21.75 24)"/>
 <!-- highlight on handle -->
 <rect x="20.5" y="18.5" width="1" height="10" rx="0.5" fill="white" fill-opacity="0.2" transform="rotate(-25 21 23)"/>
 <!-- blade (wide flat) -->
 <rect x="4" y="15" width="18" height="5" rx="1" fill="url(#sp-blade)" transform="rotate(-8 13 17.5)"/>
 <rect x="4" y="15" width="18" height="1.2" rx="0.8" fill="white" fill-opacity="0.35" transform="rotate(-8 13 17.5)"/>
 <!-- pancake on blade -->
 <ellipse cx="11" cy="13" rx="7" ry="2.5" fill="url(#sp-pancake)" transform="rotate(-8 11 13)"/>
 <ellipse cx="11" cy="12.2" rx="6" ry="1.5" fill="#f0d080" fill-opacity="0.5" transform="rotate(-8 11 13)"/>
 <!-- blade holes -->
 <circle cx="8" cy="17.5" r="0.5" fill="#707070" transform="rotate(-8 8 17.5)"/>
 <circle cx="12" cy="17.5" r="0.5" fill="#707070" transform="rotate(-8 12 17.5)"/>
 <circle cx="16" cy="17.5" r="0.5" fill="#707070" transform="rotate(-8 16 17.5)"/>
</svg>
