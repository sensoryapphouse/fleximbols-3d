<defs>
<radialGradient id="ph_node" cx="0.4" cy="0.35" r="0.8">
<stop offset="0" stop-color="#9ec9f5"/>
<stop offset="1" stop-color="#4a86c8"/>
</radialGradient>
<linearGradient id="ph_fish" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb0e8"/><stop offset="1" stop-color="#2f6fb0"/></linearGradient>
<linearGradient id="ph_bird" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a4a"/><stop offset="1" stop-color="#c8521f"/></linearGradient>
<linearGradient id="ph_frog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc24a"/><stop offset="1" stop-color="#3a8a2a"/></linearGradient>
<filter id="ph_sh" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
</filter>
</defs>

<!-- taxonomy tree connectors (phylum -> members) -->
<g stroke="#7a8290" stroke-width="4" fill="none" stroke-linecap="round">
<line x1="100" y1="46" x2="100" y2="74"/>
<line x1="40" y1="92" x2="160" y2="92"/>
<line x1="40" y1="92" x2="40" y2="116"/>
<line x1="100" y1="92" x2="100" y2="116"/>
<line x1="160" y1="92" x2="160" y2="116"/>
</g>

<!-- top phylum node -->
<g filter="url(#ph_sh)">
<circle cx="100" cy="32" r="18" fill="url(#ph_node)" stroke="#2f5f96" stroke-width="3"/>
<!-- branch/tree glyph inside node -->
<g stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round">
<line x1="100" y1="40" x2="100" y2="24"/>
<line x1="92" y1="32" x2="108" y2="32"/>
</g>
<circle cx="100" cy="22" r="2.4" fill="#fff"/>
<circle cx="90" cy="32" r="2.4" fill="#fff"/>
<circle cx="110" cy="32" r="2.4" fill="#fff"/>
</g>

<!-- member 1: FISH (left) -->
<g filter="url(#ph_sh)" transform="translate(40 150)">
<ellipse cx="0" cy="0" rx="24" ry="14" fill="url(#ph_fish)" stroke="#1f4a7c" stroke-width="2.5"/>
<path d="M22 0 Q34 -10 34 0 Q34 10 22 0 Z" fill="url(#ph_fish)" stroke="#1f4a7c" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M-6 -13 Q4 -22 14 -13 Z" fill="#2f6fb0" stroke="#1f4a7c" stroke-width="2"/>
<circle cx="-12" cy="-2" r="3.5" fill="#fff" stroke="#1f4a7c" stroke-width="1.5"/>
<circle cx="-12.5" cy="-2" r="1.6" fill="#1a1a1a"/>
</g>

<!-- member 2: FROG (centre) -->
<g filter="url(#ph_sh)" transform="translate(100 150)">
<ellipse cx="0" cy="6" rx="24" ry="16" fill="url(#ph_frog)" stroke="#2a6a1f" stroke-width="2.5"/>
<circle cx="-11" cy="-10" r="9" fill="url(#ph_frog)" stroke="#2a6a1f" stroke-width="2.5"/>
<circle cx="11" cy="-10" r="9" fill="url(#ph_frog)" stroke="#2a6a1f" stroke-width="2.5"/>
<circle cx="-11" cy="-11" r="4.5" fill="#ffd400" stroke="#2a6a1f" stroke-width="1.5"/>
<circle cx="11" cy="-11" r="4.5" fill="#ffd400" stroke="#2a6a1f" stroke-width="1.5"/>
<circle cx="-11" cy="-11" r="2" fill="#1a1a1a"/>
<circle cx="11" cy="-11" r="2" fill="#1a1a1a"/>
<path d="M-9 6 Q0 13 9 6" stroke="#1a4a12" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</g>

<!-- member 3: BIRD (right) -->
<g filter="url(#ph_sh)" transform="translate(160 150)">
<ellipse cx="-2" cy="2" rx="20" ry="14" fill="url(#ph_bird)" stroke="#a8451c" stroke-width="2.5"/>
<circle cx="12" cy="-6" r="10" fill="url(#ph_bird)" stroke="#a8451c" stroke-width="2.5"/>
<polygon points="20,-6 33,-3 20,0" fill="#f0c030" stroke="#a8451c" stroke-width="2"/>
<circle cx="15" cy="-8" r="3" fill="#fff" stroke="#a8451c" stroke-width="1.2"/>
<circle cx="15.5" cy="-8" r="1.4" fill="#1a1a1a"/>
<path d="M-6 0 Q-22 -6 -16 6 Q-10 8 -4 4 Z" fill="#c8521f" stroke="#a8451c" stroke-width="2" stroke-linejoin="round"/>
</g>
</svg>
