 <defs>
 <linearGradient id="el-beaker" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#a8d8f0"/>
 <stop offset="100%" stop-color="#5898c8"/>
 </linearGradient>
 <linearGradient id="el-liquid" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#88c8f0"/>
 <stop offset="100%" stop-color="#4488b8"/>
 </linearGradient>
 <linearGradient id="el-rod" x1="0%" y1="0%" x2="100%" y2="0%">
