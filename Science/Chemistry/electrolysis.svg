 <!-- electrode left (rod) -->
 <rect x="11" y="8" width="1.5" height="16" rx="0.75" fill="url(#el-rod)"/>
 <!-- electrode right (rod) -->
 <rect x="19.5" y="8" width="1.5" height="16" rx="0.75" fill="url(#el-rod)"/>
