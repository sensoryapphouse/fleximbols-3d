<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <!-- Checkerboard pattern (shows transparency context) -->
 <pattern id="checker" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
 <rect width="2" height="2" fill="#cccccc" fill-opacity="0.6"/>
 <rect x="2" y="2" width="2" height="2" fill="#cccccc" fill-opacity="0.6"/>
 </pattern>
 <!-- Opaque swatch gradient: deep rich blue -->
 <linearGradient id="opaqueG" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4488ff"/>
 <stop offset="100%" stop-color="#002299"/>
 </linearGradient>
 <!-- Semi-transparent swatch gradient -->
 <linearGradient id="semiG" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#88bbff"/>
 <stop offset="100%" stop-color="#3366cc"/>
 </linearGradient>
 <!-- Hidden item gradient (faint circle behind opaque) -->
 <radialGradient id="hiddenG" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ff8844"/>
 <stop offset="100%" stop-color="#cc3300"/>
 </radialGradient>
 </defs>
 <!-- Checker background behind semi-transparent swatch (right) -->
 <rect x="18" y="8" width="12" height="16" rx="1.5" fill="url(#checker)"/>
 <!-- Hidden item outline faintly visible behind semi swatch (circle, barely visible) -->
 <circle cx="24" cy="16" r="4.5" fill="url(#hiddenG)" fill-opacity="0.35"/>
 <!-- Semi-transparent swatch -->
 <rect x="18" y="8" width="12" height="16" rx="1.5" fill="url(#semiG)" fill-opacity="0.45" filter="url(#shad)"/>
 <!-- Checker background behind opaque swatch (left) - hidden by opaque -->
 <rect x="2" y="8" width="13" height="16" rx="1.5" fill="url(#checker)"/>
 <!-- Hidden item fully obscured by opaque swatch -->
 <circle cx="8.5" cy="16" r="4.5" fill="url(#hiddenG)"/>
 <!-- Opaque swatch covers completely -->
 <rect x="2" y="8" width="13" height="16" rx="1.5" fill="url(#opaqueG)" filter="url(#shad)"/>
 <!-- Highlight gloss on opaque swatch -->
 <rect x="3" y="9" width="5" height="3" rx="1" fill="white" fill-opacity="0.2"/>
</svg>
