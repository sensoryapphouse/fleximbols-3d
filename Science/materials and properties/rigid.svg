<defs>
<linearGradient id="rg_bar" x1="16" y1="11" x2="16" y2="21" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#E8EEF4"/>
<stop offset="0.35" stop-color="#B9C7D6"/>
<stop offset="0.55" stop-color="#8FA2B5"/>
<stop offset="1" stop-color="#637488"/>
</linearGradient>
<linearGradient id="rg_x" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FF6470"/>
<stop offset="1" stop-color="#E23344"/>
</linearGradient>
</defs>
<!-- thick straight steel bar (cannot bend) -->
<rect x="3.5" y="11.5" width="25" height="9" rx="2.4" fill="url(#rg_bar)" stroke="#4E5F72" stroke-width="0.7"/>
<!-- top gloss -->
<rect x="5.0" y="12.5" width="22" height="2.0" rx="1.0" fill="#FFFFFF" opacity="0.55"/>
<!-- segment seams to read as solid metal -->
<line x1="10.0" y1="13.2" x2="10.0" y2="18.8" stroke="#6E8095" stroke-width="0.5" opacity="0.7"/>
<line x1="16.0" y1="13.2" x2="16.0" y2="18.8" stroke="#6E8095" stroke-width="0.5" opacity="0.7"/>
<line x1="22.0" y1="13.2" x2="22.0" y2="18.8" stroke="#6E8095" stroke-width="0.5" opacity="0.7"/>
<!-- red no-bend X marks at the ends (inflexible) -->
<g stroke="url(#rg_x)" stroke-width="1.9" stroke-linecap="round">
<line x1="3.0" y1="6.0" x2="7.4" y2="10.4"/>
<line x1="7.4" y1="6.0" x2="3.0" y2="10.4"/>
<line x1="24.6" y1="6.0" x2="29.0" y2="10.4"/>
<line x1="29.0" y1="6.0" x2="24.6" y2="10.4"/>
</g>
</svg>
