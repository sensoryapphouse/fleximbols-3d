<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
  <linearGradient id="xb-frame" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#5d6b80"/>
   <stop offset="100%" stop-color="#2e3744"/>
  </linearGradient>
  <linearGradient id="xb-accent" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#ff7a59"/>
   <stop offset="100%" stop-color="#d23b1f"/>
  </linearGradient>
  <radialGradient id="xb-wheel" cx="0.4" cy="0.4" r="0.7">
   <stop offset="0%" stop-color="#8a96a8"/>
   <stop offset="70%" stop-color="#4a5566"/>
   <stop offset="100%" stop-color="#2a3340"/>
  </radialGradient>
  <radialGradient id="xb-hub" cx="0.4" cy="0.4" r="0.7">
   <stop offset="0%" stop-color="#ffd56b"/>
   <stop offset="100%" stop-color="#d89a16"/>
  </radialGradient>
 </defs>
 <!-- floor base -->
 <rect x="5" y="26" width="22" height="2.6" rx="1.3" fill="url(#xb-frame)"/>
 <rect x="5" y="26" width="22" height="1" rx="0.5" fill="#ffffff" fill-opacity="0.18"/>
 <!-- flywheel (front, big) -->
 <circle cx="9.5" cy="20" r="6" fill="url(#xb-wheel)"/>
 <circle cx="9.5" cy="20" r="6" fill="none" stroke="#1f2733" stroke-width="0.6"/>
 <circle cx="9.5" cy="20" r="2" fill="url(#xb-hub)"/>
 <!-- front upright + handlebar post -->
 <rect x="8.4" y="6" width="2.4" height="14" rx="1.2" fill="url(#xb-frame)"/>
 <!-- handlebars -->
 <rect x="5.5" y="6" width="8" height="2" rx="1" fill="url(#xb-accent)"/>
 <rect x="5.5" y="5.5" width="2.2" height="3" rx="1.1" fill="url(#xb-frame)"/>
 <rect x="11.3" y="5.5" width="2.2" height="3" rx="1.1" fill="url(#xb-frame)"/>
 <!-- top tube to seat -->
 <rect x="9.5" y="11" width="13" height="2.2" rx="1.1" transform="rotate(8 9.5 12)" fill="url(#xb-frame)"/>
 <!-- seat post -->
 <rect x="21" y="9" width="2.4" height="9" rx="1.2" fill="url(#xb-frame)"/>
 <!-- seat -->
 <path d="M18 9 Q23.5 7.8 25.5 9.2 Q24 11 21 10.8 Z" fill="url(#xb-accent)"/>
 <!-- pedal crank + pedal -->
 <circle cx="17" cy="21.5" r="1.4" fill="url(#xb-hub)"/>
 <rect x="16.6" y="21.2" width="5" height="1.4" rx="0.7" transform="rotate(40 17 21.5)" fill="url(#xb-frame)"/>
 <rect x="19" y="24" width="3" height="1.6" rx="0.7" fill="url(#xb-accent)"/>
 <!-- rear support leg -->
 <rect x="20" y="22" width="2.2" height="5" rx="1.1" transform="rotate(-12 21 24)" fill="url(#xb-frame)"/>
</svg>
