 <defs>
 <radialGradient id="skin" cx="50%" cy="35%" r="55%">
 <stop offset="0%" stop-color="#FFE0BD"/>
 <stop offset="100%" stop-color="#D49D7A"/>
 </radialGradient>
 <radialGradient id="hair" cx="50%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#5C3018"/>
 <stop offset="100%" stop-color="#2A1408"/>
 </radialGradient>
 <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#60B8E8"/>
 <stop offset="100%" stop-color="#3080B0"/>
 </linearGradient>
 <linearGradient id="tbl" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#D4B870"/>
 <stop offset="100%" stop-color="#9A7840"/>
 </linearGradient>
 <radialGradient id="plate" cx="50%" cy="35%" r="60%">
 <stop offset="0%" stop-color="#F5F5F5"/>
 <stop offset="100%" stop-color="#C8C8C8"/>
 </radialGradient>
 <radialGradient id="glass" cx="40%" cy="30%" r="65%">
 <stop offset="0%" stop-color="#C8E8FF" stop-opacity="0.85"/>
 <stop offset="100%" stop-color="#80B8DD" stop-opacity="0.9"/>
 </radialGradient>
 <linearGradient id="pant" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4A6A9A"/>
 <stop offset="100%" stop-color="#2A4A7A"/>
 </linearGradient>
 </defs>
 <!-- shadow -->
 <!-- TABLE -->
 <rect x="2" y="20.5" width="28" height="3.5" rx="0.5" fill="url(#tbl)" filter="url(#sh)"/>
 <rect x="2" y="20.5" width="28" height="0.7" rx="0.3" fill="#EDD898" fill-opacity="0.6"/>
 <!-- Table legs -->
 <rect x="3.5" y="24" width="1.2" height="5" rx="0.5" fill="#8A6030" fill-opacity="0.8"/>
 <rect x="27.3" y="24" width="1.2" height="5" rx="0.5" fill="#8A6030" fill-opacity="0.8"/>
 <!-- ALREADY-SET place setting (right side of table - complete) -->
 <!-- Plate already placed right -->
 <ellipse cx="25" cy="20.5" rx="2.3" ry="0.8" fill="url(#plate)"/>
 <!-- Fork (left of plate) -->
 <rect x="22" y="19.5" width="0.5" height="2.5" rx="0.2" fill="#C8C8C8" fill-opacity="0.9"/>
 <!-- Knife (right of plate) -->
 <rect x="27.5" y="19.5" width="0.5" height="2.5" rx="0.2" fill="#C8C8C8" fill-opacity="0.9"/>
 <!-- Glass (above plate right) -->
 <rect x="24.2" y="17.5" width="1.5" height="2.5" rx="0.4" fill="url(#glass)"/>
 <!-- Napkin fold -->
 <path d="M23 20.5 Q23 19.5 23.5 19.8" stroke="#F0F0F0" stroke-width="0.7" fill="none" stroke-linecap="round" fill-opacity="0"/>
 <!-- Stack of extra plates (beside figure) -->
 <ellipse cx="20" cy="19.5" rx="2.2" ry="0.7" fill="url(#plate)" filter="url(#sh)"/>
 <ellipse cx="20" cy="18.8" rx="2.2" ry="0.7" fill="url(#plate)" filter="url(#sh)"/>
 <ellipse cx="20" cy="18.1" rx="2.2" ry="0.7" fill="url(#plate)" filter="url(#sh)"/>
 <!-- LEGS -->
 <rect x="12" y="24.5" width="2.3" height="5.2" rx="1.1" fill="url(#pant)"/>
 <rect x="15.5" y="24.5" width="2.3" height="5.2" rx="1.1" fill="url(#pant)" fill-opacity="0.85"/>
 <!-- FEET -->
 <ellipse cx="13.1" cy="29.8" rx="1.6" ry="0.75" fill="#1A1A2E" fill-opacity="0.9"/>
 <ellipse cx="16.6" cy="29.8" rx="1.6" ry="0.75" fill="#1A1A2E" fill-opacity="0.9"/>
 <!-- TORSO (leaning over table placing item) -->
 <rect x="10.5" y="14.5" width="9.5" height="10.5" rx="2.2" fill="url(#top)" filter="url(#sh)" transform="rotate(-5 15.25 19.75)"/>
 <!-- LEFT ARM lowering PLATE onto table (active placement) -->
 <path d="M10.5 16.5 Q8.5 17.5 7.5 19.5" stroke="#3080B0" stroke-width="2.4" fill="none" stroke-linecap="round"/>
 <!-- Left hand with plate -->
 <ellipse cx="7.2" cy="20" rx="1.15" ry="0.85" fill="url(#skin)"/>
 <!-- Plate being placed left side (second place setting in progress) -->
 <ellipse cx="7.5" cy="20.3" rx="2.5" ry="0.85" fill="url(#plate)" filter="url(#sh)"/>
 <!-- Food highlight on plate -->
 <ellipse cx="7.5" cy="20.2" rx="1.5" ry="0.45" fill="#FFFFEE" fill-opacity="0.6"/>
 <!-- RIGHT ARM reaching forward to place fork -->
 <path d="M20 15 Q12.5 17 11.5 19.5" stroke="#60B8E8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
 <!-- Right hand with fork -->
 <ellipse cx="11.2" cy="20" rx="1.1" ry="0.8" fill="url(#skin)"/>
 <!-- Fork in hand -->
 <rect x="10.5" y="18.5" width="0.5" height="2.5" rx="0.2" fill="#C8C8C8" fill-opacity="0.9"/>
 <!-- NECK -->
 <rect x="13.5" y="12.3" width="3" height="2.5" rx="1.2" fill="url(#skin)" transform="rotate(-3 15 13.55)"/>
 <!-- HEAD -->
 <ellipse cx="15" cy="10.5" rx="4" ry="4" fill="url(#skin)" filter="url(#sh)"/>
 <!-- HAIR -->
 <ellipse cx="15" cy="6.8" rx="4" ry="2.3" fill="url(#hair)"/>
 <ellipse cx="11.2" cy="8.9" rx="1.3" ry="2.2" fill="url(#hair)"/>
 <ellipse cx="18.6" cy="8.9" rx="1.2" ry="2.2" fill="url(#hair)"/>
 <!-- EYES focused on table placement -->
 <ellipse cx="13.2" cy="10.8" rx="0.92" ry="0.85" fill="#1A1A3A"/>
 <ellipse cx="16.8" cy="10.8" rx="0.92" ry="0.85" fill="#1A1A3A"/>
 <circle cx="13.45" cy="10.55" r="0.22" fill="white" fill-opacity="0.9"/>
 <circle cx="17.05" cy="10.55" r="0.22" fill="white" fill-opacity="0.9"/>
 <path d="M12.4 10 Q13.2 9.6 14" stroke="#3A1A08" stroke-width="0.38" fill="none" stroke-linecap="round"/>
 <path d="M16 9.8 Q16.8 9.4 17.6 9.8" stroke="#3A1A08" stroke-width="0.38" fill="none" stroke-linecap="round"/>
 <!-- MOUTH focused slight smile -->
 <path d="M13.3 12.4 Q15 13 16.7 12.4" stroke="#B07050" stroke-width="0.42" fill="none" stroke-linecap="round"/>
</svg>
