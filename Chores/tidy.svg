<svg viewBox="0 0 32 32" width="200" height="200" xmlns="http://www.w3.org/2000/svg" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
 <defs>
 <radialGradient id="skin" cx="50%" cy="35%" r="55%">
 <stop offset="0%" stop-color="#FFE0BD"/>
 <stop offset="100%" stop-color="#D49D7A"/>
 </radialGradient>
 <radialGradient id="hair" cx="50%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#5C3018"/>
 <stop offset="100%" stop-color="#2A1408"/>
 </radialGradient>
 <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#F5C518"/>
 <stop offset="100%" stop-color="#D4A010"/>
 </linearGradient>
 <linearGradient id="bin" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#60B4E8"/>
 <stop offset="100%" stop-color="#3080B0"/>
 </linearGradient>
 <linearGradient id="pant" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#4A6A9A"/>
 <stop offset="100%" stop-color="#2A4A7A"/>
 </linearGradient>
 <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#E8D8C0"/>
 <stop offset="100%" stop-color="#C0A880"/>
 </linearGradient>
 </defs>
 <!-- shadow -->
 <!-- FLOOR -->
 <rect x="0" y="27.5" width="32" height="3" rx="0" fill="url(#floor)" fill-opacity="0.5"/>
 <!-- MESSY ZONE (left side) - scattered items -->
 <!-- toy block on floor -->
 <rect x="2" y="25.5" width="2.5" height="2" rx="0.3" fill="#FF6B6B" fill-opacity="0.9" transform="rotate(-15 3.25 26.5)"/>
 <!-- book lying flat -->
 <rect x="1.5" y="24" width="3.5" height="1.2" rx="0.2" fill="#5577CC" fill-opacity="0.9" transform="rotate(10 3.25 24.6)"/>
 <!-- sock -->
 <ellipse cx="4.5" cy="26" rx="1.5" ry="0.7" fill="#DDDD88" fill-opacity="0.85" transform="rotate(20 4.5 26)"/>
 <!-- ORGANISED BIN/SHELF (right side) -->
 <rect x="24" y="21" width="7" height="8" rx="0.8" fill="url(#bin)" filter="url(#sh)"/>
 <rect x="24" y="21" width="7" height="1" rx="0.5" fill="#80C8F0" fill-opacity="0.7"/>
 <!-- items neatly in bin -->
 <rect x="25" y="23" width="2" height="2.5" rx="0.3" fill="#FF8866" fill-opacity="0.85"/>
 <rect x="27.5" y="23.5" width="1.5" height="2" rx="0.3" fill="#88CC88" fill-opacity="0.85"/>
 <rect x="25" y="22.2" width="4.5" height="0.7" rx="0.2" fill="white" fill-opacity="0.25"/>
 <!-- OBJECT BEING TRANSFERRED — toy in figure's lowered hand (from messy zone to bin) -->
 <!-- Figure bends forward picking up toy -->
 <!-- LEGS (slight bent/forward lean) -->
 <rect x="13" y="23.5" width="2.3" height="6" rx="1.1" fill="url(#pant)"/>
 <rect x="16.5" y="23" width="2.3" height="6.5" rx="1.1" fill="url(#pant)" fill-opacity="0.85"/>
 <!-- FEET -->
 <ellipse cx="14.1" cy="29.8" rx="1.6" ry="0.75" fill="#1A1A2E" fill-opacity="0.9"/>
 <ellipse cx="17.7" cy="29.8" rx="1.6" ry="0.75" fill="#1A1A2E" fill-opacity="0.9"/>
 <!-- TORSO (leaned forward slightly) -->
 <rect x="11" y="14" width="9.5" height="10" rx="2.2" fill="url(#top)" filter="url(#sh)" transform="rotate(-5 15.75 19)"/>
 <!-- LEFT ARM reaching DOWN picking up item -->
 <path d="M11.5 16.5 Q9 18 7 22" stroke="#D4A010" stroke-width="2.4" fill="none" stroke-linecap="round"/>
 <!-- Left hand with toy block -->
 <rect x="5.8" y="21.8" width="2" height="1.8" rx="0.3" fill="#FF6B6B" fill-opacity="0.9"/>
 <ellipse cx="6.8" cy="21.8" rx="1" ry="0.5" fill="url(#skin)"/>
 <!-- RIGHT ARM extending toward bin -->
 <path d="M20.5 15 Q22.5 17 23 20.5" stroke="#F5C518" stroke-width="2.4" fill="none" stroke-linecap="round"/>
 <ellipse cx="23.3" cy="21" rx="1.1" ry="0.8" fill="url(#skin)"/>
 <!-- NECK -->
 <rect x="14" y="11.8" width="3" height="2.5" rx="1.2" fill="url(#skin)"/>
 <!-- HEAD (bent forward looking down) -->
 <ellipse cx="15.5" cy="10" rx="4" ry="4" fill="url(#skin)" filter="url(#sh)"/>
 <!-- HAIR -->
 <ellipse cx="15.5" cy="6.3" rx="4" ry="2.3" fill="url(#hair)"/>
 <ellipse cx="11.7" cy="8.4" rx="1.3" ry="2.2" fill="url(#hair)"/>
 <ellipse cx="19.1" cy="8.4" rx="1.2" ry="2.2" fill="url(#hair)"/>
 <!-- EYES looking down -->
 <ellipse cx="13.8" cy="10.5" rx="0.92" ry="0.85" fill="#1A1A3A"/>
 <ellipse cx="17.2" cy="10.3" rx="0.92" ry="0.85" fill="#1A1A3A"/>
 <circle cx="14.05" cy="10.25" r="0.22" fill="white" fill-opacity="0.9"/>
 <circle cx="17.45" cy="10.05" r="0.22" fill="white" fill-opacity="0.9"/>
 <path d="M13 9.8 Q13.8 9.3 14.6 9.7" stroke="#3A1A08" stroke-width="0.38" fill="none" stroke-linecap="round"/>
 <path d="M16.4 9.5 Q17.2 9.1 18" stroke="#3A1A08" stroke-width="0.38" fill="none" stroke-linecap="round"/>
 <!-- MOUTH focused slight smile -->
 <path d="M14.2 11.8 Q15.5 12.5 16.8 11.8" stroke="#B07050" stroke-width="0.4" fill="none" stroke-linecap="round"/>
</svg>
